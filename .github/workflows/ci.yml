name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  chat-presentation:
    name: Chat presentation (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check extracted components and integration
        run: |
          node tests/test_chat_presentation.cjs
          node tests/test_chat_outline.cjs
          node tests/test_chat_composer.cjs
          node tests/test_chat_image_actions.cjs
          node tests/test_chat_reply_boxes.cjs
          node tests/test_chat_reply_text.cjs
          node tests/test_webai_controls.cjs

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run pytest
        run: pytest tests/ -v

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    # 可选 job：仅在主文件语法/类型有把握时开启
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mypy
        run: pip install mypy

      - name: Run mypy
        run: mypy main.py --ignore-missing-imports
