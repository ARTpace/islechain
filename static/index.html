<!DOCTYPE html>
<html lang="zh-CN" data-studio-scale="off">

<head>
    <meta charset="UTF-8">
    <meta name="app-version" content="20261112017">
    <!-- 应用自行管理深浅主题，避免扩展重复反色。 -->
    <meta name="darkreader-lock">
    <script src="/static/modules/load-log.js?v=20261027load"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/static/js/theme-default.js?v=20261031a"></script>
<script src="/static/js/theme.js?v=20261112004"></script>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <title>IsleChain</title>
    <link rel="stylesheet" href="/static/tailwind.min.css?v=20261024004">
    <link rel="stylesheet" href="/static/css/studio-ui.css?v=20261108011">

    <link rel="stylesheet" href="/static/css/workspace-loading.css?v=20261108015">
    <link rel="stylesheet" href="/static/css/appearance-settings.css?v=20261111009">
    <script src="/static/js/ui-refine.js?v=20261024004" defer></script>
    <script src="/static/js/i18n.js?v=20261024004" defer></script>
    <style>
        :root {
            --accent: #0891b2;
            --accent-glow: #06b6d4;
            --fluid-ease: cubic-bezier(0.3, 0, 0, 1);
            /* 高定铁律 1：去边框，统一走 studio-ui.css 的暖中性明度阶梯 */
            --bg: var(--ui-bg);
            --sidebar-bg: var(--ui-panel);
            --stage-bg: var(--ui-bg);
            --border: var(--ui-line);
            --stage-border: var(--ui-line);
            --text: var(--ui-text);
            --muted: var(--ui-muted);
            --nav-hover-bg: var(--ui-accent-soft);
            --monitor-bg: var(--ui-accent-soft);
            --monitor-border: color-mix(in srgb, var(--ui-accent) 28%, transparent);
            --monitor-shadow: color-mix(in srgb, var(--ui-accent) 14%, transparent);
            --divider: var(--ui-line);
            --scrollbar: var(--ui-muted);
            --scrollbar-hover: var(--ui-text);
            --author-name: var(--ui-text);
            --social-icon: var(--ui-muted);
        }

        body.theme-dark {
            --accent: #00f0ff;
            --accent-glow: #06b6d4;
            --bg: var(--ui-bg);
            --sidebar-bg: var(--ui-panel);
            --stage-bg: var(--ui-bg);
            --border: var(--ui-line);
            --stage-border: var(--ui-line);
            --text: var(--ui-text);
            --muted: var(--ui-muted);
            --nav-hover-bg: var(--ui-accent-soft);
            --monitor-bg: var(--ui-accent-soft);
            --monitor-border: color-mix(in srgb, var(--ui-accent) 28%, transparent);
            --monitor-shadow: color-mix(in srgb, var(--ui-accent) 14%, transparent);
            --divider: var(--ui-line);
            --scrollbar: var(--ui-muted);
            --scrollbar-hover: var(--ui-text);
            --author-name: var(--ui-accent);
            --social-icon: var(--ui-muted);
        }

        /* 极简滚动条 */
        *::-webkit-scrollbar {
            width: 10px !important;
            height: 10px !important;
            background: transparent !important;
        }

        *::-webkit-scrollbar-track {
            background: transparent !important;
            border: none !important;
        }

        *::-webkit-scrollbar-thumb {
            background-color: var(--scrollbar) !important;
            border: 3px solid transparent !important;
            border-right-width: 5px !important;
            background-clip: padding-box !important;
            border-radius: 10px !important;
        }

        *::-webkit-scrollbar-thumb:hover {
            background-color: var(--scrollbar-hover) !important;
        }

        *::-webkit-scrollbar-corner {
            background: transparent !important;
        }

        * {
            scrollbar-width: thin !important;
            scrollbar-color: var(--scrollbar) transparent !important;
        }

        body {
            background: var(--bg);
            font-family: "Inter", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow: hidden;
            height: 100vh;
            color: var(--text);
            transition: background 0.3s, color 0.3s;
        }

        .app-shell {
            display: flex;
            width: 100%;
            height: 100vh;
            background: var(--bg);
            position: relative;
            transition: background 0.3s;
        }

        /* 侧边栏 */
        .sidebar {
            width: 80px;
            min-width: 80px;
            height: 100vh;
            max-height: 100vh;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            border-right: 1px solid var(--border);
            padding: 40px 0;
            transition: width 0.24s cubic-bezier(0.2, 0, 0, 1), background 0.2s, border-color 0.2s, box-shadow 0.24s ease;
            z-index: 50;
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            overflow: visible;
        }

        /* 侧边栏导航容器 */
        .sidebar-nav {
            flex: 1;
            min-height: 180px;
            overflow-y: auto;
            overflow-x: hidden;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-left: 16px;
        }

        /* 侧边栏底部固定区域 */
        .sidebar-bottom {
            flex-shrink: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-left: 16px;
            padding-bottom: 20px;
        }

        /* 侧边栏滚动条 */
        .sidebar-nav::-webkit-scrollbar {
            width: 6px !important;
        }

        .sidebar-nav::-webkit-scrollbar-thumb {
            background-color: var(--scrollbar) !important;
            border-radius: 3px !important;
            border: none !important;
        }

        .sidebar-nav::-webkit-scrollbar-thumb:hover {
            background-color: var(--scrollbar-hover) !important;
        }

        .sidebar:hover .sidebar-nav::-webkit-scrollbar {
            width: 8px !important;
        }

        .sidebar:hover {
            width: 220px;
            box-shadow: 16px 0 36px rgba(0, 0, 0, 0.18);
        }
        /* 展开态去掉 nav 容器多余的左内边距，避免与 .nav-item 自身 padding 叠加导致右侧溢出裁切 */
        .sidebar:hover .sidebar-nav,
        .sidebar:hover .sidebar-bottom {
            padding-left: 0;
        }

        /* 锁定态：不展开，只显示图标 */
        .sidebar.locked,
        .sidebar.locked:hover {
            width: 80px;
        }
        .sidebar.locked .sidebar-nav,
        .sidebar.locked .sidebar-bottom {
            padding-left: 0;
            align-items: center;
        }
        .sidebar.locked .nav-item {
            width: 56px;
            padding-left: 0;
            justify-content: center;
        }
        .sidebar.locked .nav-parent {
            width: 48px;
            padding-left: 0 !important;
            justify-content: center;
            border-left: none !important;
        }
        .sidebar.locked .nav-text,
        .sidebar.locked .nav-arrow {
            display: none;
        }
        /* 浮动栏不受锁定影响，始终显示图标+文字，并且左对齐 */
        .sidebar.locked .submenu .nav-item,
        .submenu .nav-item {
            width: 100% !important;
            margin: 0 !important;
            padding: 0 12px !important;
            overflow: visible !important;
            height: 44px !important;
            border-radius: 12px !important;
            border: 1px solid transparent !important;
            justify-content: flex-start !important;
            align-items: center !important;
            gap: 12px !important;
            font-size: 14px !important;
        }
        .submenu .nav-child svg {
            width: 20px !important;
            height: 20px !important;
            min-width: 20px !important;
            min-height: 20px !important;
            max-width: 20px !important;
            max-height: 20px !important;
            margin: 0 !important;
            flex: 0 0 20px;
        }
        .submenu .nav-child .nav-text {
            display: inline !important;
            width: auto !important;
            opacity: 1 !important;
            margin-left: 0 !important;
            padding: 0 !important;
            font-size: 14px !important;
        }

        body.theme-dark .sidebar {
            border-right-color: color-mix(in srgb, var(--accent-glow, #06b6d4) 10%, transparent);
            box-shadow: inset -1px 0 0 color-mix(in srgb, var(--accent-glow, #06b6d4) 5%, transparent);
        }

        body.theme-dark .sidebar:hover {
            box-shadow: inset -1px 0 0 color-mix(in srgb, var(--accent-glow, #06b6d4) 5%, transparent), 16px 0 36px rgba(0, 0, 0, 0.35);
        }

        .logo-ring {
            width: 36px;
            height: 36px;
            border: 2px solid var(--accent-glow, var(--accent));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s, border-color 0.3s;
            flex-shrink: 0;
        }

        /* LOGO 图形跟随「外观」里的强调色（theme.js 写入 --accent / --accent-glow），
           不再写死青色；CSS 规则会盖掉 SVG 上的 stroke/fill 属性 */
        .logo-ring svg .lr-stroke { stroke: var(--accent-glow, var(--accent, #06b6d4)); }
        .logo-ring svg .lr-fill { fill: var(--accent-glow, var(--accent, #06b6d4)); }
        .logo-ring svg .lr-glow { fill: var(--accent, #06b6d4); }

        body.theme-dark .logo-ring {
            box-shadow: 0 0 12px color-mix(in srgb, var(--accent-glow, #06b6d4) 30%, transparent), inset 0 0 8px color-mix(in srgb, var(--accent-glow, #06b6d4) 10%, transparent);
        }

        /* 导航项 - 始终保持展开宽度，靠 sidebar overflow:hidden 裁切 */
        .nav-item.is-module-off { display: none !important; }
        .nav-item {
            position: relative;
            box-sizing: border-box;
            width: 220px;
            height: 56px;
            margin: 11px 0;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            border-radius: 16px;
            cursor: pointer;
            transition: width 0.24s cubic-bezier(0.2, 0, 0, 1), background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
            color: var(--muted);
            overflow: hidden;
            padding-left: 16px;
            border: 1px solid transparent;
            flex-shrink: 0;
        }

        .sidebar:hover .nav-item {
            width: 220px;
        }

        .sidebar.locked:hover .sidebar-nav .nav-item,
        .sidebar.locked .sidebar-nav .nav-item,
        .sidebar.locked:hover .sidebar-bottom .nav-item,
        .sidebar.locked .sidebar-bottom .nav-item {
            width: 56px;
            padding-left: 0;
            justify-content: center;
        }

        .nav-item:hover {
            background: color-mix(in srgb, var(--accent-glow, var(--accent)) 10%, transparent);
            color: var(--accent-glow, var(--accent));
            border-color: color-mix(in srgb, var(--accent) 15%, transparent);
        }

        body.theme-dark .nav-item:hover {
            border-color: color-mix(in srgb, var(--accent-glow, #06b6d4) 15%, transparent);
            box-shadow: 0 0 15px color-mix(in srgb, var(--accent-glow, #06b6d4) 6%, transparent);
        }

        .nav-item.active {
            background: var(--accent);
            color: var(--ui-text);
            box-shadow: 0 4px 20px color-mix(in srgb, var(--accent) 30%, transparent);
        }

        body.theme-dark .nav-item.active {
            background: color-mix(in srgb, var(--accent-glow, #06b6d4) 12%, transparent);
            color: var(--accent-glow, #06b6d4);
            border-color: color-mix(in srgb, var(--accent-glow, #06b6d4) 30%, transparent);
            box-shadow: 0 0 20px color-mix(in srgb, var(--accent-glow, #06b6d4) 15%, transparent), inset 0 0 15px color-mix(in srgb, var(--accent-glow, #06b6d4) 5%, transparent);
        }

        /* 导航图标与按钮共用角色色，覆盖旧深色皮肤的青色选中态；默认色保持原有回退。 */
        html.studio-accent-customized body .sidebar :is(.nav-item.active, .nav-child.submenu-active) {
            color: var(--studio-accent-text, var(--accent-glow, var(--accent))) !important;
            background: var(--studio-accent-soft, var(--ui-accent-soft)) !important;
            border-color: var(--studio-accent-line, var(--ui-line-strong)) !important;
            box-shadow: none !important;
        }
        html.studio-accent-customized body .sidebar :is(.nav-item, .nav-child):hover {
            color: var(--studio-accent-text, var(--accent-glow, var(--accent))) !important;
        }
        html body .sidebar :is(.nav-item, .nav-child) > svg { color: inherit; }

        /* --- Collapsible Submenu Styles --- */

        .nav-parent {
            position: relative;
            cursor: pointer;
        }

        .nav-arrow {
            transition: transform 0.25s ease;
        }

        .nav-parent .nav-arrow {
            transform: rotate(-90deg);
        }

        .nav-parent.expanded .nav-arrow {
            transform: rotate(0deg);
        }

        /* 浮动工具栏容器 - 从侧边栏右侧弹出 */
        .submenu {
            position: fixed;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 60;
            background: var(--sidebar-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            width: fit-content;
            min-width: 150px;
            max-height: calc(100vh - 32px);
            overflow-y: auto;
            overflow-x: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
            will-change: opacity;
        }

        body.theme-dark .submenu {
            background: rgba(20, 20, 20, 0.95);
            border-color: color-mix(in srgb, var(--accent-glow, #06b6d4) 12%, transparent);
            box-shadow: 0 8px 32px color-mix(in srgb, var(--accent-glow, #06b6d4) 8%, transparent);
        }

        .submenu.expanded {
            opacity: 1;
            pointer-events: auto;
        }

        /* 去掉 sidebar:hover 控制 submenu 显隐，完全由 JS 控制 */

        /* 子菜单项 - 单列对齐 */
        .nav-child {
            width: 100%;
            height: 36px;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            color: var(--muted);
            padding: 0 12px;
            border: 1px solid transparent;
            font-size: 12px;
            opacity: 0.85;
            flex-shrink: 0;
            gap: 8px;
            overflow: visible;
        }

        .nav-child svg {
            width: 18px;
            height: 18px;
            min-width: 18px;
            flex-shrink: 0;
        }

        .nav-child .nav-text {
            opacity: 1;
            white-space: nowrap;
            font-weight: 500;
        }

        .nav-child:hover {
            opacity: 1;
            background: color-mix(in srgb, var(--accent-glow, var(--accent)) 10%, transparent);
            color: var(--accent-glow, var(--accent));
        }

        body.theme-dark .nav-child:hover {
            border-color: color-mix(in srgb, var(--accent-glow, #06b6d4) 12%, transparent);
        }

        .nav-child.submenu-active {
            opacity: 1;
            background: var(--accent);
            color: var(--ui-text);
            border-color: transparent;
        }

        body.theme-dark .nav-child.submenu-active {
            background: color-mix(in srgb, var(--accent-glow, #06b6d4) 12%, transparent);
            color: var(--accent-glow, #06b6d4);
            border-color: color-mix(in srgb, var(--accent-glow, #06b6d4) 30%, transparent);
        }

        .nav-parent.has-active-child {
            background: var(--accent);
            color: var(--ui-text);
        }

        .sidebar:hover .nav-parent.has-active-child {
            border-left: 3px solid var(--accent);
            padding-left: 11px;
        }

        body.theme-dark .nav-parent.has-active-child {
            background: color-mix(in srgb, var(--accent-glow, #06b6d4) 15%, transparent);
            color: var(--accent-glow, #06b6d4);
        }

        body.theme-dark .sidebar:hover .nav-parent.has-active-child {
            border-left: 3px solid var(--accent-glow, #06b6d4);
        }

        /* Stage base style */
        .stage {
            flex: 1;
            background: var(--stage-bg);
            margin: 16px 16px 16px 96px;
            border-radius: 32px;
            overflow: hidden;
            border: 1px solid var(--stage-border);
            position: relative;
            transition: background 0.3s, border-color 0.3s;
        }

        .nav-text {
            opacity: 0;
            margin-left: 18px;
            font-weight: 600;
            font-size: 15px;
            white-space: nowrap;
            transition: opacity 0.2s;
        }

        .sidebar:hover .nav-text {
            opacity: 1;
        }

        /* 导航图标固定尺寸 - 覆盖所有可能的样式（排除箭头，箭头单独控尺寸） */
        .nav-item svg:not(.nav-arrow),
        .nav-item .icon-svg {
            width: 30px !important;
            height: 30px !important;
            min-width: 30px !important;
            min-height: 30px !important;
            max-width: 30px !important;
            max-height: 30px !important;
            flex-shrink: 0;
            display: inline-block;
            transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* 卡通感：悬停时图标轻微弹起（箭头不参与） */
        .nav-item:hover > svg:not(.nav-arrow),
        .nav-item.active > svg:not(.nav-arrow) {
            transform: scale(1.1);
        }

        .nav-arrow {
            width: 16px !important;
            height: 16px !important;
            flex-shrink: 0;
            opacity: 0;
            margin-right: 8px;
            transition: opacity 0.2s;
        }

        .sidebar:hover .nav-arrow {
            opacity: 1;
        }

        /* 重置所有 SVG 的默认尺寸 */
        svg:not([width]):not([height]) {
            width: auto;
            height: auto;
        }

        .nav-item svg:not(.nav-arrow):not([width]):not([height]),
        .nav-arrow svg:not([width]):not([height]) {
            width: inherit !important;
            height: inherit !important;
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            z-index: 0;
            transition: opacity 0.26s ease, visibility 0s linear 0.26s;
        }

        iframe.leaving {
            opacity: 1;
            visibility: visible;
            pointer-events: none;
            z-index: 1;
        }

        iframe.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            z-index: 2;
            transition: opacity 0.26s ease, visibility 0s linear 0s;
        }

        /* 侧边栏底部运行状态（在线 / 队列），收起时只留一个圆点 */
        body.chat-view .sidebar-status { display:none; }
        .sidebar-status {
            flex: 0 0 auto;
            width: 64px;
            height: 34px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin: 0 0 4px;
            padding: 0;
            border-radius: 10px;
            border: 1px solid transparent;
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            cursor: default;
            transition: width .24s cubic-bezier(.2,0,0,1), color .2s ease, background .2s ease, border-color .2s ease;
        }
        .sidebar:hover .sidebar-status { width: 190px; justify-content: flex-start; padding: 0 12px; }
        .sidebar.locked .sidebar-status,
        .sidebar.locked:hover .sidebar-status { width: 48px; justify-content: center; padding: 0; }
        .sidebar-status .ss-icons { display: inline-flex; align-items: center; justify-content: center; width: 10px; flex: 0 0 auto; }
        .sidebar-status .ss-text { display: none; align-items: center; gap: 5px; }
        .sidebar:hover .sidebar-status .ss-text { display: inline-flex; }
        .sidebar.locked .sidebar-status .ss-text { display: none; }
        .sidebar-status #online-val,
        .sidebar-status #queue-val { font-weight: 700; color: var(--text); }
        .sidebar-status .ss-sep { width: 1px; height: 10px; margin: 0 2px; background: var(--border); }
        .sidebar-status.is-busy { color: var(--accent-glow, var(--accent)); background: color-mix(in srgb, var(--accent-glow, #06b6d4) 10%, transparent); border-color: color-mix(in srgb, var(--accent-glow, #06b6d4) 45%, transparent); }
        .sidebar-status.is-busy #online-val,
        .sidebar-status.is-busy #queue-val { color: var(--accent-glow, var(--accent)); }
        .sidebar-status.is-busy .ss-sep { background: var(--accent-glow, var(--accent)); }

        .pulse-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
        }

        body.theme-dark .pulse-dot {
            background: var(--accent-glow, #06b6d4);
            box-shadow: 0 0 8px color-mix(in srgb, var(--accent-glow, #06b6d4) 60%, transparent);
            animation: neonPulse 2s ease-in-out infinite;
        }

        @keyframes neonPulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 8px color-mix(in srgb, var(--accent-glow, #06b6d4) 60%, transparent); }
            50% { opacity: 0.6; box-shadow: 0 0 4px color-mix(in srgb, var(--accent-glow, #06b6d4) 30%, transparent); }
        }

        .spinner-nano {
            width: 10px;
            height: 10px;
            border: 2px solid color-mix(in srgb, var(--accent-glow, #06b6d4) 20%, transparent);
            border-top-color: var(--accent-glow, var(--accent));
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .is-busy .spinner-nano { display: block; }
        .is-busy .pulse-dot { display: none; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .label-nano {
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.5;
            font-size: 9px;
        }

        body.theme-dark.scanlines-on .stage::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 240, 255, 0.015) 2px,
                rgba(0, 240, 255, 0.015) 4px
            );
            pointer-events: none;
            z-index: 1;
            animation: scanlines 8s linear infinite;
        }

        @keyframes scanlines {
            0% { transform: translateY(0); }

        /* 作者组件 */
        .author-box {
            width: 100%;
            height: 60px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .dx-letter {
            position: absolute;
            font-size: 14px;
            font-weight: 800;
            color: var(--text);
            transition: all 0.5s var(--fluid-ease) 0.4s;
            z-index: 10;
        }

        .letter-d { transform: translateX(-8px); }
        .letter-x { transform: translateX(8px); }

        .sidebar:hover .letter-d {
            transform: translateX(-120px);
            opacity: 0;
            transition-delay: 0s;
        }

        .sidebar:hover .letter-x {
            transform: translateX(120px);
            opacity: 0;
            transition-delay: 0s;
        }

        .author-content-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.4s var(--fluid-ease) 0s;
            pointer-events: none;
        }

        .sidebar:hover .author-content-wrap {
            opacity: 1;
            transform: scale(1);
            transition-delay: 0.2s;
            pointer-events: auto;
        }

        .author-name-lite {
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--author-name);
        }

        .social-row-lite { display: flex; gap: 12px; }

        .social-icon-lite {
            color: var(--social-icon);
            transition: color 0.2s, transform 0.2s;
        }

        .social-icon-lite:hover {
            color: var(--text);
            transform: translateY(-1px);
        }

        /* 主题切换按钮 */
        .theme-toggle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            margin: 8px 0;
            flex-shrink: 0;
        }

        .theme-toggle:hover {
            background: color-mix(in srgb, var(--accent-glow, var(--accent)) 10%, transparent);
            color: var(--accent-glow, var(--accent));
            border-color: color-mix(in srgb, var(--accent-glow, var(--accent)) 45%, transparent);
        }

        body.theme-dark .theme-toggle:hover {
            box-shadow: 0 0 12px color-mix(in srgb, var(--accent-glow, #06b6d4) 20%, transparent);
        }

        .theme-toggle svg { width: 16px; height: 16px; }

    <script>
        window.FeatureModules = {
            key: 'studio_feature_modules',
            access: null,
            firstOn: function () {
                for (const group of this.orderedGroups()) for (const item of group.items) if (this.isOn(item.id)) return item.id;
                return '';
            },
            orderedGroups: function (includeApps) {
                var saved = {};
                try { saved = JSON.parse(localStorage.getItem('studio_feature_module_order') || '{}') || {}; } catch (e) {}
                return this.groups.map(function (group, index) {
                    var ids = Array.isArray(saved[group.title]) ? saved[group.title] : [];
                    var source = group.items.slice();
                    if (includeApps && index === 0) source.push({ id: 'apps', name: '应用', orderOnly: true });
                    var items = source.sort(function (a, b) {
                        var ai = ids.indexOf(a.id), bi = ids.indexOf(b.id);
                        return (ai < 0 ? ids.length + (a.orderOnly ? group.items.length : group.items.indexOf(a)) : ai) - (bi < 0 ? ids.length + (b.orderOnly ? group.items.length : group.items.indexOf(b)) : bi);
                    });
                    return Object.assign({}, group, { items: items });
                });
            },
            move: function (id, direction) {
                if (direction !== -1 && direction !== 1) return;
                var groups = this.orderedGroups(true);
                var group = groups.find(group => group.items.some(item => item.id === id));
                if (!group) return;
                var index = group.items.findIndex(item => item.id === id), next = index + direction;
                if (next < 0 || next >= group.items.length) return;
                [group.items[index], group.items[next]] = [group.items[next], group.items[index]];
                var order = {};
                groups.forEach(group => { order[group.title] = group.items.map(item => item.id); });
                localStorage.setItem('studio_feature_module_order', JSON.stringify(order));
                this.applyOrder();
            },
            moveTo: function (id, targetId, after) {
                var groups = this.orderedGroups(true);
                var group = groups.find(g => g.items.some(item => item.id === id));
                if (!group || id === targetId || !group.items.some(item => item.id === targetId)) return;
                var item = group.items.splice(group.items.findIndex(item => item.id === id), 1)[0];
                group.items.splice(group.items.findIndex(item => item.id === targetId) + (after ? 1 : 0), 0, item);
                var order = {};
                groups.forEach(g => { order[g.title] = g.items.map(item => item.id); });
                localStorage.setItem('studio_feature_module_order', JSON.stringify(order));
                this.applyOrder();
            },
            applyOrder: function () {
                var nav = document.querySelector('.sidebar-nav');
                var anchor = document.getElementById('nav-comfy');
                var submenu = document.getElementById('comfyui-submenu');
                this.orderedGroups(true).forEach(function (group, index) {
                    group.items.forEach(function (item) {
                        var node = item.orderOnly ? anchor : document.querySelector('[data-module="' + item.id + '"]');
                        if (index === 0 && nav && node?.parentNode === nav) nav.appendChild(node);
                        else if (index === 1 && submenu && node?.parentNode === submenu) submenu.appendChild(node);
                    });
                });
            },
            loadAccess: async function () {
                try {
                    const response = await fetch('/api/feature-access', { cache: 'no-store', signal: AbortSignal.timeout(5000) });
                    if (!response.ok) throw new Error('无法读取访客功能权限');
                    this.access = await response.json();
                } catch (error) {
                    this.access = null;
                    clearTimeout(this._retry);
                    this._retry = setTimeout(() => { if (!document.hidden) this.loadAccess(); }, 3000);
                }
                this.apply();
                if(!this.firstOn()) window.WorkspaceLoading?.activate(null);
                return this.access;
            },
            groups: [
                { title: '主功能', items: [
                    { id: 'chat-gen', name: '对话生图', locked: true },
                    { id: 'training', name: '模型训练' },
                    { id: 'generation-dashboard', name: '生成数据' },
                    { id: 'canvas', name: '无限画布' },
                    { id: 'asset-manager', name: '素材库' }
                ]},
                { title: 'ComfyUI 应用', items: [
                    { id: 'tripo-studio', name: 'Tripo Studio' },
                    { id: 'rodin3d', name: '3D 生成' },
                    { id: 'zimage', name: '文生图' },
                    { id: 'klein', name: '图片编辑' },
                    { id: 'texture-repaint', name: '贴图重绘' },
                    { id: 'angle', name: '3D视角变换' },
                    { id: 'threeview', name: '三视图' },
                    { id: 'cgstyle', name: 'CG一键细化' },
                    { id: '2dstyle', name: '2D风格细化' },
                    { id: 'watermark-removal', name: '图片去水印' },
                    { id: 'rmbg', name: '一键抠图' },
                    { id: 'gaoqingxiufu', name: '高清修复' },
                    { id: 'kuotu', name: '扩图' },
                    { id: 'promptgen', name: '图像反推' },
                    { id: 'textmatting', name: '文字抠图' },
                    { id: 'yichuwuti', name: '万物移除' },
                    { id: 'poster', name: '海报设计' },
                    { id: 'tts', name: 'TTS 语音' },
                    { id: 'litevideo', name: '视频生成' }
                ]}
            ],
            map: function () {
                try { return JSON.parse(localStorage.getItem(this.key) || '{}') || {}; }
                catch (e) { return {}; }
            },
            isOn: function (id) {
                if (!this.access) return id === 'chat-gen';
                var disabled = this.access.guest_disabled;
                if (this.access.visitor && Array.isArray(disabled) && disabled.indexOf(id) >= 0) return false;
                if (!id || id === 'chat-gen') return true;
                return this.map()[id] !== false;
            },
            set: function (id, on) {
                this.setMany([id], on);
            },
            setMany: function (ids, on) {
                var map = this.map();
                this.groups.forEach(group => group.items.forEach(item => {
                    if (!ids.includes(item.id) || item.locked) return;
                    if (on) delete map[item.id];
                    else map[item.id] = false;
                }));
                localStorage.setItem(this.key, JSON.stringify(map));
                this.apply();
                var active = document.querySelector('iframe.active');
                var activeId = active && active.id.indexOf('frame-') === 0 ? active.id.slice(6) : '';
                if (activeId && !this.isOn(activeId) && typeof switchUI === 'function') {
                    switchUI(document.querySelector('[data-module="chat-gen"]'), 'chat-gen');
                }
            },
            apply: function () {
                var self = this;
                this.applyOrder();
                document.querySelectorAll('[data-module]').forEach(function (el) {
                    el.classList.toggle('is-module-off', !self.isOn(el.getAttribute('data-module')));
                });
                var comfy = this.groups[1].items.some(function (item) { return self.isOn(item.id); });
                var parent = document.getElementById('nav-comfy');
                if (parent) parent.classList.toggle('is-module-off', !comfy);
                if (!comfy) {
                    var submenu = document.getElementById('comfyui-submenu');
                    if (submenu) submenu.classList.remove('expanded');
                }
                var lostActive = false;
                document.querySelectorAll('iframe[id^="frame-"]').forEach(function (frame) {
                    var id = frame.id.slice(6);
                    if (!self.groups.some(group => group.items.some(item => item.id === id)) || self.isOn(id)) return;
                    if (frame.classList.contains('active')) lostActive = true;
                    frame.classList.remove('active');
                    window.WorkspaceLoading?.forget(frame);
                    frame.removeAttribute('src');
                });
                if (lostActive && this.firstOn() && typeof switchUI === 'function') {
                    var next = this.firstOn();
                    var nav = document.querySelector('[data-module="' + next + '"]');
                    if (nav) switchUI(nav, next, nav.classList.contains('nav-child') ? 'comfy' : null);
                }
                var note = document.getElementById('module-access-note');
                if (!note) {
                    note = document.createElement('div'); note.id = 'module-access-note';
                    note.style.cssText = 'position:fixed;inset:40% 10% auto 15%;text-align:center;color:var(--ui-text);pointer-events:none';
                    document.body.appendChild(note);
                }
                note.hidden = !!this.firstOn();
                note.textContent = this.access ? '主机暂未开放可用功能，请联系主机管理员。' : '功能权限加载失败，请刷新页面重试。';
            }
        };
        FeatureModules.ready = FeatureModules.loadAccess();
        setInterval(function () { if (!document.hidden && (!FeatureModules.access || FeatureModules.access.visitor)) FeatureModules.loadAccess(); }, 15000);
        (async function () {
            await FeatureModules.ready;
            var id = 'chat-gen';
            try {
                var saved = JSON.parse(localStorage.getItem('lastSelectedApp') || 'null');
                if (saved && saved.id) id = saved.id;
            } catch (e) {}
            if (id === 'gpt-chat' || id === 'online' || id === 'api-settings' || id === 'comfyui-settings' || id === 'wildcard-settings' || id === 'cli-settings' || !FeatureModules.isOn(id)) id = FeatureModules.firstOn();
            var frame = id && document.getElementById('frame-' + id);
            if (!frame) return;
            window.WorkspaceLoading?.activate(frame);
            if (!frame.getAttribute('src')) frame.src = frame.dataset.src;
            frame.classList.add('active');
            document.body.classList.toggle('chat-view', frame.id === 'frame-chat-gen');
        })();
        document.addEventListener('click', function (event) {
            if (event.target.closest && event.target.closest('iframe')) return;
            document.querySelectorAll('iframe.active').forEach(function (frame) {
                try {
                    var win = frame.contentWindow;
                    if (!win) return;
                    if (typeof win.closePromptPicker === 'function') win.closePromptPicker();
                    else win.document.querySelector('#promptPickerShell.is-open .prompt-picker-x')?.click();
                } catch (e) {}
            });
        });
    </script>

    <script src="/static/modules/model-visibility.js?v=20261024pane"></script>

    <script>
        if (!AuthManager.isLoggedIn()) {
            window.location.replace('/static/login.html');
        }

        function generateUUID() {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                try { return crypto.randomUUID(); } catch (e) { }
            }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        const CID = localStorage.getItem("client_id") || generateUUID();
        localStorage.setItem("client_id", CID);

        const retainedFrames = [];
        function retainFrames(target) {
            const idx = retainedFrames.indexOf(target);
            if (idx >= 0) retainedFrames.splice(idx, 1);
            retainedFrames.push(target);
            while (retainedFrames.length > 8) {
                const old = retainedFrames.shift();
                if (!old || old === target || old.classList.contains('active')) continue;
                const drop = old;
                setTimeout(() => {
                    if (!drop || drop === target || drop.classList.contains('active') || drop.classList.contains('leaving')) return;
                    window.WorkspaceLoading?.forget(drop);
                    drop.removeAttribute('src');
                }, 2000);
            }
        }

        function showFrame(target) {
            if(target) window.WorkspaceLoading?.activate(target);
            if (!target || target.classList.contains('active')) return;
            document.querySelectorAll('iframe.leaving').forEach(f => f.classList.remove('leaving'));
            document.querySelectorAll('iframe.active').forEach(f => {
                f.classList.remove('active');
                f.classList.add('leaving');
                const drop = f;
                setTimeout(() => drop.classList.remove('leaving'), 320);
            });
            target.classList.remove('leaving');
            target.classList.add('active');
        }

        let imageEditorReturnFrame = null;
        window.openGalleryCanvasEditor = function(key) {
            const source = document.querySelector('iframe.active');
            const nav = document.querySelector('.nav-item[data-module="canvas"]');
            const target = document.getElementById('frame-canvas');
            if (!source || !nav || !target) return false;
            imageEditorReturnFrame = {
                frame:source,
                nav:document.querySelector('.nav-item.active, .nav-item.submenu-active')
            };
            target.src = '/static/canvas.html?editImage=' + encodeURIComponent(key);
            switchUI(nav, 'canvas');
            return true;
        };
        window.returnFromGalleryCanvasEditor = function() {
            const previous = imageEditorReturnFrame;
            if (!previous) return false;
            imageEditorReturnFrame = null;
            if (previous.nav) previous.nav.click();
            else showFrame(previous.frame);
            return true;
        };

        // 素材库视图切换：「素材库」按钮展开的子菜单里的四个入口
        function switchAssetTab(el, tab) {
            var navAsset = document.getElementById('nav-asset');
            var frame = document.getElementById('frame-asset-manager');
            // 首次进入直接把视图写进 URL，之后走 postMessage，不用重载页面
            if (frame && !frame.getAttribute('src')) {
                frame.dataset.src = '/static/asset-manager.html?v=20261102mergetab&tab=' + encodeURIComponent(tab);
            }
            switchUI(navAsset || el, 'asset-manager');
            if (navAsset) navAsset.classList.add('active');
            document.querySelectorAll('#asset-submenu [data-asset-tab]').forEach(function (node) {
                node.classList.toggle('submenu-active', node === el);
            });
            closeAssetFlyout();
            if (!frame) return;
            var post = function () {
                try { frame.contentWindow.postMessage({ type: 'asset-manager-tab', tab: tab }, '*'); } catch (e) {}
            };
            post();
            if (frame.dataset.ready !== '1') {
                frame.addEventListener('load', function () {
                    frame.dataset.ready = '1';
                    post();
                }, { once: true });
            }
        }

        // ===== 「素材库」按钮的子菜单 =====
        function positionAssetFlyout() {
            var menu = document.getElementById('asset-submenu');
            var nav = document.getElementById('nav-asset');
            var sidebar = document.querySelector('.sidebar');
            if (!menu || !sidebar) return;
            var sideRect = sidebar.getBoundingClientRect();
            var navRect = (nav || sidebar).getBoundingClientRect();
            var top = navRect.top - 8;
            var maxTop = window.innerHeight - menu.offsetHeight - 16;
            if (top > maxTop) top = Math.max(16, maxTop);
            menu.style.left = (sideRect.right + 2) + 'px';
            menu.style.top = top + 'px';
        }

        function closeAssetFlyout() {
            var menu = document.getElementById('asset-submenu');
            var nav = document.getElementById('nav-asset');
            if (menu) menu.classList.remove('expanded');
            if (nav) nav.classList.remove('expanded');
        }

        function toggleAssetSubmenu(el) {
            var menu = document.getElementById('asset-submenu');
            if (!menu) return;
            var willOpen = !menu.classList.contains('expanded');
            // 同一时间只展开一个浮动菜单
            var comfyMenu = document.getElementById('comfyui-submenu');
            if (comfyMenu) comfyMenu.classList.remove('expanded');
            var comfyNav = document.getElementById('nav-comfy');
            if (comfyNav) comfyNav.classList.remove('expanded');
            if (!willOpen) { closeAssetFlyout(); return; }
            positionAssetFlyout();
            menu.classList.add('expanded');
            el.classList.add('expanded');
        }

        (function initAssetFlyout() {
            var nav = document.getElementById('nav-asset');
            var menu = document.getElementById('asset-submenu');
            if (!nav || !menu) return;
            var openTimer = null, closeTimer = null;
            function openSoon() {
                clearTimeout(openTimer);
                openTimer = setTimeout(function () {
                    if (menu.classList.contains('expanded')) return;
                    var comfyMenu = document.getElementById('comfyui-submenu');
                    if (comfyMenu) comfyMenu.classList.remove('expanded');
                    var comfyNav = document.getElementById('nav-comfy');
                    if (comfyNav) comfyNav.classList.remove('expanded');
                    positionAssetFlyout();
                    menu.classList.add('expanded');
                    nav.classList.add('expanded');
                }, 800);
            }
            function closeSoon() {
                clearTimeout(closeTimer);
                closeTimer = setTimeout(function () {
                    if (!menu.classList.contains('expanded')) return;
                    var mr = menu.getBoundingClientRect(), nr = nav.getBoundingClientRect(), pad = 20;
                    var inNav = lastMouseX >= nr.left - pad && lastMouseX <= nr.right + pad && lastMouseY >= nr.top - pad && lastMouseY <= nr.bottom + pad;
                    var inMenu = lastMouseX >= mr.left - pad && lastMouseX <= mr.right + pad && lastMouseY >= mr.top - pad && lastMouseY <= mr.bottom + pad;
                    if (!inNav && !inMenu) closeAssetFlyout();
                }, 150);
            }
            nav.addEventListener('mouseenter', openSoon);
            nav.addEventListener('mouseleave', function () { clearTimeout(openTimer); closeSoon(); });
            menu.addEventListener('mouseenter', function () { clearTimeout(openTimer); clearTimeout(closeTimer); });
            menu.addEventListener('mouseleave', closeSoon);
            document.addEventListener('pointerdown', function (e) {
                if (!menu.classList.contains('expanded')) return;
                if (e.target.closest && (e.target.closest('#asset-submenu') || e.target.closest('#nav-asset'))) return;
                closeAssetFlyout();
            });
            window.addEventListener('resize', function () {
                if (menu.classList.contains('expanded')) positionAssetFlyout();
            });
        })();

        function switchUI(el, id, parentId) {
            if (window.FeatureModules && !FeatureModules.isOn(id)) return;
            // Clear all nav item active states
            document.querySelectorAll('.nav-item').forEach(n => {
                n.classList.remove('active', 'submenu-active', 'has-active-child');
            });

            // If this is a child item (has parentId)
            if (parentId) {
                el.classList.add('submenu-active');
                // 同步图标到父按钮：保存原始图标，替换为子项图标
                const parent = document.getElementById('nav-comfy');
                if (parent) {
                    const childSvg = el.querySelector('svg');
                    const parentSvg = parent.querySelector('svg:first-child');
                    if (childSvg && parentSvg) {
                        // 首次保存原始图标
                        if (!parentSvg._originalHTML) parentSvg._originalHTML = parentSvg.innerHTML;
                        // 保存当前子项的原始内容（避免被污染）
                        if (!childSvg._originalHTML) childSvg._originalHTML = childSvg.innerHTML;
                        parentSvg.innerHTML = childSvg._originalHTML;
                    }
                }
                // Collapse submenu after selecting a child
                const submenu = document.getElementById('comfyui-submenu');
                if (submenu) {
                    submenu.classList.remove('expanded');
                }
                triggerCooldown();
                if (parent) {
                    parent.classList.add('has-active-child');
                    parent.classList.remove('expanded', 'collapsed');
                }
            } else {
                el.classList.add('active');
                const flyout = document.getElementById('comfyui-submenu');
                if (flyout) flyout.classList.remove('expanded');
                const comfyNav = document.getElementById('nav-comfy');
                if (comfyNav) comfyNav.classList.remove('expanded');
                submenuPinned = false;
            }

            // Load the iframe
            document.body.classList.toggle('chat-view', id === 'chat-gen');
            const target = document.getElementById('frame-' + id);
            if (!target.src) target.src = target.dataset.src;
            showFrame(target);
            retainFrames(target);
            // sync theme and auth to newly activated iframe
            syncThemeToFrame(target);
            syncAuthToFrame(target);

            // Save selection to localStorage
            localStorage.setItem('lastSelectedApp', JSON.stringify({ id, parentId }));
        }

        function positionSubmenu() {
            const submenu = document.getElementById('comfyui-submenu');
            const sidebar = document.querySelector('.sidebar');
            if (!submenu || !sidebar) return;
            const rect = sidebar.getBoundingClientRect();
            let top = rect.top + 40;
            const maxTop = window.innerHeight - submenu.offsetHeight - 16;
            if (top > maxTop) top = Math.max(16, maxTop);
            submenu.style.left = (rect.right + 2) + 'px';
            submenu.style.top = top + 'px';
        }

        // 侧边栏锁定功能
        function toggleSidebarLock() {
            const sidebar = document.querySelector('.sidebar');
            const iconOpen = document.getElementById('icon-lock-open');
            const iconClosed = document.getElementById('icon-lock-closed');
            if (!sidebar) return;
            const isLocked = sidebar.classList.toggle('locked');
            localStorage.setItem('sidebarLocked', isLocked);
            if (iconOpen) iconOpen.style.display = isLocked ? 'none' : 'block';
            if (iconClosed) iconClosed.style.display = isLocked ? 'block' : 'none';
        }
        // 启动时恢复锁定状态
        if (localStorage.getItem('sidebarLocked') === 'true') {
            const sidebar = document.querySelector('.sidebar');
            if (sidebar) sidebar.classList.add('locked');
            const iconOpen = document.getElementById('icon-lock-open');
            const iconClosed = document.getElementById('icon-lock-closed');
            if (iconOpen) iconOpen.style.display = 'none';
            if (iconClosed) iconClosed.style.display = 'block';
        }

        function toggleSubmenu(el) {
            const submenu = document.getElementById('comfyui-submenu');
            if (!submenu) return;

            const isExpanded = submenu.classList.contains('expanded');
            if (!isExpanded && typeof closeAssetFlyout === 'function') closeAssetFlyout();

            if (isExpanded) {
                submenu.classList.remove('expanded');
                el.classList.add('collapsed');
                el.classList.remove('expanded');
            } else {
                positionSubmenu();
                submenu.classList.add('expanded');
                el.classList.add('expanded');
                el.classList.remove('collapsed');
            }
        }

        // hover 延迟展开浮动栏
        let comfyHoverTimer = null;
        let submenuPinned = false;
        let submenuCooldown = false;
        const navComfy = document.getElementById('nav-comfy');
        const comfySubmenu = document.getElementById('comfyui-submenu');

        function closeComfySubmenu() {
            const submenu = document.getElementById('comfyui-submenu');
            if (submenu) submenu.classList.remove('expanded');
        }

        // 检测鼠标是否同时离开了 nav-comfy 和浮动栏
        function checkShouldClose() {
            clearTimeout(comfyHoverTimer);
            comfyHoverTimer = setTimeout(() => {
                const submenu = document.getElementById('comfyui-submenu');
                if (!submenu || !submenu.classList.contains('expanded')) return;
                const submenuRect = submenu.getBoundingClientRect();
                const navRect = navComfy.getBoundingClientRect();
                const mx = lastMouseX, my = lastMouseY;
                const pad = 20; // 20px 容差，防止间隙触发关闭
                const inNav = mx >= navRect.left - pad && mx <= navRect.right + pad && my >= navRect.top - pad && my <= navRect.bottom + pad;
                const inSub = mx >= submenuRect.left - pad && mx <= submenuRect.right + pad && my >= submenuRect.top - pad && my <= submenuRect.bottom + pad;
                if (!inNav && !inSub) {
                    closeComfySubmenu();
                    submenuPinned = false;
                }
            }, 150);
        }

        let lastMouseX = 0, lastMouseY = 0;
        document.addEventListener('mousemove', (e) => { lastMouseX = e.clientX; lastMouseY = e.clientY; });

        if (navComfy) {
            navComfy.addEventListener('mouseenter', () => {
                clearTimeout(comfyHoverTimer);
                if (submenuCooldown) return;
                const submenu = document.getElementById('comfyui-submenu');
                if (submenu && !submenu.classList.contains('expanded')) {
                    submenuPinned = false;
                    comfyHoverTimer = setTimeout(() => {
                        if (typeof closeAssetFlyout === 'function') closeAssetFlyout();
                        positionSubmenu();
                        submenuPinned = true;
                        submenu.classList.add('expanded');
                        navComfy.classList.add('expanded');
                    }, 800);
                } else if (submenu && submenu.classList.contains('expanded') && !submenuPinned) {
                    positionSubmenu();
                    submenuPinned = true;
                }
            });
            navComfy.addEventListener('mouseleave', checkShouldClose);
        }

        function triggerCooldown() {
            submenuCooldown = true;
            setTimeout(() => { submenuCooldown = false; }, 500);
        }

        if (comfySubmenu) {
            comfySubmenu.addEventListener('mouseleave', checkShouldClose);
        }
        document.querySelectorAll('.sidebar .nav-item').forEach((item) => {
            if (item.id === 'nav-comfy' || item.classList.contains('nav-child')) return;
            item.addEventListener('pointerdown', () => {
                closeComfySubmenu();
                submenuPinned = false;
                if (navComfy) navComfy.classList.remove('expanded');
            });
        });
        document.addEventListener('pointerdown', (e) => {
            const submenu = document.getElementById('comfyui-submenu');
            if (!submenu || !submenu.classList.contains('expanded')) return;
            if (e.target.closest && (e.target.closest('#comfyui-submenu') || e.target.closest('#nav-comfy'))) return;
            closeComfySubmenu();
            submenuPinned = false;
            if (navComfy) navComfy.classList.remove('expanded');
        });
        window.addEventListener('blur', () => {
            setTimeout(() => {
                const submenu = document.getElementById('comfyui-submenu');
                if (!submenu || !submenu.classList.contains('expanded')) return;
                if (document.activeElement && document.activeElement.tagName === 'IFRAME') {
                    closeComfySubmenu();
                    submenuPinned = false;
                    if (navComfy) navComfy.classList.remove('expanded');
                }
            }, 0);
        });
        window.addEventListener('resize', positionSubmenu);

        let queueStatusPending = false;
        async function syncStatus() {
            if (queueStatusPending || document.hidden) return;
            queueStatusPending = true;
            try {
                const res = await fetch(`/api/queue_status?client_id=${CID}`, {signal: AbortSignal.timeout(10000)});
                const data = await res.json();
                const monitor = document.getElementById('nano-monitor');
                const queueVal = document.getElementById('queue-val');
                const logoDot = document.getElementById('logo-dot');
                const total = data.total || 0;
                const pos = data.position || 0;
                if (pos > 0) {
                    monitor.classList.add('is-busy');
                    queueVal.innerText = `${pos}/${total}`;
                    logoDot.style.backgroundColor = 'var(--accent-glow, var(--accent))';
                } else {
                    monitor.classList.remove('is-busy');
                    queueVal.innerText = total > 0 ? total : '0';
                    logoDot.style.backgroundColor = 'var(--text)';
                }
                const onlineVal = document.getElementById('online-val');
                if (onlineVal) monitor.title = `在线 ${onlineVal.innerText} · 队列 ${queueVal.innerText}`;
            } catch (e) { }
            finally { queueStatusPending = false; }
        }

        const host = window.location.host;
        if (host) {
            const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
            const ws = new WebSocket(`${protocol}://${host}/ws/stats?client_id=${CID}`);
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'stats') {
                    document.getElementById('online-val').innerText = data.online_count;
                } else if (data.type === 'cloud_status') {
                    const iframe = document.querySelector('iframe.active');
                    if (iframe && iframe.contentWindow) {
                        iframe.contentWindow.postMessage(data, '*');
                    }
                }
            };
            setInterval(syncStatus, 2000);
        }

        // --- 夜间模式 ---

        function syncThemeToFrame(iframe) {
            const theme = (window.StudioTheme || {get: () => 'dark'}).get();
            try {
                if (iframe && iframe.contentWindow) {
                    iframe.contentWindow.postMessage({ type: 'studio-theme', theme }, '*');
                    iframe.contentWindow.postMessage({
                        type: 'studio-look',
                        scanlines: window.StudioLook ? window.StudioLook.scanlines() : false,
                        accent: window.StudioLook ? window.StudioLook.accent() : '',
                        scale: window.StudioScale ? window.StudioScale.getMode() : 'auto'
                    }, '*');
                }
            } catch (e) {}
        }

        function syncAuthToFrame(iframe) {
            const token = AuthManager.getAuthToken();
            try {
                if (iframe && iframe.contentWindow && token) {
                    iframe.contentWindow.postMessage({ type: 'auth-token', token }, '*');
                }
            } catch (e) {}
        }

        function broadcastTheme(theme) {
            if (window.StudioTheme) {
                window.StudioTheme.set(theme);
            }
            document.querySelectorAll('iframe').forEach(f => syncThemeToFrame(f));
            updateThemeIcon(theme);
        }

        function updateThemeIcon(theme) {
            const moon = document.getElementById('icon-moon');
            const sun = document.getElementById('icon-sun');
            if (!moon || !sun) return;
            if (theme === 'dark') {
                moon.style.display = 'none';
                sun.style.display = 'block';
            } else {
                moon.style.display = 'block';
                sun.style.display = 'none';
            }
        }

        function toggleTheme() {
            const current = window.StudioTheme ? window.StudioTheme.get() : 'dark';
            broadcastTheme(current === 'dark' ? 'light' : 'dark');
        }

        // listen for theme changes triggered by theme.js
        window.addEventListener('studio-theme-change', (e) => {
            updateThemeIcon(e.detail.theme);
        });

        // init icon state on load
        window.addEventListener('DOMContentLoaded', async () => {
            // ── 首帧同步：先用本地存储恢复侧栏顺序与选中高亮。
            //    这两步不依赖网络权限接口，若等到 await FeatureModules.ready 之后才做，
            //    首帧会先画出「HTML 默认顺序 + 无高亮」，请求返回后突变，造成图标/高亮闪烁。
            try {
                if (window.FeatureModules) FeatureModules.applyOrder();
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active', 'submenu-active', 'has-active-child'));
                const saved0 = localStorage.getItem('lastSelectedApp');
                if (saved0) {
                    const s0 = JSON.parse(saved0) || {};
                    const id0 = s0.id, parent0 = s0.parentId;
                    if (id0) {
                        if (parent0 === 'comfy') {
                            const p0 = document.getElementById('nav-comfy');
                            if (p0) p0.classList.add('has-active-child');
                            const c0 = document.querySelector(`.nav-child[onclick*="'${id0}'"]`);
                            if (c0) c0.classList.add('submenu-active');
                        } else {
                            const t0 = document.querySelector(`.nav-item[onclick*="'${id0}'"]`);
                            if (t0) t0.classList.add('active');
                        }
                        document.body.classList.toggle('chat-view', id0 === 'chat-gen');
                    }
                }
            } catch (e) {}

            await FeatureModules.ready;
            const theme = window.StudioTheme ? window.StudioTheme.get() : 'dark';
            updateThemeIcon(theme);

            // Restore last selected app
            // 先清掉首帧同步阶段加的高亮，避免权限校正后出现两项同时高亮
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active', 'submenu-active', 'has-active-child'));
            const saved = localStorage.getItem('lastSelectedApp');
            if (saved) {
                try {
                    let { id, parentId } = JSON.parse(saved);
                    if (id === 'gpt-chat' || id === 'online' || id === 'api-settings' || id === 'comfyui-settings' || id === 'wildcard-settings' || id === 'cli-settings' || (window.FeatureModules && !FeatureModules.isOn(id))) {
                        id = FeatureModules.firstOn();
                        parentId = null;
                    }
                    if (id === 'tripo-studio' || id === 'tts' || id === 'litevideo' || id === 'threeview' || id === 'rodin3d') parentId = 'comfy';
                    if (id) {
                        // If it was a comfyui child item
                        if (parentId === 'comfy') {
                            const parent = document.getElementById('nav-comfy');
                            if (parent) {
                                parent.classList.add('has-active-child');
                            }
                            // 找到并激活对应的子菜单项（但不展开 submenu）
                            const childNav = document.querySelector(`.nav-child[onclick*="'${id}'"]`);
                            if (childNav) {
                                childNav.classList.add('submenu-active');
                                // 同步图标到父按钮
                                if (parent) {
                                    const childSvg = childNav.querySelector('svg');
                                    const parentSvg = parent.querySelector('svg:first-child');
                                    if (childSvg && parentSvg) {
                                        if (!parentSvg._originalHTML) parentSvg._originalHTML = parentSvg.innerHTML;
                                        if (!childSvg._originalHTML) childSvg._originalHTML = childSvg.innerHTML;
                                        parentSvg.innerHTML = childSvg._originalHTML;
                                    }
                                }
                            }
                        } else {
                            // Top-level nav item
                            const topNav = document.querySelector(`.nav-item[onclick*="'${id}'"]`);
                            if (topNav) {
                                topNav.classList.add('active');
                            }
                        }
                        // Activate the iframe
                        document.body.classList.toggle('chat-view', id === 'chat-gen');
                        const target = document.getElementById('frame-' + id);
                        if (target) {
                            target.classList.add('active');
                            if (!target.src) target.src = target.dataset.src;
                            retainFrames(target);
                            syncThemeToFrame(target);
                        }
                    }
                } catch (e) {
                    console.error('Failed to restore last selected app:', e);
                }
            }

            if (window.FeatureModules) FeatureModules.apply();
            // 仅恢复当前仍获准显示的模块。
            if (!document.querySelector('iframe.active')) {
                const fallback = FeatureModules.firstOn();
                const chatFrame = fallback && document.getElementById('frame-' + fallback);
                if (chatFrame) {
                    chatFrame.classList.add('active');
                    if (!chatFrame.src) chatFrame.src = chatFrame.dataset.src;
                    retainFrames(chatFrame);
                    syncThemeToFrame(chatFrame);
                }
                const chatNav = fallback && document.querySelector('[data-module="' + fallback + '"]');
                if (chatNav) chatNav.classList.add('active');
            }
        });

        // sync theme and auth when iframe loads
        document.querySelectorAll('iframe').forEach(f => {
            f.addEventListener('load', () => {
                syncThemeToFrame(f);
                syncAuthToFrame(f);
            });
        });

    </script>
</body>
