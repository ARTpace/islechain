<!DOCTYPE html>
<html lang="zh-CN" data-studio-scale="off">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <title>素材库管理</title>
    <script src="/static/js/theme-default.js?v=20261031a"></script>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || (window.STUDIO_DEFAULT_THEME || 'dark');
                var dark = theme === 'dark';
                document.documentElement.classList.toggle('studio-theme-dark', dark);
                document.documentElement.classList.toggle('theme-dark', dark);
            } catch(e) {}
        })();
    </script>
    <script src="/static/vendor/js/lucide.js?v=20261024001"></script>
    <script src="/static/js/theme.js?v=20261102look"></script>
    <link rel="stylesheet" href="/static/css/theme.css?v=20261102accent">
    <link rel="stylesheet" href="/static/css/studio-ui.css">
    <link rel="stylesheet" href="/static/css/asset-manager.css?v=20261102subchip">
    <link rel="stylesheet" href="/static/css/library-gallery-ui.css?v=20261101prompttabs">
    <link rel="stylesheet" href="/static/css/style-pack-manager.css?v=20261101mediatabs">
    <style id="ui-responsive">
        /* 外壳响应式：防横向滚动 + 移动端堆叠 */
        html, body { overflow-x: hidden; }
        .asset-page, .asset-page-head, .asset-tabs, .asset-manager-root { min-width: 0; }
        @media (max-width: 1024px) {
            .asset-tabs { flex-wrap: wrap; }
        }
        @media (max-width: 640px) {
            .asset-page-head { flex-direction: column; align-items: flex-start; gap: 12px; }
            .asset-head-actions { flex-wrap: wrap; width: 100%; }
            .asset-tabs { overflow-x: auto; flex-wrap: nowrap; }
            .asset-manager-root { min-width: 0; }
        }
    </style>
</head>
<body>
    <div class="asset-page">
        <!-- 视图切换交给主界面侧边栏「应用」展开菜单（素材资产 / 工作流管理 / 提示词库 / 画布资产），页面内不再放标签与页头按钮 -->
        <div id="assetStatus" class="asset-status" style="display:none"></div>

        <main id="assetManagerRoot" class="asset-manager-root"></main>
    </div>

    <input id="assetUploadInput" type="file" accept="image/*,video/*,audio/*,.json,.zip,application/json,application/zip" multiple hidden>
    <script src="/static/modules/style-pack-manager.js?v=20261101platformupdates"></script>
    <script src="/static/modules/content-pack-manager.js?v=20261101mediatabs"></script>
    <script src="/static/modules/prompt-gallery-ui.js?v=20261102fit"></script>
    <script src="/static/modules/asset-library-view.js?v=20261102mergetab"></script>
    <script src="/static/modules/prompt-content-library.js?v=20261102anchorpop"></script>
    <script src="/static/modules/prompt-library-picker.js?v=20261101prompttabs"></script>
    <script src="/static/js/asset-manager.js?v=20261102mergetab"></script>
</body>
</html>
