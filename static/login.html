<!DOCTYPE html>
<html lang="zh-CN" data-studio-scale="off"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light"><meta name="darkreader-lock">
<title>登录 · 屿链</title>
<script src="/static/js/login-theme.js?v=20261111017"></script>
<link rel="stylesheet" href="/static/css/studio-ui.css?v=20261111006">
<link rel="stylesheet" href="/static/css/login.css?v=20261111033">

<link rel="stylesheet" href="/static/css/studio-controls.css?v=20261111006">
</head><body>
<main class="island-world" aria-label="屿链创作工作台">
<div class="scene-stage">
<img class="scene-backdrop" src="/static/assets/login/island-blue-background.webp?v=20261111001" alt="" draggable="false">
<img class="scene-night-lighting" src="/static/assets/login/island-night-lighting.svg?v=20261111018" alt="" aria-hidden="true" draggable="false">
<img class="scene-night-lighting scene-light-bloom" src="/static/assets/login/island-night-lighting.svg?v=20261111018" alt="" aria-hidden="true" draggable="false">


<header class="login-brand" aria-label="IsleChain 屿链">
    <img class="brand-logo brand-logo-day" src="/static/assets/login/islechain-logo.webp?v=20261111023" width="1311" height="360" alt="IsleChain" draggable="false">
    <img class="brand-logo brand-logo-night" src="/static/assets/login/islechain-logo-night.webp?v=20261111024" width="1311" height="360" alt="IsleChain" draggable="false">
    <p class="brand-tagline">连接灵感 · 自由创作</p>
</header>
<section class="login-panel" aria-labelledby="loginTitle">
<div class="login-content">
    <header class="login-heading">
        <h1 id="loginTitle">Welcome!</h1>
        <p>Enter your world on IsleChain</p>
    </header>
<form id="loginForm" autocomplete="off" novalidate>
    <!-- 诱饵输入框：拦掉浏览器自动填充，避免用户名/密码被静默预填 -->
    <div style="position:absolute;left:-9999px;top:-9999px;height:0;opacity:0;overflow:hidden;pointer-events:none;" aria-hidden="true">
        <input type="text" name="fakeusername" tabindex="-1" autocomplete="off">
        <input type="password" name="fakepassword" tabindex="-1" autocomplete="new-password">
    </div>

    <div class="field">
        <label for="username">Email or Username</label>
        <div class="field-box">
            <svg class="field-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M3 22v-2a9 9 0 0 1 18 0v2Z"/></svg>
            <input id="username" type="text" placeholder="Email or Username" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')">
        </div>
    </div>

    <div class="field">
        <label for="password">Password</label>
        <div class="field-box">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" aria-hidden="true"><rect x="4" y="10" width="16" height="12" rx="3" fill="currentColor" stroke="none"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/><path d="M12 15v3" stroke="white"/></svg>
            <input id="password" type="password" placeholder="Password" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly')">
            <button type="button" class="reveal" id="togglePwd" aria-label="显示密码" aria-pressed="false">
                <svg class="i-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6Z"/>
                    <circle cx="12" cy="12" r="2.6"/>
                </svg>
                <svg class="i-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 3l18 18"/>
                    <path d="M10.6 6.2A10 10 0 0 1 12 6c6.4 0 10 6 10 6a17.3 17.3 0 0 1-3.3 3.9"/>
                    <path d="M6.5 8.2A17.4 17.4 0 0 0 2 12s3.6 6 10 6a10 10 0 0 0 3.4-.6"/>
                    <circle cx="12" cy="12" r="2.6"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="login-options">
        <label class="remember-option" title="仅记住账号，不保存密码"><input id="rememberMe" type="checkbox" checked><span>Remember me</span></label>
        <button type="button" class="forgot-password" id="forgotPassword">Forgot password?</button>
    </div>
    <div id="loginError" role="alert" aria-live="polite"><span></span></div>

    <button type="submit" class="btn-primary" id="loginBtn"><span class="label">Log In <span aria-hidden="true">→</span></span></button>

</form>


</div>
</section>
</div></main>
<script src="/static/js/login.js?v=20261111003"></script>
<script src="/static/js/login-effects.js?v=20261111030"></script>
</body></html>
