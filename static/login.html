<!DOCTYPE html>
<html lang="zh-CN" data-studio-scale="off">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>登录 - ART AI</title>
    <link rel="stylesheet" href="/static/css/studio-ui.css">
    <link rel="stylesheet" href="/static/css/login.css?v=20261031c">
    <script src="/static/js/theme-default.js?v=20261031a"></script>
    <script src="/static/js/theme.js?v=20261031c"></script>
</head>
<body>
<canvas id="bgCanvas" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<header class="brand">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 2.5 L29.5 16 L16 29.5 L2.5 16 Z" fill="none" stroke="currentColor" stroke-width="1.1" opacity=".55"/>
        <path d="M16 8.2 L23.8 16 L16 23.8 L8.2 16 Z" fill="none" stroke="currentColor" stroke-width=".75" opacity=".3"/>
        <circle cx="16" cy="16" r="2.5" fill="currentColor"/>
    </svg>
    <h1>ART AI</h1>
    <p>创作工作台</p>
</header>

<form id="loginForm" autocomplete="off" novalidate>
    <!-- 诱饵输入框：拦掉浏览器自动填充，避免用户名/密码被静默预填 -->
    <div style="position:absolute;left:-9999px;top:-9999px;height:0;opacity:0;overflow:hidden;pointer-events:none;" aria-hidden="true">
        <input type="text" name="fakeusername" tabindex="-1" autocomplete="off">
        <input type="password" name="fakepassword" tabindex="-1" autocomplete="new-password">
    </div>

    <div class="field">
        <label for="username">用户名</label>
        <div class="field-box">
            <input id="username" type="text" placeholder="输入用户名" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')">
        </div>
    </div>

    <div class="field">
        <label for="password">密码</label>
        <div class="field-box">
            <input id="password" type="password" placeholder="输入密码" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly')">
            <button type="button" class="reveal" id="togglePwd" aria-label="显示密码" aria-pressed="false">
                <svg class="i-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6Z"/>
                    <circle cx="12" cy="12" r="2.6"/>
                </svg>
                <svg class="i-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 3l18 18"/>
                    <path d="M10.6 6.2A10 10 0 0 1 12 6c6.4 0 10 6 10 6a17.3 17.3 0 0 1-3.3 3.9"/>
                    <path d="M6.5 8.2A17.4 17.4 0 0 0 2 12s3.6 6 10 6a10 10 0 0 0 3.4-.6"/>
                    <circle cx="12" cy="12" r="2.6"/>
                </svg>
            </button>
        </div>
    </div>

    <div id="loginError" role="alert" aria-live="polite"><span></span></div>

    <button type="submit" class="btn-primary" id="loginBtn"><span class="label">登录</span></button>
    <button type="button" class="btn-link" id="registerBtn">还没有账号？<b>创建账号</b></button>
</form>

<div class="footer">ART AI · 本地创作工作台</div>

<script src="/static/js/login-bg.js?v=20261031c"></script>
<script src="/static/js/login.js?v=20261031c"></script>
</body>
</html>
