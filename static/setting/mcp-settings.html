<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP 工具</title>
    <script src="/static/modules/auth-token.js?v=20261103mcp"></script>
    <script src="/static/js/theme-default.js?v=20261031a"></script>
<script src="/static/js/theme.js?v=20261111016"></script>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || (window.STUDIO_DEFAULT_THEME || 'dark');
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                }
                if(location.search.indexOf('embed=1') >= 0) document.documentElement.classList.add('embed');
                if(window.parent !== window) document.documentElement.classList.add('in-settings');
            } catch(e) {}
        })();
    </script>
    <script src="/static/lucide.min.js?v=20261024001"></script>

    <link rel="stylesheet" href="/static/theme.css?v=20261108011">
    <link rel="stylesheet" href="/static/css/studio-ui.css?v=20261108011">
    <style>
        :root { --bg:var(--ui-bg); --panel:var(--ui-panel); --soft:var(--ui-soft); --line:var(--ui-line); --line-strong:var(--ui-line-strong); --text:var(--ui-text); --muted:var(--ui-muted); --faint:var(--ui-faint); --accent:var(--ui-accent); --accent-glow:var(--ui-accent-glow); --neon-cyan:var(--ui-accent); }
        body.studio-theme-dark, html.studio-theme-dark body { --bg:var(--ui-bg); --panel:var(--ui-panel); --soft:var(--ui-soft); --line:var(--ui-line); --line-strong:var(--ui-line-strong); --text:var(--ui-text); --muted:var(--ui-muted); --faint:var(--ui-faint); --accent:var(--ui-accent); --accent-glow:var(--ui-accent-glow); --neon-cyan:var(--ui-accent); }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:'Fira Code',Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
        html.embed .page { padding:16px 16px 40px; }
        html.embed .page-head { display:none; }
        .page { min-height:100vh; padding:32px 24px 72px; background: radial-gradient(ellipse at top, rgba(0,240,255,.03) 0%, transparent 50%), var(--bg); }
        .wrap { max-width:1040px; margin:0 auto; }
        .page-head { padding:0 4px 24px; display:flex; justify-content:space-between; align-items:end; gap:20px; flex-wrap:wrap; }
        .page-head .title { font-size:24px; font-weight:900; letter-spacing:-.015em; color:var(--neon-cyan); }
        .page-head .sub { margin-top:8px; color:var(--muted); font-size:12.5px; line-height:1.6; font-weight:600; max-width:560px; }
        .page-head .status { color:var(--neon-cyan); font-size:11.5px; font-weight:700; letter-spacing:.04em; min-height:16px; }
        .block { margin-bottom:16px; padding:16px 18px; background:var(--panel); border:1px solid var(--line); border-radius:16px; }
        .block-title { font-size:14px; font-weight:800; color:var(--text); }
        .block-desc { margin-top:4px; color:var(--muted); font-size:12px; line-height:1.55; }
        .summary { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
        .actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px; }
        .btn { border:1px solid var(--line-strong); border-radius:9px; padding:7px 12px; font-size:12px; font-weight:700; color:var(--text); background:var(--soft); cursor:pointer; transition:all .15s ease; }
        .btn:hover { border-color:var(--accent); }
        .btn:disabled { opacity:.45; cursor:default; }
        .btn.primary { background:var(--accent); color:var(--bg); border-color:transparent; }
        .btn.danger { color:#e11d48; }
        .btn.small { padding:5px 9px; font-size:11px; }
        .server-meta { margin-top:10px; color:var(--muted); font-size:11.5px; word-break:break-all; }
        .server-actions { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 4px; }
        .checks { display:flex; flex-direction:column; gap:7px; margin:10px 0; padding:11px 13px; border:1px solid var(--line); border-radius:11px; background:var(--soft); }
        .checks label { display:flex; gap:8px; align-items:flex-start; font-size:12.5px; color:var(--muted); line-height:1.5; }
        .tool-list { max-height:280px; overflow:auto; margin-top:8px; }
        .tool { display:flex; gap:8px; align-items:flex-start; padding:8px 0; border-top:1px dashed var(--line); }
        .tool-name { font-weight:700; font-size:12.5px; color:var(--text); }
        .tool-desc { display:block; color:var(--faint); font-size:11px; line-height:1.5; margin-top:2px; }
        .risk { display:inline-block; margin-left:6px; padding:0 6px; border-radius:5px; font-size:11px; line-height:17px; border:1px solid var(--line-strong); color:var(--muted); }
        .risk[data-risk=readonly] { color:#1a7f4b; border-color:#1a7f4b55; background:#1a7f4b12; }
        .risk[data-risk=mutating] { color:#9a6400; border-color:#9a640055; background:#9a640012; }
        .risk[data-risk=destructive] { color:#c0392b; border-color:#c0392b55; background:#c0392b12; }
        .risk[data-risk=trusted] { color:var(--ui-accent); border-color:color-mix(in srgb, var(--ui-accent) 33.33%, transparent); background:color-mix(in srgb, var(--ui-accent) 7.06%, transparent); }
        .empty { color:var(--faint); font-size:12px; padding:4px 2px; }
        .import summary { cursor:pointer; font-weight:700; font-size:13px; color:var(--text); }
        .import label { display:block; margin:12px 0 6px; font-size:12.5px; color:var(--muted); }
        textarea { width:100%; min-height:130px; border:1px solid var(--line-strong); border-radius:10px; padding:10px; background:transparent; color:inherit; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; line-height:1.55; resize:vertical; }
        textarea:focus { outline:none; border-color:var(--accent); }
        .notice { min-height:20px; font-size:12.5px; line-height:1.7; color:var(--muted); white-space:pre-wrap; }
        .hint { color:var(--faint); font-size:11.5px; line-height:1.6; }
        /* 紧凑卡片列表 + 详情切换 */
        .mcp-tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:12px; }
        .mcp-tile { display:flex; flex-direction:column; gap:10px; min-height:112px; padding:13px 14px; background:var(--panel); border:1px solid var(--line-strong); border-radius:14px; cursor:pointer; transition:border-color .15s ease,transform .15s ease,opacity .15s ease; }
        .mcp-tile:hover { border-color:var(--accent); transform:translateY(-1px); }
        .mcp-tile.is-off { opacity:.48; }
        .mcp-tile.is-off .sk-state i { background:var(--muted); }
        .mcp-tile-top { display:flex; align-items:center; gap:9px; min-width:0; }
        .mcp-tile-mark { width:28px; height:28px; flex:none; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; background:var(--soft); border:1px solid var(--line-strong); color:var(--accent); font-size:13px; font-weight:800; }
        .mcp-tile-name { flex:1; min-width:0; font-size:12.5px; font-weight:800; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .mcp-tile-meta { display:flex; flex-wrap:wrap; gap:5px 10px; font-size:10.5px; color:var(--muted); }
        .mcp-tile-meta b { color:var(--text); font-weight:750; }
        .mcp-tile-tag { padding:1px 6px; border:1px solid var(--line); border-radius:6px; color:var(--accent); }
        .mcp-tile-endpoint { font-size:10.5px; color:var(--faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .mcp-tile-foot { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:auto; }
        .mcp-tile-foot .sk-switch { flex:none; }
        .mcp-tile-hint { font-size:10.5px; color:var(--faint); }
        #mcpHome[hidden], .mcp-detail[hidden] { display:none !important; }
        .mcp-detail-bar { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
        .mcp-detail-title { font-size:15px; font-weight:850; color:var(--text); }
        .mcp-detail-state { font-size:11px; color:var(--muted); }
        .mcp-card { padding:16px 18px; background:var(--panel); border:1px solid var(--line); border-radius:16px; }
        .mcp-head { display:flex; align-items:center; gap:12px; }
        .mcp-name { font-size:15px; font-weight:850; color:var(--text); word-break:break-all; }
    </style>
    <link rel="stylesheet" href="/static/setting/settings-kit.css?v=20261111001">
</head>
<body class="sk-settings-page">
    <div class="page">
        <div class="wrap">
            <header class="page-head">
                <div>
                    <div class="title">MCP 工具</div>
                    <div class="sub">服务连接 · 工具授权 · 信任管理</div>
                </div>
                <div id="status" class="status"></div>
            </header>

            <div id="mcpHome">
                <section class="block summary">
                    <div>
                        <div class="block-title">服务总览</div>
                        <div id="summary" class="block-desc">正在加载服务…</div>
                    </div>
                    <div class="actions" style="margin:0">
                        <button class="btn primary" type="button" data-act="add">添加服务</button>
                        <button class="btn" type="button" data-act="reload">刷新</button>
                    </div>
                </section>

                <div class="mcp-tiles" id="servers"></div>

                <details class="block import" id="import">
                    <summary>添加服务 / 导入 MCP 配置</summary>
                    <label>配置 JSON</label>
                    <textarea id="config" spellcheck="false" placeholder='{"mcpServers":{"my-tool":{"url":"http://127.0.0.1:3000/mcp"}}}'></textarea>
                    <p class="hint">兼容 mcpServers 格式；stdio 使用 command、args、env，可选 cwd。认证使用 headers。新服务默认停用，需在卡片上启用并授权工具。</p>
                    <div class="server-actions"><button class="btn" type="button" id="save"><span>保存配置</span></button></div>
                </details>
            </div>

            <section class="mcp-detail" id="mcpDetail" hidden>
                <div class="mcp-detail-bar">
                    <button class="btn small" type="button" data-nav="back">&#8249; 返回列表</button>
                    <span class="mcp-detail-title" id="detailTitle"></span>
                    <span class="mcp-detail-state" id="detailState"></span>
                </div>
                <div id="mcpDetailCard"></div>
            </section>

            <p class="notice" id="notice" role="status" aria-live="polite"></p>
        </div>
    </div>
    <script src="/static/js/mcp-settings.js?v=20261109mcp1"></script>
    <script src="/static/setting/settings-graphic.js?v=sk2"></script>
</body>
</html>
