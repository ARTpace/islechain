<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机生成器</title>
    <script src="/static/modules/auth-token.js"></script>
    <script>(function(){try{var t=localStorage.getItem('studio_theme')||localStorage.getItem('canvas_theme')||'dark';if(t==='dark'){document.documentElement.classList.add('studio-theme-dark','theme-dark');}}catch(e){}})();</script>
    <link rel="stylesheet" href="/static/tailwind.min.css">
    <script src="/static/lucide.min.js"></script>
    <script src="/static/theme.js"></script>
    <link rel="stylesheet" href="/static/theme.css">
    <style>
        :root{--bg:#f8f8f8;--text-main:#1a1a1a;--accent:#00b4d8;--card-bg:#fff;--border:rgba(0,0,0,0.06);--text-sub:#999;}
        body{background:var(--bg);color:var(--text-main);font-family:'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;margin:0;min-height:100vh;padding:24px;}
        body.studio-theme-dark{--bg:#0a0e17;--text-main:#e0e7ef;--card-bg:#0d1520;--border:rgba(255,255,255,0.06);--text-sub:#666;}
        
        .container{max-width:600px;margin:0 auto;}
        .header{margin-bottom:24px;}
        .header h1{font-size:20px;font-weight:800;margin:0 0 4px;}
        .header p{font-size:12px;color:var(--text-sub);margin:0;}
        
        .card{background:var(--card-bg);border-radius:12px;border:1px solid var(--border);padding:16px;margin-bottom:12px;}
        
        .source-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);}
        .source-row:last-child{border-bottom:none;}
        .source-icon{font-size:20px;width:32px;text-align:center;}
        .source-info{flex:1;}
        .source-name{font-size:13px;font-weight:700;}
        .source-count{font-size:11px;color:var(--text-sub);}
        .source-controls{display:flex;align-items:center;gap:8px;}
        
        .toggle{position:relative;width:36px;height:20px;background:#ccc;border-radius:10px;cursor:pointer;transition:background 0.2s;}
        .toggle.active{background:var(--accent);}
        .toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:transform 0.2s;}
        .toggle.active::after{transform:translateX(16px);}
        
        select{padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:11px;background:transparent;color:var(--text-main);outline:none;}
        select:focus{border-color:var(--accent);}
        
        .count-input{width:50px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:11px;text-align:center;background:transparent;color:var(--text-main);outline:none;}
        .count-input:focus{border-color:var(--accent);}
        
        .btn{height:40px;padding:0 24px;border-radius:10px;font-size:13px;font-weight:700;border:none;cursor:pointer;transition:all 0.15s;display:inline-flex;align-items:center;gap:8px;}
        .btn-primary{background:var(--accent);color:#fff;}
        .btn-primary:hover{opacity:0.9;transform:translateY(-1px);}
        .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-main);}
        .btn-ghost:hover{background:rgba(0,0,0,0.04);}
        body.studio-theme-dark .btn-ghost:hover{background:rgba(255,255,255,0.04);}
        
        .btn-row{display:flex;gap:8px;margin-top:16px;}
        
        .result-box{margin-top:16px;padding:16px;border-radius:12px;background:rgba(0,180,216,0.05);border:1px solid rgba(0,180,216,0.2);}
        .result-title{font-size:11px;font-weight:800;color:var(--accent);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.05em;}
        .result-content{font-size:12px;line-height:1.8;}
        .result-item{display:inline-block;padding:4px 8px;margin:2px;border-radius:6px;background:rgba(0,180,216,0.1);font-weight:600;}
        
        .empty-state{text-align:center;padding:40px;color:var(--text-sub);}
        .empty-state .icon{font-size:48px;margin-bottom:12px;opacity:0.5;}
        .empty-state .text{font-size:13px;font-weight:600;}
        
        .toast{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:10px;font-size:12px;font-weight:600;z-index:1000;transform:translateX(120%);transition:transform 0.3s ease;}
        .toast.show{transform:translateX(0);}
        .toast.success{background:#10b981;color:#fff;}
        .toast.error{background:#ef4444;color:#fff;}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎲 随机生成器</h1>
            <p>随机组合角色、画师、预设和 LoRA，快速生成多样化图片</p>
        </div>

        <!-- 随机源配置 -->
        <div class="card">
            <div class="source-row">
                <div class="source-icon">👤</div>
                <div class="source-info">
                    <div class="source-name">角色</div>
                    <div class="source-count" id="characterCount">加载中...</div>
                </div>
                <div class="source-controls">
                    <select id="characterCategory">
                        <option value="">全部</option>
                    </select>
                    <div class="toggle active" id="characterToggle" onclick="toggleSource('character')"></div>
                </div>
            </div>

            <div class="source-row">
                <div class="source-icon">🎨</div>
                <div class="source-info">
                    <div class="source-name">画师</div>
                    <div class="source-count" id="artistCount">加载中...</div>
                </div>
                <div class="source-controls">
                    <select id="artistCategory">
                        <option value="">全部</option>
                    </select>
                    <input type="number" class="count-input" id="artistCount" value="1" min="1" max="5" title="数量">
                    <div class="toggle active" id="artistToggle" onclick="toggleSource('artist')"></div>
                </div>
            </div>

            <div class="source-row">
                <div class="source-icon">⚙️</div>
                <div class="source-info">
                    <div class="source-name">预设</div>
                    <div class="source-count" id="presetCount">加载中...</div>
                </div>
                <div class="source-controls">
                    <select id="presetCategory">
                        <option value="">全部</option>
                    </select>
                    <div class="toggle active" id="presetToggle" onclick="toggleSource('preset')"></div>
                </div>
            </div>

            <div class="source-row">
                <div class="source-icon">🎯</div>
                <div class="source-info">
                    <div class="source-name">LoRA</div>
                    <div class="source-count" id="loraCount">加载中...</div>
                </div>
                <div class="source-controls">
                    <select id="loraCategory">
                        <option value="">全部</option>
                    </select>
                    <div class="toggle" id="loraToggle" onclick="toggleSource('lora')"></div>
                </div>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="btn-row">
            <button class="btn btn-primary" onclick="randomAll()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
                随机生成
            </button>
            <button class="btn btn-ghost" onclick="copyResult()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                复制结果
            </button>
        </div>

        <!-- 结果展示 -->
        <div class="result-box" id="resultBox" style="display:none;">
            <div class="result-title">随机结果</div>
            <div class="result-content" id="resultContent"></div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // === 状态 ===
        let sources = {};
        let lastResult = null;

        // === API ===
        async function api(path) {
            const res = await fetch(path, {
                headers: { 'Authorization': 'Bearer ' + (window.AUTH_TOKEN || '') }
            });
            if (!res.ok) throw new Error(res.statusText);
            return res.json();
        }

        // === 加载数据 ===
        async function loadSources() {
            try {
                const data = await api('/api/random/sources');
                sources = {};
                data.forEach(s => sources[s.id] = s);
                renderSourceInfo();
                await loadCategories();
            } catch (e) {
                showToast('加载失败: ' + e.message, 'error');
            }
        }

        async function loadCategories() {
            for (const id of Object.keys(sources)) {
                try {
                    const data = await api(`/api/random/categories/${id}`);
                    const select = document.getElementById(`${id}Category`);
                    if (select && data.categories) {
                        select.innerHTML = '<option value="">全部</option>' + 
                            data.categories.map(c => `<option value="${c}">${c}</option>`).join('');
                    }
                } catch (e) {
                    console.error(`加载 ${id} 类别失败:`, e);
                }
            }
        }

        // === 渲染 ===
        function renderSourceInfo() {
            for (const [id, source] of Object.entries(sources)) {
                const countEl = document.getElementById(`${id}Count`);
                if (countEl && countEl.tagName !== 'INPUT') {
                    countEl.textContent = `${source.count} 项`;
                }
            }
        }

        // === 切换开关 ===
        function toggleSource(id) {
            const toggle = document.getElementById(`${id}Toggle`);
            if (toggle) {
                toggle.classList.toggle('active');
            }
        }

        // === 随机生成 ===
        async function randomAll() {
            const config = {};
            
            // 收集配置
            for (const id of Object.keys(sources)) {
                const toggle = document.getElementById(`${id}Toggle`);
                const category = document.getElementById(`${id}Category`);
                const countInput = document.getElementById(`${id}Count`);
                
                config[id] = {
                    enabled: toggle ? toggle.classList.contains('active') : true,
                    category: category ? category.value : undefined,
                    count: countInput && countInput.tagName === 'INPUT' ? parseInt(countInput.value) || 1 : 1
                };
            }

            try {
                const result = await fetch('/api/random/all', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + (window.AUTH_TOKEN || '')
                    },
                    body: JSON.stringify(config)
                }).then(r => r.json());

                lastResult = result;
                renderResult(result);
            } catch (e) {
                showToast('随机生成失败: ' + e.message, 'error');
            }
        }

        // === 渲染结果 ===
        function renderResult(result) {
            const box = document.getElementById('resultBox');
            const content = document.getElementById('resultContent');
            
            let html = '';
            
            for (const [id, item] of Object.entries(result)) {
                const source = sources[id];
                if (!source) continue;
                
                html += `<div style="margin-bottom:8px;">`;
                html += `<strong>${source.icon} ${source.name}:</strong> `;
                
                if (Array.isArray(item)) {
                    html += item.map(i => `<span class="result-item">${i.name || i.id}</span>`).join(' ');
                } else {
                    html += `<span class="result-item">${item.name || item.id}</span>`;
                }
                
                html += `</div>`;
            }
            
            if (!html) {
                html = '<div style="color:var(--text-sub);">未选择任何随机源</div>';
            }
            
            content.innerHTML = html;
            box.style.display = 'block';
        }

        // === 复制结果 ===
        function copyResult() {
            if (!lastResult) {
                showToast('没有可复制的结果', 'error');
                return;
            }
            
            let text = '';
            for (const [id, item] of Object.entries(lastResult)) {
                if (Array.isArray(item)) {
                    text += item.map(i => i.trigger || i.danbooru_tag || i.name || '').filter(Boolean).join(', ');
                } else {
                    text += item.trigger || item.danbooru_tag || item.name || '';
                }
                text += ', ';
            }
            
            text = text.replace(/, $/, '');
            
            navigator.clipboard.writeText(text).then(() => {
                showToast('已复制到剪贴板', 'success');
            }).catch(() => {
                showToast('复制失败', 'error');
            });
        }

        // === Toast ===
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // === 初始化 ===
        document.addEventListener('DOMContentLoaded', () => {
            loadSources();
            lucide.createIcons();
        });
    </script>
</body>
</html>
