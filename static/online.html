    <style>
        :root { --accent:#111827; --bg:#f9fafb; --card:#fff; --easing:cubic-bezier(0.4,0,0.2,1); }

        .control-label { display:flex; align-items:center; gap:6px; color:#94a3b8; font-size:10px; font-weight:600; letter-spacing:.04em; }
        .size-row { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px; align-items:start; }
        .size-field { min-width:0; display:flex; flex-direction:column; gap:6px; }
        .size-select,.size-custom { width:100%; min-width:0; max-width:100%; height:34px; border:1px solid #edf2f7; border-radius:14px; background:#f8fafc; color:#111827; outline:none; padding:0 10px; font-size:11px; font-weight:700; }
        .size-select { -webkit-appearance:none; appearance:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; padding-right:28px; transition:border-color .15s; background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='2,4 6,8 10,4'/%3e%3c/svg%3e"); background-repeat:no-repeat; background-position:right 10px center; background-size:11px; }
        .size-select:focus { border-color:#3b82f6; }

        .size-custom { display:none; background:#fff; }

        /* 比例自定义下拉 */

    <script>
    (function(){
        // 检测访问来源
        const _isLocalAccess = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost';
        const COMFYUI_CONFIG = {"local_address": "127.0.0.1:8188", "cloud_address": "https://kg03rrnf6rg9bxab-8188.container.x-gpu.com/", "active_server": _isLocalAccess ? "本地服务器" : "云端服务器"};
        let COMFYUI_SERVER = 'http://127.0.0.1:8188';
        let IS_LOCAL_SERVER = _isLocalAccess;
        const CLIENT_ID = localStorage.getItem("client_id") || ('online_' + Date.now().toString(36) + Math.random().toString(36).substr(2, 9));
        if (!localStorage.getItem("client_id")) localStorage.setItem("client_id", CLIENT_ID);
        async function loadConfig(){
            const localConfig = localStorage.getItem('comfyui_config');
            if (localConfig) {
                try {
                    const config = JSON.parse(localConfig);
                    const activeServer = config.active_server || '本地服务器';
                    IS_LOCAL_SERVER = (activeServer === '本地服务器');
                    if (activeServer === '云端服务器' && config.cloud_address) {
                        COMFYUI_SERVER = (config.cloud_address.startsWith('http') ? config.cloud_address : `https://${config.cloud_address}`).replace(/\/+$/, '');
                    } else if (config.local_address) {
                        COMFYUI_SERVER = (config.local_address.startsWith('http') ? config.local_address : `http://${config.local_address}`).replace(/\/+$/, '');
                    }
                } catch(e) {}
            }
        }
        window.loadConfig = loadConfig;
    })();

    lucide.createIcons();
    const DEFAULT_IMAGE_MODELS = ["gpt-image-2-all","nano-banana","gpt-image-1"];
    const JIMENG_DEFAULT_IMAGE_MODELS = ["5.0Pro","5.0","4.7","4.6","4.5","4.1","4.0","3.1","3.0"];

    /* ---------- 全局状态 ---------- */
    let selectedProviderId = '';
    let selectedModel = '';
    let currentProtocol = 'api';
    let providerModels = {};
    let allProviders = [];
    let apiProviders = [];
    let providerMode = 'api'; // 当前协议模式（用于协议自适应）
    let quality = 'auto';
    let outputCount = 1;
    let generateType = 'image'; // 'image' | 'video'
    let selectedVideoModel = '';
    let videoDuration = 5;
    let customRatioWidth = '';
    let customRatioHeight = '';
    let customWidth = '';
    let customHeight = '';

    const PAGE_SIZE = 24;
    let allHistory = [], currentIndex = 0, isLoading = false, currentResult = null;

    let refs = [];
    let ratio = 'square';
    let resolution = '1k';

    /* ---------- 尺寸表（Infinite-Canvas 版，含 4K）---------- */
    const SIZE_OPTIONS = {
        square:     [['1024x1024','1k'],['2048x2048','2k'],['3840x3840','4k']],
        portrait:   [['1024x1536','1k'],['1360x2048','2k'],['2352x3520','4k']],
        portrait43: [['1008x1344','1k'],['1536x2048','2k'],['2448x3264','4k']],
        landscape43:[['1344x1008','1k'],['2048x1536','2k'],['3264x2448','4k']],
        landscape:  [['1536x1024','1k'],['2048x1360','2k'],['3520x2352','4k']],
        story:      [['720x1280','1k'],['1152x2048','2k'],['2160x3840','4k']],
        wide:       [['1280x720','1k'],['2048x1152','2k'],['3840x2160','4k']]
    };
    const RES_LONG_SIDE = { '1k': 1536, '2k': 2048, '4k': 3840 };

    /* ---------- Provider 协议识别 ---------- */
    function getProviderProtocol(id){
        const prov = allProviders.find(p => p.id === id);
        const proto = String(prov?.protocol || '').toLowerCase();
        const pid = String(id || '').toLowerCase();
        const base = String(prov?.base_url || '').toLowerCase();
        if(proto === 'modelscope' || pid === 'modelscope') return 'modelscope';
        if(proto === 'runninghub' || pid === 'runninghub') return 'runninghub';
        if(proto === 'jimeng' || pid === 'jimeng') return 'jimeng';
        if(proto === 'volcengine' || pid === 'volcengine') return 'volcengine';
        if(proto === 'gemini') return 'gemini';
        if(proto === 'codex' || pid === 'codex') return 'codex';
        if(proto === 'gemini-cli' || pid === 'gemini-cli') return 'gemini-cli';
        if(proto === 'apimart' || base.includes('apimart.ai')) return 'apimart';

            try {
                const res = await fetch(`/api/providers/models?provider_id=${encodeURIComponent(selectedProviderId)}`);
                const data = await res.json();
                if (data.image_models && data.image_models.length > 0) models = data.image_models;
            } catch(e) {}
            if (!models.length) {
                const prov = allProviders.find(p => p.id === selectedProviderId);
                if (prov && prov.image_models && prov.image_models.length) models = prov.image_models;
            }
            if (!models.length) {
                if (selectedProviderId === 'modelscope') models = (window.IMAGE_MODELS || DEFAULT_IMAGE_MODELS).filter(m => !m.toLowerCase().includes('gpt') && !m.toLowerCase().includes('nano'));
                else if (selectedProviderId === 'jimeng') models = JIMENG_DEFAULT_IMAGE_MODELS;
                else if (selectedProviderId === 'gemini-cli') models = ['auto'];
                else if (selectedProviderId === 'codex') models = ['gpt-image-2'];
                else models = (window.IMAGE_MODELS && window.IMAGE_MODELS.length > 0) ? window.IMAGE_MODELS : DEFAULT_IMAGE_MODELS;
            }
            providerModels[selectedProviderId] = models;
            renderModelList();

    function customRatioValue(){
        const w = parseInt(customRatioWidth, 10);
        const h = parseInt(customRatioHeight, 10);
        if (!w || !h || w < 1 || h < 1) return null;
        return [w, h];
    }
    function customSizeValue(){
        const w = parseInt(customWidth, 10);
        const h = parseInt(customHeight, 10);
        if (!w || !h || w < 64 || h < 64) return null;
        return `${w}x${h}`;
    }
    function fitCustomSizeToImage(ev){
        if (ev) ev.stopPropagation();
        // 从第一张参考图获取尺寸
        const firstRef = refs.find(r => r && r.url);
        if (!firstRef) return;
        const img = new Image();
        img.onload = function() {
            const wInput = document.getElementById('sizeCustomWidth');
            const hInput = document.getElementById('sizeCustomHeight');
            if (wInput && hInput) {
                wInput.value = this.naturalWidth;
                hInput.value = this.naturalHeight;
                setCustomSize();
            }
        };
        img.src = firstRef.url;
        alert('请先上传参考图');
    }
    function currentSize(){
        if (ratio === 'custom') {
            const cs = customSizeValue();
            if (cs) return cs;
            // fallback 用 customRatioValue 算像素
            const cr = customRatioValue();
            if (cr) {
                const longSide = RES_LONG_SIDE[resolution] || 1536;
                const ratio = cr[0] / cr[1];
                if (ratio >= 1) return `${longSide}x${Math.round(longSide / ratio)}`;
                return `${Math.round(longSide * ratio)}x${longSide}`;
            }
            return '1024x1024';
        }
        if (resolution === 'custom') {
            const cs = customSizeValue();
            if (cs) return cs;
        }
        const options = SIZE_OPTIONS[ratio] || SIZE_OPTIONS.square;
        const match = options.find(([, label]) => label === resolution) || options[0];
        return match[0];
    }

    function applyAssetToRef(url, name){
        closeAssetPickerForRefs();
        if (!_refImgMgr) return;
        // 将资产库 URL 转为 File 添加到 RefImageManager
        fetch(url).then(r => r.blob()).then(blob => {
            const ext = (name || 'image').split('.').pop() || 'png';
            const file = new File([blob], name || ('asset.' + ext), { type: blob.type || 'image/' + ext });
            _refImgMgr.addFiles([file]);
        }).catch(() => {
            // 降级：直接添加 URL
            if (_refImgMgr.getFiles) {
                // RefImageManager 暂不支持直接 URL 添加，这里用一个简单的 fallback
                alert('无法加载资产图片');
            }
        });
    }

    /* ---------- 生成提交 ---------- */
    async function submitImage(){
        const prompt = document.getElementById('prompt').value.trim();
        if (!prompt) { alert('请输入提示词'); return; }
        const btn = document.getElementById('genBtn');
        btn.disabled = true;
        const count = generateType === 'video' ? 1 : outputCount;
        const batchId = Date.now();
        // 创建 pending card（单图/多图都显示）
        const masonry = document.getElementById('masonry');
        createPendingCards(batchId, count, masonry);
        const refImages = refs.filter(r => r && r.url).map(r => ({ url: r.url, name: r.name || '' }));
        let body, apiUrl;
        if(generateType === 'video'){
            apiUrl = '/api/online-video';
            body = {
                prompt, model: selectedVideoModel || selectedModel || '',
                size: currentSize(),
                duration: videoDuration,
                protocol: providerMode,
                provider_id: selectedProviderId,
                reference_images: refImages,
            };
        } else {
            apiUrl = '/api/online-image';
            body = {
                prompt, model: selectedModel || '',
                size: currentSize(),
                protocol: getProtocol(selectedModel),
                provider_id: selectedProviderId,
                reference_images: refImages,
                quality: quality,
                image_request_mode: ''
            };
            const activeProv = allProviders.find(p => p.id === selectedProviderId);
            if (activeProv && activeProv.image_request_mode) {
                body.image_request_mode = activeProv.image_request_mode;
            }
        }
        const requests = Array.from({length: count}, () =>
            fetch(apiUrl, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})
                .then(async r => { if(!r.ok) { const err = await r.json(); throw new Error(err.detail || '生成失败'); } return r.json(); })
        );
        try {
            const results = await Promise.allSettled(requests);
            results.forEach((res, i) => {
                if (res.status === 'fulfilled') {
                    const data = res.value;
                    updatePendingCard(batchId, i, data);
                    if (i === 0) currentResult = data;
                    // 始终渲染到历史
                    const imgArr = data.images || data.videos || [];
                    if(imgArr[0] && !document.getElementById(`history-${data.timestamp}`)){
                        allHistory.unshift(data);
                        renderImageCard(data, true);
                        if(typeof GalleryList !== 'undefined' && GalleryList.pushNewImage){
                            GalleryList.pushNewImage(data);
                        }
                        fetch('/api/history/save', {
                            method:'POST', headers:{'Content-Type':'application/json'},
                            body: JSON.stringify(data)
                        }).then(r => r.json()).then(d => {
                            if(d.timestamp) data.timestamp = d.timestamp;
                        }).catch(e => console.warn('[history save]', e));
                    }
                } else {
                    failPendingCard(batchId, i);
                }
            });
        } catch(err) { console.error(err); }
        finally {
            btn.disabled = false;
        }
    }

    function getProtocol(model){
        if (!model) return currentProtocol || providerMode || 'openai';
        const m = model.toLowerCase();
        if (m.includes('gemini')) return 'gemini';
        if (m.includes('nano-banana') || m.includes('gpt-image')) return 'openai';
        return currentProtocol || providerMode || 'openai';
    }

    /* ---------- Pending Card (生成中占位) ---------- */
    function createPendingCards(batchId, count, masonry){
        if (!masonry || typeof CardProgress === 'undefined') return;
        for (let i = 0; i < count; i++) {
            const id = `pending-${batchId}-${i}`;
            if (document.getElementById(id)) continue;
            const card = document.createElement('div');
            card.id = id;
            card.className = 'masonry-item';
            card.style.minHeight = '120px';
            card.style.position = 'relative';
            masonry.prepend(card);
            // 使用 CardProgress 环形进度条
            CardProgress.attach(card).update({ status: 'started' });
            // 2 秒后切换到"执行中"
            setTimeout(() => {
                const c = document.getElementById(id);
                if (c) CardProgress.update(c, { status: 'executing' });
            }, 2000);
        }
    }
    function updatePendingCard(batchId, index, data){
        const pid = `pending-${batchId}-${index}`;
        const card = document.getElementById(pid);
        if (!card || !data.images?.[0]) return;
        // 先显示"完成"动画
        CardProgress.update(card, { status: 'complete' });
        // 延迟替换为真实卡片（让完成动画先播放一下）
        setTimeout(() => {
            if (!card.parentNode) return;
            if (document.getElementById(`history-${data.timestamp}`)) { card.remove(); return; }
            card.id = `history-${data.timestamp}`;
            card.style.minHeight = '';
            card.style.position = '';
            card.className = 'masonry-item group relative';
            card.onclick = () => openLightbox(data.images[0], allHistory.map(h => h.images[0]), allHistory.indexOf(data));
            card.innerHTML = buildCardInner(data);

    function failPendingCard(batchId, index){
        const pid = `pending-${batchId}-${index}`;

        if (!card) return;

    function buildCardInner(data){
        const u = (data.images[0]||'').replace(/\\/g,'\\\\').replace(/'/g,'\\');
        const p = (data.prompt||'Online Image').replace(/\\/g,'\\\\').replace(/'/g,'\\').replace(/`/g,'\\`').replace(/</g,'&lt;');
        const ts = data.timestamp;
        return '<div class="relative group">\
<img src="' + u + '" class="w-full block" style="display:block;object-fit:contain;" loading="lazy" onerror="this.closest(\'.masonry-item\')?.remove()">\
<div class="absolute top-3 right-3 flex gap-1.5 opacity-0 group-hover:opacity-100 z-10 transition-opacity">\
<button onclick="backfillParams(\'' + ts + '\',event)" class="card-action-btn" title="参数回填"><i data-lucide="undo-2" class="w-3.5 h-3.5"></i></button>\
<button onclick="processRemoveBg(\'' + u + '\',\'' + ts + '\',event)" class="card-action-btn" title="去除背景"><i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i></button>\
<button onclick="saveToAssetLibrary(\'' + u + '\',event)" class="card-action-btn" title="保存到资产库"><i data-lucide="folder-plus" class="w-3.5 h-3.5"></i></button>\

</div>\
<div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 p-4 pt-8 flex flex-col justify-end transition-opacity pointer-events-none"><p class="text-white text-[10px] font-medium line-clamp-2 uppercase tracking-wider">' + p + '</p></div>\
</div>';

    function renderImageCard(data, isNew){
        if (!data.images?.[0] || document.getElementById(`history-${data.timestamp}`)) return;
        const card = document.createElement('div');

        card.className = 'masonry-item group relative cursor-zoom-in';
        card.onclick = () => openLightbox(data.images[0], allHistory.map(h => h.images[0]), allHistory.indexOf(data));
        card.innerHTML = buildCardInner(data);
        const masonry = document.getElementById('masonry');
        if (masonry) { isNew ? masonry.prepend(card) : masonry.appendChild(card); }

    function clearPrompt() {
        const p = document.getElementById('prompt');

    /* ---------- 下载 ---------- */
    async function downloadHistoryImage(url, ev){
        ev.stopPropagation();
        try {
            const r = await fetch(url); const b = await r.blob();
            const u = URL.createObjectURL(b); const a = document.createElement('a');
            a.href = u; a.download = `online_${Date.now()}.png`; document.body.appendChild(a); a.click();
            document.body.removeChild(a); URL.revokeObjectURL(u);
        } catch(e) { window.open(url, '_blank'); }
    }
    async function downloadLightboxImage(){
        const img = document.getElementById('lightboxImg');
        if (!img?.src) return;
        try {
            const r = await fetch(img.src); const b = await r.blob();
            const u = URL.createObjectURL(b); const a = document.createElement('a');
            a.href = u; a.download = `online_${Date.now()}.png`; document.body.appendChild(a); a.click();
            document.body.removeChild(a); URL.revokeObjectURL(u);
        } catch(e) { window.open(img.src, '_blank'); }
    }

    function openLightbox(url, images, startIndex){
        if (typeof GalleryDisplay !== "undefined" && GalleryDisplay.Lightbox) {

    function backfillParams(ts, ev){
        ev.stopPropagation();
        const data = allHistory.find(h => String(h.timestamp) === String(ts));
        if (!data) return;
        const p = document.getElementById('prompt');
        if (p && data.prompt) p.value = data.prompt;
        // 清空并回填参考图
        if (_refImgMgr) { _refImgMgr.clear(); }
        (data.params?.reference_images || []).slice(0,5).forEach(function(ref) {
            if (ref && ref.url) {
                fetch(ref.url).then(function(r){ return r.blob(); }).then(function(blob){
                    var name = ref.name || 'ref.png';
                    var file = new File([blob], name, { type: blob.type || 'image/png' });
                    if (_refImgMgr) _refImgMgr.addFiles([file]);
                }).catch(function(){});
            }
        });
        if (data.params?.size) {
            const sz = data.params.size;
            const mr = Object.keys(SIZE_OPTIONS).find(key => SIZE_OPTIONS[key].some(([v]) => v === sz)) || 'square';
            setRatio(mr);
        }
        window.scrollTo({top:0, behavior:'smooth'});
    }

    /* ---------- 删除 ---------- */
    async function deleteHistoryItem(ts, ev){
        ev.stopPropagation();
        const card = document.getElementById(`history-${ts}`);
        if (!card || card.querySelector('.delete-confirm')) return;
        const confirm = document.createElement('div');
        confirm.className = 'delete-confirm absolute inset-0 z-20 flex flex-col items-center justify-center gap-3 bg-white/95 backdrop-blur-sm rounded-2xl';
        confirm.innerHTML = `'<span style="font-size:13px;font-weight:700;color:#374151;">确认删除？</span>
            <div style="display:flex;gap:8px;">
                <button class="confirm-yes" style="padding:4px 18px;background:#ef4444;color:#fff;border-radius:999px;font-size:11px;font-weight:700;border:none;cursor:pointer;">删除</button>
                <button class="confirm-no" style="padding:4px 18px;background:#f1f5f9;color:#475569;border-radius:999px;font-size:11px;font-weight:700;border:none;cursor:pointer;">取消</button>
            </div>'`;
        card.appendChild(confirm);
        confirm.querySelector('.confirm-yes').onclick = async e => {
            e.stopPropagation();
            try {
                const res = await fetch('/api/history/delete', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({timestamp:ts})}).then(r=>r.json());
                if (res.success) card.remove();
            } catch(err) { card.remove(); }
        };
        confirm.querySelector('.confirm-no').onclick = e => { e.stopPropagation(); confirm.remove(); };
    }

    /* ---------- 去除背景 (jiandanbeijing - art-canvas 独有) ---------- */
    async function processRemoveBg(imageUrl, ts, ev){
        ev.stopPropagation();
        if (!window.jiandanBeijing) { alert('简单去背景模块未加载'); return; }
        const card = document.getElementById(`history-${ts}`);
        if (card) card.style.opacity = '0.5';
        try {
            const resultUrl = await window.jiandanBeijing.removeBackground(imageUrl);
            const saveRes = await fetch('/api/history/save', {
                method:'POST', headers:{'Content-Type':'application/json'},
                body:JSON.stringify({prompt:'去除背景', images:[resultUrl], type:'online'})
            });
            const saveData = await saveRes.json();
            if (saveData.success) {
                const newData = {images:[resultUrl], prompt:'去除背景', timestamp:saveData.timestamp};
                allHistory.unshift(newData);
                renderImageCard(newData, true);
            }
        } catch(err) {
            console.error('[去除背景] 失败:', err);
            alert(`去除背景失败: ${err.message}`);
        } finally {
            if (card) card.style.opacity = '';
        }
    }

    /* ---------- 保存到资产库 (art-canvas 独有) ---------- */
    async function saveToAssetLibrary(imageUrl, ev){
        ev.stopPropagation();
        try {
            const res = await fetch('/api/user/assets/save-from-url', {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({url: imageUrl})
            });
            if (!res.ok) {
                const err = await res.json().catch(()=>({}));
                if (res.status === 401) { alert('请先登录后再保存到资产库'); return; }
                throw new Error(err.detail || '保存失败');
            }
            alert('已保存到资产库');
        } catch(err) {
            alert(`保存到资产库失败: ${err.message}`);
        }
    }


    // ── prompt 兼容层：contenteditable div 注入 .value getter/setter ──
    (function() {
        var el = document.getElementById('prompt');
        if (!el || el._compatReady) return;
        el._compatReady = true;

        function preserveChips() {
            return Array.prototype.slice.call(el.querySelectorAll('.ref-chip'));
        }
        function restoreChips(chips) {
            if (!chips || chips.length === 0) return;
            var firstText = null;
            for (var i = 0; i < el.childNodes.length; i++) {
                if (el.childNodes[i].nodeType === 3) { firstText = el.childNodes[i]; break; }
            }
            chips.forEach(function(chip) { el.insertBefore(chip, firstText); });
            chips.forEach(function(chip) {
                if (chip.nextSibling && chip.nextSibling.nodeType === 3) return;
                el.insertBefore(document.createTextNode(' '), chip.nextSibling);
            });
        }

        Object.defineProperty(el, 'value', {
            get: function() {
                var out = '';
                el.childNodes.forEach(function(n) {
                    if (n.nodeType === 3) out += n.nodeValue;
                });
                return out;
            },
            set: function(v) {
                var savedChips = preserveChips();
                var vStr = v == null ? '' : String(v);
                Array.prototype.slice.call(el.childNodes).forEach(function(n) {
                    if (n.nodeType === 1 && n.classList && n.classList.contains('ref-chip')) return;
                    el.removeChild(n);
                });
                if (vStr) el.appendChild(document.createTextNode(vStr));
                restoreChips(savedChips);
                el.dispatchEvent(new Event('input', {bubbles:true}));
            }
        });
    })();

    // 桥接：选择器写入 #prompt.value 后触发 input（兼容层已自动 dispatch）
    // 但保留原有钩子以确保 updatePickerButtonsHighlight 被调用
    if (typeof pickerApply !== 'undefined') {
        var _origPickerApply = pickerApply;
        pickerApply = function() {
            _origPickerApply.apply(this, arguments);
            if (typeof updatePickerButtonsHighlight === 'function') updatePickerButtonsHighlight();
        };
    }
    if (typeof artistPickerApply !== 'undefined') {
        var _origArtistPickerApply = artistPickerApply;

            if (typeof updatePickerButtonsHighlight === 'function') updatePickerButtonsHighlight();
        };
    }

    /* ---------- 自定义下拉组件 ---------- */
    function initCustomSelect(id){
        const select = document.getElementById(id);
        if(!select || select.dataset.customInit) return;
        select.dataset.customInit = '1';
        select.style.display = 'none';
        
        const wrap = document.createElement('div');
        wrap.className = 'ratio-wrap';
        wrap.style.width = '100%';
        const btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'ratio-btn';
        const lbl = document.createElement('span');
        lbl.className = 'ratio-btn-label';
        btn.appendChild(lbl);
        btn.insertAdjacentHTML('beforeend','<svg class="ratio-chevron" viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,4 6,8 10,4"/></svg>');
        const menu = document.createElement('div');
        menu.className = 'ratio-menu'; menu.hidden = true;
        
        function rebuild(){
            menu.innerHTML = '';
            Array.from(select.options).forEach(opt => {
                const it = document.createElement('button');
                it.type = 'button'; it.className = 'ratio-option'; it.dataset.value = opt.value;
                it.onclick = function(e){ e.stopPropagation(); select.value = opt.value; select.dispatchEvent(new Event('change',{bubbles:true})); syncUI(); close(); };
                const il = document.createElement('span'); il.className = 'ratio-opt-label'; il.textContent = opt.text;
                it.appendChild(il); menu.appendChild(it);
            });
            syncUI();
        }
        function syncUI(){
            const idx = select.selectedIndex;
            lbl.textContent = idx >= 0 ? select.options[idx].text : '';
            menu.querySelectorAll('.ratio-option').forEach(o => o.classList.toggle('active', o.dataset.value === select.value));
        }
        function open(){ menu.hidden = false; wrap.classList.add('open'); rebuild(); }
        function close(){ menu.hidden = true; wrap.classList.remove('open'); }
        btn.onclick = function(e){ if(menu.hidden) open(); else close(); };
        document.addEventListener('click', e => { if(!wrap.contains(e.target)) close(); });
        wrap.appendChild(btn); wrap.appendChild(menu);
        select.parentNode.insertBefore(wrap, select);
        rebuild();
    }
    function rebuildCustomSelect(id){
        const select = document.getElementById(id);
        if(!select) return;
        const wrap = select.previousElementSibling;
        if(!wrap || !wrap.classList.contains('ratio-wrap')) return;
        const menu = wrap.querySelector('.ratio-menu');
        const lbl = wrap.querySelector('.ratio-btn-label');
        if(!menu || !lbl) return;
        menu.innerHTML = '';
        Array.from(select.options).forEach(opt => {
            const it = document.createElement('button');
            it.type = 'button'; it.className = 'ratio-option'; it.dataset.value = opt.value;
            it.onclick = function(e){ e.stopPropagation(); select.value = opt.value; select.dispatchEvent(new Event('change',{bubbles:true})); syncUI(); close(); };
            const il = document.createElement('span'); il.className = 'ratio-opt-label'; il.textContent = opt.text;
            it.appendChild(il); menu.appendChild(it);
        });
        function syncUI(){
            const idx = select.selectedIndex;
            lbl.textContent = idx >= 0 ? select.options[idx].text : '';
            menu.querySelectorAll('.ratio-option').forEach(o => o.classList.toggle('active', o.dataset.value === select.value));
        }
        function close(){ menu.hidden = true; const w = select.closest('.ratio-wrap'); if(w) w.classList.remove('open'); }
        syncUI();
    }

        await loadConfig();

    window.onload = async () => {
        // ── PromptTags 可见性开关 ──

        window.togglePromptTagsVisibility = function() {
            window.promptTagsVisible = !window.promptTagsVisible;

            var sw = document.getElementById('promptTagsSwitch');
            if (sw) sw.classList.toggle('active', window.promptTagsVisible);
            if (typeof updatePromptTags === 'function') updatePromptTags();
        };
    
        buildRatioMenu();
        selectRatio(ratio, false);
        const rs = document.getElementById('resolutionSelect');
        if (rs) rs.value = resolution;
        // 初始化自定义下拉
        ['providerSelect','modelSelect','qualitySelect','countSelect','resolutionSelect','videoModelSelect'].forEach(initCustomSelect);
        await initModels();
        
        // 初始化 AI 提示词预设选择器
        if (typeof spPickerInit === 'function') spPickerInit();
        if (typeof spmInit === 'function') spmInit();
        
        // 初始化 AI 生成按钮（smartPromptContainer 中：单击AI生成，长按打开预设）
        if (typeof SmartPrompt !== 'undefined') {
            SmartPrompt.init('smartPromptContainer', {
                getText: function() { var el = document.getElementById('prompt'); return el ? el.value : ''; },
                setText: function(text) {
                    var el = document.getElementById('prompt');
                    if (el) { el.value = text; el.dispatchEvent(new Event('input')); }
                },
                onLongPress: function() {
                    if (typeof spPickerOpen === 'function') spPickerOpen();
                }
            });
        }
        
        // 初始化翻译
        var promptEl = document.getElementById('prompt');
        if (typeof PromptTranslateUI !== 'undefined' && promptEl) {
            PromptTranslateUI.init('translateBtnContainer', {
                getText: function() { return promptEl.value || promptEl.innerText || ''; },
                onApply: function(text) {
                    if (promptEl) {
                        promptEl.value = text;
                        promptEl.dispatchEvent(new Event('input', { bubbles: true }));
                    }
                }
            });
        }
        
        // 清除按钮显示/隐藏
        if (promptEl) {
            function updateClearBtn() {
                var btn = document.getElementById('clearPromptBtn');
                if (!btn) return;
                var val = promptEl.value || promptEl.innerText || '';
                btn.style.display = val.trim().length > 0 ? 'flex' : 'none';
            }
            promptEl.addEventListener('input', updateClearBtn);
            // 初始检测（输入框可能已有内容）
            setTimeout(updateClearBtn, 100);
        }
        
        // 初始化 GalleryDisplay
        if (typeof GalleryDisplay !== 'undefined' && GalleryDisplay.init) {
            GalleryDisplay.init({
                historyType: 'online',
                favoritesStorageKey: 'online_favorites',
                masonrySelector: '#masonry',
                loadMoreSelector: '#loadMoreTrigger',
                autoScan: false,
                lightbox: true,
                scrollToTop: true,
                toolbarExtras: true,
                favoritesEnabled: true,
            });
        }
        // 初始检测
        setTimeout(function() {
            var btn = document.getElementById('clearPromptBtn');
            if (btn) {
                var el = document.getElementById('prompt');
                var val = el ? (el.value || el.innerText || '') : '';
                btn.style.display = val.trim().length > 0 ? 'flex' : 'none';
            }
        }, 100);
        
        // ── PromptTags 初始化 ──
        if (typeof PromptTags !== 'undefined') {
            PromptTags.init();
            window.updatePromptTags = function() { PromptTags.update(); };
        }
        
        await loadHistory(0);
        const trigger = document.getElementById('loadMoreTrigger');
        if (trigger) {
            const observer = new IntersectionObserver(entries => {
                if (entries[0].isIntersecting && currentIndex < allHistory.length) loadHistory(1);
            }, {threshold: .1});
            observer.observe(trigger);
            trigger.onclick = () => loadHistory(1);
        }
    };
