    <style>

    <script>
    (function(){
        // 检测访问来源
        const _isLocalAccess = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost';
        const COMFYUI_CONFIG = {"local_address": "127.0.0.1:8188", "cloud_address": "https://kg03rrnf6rg9bxab-8188.container.x-gpu.com/", "active_server": _isLocalAccess ? "本地服务器" : "云端服务器"};
        let COMFYUI_SERVER = 'http://127.0.0.1:8188';
        let IS_LOCAL_SERVER = _isLocalAccess;
        const CLIENT_ID = localStorage.getItem("client_id") || ('online_' + Date.now().toString(36) + Math.random().toString(36).substr(2, 9));
        if (!localStorage.getItem("client_id")) localStorage.setItem("client_id", CLIENT_ID);
        async function loadConfig(){
            const localConfig = localStorage.getItem('comfyui_config');
            if (localConfig) {
                try {
                    const config = JSON.parse(localConfig);
                    const activeServer = config.active_server || '本地服务器';
                    IS_LOCAL_SERVER = (activeServer === '本地服务器');
                    if (activeServer === '云端服务器' && config.cloud_address) {
                        COMFYUI_SERVER = (config.cloud_address.startsWith('http') ? config.cloud_address : `https://${config.cloud_address}`).replace(/\/+$/, '');
                    } else if (config.local_address) {
                        COMFYUI_SERVER = (config.local_address.startsWith('http') ? config.local_address : `http://${config.local_address}`).replace(/\/+$/, '');
                    }
                } catch(e) {}
            }
        }
        window.loadConfig = loadConfig;
    })();

    lucide.createIcons();
    const DEFAULT_IMAGE_MODELS = ["gpt-image-2-all","nano-banana","gpt-image-1"];
    const JIMENG_DEFAULT_IMAGE_MODELS = ["5.0Pro","5.0","4.7","4.6","4.5","4.1","4.0","3.1","3.0"];

    /* ---------- 全局状态 ---------- */
    let selectedProviderId = '';
    let selectedModel = '';
    let currentProtocol = 'api';
    let providerModels = {};
    let allProviders = [];
    let apiProviders = [];
    let providerMode = 'api'; // 当前协议模式（用于协议自适应）
    let quality = 'auto';
    let outputCount = 1;
    let generateType = 'image'; // 已废弃（视频功能移除）
    let customRatioWidth = '';
    let customRatioHeight = '';
    let customWidth = '';
    let customHeight = '';

    const PAGE_SIZE = 24;
    let allHistory = [], currentIndex = 0, isLoading = false, currentResult = null;

    let refs = [];
    let ratio = 'square';
    let resolution = '1k';
    // 导出变量到全局，让 onclick 可访问
    Object.defineProperty(window, '__resolution', { get:()=>resolution, set:v=>{resolution=v} });
    Object.defineProperty(window, '__quality', { get:()=>quality, set:v=>{quality=v} });
    Object.defineProperty(window, '__outputCount', { get:()=>outputCount, set:v=>{outputCount=v} });
    Object.defineProperty(window, '__ratio', { get:()=>ratio, set:v=>{ratio=v} });
    Object.defineProperty(window, '__customRatioWidth', { get:()=>customRatioWidth, set:v=>{customRatioWidth=v} });
    Object.defineProperty(window, '__customRatioHeight', { get:()=>customRatioHeight, set:v=>{customRatioHeight=v} });

    /* ---------- 尺寸表（Infinite-Canvas 版，含 4K）---------- */
    const SIZE_OPTIONS = {
        square:     [['1024x1024','1k'],['2048x2048','2k'],['3840x3840','4k']],
        portrait:   [['1024x1536','1k'],['1360x2048','2k'],['2352x3520','4k']],
        portrait43: [['1008x1344','1k'],['1536x2048','2k'],['2448x3264','4k']],
        landscape43:[['1344x1008','1k'],['2048x1536','2k'],['3264x2448','4k']],
        landscape:  [['1536x1024','1k'],['2048x1360','2k'],['3520x2352','4k']],
        story:      [['720x1280','1k'],['1152x2048','2k'],['2160x3840','4k']],
        wide:       [['1280x720','1k'],['2048x1152','2k'],['3840x2160','4k']]
    };
    const RES_LONG_SIDE = { '1k': 1536, '2k': 2048, '4k': 3840 };

    /* ---------- Provider 协议识别 ---------- */
    function getProviderProtocol(id){
        const prov = allProviders.find(p => p.id === id);
        const proto = String(prov?.protocol || '').toLowerCase();
        const pid = String(id || '').toLowerCase();
        const base = String(prov?.base_url || '').toLowerCase();
        if(proto === 'modelscope' || pid === 'modelscope') return 'modelscope';
        if(proto === 'runninghub' || pid === 'runninghub') return 'runninghub';
        if(proto === 'jimeng' || pid === 'jimeng') return 'jimeng';
        if(proto === 'volcengine' || pid === 'volcengine') return 'volcengine';
        if(proto === 'gemini') return 'gemini';
        if(proto === 'codex' || pid === 'codex') return 'codex';
        if(proto === 'gemini-cli' || pid === 'gemini-cli') return 'gemini-cli';
        if(proto === 'apimart' || base.includes('apimart.ai')) return 'apimart';
        // OpenAI 兼容协议统一标记为 'api'，触发质量下拉显示
        return 'api';
        if (id === 'volcengine') return 'volcengine';
        if (id === 'gemini' || id === 'gemini-cli') return 'gemini';
        if (id === 'grok') return 'grok';
        return 'openai';
    }

    /* ---------- 协议徽标（Infinite-Canvas 风格）---------- */
    const PROTOCOL_BADGE = {
        api:'API', apimart:'APIMart', modelscope:'ModelScope',
        runninghub:'RunningHub', jimeng:'即梦',
        volcengine:'火山引擎', gemini:'Gemini', grok:'Grok', openai:'OpenAI'
    };
    const QUALITY_PROTOCOLS = new Set(['api','apimart']);
    function updateAdaptivePanel(){
        const proto = providerMode;
        const badge = document.getElementById('providerModeBadge');
        if (badge) {
            badge.textContent = PROTOCOL_BADGE[proto] || 'API';
            badge.style.display = '';
        }
        const qf = document.getElementById('qualityField');
        if (qf) qf.style.display = QUALITY_PROTOCOLS.has(proto) ? '' : 'none';
        const qs = document.getElementById('qualitySelect');
        if (qs) qs.value = quality;
        if (proto === 'runninghub') outputCount = 1;
        const cf = document.getElementById('countField');
        if (cf) cf.style.display = (proto === 'runninghub') ? 'none' : '';
        const cs = document.getElementById('countSelect');
        if (cs) cs.value = String(outputCount);
    }

    /* ---------- Provider 加载 / 渲染 ---------- */
    async function loadProviders(){
        try {
            const res = await fetch('/api/providers');
            if (!res.ok) return;
            const data = await res.json();
            allProviders = data.providers || [];
            apiProviders = allProviders;
            const imageProviders = allProviders.filter(p =>
                p.enabled && ((p.image_models && p.image_models.length > 0) || ['modelscope','jimeng'].includes(p.id))
            );
            const select = document.getElementById('providerSelect');
            if (select) {
                select.innerHTML = imageProviders.map(p =>
                    `<option value="${p.id}" ${p.id === selectedProviderId ? 'selected' : ''}>${escapeHtml(p.name || p.id)}</option>`
                ).join('');
            }
            if (!imageProviders.find(p => p.id === selectedProviderId) && imageProviders.length > 0) {
                selectedProviderId = imageProviders[0].id;
            }
            rebuildCustomSelect('providerSelect');
        } catch(e) {
            console.error('加载提供商失败:', e);
        }
    }

    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }

    /* ── 新版下拉菜单切换函数 ── */
    function _toggleMenu(menuId, evt){
        if(evt) evt.stopPropagation();
        // 关闭其他所有 .anima-ctrl-menu
        document.querySelectorAll('.anima-ctrl-menu').forEach(m => {
            if(m.id !== menuId) m.classList.remove('open');
        });
        const menu = document.getElementById(menuId);
        if(menu) menu.classList.toggle('open');
    }
    function toggleProviderMenu(evt){ _toggleMenu('providerMenu', evt); }
    function toggleModelMenu(evt){ _toggleMenu('modelMenu', evt); }
    function toggleResolutionMenu(evt){ _toggleMenu('resolutionMenu', evt); }
    function toggleCountMenu(evt){ _toggleMenu('countMenu', evt); }
    // 暴露到全局供 onclick 使用
    window.toggleProviderMenu = toggleProviderMenu;
    window.toggleModelMenu = toggleModelMenu;

    async function refreshProviderModels(){
        const btn = document.getElementById('refreshModelsBtn');
        if (btn) btn.classList.add('spin');
        try {
            let models = [];
            try {
                const res = await fetch(`/api/providers/models?provider_id=${encodeURIComponent(selectedProviderId)}`);
                const data = await res.json();
                if (data.image_models && data.image_models.length > 0) models = data.image_models;
            } catch(e) {}
            if (!models.length) {
                const prov = allProviders.find(p => p.id === selectedProviderId);
                if (prov && prov.image_models && prov.image_models.length) models = prov.image_models;
            }
            if (!models.length) {
                if (selectedProviderId === 'modelscope') models = (window.IMAGE_MODELS || DEFAULT_IMAGE_MODELS).filter(m => !m.toLowerCase().includes('gpt') && !m.toLowerCase().includes('nano'));
                else if (selectedProviderId === 'jimeng') models = JIMENG_DEFAULT_IMAGE_MODELS;
                else if (selectedProviderId === 'gemini-cli') models = ['auto'];
                else if (selectedProviderId === 'codex') models = ['gpt-image-2'];
                else models = (window.IMAGE_MODELS && window.IMAGE_MODELS.length > 0) ? window.IMAGE_MODELS : DEFAULT_IMAGE_MODELS;
            }
            providerModels[selectedProviderId] = models;
            renderModelList();
        } catch(e) {
            console.error('刷新模型列表失败:', e);
        } finally {
            if (btn) btn.classList.remove('spin');
        }
    }

    function fitCustomSizeToImage(ev){

    function currentSize(){
        if (ratio === 'custom') {
            const cs = customSizeValue();
            if (cs) return cs;
            // fallback 用 customRatioValue 算像素
            const cr = customRatioValue();
            if (cr) {
                const longSide = RES_LONG_SIDE[resolution] || 1536;
                const ratio = cr[0] / cr[1];
                if (ratio >= 1) return `${longSide}x${Math.round(longSide / ratio)}`;
                return `${Math.round(longSide * ratio)}x${longSide}`;
            }
            return '1024x1024';
        }
        if (resolution === 'custom') {
            const cs = customSizeValue();
            if (cs) return cs;
        }
        const options = SIZE_OPTIONS[ratio] || SIZE_OPTIONS.square;
        const match = options.find(([, label]) => label === resolution) || options[0];
        return match[0];
    }

    var _reverseProvider = 'auto';

    function _revView(name) {
        var ids = { settings: 'revViewSettings', progress: 'revViewProgress', result: 'revViewResult' };
        // 先把隐藏的视图移除再显示,让 fade-in 动画每次都触发（重置 animation）
        Object.keys(ids).forEach(function (k) {
            var el = document.getElementById(ids[k]);
            if (!el) return;
            if (k === name) {
                if (el.hidden) {
                    el.hidden = false;
                    // 强制 reflow 重启动画
                    void el.offsetWidth;
                    el.style.animation = 'none';
                    void el.offsetWidth;
                    el.style.animation = '';
                }
            } else {
                el.hidden = true;
            }
        });
        var title = document.getElementById('revViewTitle');
        if (title) title.textContent = name === 'settings' ? '反推设置' : (name === 'progress' ? '反推中' : '反推结果');
        var back = document.getElementById('revReRunBtn');
        if (back) back.style.display = (name === 'result') ? 'flex' : 'none';
        var modal = document.getElementById('reverseModal');
        if (modal) modal.classList.toggle('on-result', name === 'result');

    // ── 缩略图渲染 ──
    function _setReverseFile(file) {
        // 释放旧 objectURL
        if (_reverseFileUrl) { try { URL.revokeObjectURL(_reverseFileUrl); } catch (_) {} _reverseFileUrl = null; }
        _reverseFile = file || null;
        var thumb = document.getElementById('revPreviewThumb');
        var name = document.getElementById('revPreviewName');
        var size = document.getElementById('revPreviewSize');
        var preview = document.getElementById('revPreview');
        if (!file) {
            if (thumb) { thumb.style.backgroundImage = ''; thumb.classList.add('empty'); }
            if (name) { name.textContent = ''; }
            if (size) size.textContent = '';
            if (preview) preview.classList.add('is-empty');
            var btn = document.getElementById('revStartBtn');
            if (btn) btn.disabled = true;
            return;
        }
        _reverseFileUrl = URL.createObjectURL(file);
        if (thumb) { thumb.style.backgroundImage = 'url(' + _reverseFileUrl + ')'; thumb.classList.remove('empty'); }
        if (name) { name.textContent = file.name; }
        if (size) size.textContent = (file.size / 1024).toFixed(1) + ' KB';
        if (preview) preview.classList.remove('is-empty');
        var btn = document.getElementById('revStartBtn');
        if (btn) btn.disabled = false;
    }

    // ── 拖入支持（整张 modal 都是 dropzone） ──
    function _bindReverseDragDrop() {
        var overlay = document.getElementById('reverseModalOverlay');
        if (!overlay || overlay._dragBound) return;
        overlay._dragBound = true;
        var onEnter = function (e) {
            e.preventDefault();
            if (!_reverseDragDepth) overlay.classList.add('is-dragover');
            _reverseDragDepth++;
        };
        var onLeave = function (e) {
            e.preventDefault();
            _reverseDragDepth = Math.max(0, _reverseDragDepth - 1);
            if (!_reverseDragDepth) overlay.classList.remove('is-dragover');
        };
        var onOver = function (e) { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy'; };
        var onDrop = function (e) {
            e.preventDefault();
            _reverseDragDepth = 0;
            overlay.classList.remove('is-dragover');
            var files = e.dataTransfer && e.dataTransfer.files;
            if (!files || !files.length) return;
            var f = files[0];
            if (!/^image\//.test(f.type)) {
                alert('请拖入图片文件');
                return;
            }
            // 若正在反推中,拖入新图无效（避免混乱）
            var prog = document.getElementById('revViewProgress');

    // 进度视图：阶段 + 0-100% 伪进度
    var _REV_STAGES = [
        { p: 8,  t: '正在上传图片…' },
        { p: 30, t: '正在分析图片…' },
        { p: 60, t: '正在生成提示词…' },

    ];
    function _startReverseProgress(file) {
        var stage = document.getElementById('revProgressStage');
        var ftext = document.getElementById('revProgressFile');
        var bar = document.getElementById('revProgressBar');
        var pct = document.getElementById('revProgressPercent');
        if (ftext) ftext.textContent = file.name + '  ·  ' + (file.size / 1024).toFixed(1) + ' KB';
        if (bar) bar.style.width = '0%';
        if (pct) pct.textContent = '0%';
        var i = 0, cur = 0;
        if (_reverseTimer) clearInterval(_reverseTimer);
        _reverseTimer = setInterval(function () {
            if (i >= _REV_STAGES.length) {
                cur = Math.min(95, cur + 0.4);
            } else {
                var target = _REV_STAGES[i].p;
                cur = Math.min(target, cur + (target - cur) * 0.18);
                if (stage) stage.textContent = _REV_STAGES[i].t;
                if (cur >= target - 0.5) i++;
            }
            var rounded = Math.round(cur);
            if (bar) bar.style.width = rounded + '%';
            if (pct) pct.textContent = rounded + '%';
        }, 180);
    }
    function _stopReverseProgress(success) {
        if (_reverseTimer) { clearInterval(_reverseTimer); _reverseTimer = null; }
        var bar = document.getElementById('revProgressBar');
        var pct = document.getElementById('revProgressPercent');
        var stage = document.getElementById('revProgressStage');
        if (bar) bar.style.width = '100%';
        if (pct) pct.textContent = '100%';
        if (stage) stage.textContent = success ? '完成' : '已取消';
    }

    function startReverseFromModal() {

        _reverseAbort = new AbortController();
        var fd = new FormData();
        fd.append('file', file);
        if (opts.mode) fd.append('mode', opts.mode);
        if (opts.targetStyle) fd.append('target_style', opts.targetStyle);
        if (opts.provider) fd.append('provider', opts.provider);
        if (opts.visionProviderId) fd.append('vision_provider_id', opts.visionProviderId);
        fetch('/api/interrogate', { method: 'POST', body: fd, signal: _reverseAbort.signal })
            .then(function (res) {
                if (!res.ok) return res.json().then(function (j) { throw new Error(j.detail || ('HTTP ' + res.status)); },
                    function () { throw new Error('HTTP ' + res.status); });
                return res.json();
            })
            .then(function (result) {
                _stopReverseProgress(true);
                _showReverseResult(result);
            })
            .catch(function (e) {
                _stopReverseProgress(false);
                if (e.name === 'AbortError') return;
                _revView('settings');
                alert('反推失败: ' + e.message);
            });
    }

    function copyReverseResult() {

        var done = function () { if (wrap) { wrap.classList.add('copied'); setTimeout(function(){ wrap.classList.remove('copied'); }, 1200); } };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, done);
        } else {

    /* ---------- 生成提交 ---------- */
    async function submitImage(){
        const prompt = document.getElementById('prompt').value.trim();
        if (!prompt) { alert('请输入提示词'); return; }
        const btn = document.getElementById('genBtn');
        btn.disabled = true;
        const count = outputCount;
        const batchId = Date.now();
        // 创建 pending card（单图/多图都显示）
        const masonry = document.getElementById('masonry');
        createPendingCards(batchId, count, masonry);
        // 参考图：将 blob URL 转为 data URL
        var refPromises = (refs || []).filter(function(r){ return r && r.url; }).map(function(r){
            return new Promise(function(resolve){
                var url = r.url;
                if (url && url.startsWith('blob:')) {
                    fetch(url).then(function(resp){ return resp.blob(); }).then(function(blob){
                        var reader = new FileReader();
                        reader.onloadend = function(){ resolve({ url: reader.result, name: r.name || '' }); };
                        reader.readAsDataURL(blob);
                    }).catch(function(){ resolve({ url: url, name: r.name || '' }); });
                } else {
                    resolve({ url: url, name: r.name || '' });
                }
            });
        });
        const refImages = await Promise.all(refPromises);
        const apiUrl = '/api/online-image';
        const body = {
            prompt, model: selectedModel || '',
            size: currentSize(),
            protocol: getProtocol(selectedModel),
            provider_id: selectedProviderId,
            reference_images: refImages,
            quality: quality,
            image_request_mode: ''
        };
        const activeProv = allProviders.find(p => p.id === selectedProviderId);
        if (activeProv && activeProv.image_request_mode) {
            body.image_request_mode = activeProv.image_request_mode;
        }
        const requests = Array.from({length: count}, () =>
            fetch(apiUrl, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})
                .then(async r => { if(!r.ok) { const err = await r.json(); console.error('[生成失败]', JSON.stringify(err)); throw new Error(err.detail || err.message || '生成失败'); } return r.json(); })
        );
        try {
            const results = await Promise.allSettled(requests);
            results.forEach((res, i) => {
                if (res.status === 'fulfilled') {
                    const data = res.value;
                    updatePendingCard(batchId, i, data);
                    if (i === 0) currentResult = data;
                    // 记录到历史（但不重复创建卡片，由 updatePendingCard 处理）
                    const imgArr = data.images || [];
                    if(imgArr[0] && !document.getElementById(`history-${data.timestamp}`)){
                        allHistory.unshift(data);
                        if(typeof GalleryList !== 'undefined' && GalleryList.pushNewImage){
                            GalleryList.pushNewImage(data);
                        }
                        fetch('/api/history/save', {
                            method:'POST', headers:{'Content-Type':'application/json'},
                            body: JSON.stringify(data)
                        }).then(r => r.json()).then(d => {
                            if(d.timestamp) data.timestamp = d.timestamp;
                        }).catch(e => console.warn('[history save]', e));
                    }
                } else {
                    failPendingCard(batchId, i);
                }
            });
        } catch(err) { console.error(err); }
        finally {
            btn.disabled = false;
        }
    }

    function getProtocol(model){
        if (!model) return currentProtocol || providerMode || 'openai';
        const m = model.toLowerCase();
        if (m.includes('gemini')) return 'gemini';
        if (m.includes('nano-banana') || m.includes('gpt-image')) return 'openai';
        return currentProtocol || providerMode || 'openai';
    }

    /* ---------- Pending Card (生成中占位) ---------- */
    function createPendingCards(batchId, count, masonry){
        if (!masonry) return;
        var hasProgress = typeof CardProgress !== 'undefined';
        for (let i = 0; i < count; i++) {
            const id = `pending-${batchId}-${i}`;
            if (document.getElementById(id)) continue;
            const card = document.createElement('div');
            card.id = id;
            card.className = 'masonry-item pending-card';
            card.style.minHeight = '';
            card.style.position = 'relative';
            // 按当前 ratio 设置卡片宽高比
            var ar = _getAspectRatioForRatio(window.__ratio || 'square');
            if (ar) card.style.aspectRatio = ar;
            masonry.prepend(card);
            if (hasProgress) {
                CardProgress.attach(card).update({ status: 'started' });
                // 2 秒后切换到"执行中"
                setTimeout(function(pid) {
                    var c = document.getElementById(pid);
                    if (c) CardProgress.update(c, { status: 'executing' });
                }, 2000, id);
            } else {
                card.innerHTML = '<div class="flex items-center justify-center flex-col gap-3 p-10"><svg class="spin" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" opacity="0.4"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg><span class="text-[10px] font-bold uppercase tracking-widest opacity-40">生成中</span></div>';
            }
        }
    }
    function _getAspectRatioForRatio(r){
        // 返回 CSS aspect-ratio 字符串
        var map = {
            'square': '1 / 1',
            'portrait': '2 / 3',
            'landscape': '3 / 2',
            'portrait43': '3 / 4',
            'landscape43': '4 / 3',
            'story': '9 / 16',
            'wide': '16 / 9'
        };
        if (r === 'custom') {
            var cw = parseFloat(window.__customRatioWidth || '');
            var ch = parseFloat(window.__customRatioHeight || '');
            if (cw > 0 && ch > 0) return cw + ' / ' + ch;
        }
        return map[r] || '1 / 1';
    }
    function updatePendingCard(batchId, index, data){
        const pid = `pending-${batchId}-${index}`;
        const card = document.getElementById(pid);
        if (!card || !data.images?.[0]) return;
        var hasProgress = typeof CardProgress !== 'undefined';
        if (hasProgress) {
            // 先显示"完成"动画
            CardProgress.update(card, { status: 'complete' });
        }
        // 延迟替换为真实卡片（让完成动画先播放一下）
        setTimeout(function(c, batchIndex, batchTgtId, batchData){
            if (!c.parentNode) return;
            if (document.getElementById(`history-${batchData.timestamp}`)) { c.remove(); return; }
            c.id = `history-${batchData.timestamp}`;
            c.style.minHeight = '';
            c.style.position = '';
            c.style.aspectRatio = '';
            c.className = 'masonry-item group relative cursor-zoom-in';
            c.onclick = function() {
                openLightbox(batchData.images[0], allHistory.map(function(h){ return h.images[0]; }), allHistory.indexOf(batchData));
            };
            c.innerHTML = buildCardInner(batchData);
            // lucide 图标 - 用 scope 指定只处理当前卡片
            if (typeof lucide !== 'undefined' && lucide.createIcons) {
                try { lucide.createIcons({ scope: c }); } catch(e) {}
            }
        }, hasProgress ? 600 : 0, card, index, pid, data);
    }
    function failPendingCard(batchId, index){
        const pid = `pending-${batchId}-${index}`;
        const card = document.getElementById(pid);
        if (!card) return;
        card.innerHTML = '<div class="flex items-center justify-center flex-col gap-3 p-10"><span style="font-size:15px;font-weight:800;color:#ef4444">✕</span><span style="font-size:10px;font-weight:700;color:#ef4444;">生成失败</span></div>';
        setTimeout(() => card.remove(), 3000);
    }
    function buildCardInner(data){
        const u = (data.images[0]||'').replace(/\\/g,'\\\\').replace(/'/g,'\\');
        const p = (data.prompt||'Online Image').replace(/\\/g,'\\\\').replace(/'/g,'\\').replace(/`/g,'\\`').replace(/</g,'&lt;');
        return '<div class="relative group" style="cursor:pointer;">\
<img src="' + u + '" class="w-full block" style="display:block;width:100%;height:auto;" loading="lazy" onerror="this.closest(\'.masonry-item\')?.remove()" onload="this.style.opacity=1">\
<div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 p-4 pt-8 flex flex-col justify-end transition-opacity pointer-events-none"><p class="text-white text-[10px] font-medium line-clamp-2 uppercase tracking-wider">' + p + '</p></div>\
</div>';
    }
    function renderImageCard(data, isNew){
        if (!data.images?.[0] || document.getElementById(`history-${data.timestamp}`)) return;
        const card = document.createElement('div');
        card.id = `history-${data.timestamp}`;
        card.className = 'masonry-item group relative cursor-zoom-in';
        card.onclick = () => openLightbox(data.images[0], allHistory.map(h => h.images[0]), allHistory.indexOf(data));
        card.innerHTML = buildCardInner(data);
        const masonry = document.getElementById('masonry');
        if (masonry) { isNew ? masonry.prepend(card) : masonry.appendChild(card); }
        // 用 scope 确保新卡片的 lucide 图标被渲染
        try { if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons({ scope: card }); } catch(e){}
    }

    function openLightbox(url, images, startIndex){
        if (typeof GalleryDisplay !== "undefined" && GalleryDisplay.Lightbox) {
            GalleryDisplay.Lightbox.openLightbox(url, images && images.length > 1 ? images : [url], startIndex || 0);
        }
    }

    function closeLightbox(){
        if (typeof GalleryDisplay !== "undefined" && GalleryDisplay.Lightbox) {
            GalleryDisplay.Lightbox.closeLightbox();
        }
    }

    function applySameStyle(){
        // Gallery 模块 lightbox 已通过 onUsePrompt 回调
    }

    // ── prompt 兼容层：contenteditable div 注入 .value getter/setter ──
    (function() {
        var el = document.getElementById('prompt');
        if (!el || el._compatReady) return;
        el._compatReady = true;

        function preserveChips() {
            return Array.prototype.slice.call(el.querySelectorAll('.ref-chip'));
        }
        function restoreChips(chips) {
            if (!chips || chips.length === 0) return;
            var firstText = null;
            for (var i = 0; i < el.childNodes.length; i++) {
                if (el.childNodes[i].nodeType === 3) { firstText = el.childNodes[i]; break; }
            }
            chips.forEach(function(chip) { el.insertBefore(chip, firstText); });
            chips.forEach(function(chip) {
                if (chip.nextSibling && chip.nextSibling.nodeType === 3) return;
                el.insertBefore(document.createTextNode(' '), chip.nextSibling);
            });
        }

        Object.defineProperty(el, 'value', {
            get: function() {
                var out = '';
                el.childNodes.forEach(function(n) {
                    if (n.nodeType === 3) out += n.nodeValue;
                });
                return out;
            },
            set: function(v) {
                var savedChips = preserveChips();
                var vStr = v == null ? '' : String(v);
                Array.prototype.slice.call(el.childNodes).forEach(function(n) {
                    if (n.nodeType === 1 && n.classList && n.classList.contains('ref-chip')) return;
                    el.removeChild(n);
                });
                if (vStr) el.appendChild(document.createTextNode(vStr));
                restoreChips(savedChips);
                el.dispatchEvent(new Event('input', {bubbles:true}));
            }
        });
    })();

    // 桥接：选择器写入 #prompt.value 后触发 input（兼容层已自动 dispatch）
    // 但保留原有钩子以确保 updatePickerButtonsHighlight 被调用
    if (typeof pickerApply !== 'undefined') {
        var _origPickerApply = pickerApply;
        pickerApply = function() {
            _origPickerApply.apply(this, arguments);
            if (typeof updatePickerButtonsHighlight === 'function') updatePickerButtonsHighlight();
        };
    }
    if (typeof artistPickerApply !== 'undefined') {
        var _origArtistPickerApply = artistPickerApply;
        artistPickerApply = function() {
            _origArtistPickerApply.apply(this, arguments);
            if (typeof updatePickerButtonsHighlight === 'function') updatePickerButtonsHighlight();
        };
    }

    /* ---------- 自定义下拉组件 ---------- */
    /* initCustomSelect / rebuildCustomSelect 已替换为 anima-ctrl-wrap 风格菜单（在 HTML 中直接构建），
       保留这两个函数为 noop 以避免破坏现有调用点 */
    function initCustomSelect(id){ /* noop */ }
    function rebuildCustomSelect(id){
        // 调用新版 _refreshMenus 以重建菜单
        if(typeof _refreshMenus === 'function') _refreshMenus();

    /* ---------- 初始化 ---------- */
    document.addEventListener('DOMContentLoaded', async () => {
        await loadConfig();
        initRefImageManager();
    });

    window.onload = async () => {
    
        buildRatioMenu();
        selectRatio(ratio, false);
        const rs = document.getElementById('resolutionSelect');
        if (rs) rs.value = resolution;
        // 初始化自定义下拉（已 noop，新版菜单在 HTML 中直接构建）
        await initModels();
        
        // 初始化 AI 提示词预设选择器
        if (typeof spPickerInit === 'function') spPickerInit();
        if (typeof spmInit === 'function') spmInit();
        
        // 初始化 AI 生成按钮（smartPromptContainer 中：单击AI生成，长按打开预设）
        if (typeof SmartPrompt !== 'undefined') {
            SmartPrompt.init('smartPromptContainer', {
                getText: function() { var el = document.getElementById('prompt'); return el ? el.value : ''; },
                setText: function(text) {
                    var el = document.getElementById('prompt');
                    if (el) { el.value = text; el.dispatchEvent(new Event('input')); }
                },
                onLongPress: function() {
                    if (typeof spPickerOpen === 'function') spPickerOpen();
                }
            });
        }
        
        // 初始化翻译
        var promptEl = document.getElementById('prompt');
        if (typeof PromptTranslateUI !== 'undefined' && promptEl) {
            PromptTranslateUI.init('translateBtnContainer', {
                getText: function() { return promptEl.value || promptEl.innerText || ''; },
                onApply: function(text) {
                    if (promptEl) {
                        promptEl.value = text;
                        promptEl.dispatchEvent(new Event('input', { bubbles: true }));
                    }
                }
            });
            // 重要：监听 prompt 输入事件，让翻译按钮实时显示/隐藏
            promptEl.addEventListener('input', function() {
                if (typeof PromptTranslateUI !== 'undefined' && PromptTranslateUI.updateVisibility) {
                    PromptTranslateUI.updateVisibility();
                }
            });
            // 初始检测（如果 prompt 已有内容）
            setTimeout(function() {
                if (typeof PromptTranslateUI !== 'undefined' && PromptTranslateUI.updateVisibility) {
                    PromptTranslateUI.updateVisibility();
                }
            }, 100);
        }
        
        // 清除按钮显示/隐藏
        if (promptEl) {
            function updateClearBtn() {
                var btn = document.getElementById('clearPromptBtn');
                if (!btn) return;
                var val = promptEl.value || promptEl.innerText || '';
                btn.style.display = val.trim().length > 0 ? 'flex' : 'none';
            }
            promptEl.addEventListener('input', updateClearBtn);
            // 初始检测（输入框可能已有内容）
            setTimeout(updateClearBtn, 100);
        }
        
        // 初始化 GalleryDisplay
        if (typeof GalleryDisplay !== 'undefined' && GalleryDisplay.init) {
            GalleryDisplay.init({
                historyType: 'online',
                favoritesStorageKey: 'online_favorites',
                masonrySelector: '#masonry',
                loadMoreSelector: '#loadMoreTrigger',
                autoScan: false,
                lightbox: true,
                scrollToTop: true,
                toolbarExtras: true,
                favoritesEnabled: true,
            });
            // 收藏图片时自动保存到资产库（已收藏的不重复保存）
            var _favSavingToAsset = {};
            if (GalleryDisplay.Base && GalleryDisplay.Base.bus && typeof GalleryDisplay.Base.bus.on === 'function') {
                function _findPromptByUrl(u) {
                    try {
                        var items = (window.GalleryList && GalleryList.allHistory) || [];
                        for (var i = 0; i < items.length; i++) {
                            var r = items[i];
                            if (r && r.images && r.images.indexOf(u) !== -1) return r.prompt || '';
                        }
                    } catch (e) {}
                    return '';
                }
                GalleryDisplay.Base.bus.on('fav:changed', function(ev) {
                    if (ev && ev.added && ev.url && !_favSavingToAsset[ev.url]) {
                        var gPrompt = _findPromptByUrl(ev.url);
                        _favSavingToAsset[ev.url] = true;
                        fetch('/api/user/assets/save-from-url', {
                            method:'POST', headers:{'Content-Type':'application/json'},
                            body: JSON.stringify({url: ev.url, prompt: gPrompt})
                        }).then(function(r){
                            if (r.ok) {
                                console.log('[收藏] 已保存到资产库:', ev.url);
                                if (window.AssetLibrary && typeof AssetLibrary.invalidate === 'function') {
                                    try { AssetLibrary.invalidate(); } catch (_) {}
                                }
                            }
                            else console.warn('[收藏] 保存失败:', r.status, r.statusText);
                        }).catch(function(e){
                            console.warn('[收藏] 保存异常:', e);
                            delete _favSavingToAsset[ev.url];
                        });
                    }
                });
            }
            // 把工具栏移到固定区域（不随画廊滚动）
            (function() {
                function moveToolbar() {
                    var target = document.getElementById('galleryToolbarArea');
                    if (!target) return;
                    // 找工具栏容器：masonry 的前一个兄弟元素（由 HistoryBulkManager 插入）
                    var masonry = document.getElementById('masonry');
                    if (masonry && masonry.previousElementSibling && masonry.previousElementSibling !== target) {
                        target.appendChild(masonry.previousElementSibling);
                    }
                }
                // 延迟执行等 toolbar 创建
                setTimeout(moveToolbar, 200);
                setTimeout(moveToolbar, 800);
            })();
        }
        // 初始检测
        setTimeout(function() {
            var btn = document.getElementById('clearPromptBtn');
            if (btn) {
                var el = document.getElementById('prompt');
                var val = el ? (el.value || el.innerText || '') : '';
                btn.style.display = val.trim().length > 0 ? 'flex' : 'none';
            }
        }, 100);
        
        // ── PromptTags 初始化 ──
        if (typeof PromptTags !== 'undefined') {
            PromptTags.init();
            window.updatePromptTags = function() { PromptTags.update(); };
        }
        
        await loadHistory(0);
        const trigger = document.getElementById('loadMoreTrigger');
        if (trigger) {
            const observer = new IntersectionObserver(entries => {
                if (entries[0].isIntersecting && currentIndex < allHistory.length) loadHistory(1);
            }, {threshold: .1});
            observer.observe(trigger);
            trigger.onclick = () => loadHistory(1);
        }
    };
    </script>
