    <script>
        lucide.createIcons();

        function generateUUID() {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) { try { return crypto.randomUUID(); } catch(e){} }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16); });
        }
        const CLIENT_ID = localStorage.getItem("client_id") || generateUUID();
        localStorage.setItem("client_id", CLIENT_ID);

        // === 通用工具函数（纯函数，无副作用） ===
        // - splitPrompt(text)             : 把提示词按逗号拆成 token 数组（trim + 过滤空）
        // - setPickerButtonState(btn, n, label)
        //                                   根据已选数量 n 设置按钮高亮 + 角标文案
        // - promptHasArtistToken(parts)  : 判断 parts 中是否含 @xxx / by xxx 风格的画师 token
        // - extractArtistName(token)     : 从 @xxx / by xxx 中提取画师名（无前缀则返回 null）
        // - safeDbAvailable(name)        : 延迟安全检查全局 DB 是否已加载
        // 注：以下函数都是无副作用的纯函数，专门用于消解 updatePickerButtonsHighlight / syncPickerStatesFromPrompt 内的重复样板
        function splitPrompt(text) {
            if (!text) return [];
            return text.split(',').map(p => p.trim()).filter(Boolean);
        }
        function setPickerButtonState(btnId, textId, count, baseLabel) {
            const btn = document.getElementById(btnId);
            const txt = document.getElementById(textId);
            if (!btn) return;
            if (count > 0) btn.classList.add('is-in-use');
            else btn.classList.remove('is-in-use');
            if (txt) txt.textContent = count > 0 ? `${baseLabel}(${count})` : baseLabel;
        }
        function promptHasArtistToken(token) {
            if (!token) return false;
            return token.startsWith('@') || token.startsWith('by ');
        }
        function extractArtistName(token) {
            if (!token) return null;
            if (token.startsWith('@')) return token.substring(1).trim();
            if (token.startsWith('by ')) return token.substring(3).trim();
            return null;
        }
        function safeDbAvailable(name) {
            // 注：本函数已弃用。原实现用 window[name] 查 let 声明的全局变量永远返回 false，
            // 导致 getCharIndex 锁死空缓存。已替换为 _readDb()（依赖 picker 脚本主动挂到 window）。
            // 保留定义仅为兼容外部脚本（lora-picker.js 等）可能的引用。
            try {
                const v = (typeof window !== 'undefined') ? window[name] : undefined;
                return Array.isArray(v) && v.length > 0;
            } catch (_) { return false; }
        }

        // === DB 索引（懒加载单例） — 当前未使用 ===
        // 历史问题：原实现走 safeDbAvailable → window[name] 查 let 声明的全局变量永远失败，
        // 导致 getCharIndex 锁死空缓存，角色识别（紫色 tag + 缩略图）回归失效。
        // 现 updatePromptTags / updatePickerButtonsHighlight / syncPickerStatesFromPrompt
        // 全部改用"直接 typeof + 每次重建 Set"（对齐旧版本 C:\Users\ARTpace\Pictures\art-canvas），
        // 性能可接受（36k 元素 Set 重建约几毫秒，输入防抖 60ms 内不卡顿）。
        // 本套函数保留作为未来性能优化基础设施，但当前没有被任何调用点引用。
        function _readDb(name) {
            // 三个外部 picker 脚本（anima-character-picker.js / anima-artist-picker.js / preset-picker.js）
            // 在数据加载完后会同步挂到 window[name]，所以这里只读 window 即可。
            try {
                if (typeof window !== 'undefined') {
                    const v = window[name];
                    if (Array.isArray(v) && v.length > 0) return v;
                }
            } catch (_) {}
            return null;
        }
        let __charIndex = null;
        function getCharIndex() {
            const db = _readDb('ANIMA_CHAR_DB');
            // DB 还没就绪时绝不缓存空状态，否则首次空缓存会锁死
            if (!db) return { nameSet: new Set(), triggerSet: new Set(), triggerToName: new Map(), built: false, count: 0 };
            if (__charIndex && __charIndex.count === db.length) return __charIndex;
            const index = { nameSet: new Set(), triggerSet: new Set(), triggerToName: new Map(), built: false, count: 0 };
            db.forEach(c => {
                const name = (c.name || '').toLowerCase();
                if (name) index.nameSet.add(name);
                if (Array.isArray(c.triggers)) {
                    c.triggers.forEach(t => {
                        const tl = String(t).toLowerCase();
                        if (tl) {
                            index.triggerSet.add(tl);
                            if (name) index.triggerToName.set(tl, c.name);
                        }
                    });
                } else if (typeof c.trigger === 'string') {
                    const tl = c.trigger.toLowerCase();
                    if (tl) {
                        index.triggerSet.add(tl);
                        if (name) index.triggerToName.set(tl, c.name);
                    }
                }
            });
            index.built = true;
            index.count = db.length;
            __charIndex = index;
            return index;
        }
        function isCharToken(token) {
            if (!token) return false;
            if (promptHasArtistToken(token) || token.startsWith('[')) return false;
            const idx = getCharIndex();
            if (!idx.built) return false;
            const tl = token.toLowerCase();
            return idx.nameSet.has(tl) || idx.triggerSet.has(tl);
        }
        function findCharNameByTrigger(trigger) {
            if (!trigger) return null;
            return getCharIndex().triggerToName.get(trigger.toLowerCase()) || null;
        }

        let __artistIndex = null;
        function getArtistIndex() {
            const db = _readDb('ANIMA_ARTIST_DB');
            if (__artistIndex && db && __artistIndex.count === db.length) return __artistIndex;
            const index = { nameSet: new Set(), built: false, count: 0 };
            if (db) {
                db.forEach(a => {
                    const n = (a.name || '').toLowerCase();
                    if (n) index.nameSet.add(n);
                });
                index.built = true;
                index.count = db.length;
            }
            __artistIndex = index;
            return index;
        }
        function isArtistName(name) {
            if (!name) return false;
            return getArtistIndex().nameSet.has(name.toLowerCase());
        }
        function isArtistToken(token) {
            const n = extractArtistName(token);
            return n ? isArtistName(n) : false;
        }

        let __presetIndex = null;
        function getPresetIndex() {
            const db = _readDb('_flatIndex');
            if (!db) return { built: false, count: 0, byKey: new Map() };
            if (__presetIndex && __presetIndex.count === db.length) return __presetIndex;
            __presetIndex = { built: false, count: 0, byKey: new Map() };
            db.forEach(p => {
                if (!p) return;
                const key = (p.category_id || p.category || '') + ':' + (p.id || p.name);
                __presetIndex.byKey.set(key, p);
            });
            __presetIndex.built = true;
            __presetIndex.count = db.length;
            return __presetIndex;
        }
        // 预设在 prompt 中是否被命中（按预设 name 或预设 prompt 字符串匹配）
        function isPresetMatched(lowerSet, preset) {
            if (!preset) return null;
            const name = (preset.name || '').toLowerCase();
            const prompt = (preset.prompt || '').toLowerCase();
            if ((name && lowerSet.has(name)) || (prompt && lowerSet.has(prompt))) {
                return (preset.category_id || preset.category || '') + ':' + (preset.id || preset.name);
            }
            return null;
        }
        function invalidateDbIndexes() {
            __charIndex = null;
            __artistIndex = null;
            __presetIndex = null;
            __presetPromptSet = null;
        }

        // 预设 prompt 字符串 → id 的索引（懒加载单例）
        // - 用于 updatePromptTags / _mergePresetsForDrag 贪心合并连续 token
        // - 仅包含「prompt 包含 , 的多词预设」，单词预设不需要合并
        let __presetPromptSet = null;
        function getPresetPromptSet() {
            if (__presetPromptSet) return __presetPromptSet;
            const map = new Map();
            try {
                if (typeof presetPickerData !== 'undefined' && presetPickerData && Array.isArray(presetPickerData.categories)) {
                    presetPickerData.categories.forEach(cat => {
                        if (!cat || !Array.isArray(cat.subcategories)) return;
                        cat.subcategories.forEach(sub => {
                            if (!sub || !Array.isArray(sub.presets)) return;
                            sub.presets.forEach(p => {
                                if (p && p.prompt && p.prompt.includes(',')) {
                                    const k = p.prompt.trim();
                                    if (k && !map.has(k)) map.set(k, p.id);
                                }
                            });
                        });
                    });
                }
            } catch (_) {}
            __presetPromptSet = map;
            return map;
        }

        let isGenerating = false;
        let currentPromptId = null;
        const COMFYUI_WS_URL = `${window.location.protocol==='https:'?'wss:':'ws:'}//${window.location.host}/api/comfyui/ws?client_id=${CLIENT_ID}`;

        // === 共享 WebSocket：实时进度分发 ===
        const _activeTasks = new Map(); // promptId → { card, onDone }
        let _sharedWs = null;
        let _wsReconnectTimer = null;
        function _ensureWs() {
            if (_sharedWs && _sharedWs.readyState === 1) return Promise.resolve();
            if (_sharedWs && _sharedWs.readyState === 0) return new Promise((r) => {
                _sharedWs.addEventListener('open', r, { once: true });
                setTimeout(r, 3000);
            });
            if (_wsReconnectTimer) { clearTimeout(_wsReconnectTimer); _wsReconnectTimer = null; }
            _sharedWs = null;
            return new Promise((resolve) => {
                try {
                    const ws = new WebSocket(COMFYUI_WS_URL);
                    _sharedWs = ws;
                    ws.onopen = () => resolve();
                    setTimeout(resolve, 3000);
                    ws.onmessage = (e) => {
                        try {
                            if (typeof e.data !== 'string') return;
                            const msg = JSON.parse(e.data);
                            const pid = msg.data?.prompt_id;
                            if (!pid) return;
                            const task = _activeTasks.get(pid);
                            if (!task) return;
                            if (msg.type === 'progress') {
                                updateCardProgress(task.card, { status: 'sampling', value: msg.data.value, max: msg.data.max });
                            } else if (msg.type === 'executing') {
                                if (msg.data.node === null) {
                                    updateCardProgress(task.card, { status: 'done' });
                                    if (task.onDone) task.onDone();
                                } else {
                                    updateCardProgress(task.card, { status: 'executing' });
                                }
                            } else if (msg.type === 'execution_start') {
                                updateCardProgress(task.card, { status: 'started' });
                            }
                        } catch(err) {}
                    };
                    ws.onclose = () => { _sharedWs = null; _wsReconnectTimer = setTimeout(_ensureWs, 2000); };
                    ws.onerror = () => {};
                } catch(e) { resolve(); }
            });
        }
        async function _registerTask(promptId, card, onDone) {
            _activeTasks.set(promptId, { card, onDone });
            await _ensureWs();
        }
        function _unregisterTask(promptId) {
            _activeTasks.delete(promptId);
        }

        // === 工作流切换 ===
        let currentWorkflow = 'Z-Image.json';
        // 获取当前模型模式（供预设选择器过滤用）
        function getCurrentModelMode() {
            if (currentWorkflow.includes('anima 图生图')) return 'Anima图生图';
            if (currentWorkflow.includes('anima')) return 'ANIMA';
            if (currentWorkflow.includes('Krea2')) return 'Krea2';
            if (currentWorkflow.includes('Ideogram4')) return 'Ideogram4';
            if (currentWorkflow.includes('Boogu')) return 'Boogu';
            return 'Z-Image';
        }
        let currentEngine = localStorage.getItem('zimage_engine') || 'local';
        let currentBatchCount = 1;

        function switchWorkflow(name) {
            currentWorkflow = name;
            localStorage.setItem('zimage_workflow', name);
            // 按钮只显示类型名（Z-Image / ANIMA），不再显示具体工作流名
            // —— 避免选 UNET 模型 / 从历史载入工作流时把按钮文本覆盖成具体名
            const txt = document.getElementById('modelText');
            if (txt) txt.textContent = getCurrentModelMode();
            const items = document.querySelectorAll('#modelMenu .anima-ctrl-menu-item');
            items.forEach(it => {
                const isOn = it.getAttribute('data-model-key') === name;
                const chk = it.querySelector('.chk');
                if (chk) chk.style.opacity = isOn ? '1' : '0';
            });
            // 切换模式后：检查当前选中的模型是否仍属于新模式；不兼容则清空
            const prefixes = _compatModelPrefixes();
            const isCompatible = (modelName) => {
                if (!modelName) return true;
                if (prefixes === null) return true;
                const lower = modelName.replace(/\\/g, '/').toLowerCase();
                return prefixes.some(p => lower.startsWith(p.replace(/\\/, '/')));
            };
            if (selectedUnetModel && !isCompatible(selectedUnetModel)) {
                selectedUnetModel = '';
            }
            // 恢复该工作流上次记忆的 UNET 模型（按工作流持久化到 localStorage）
            const saved = _getSavedUnetForWorkflow(currentWorkflow);
            if (saved && isCompatible(saved) && saved !== selectedUnetModel) {
                selectedUnetModel = saved;
            } else if (saved && !isCompatible(saved)) {
                // 记忆里的模型已经不属于该工作流了（例如工作流被改成另一个前缀），
                // 清掉过期记忆避免之后一直卡住
                _setSavedUnetForWorkflow(currentWorkflow, '');
            }
            updateParamsUI();
        }


        // === 当前工作流兼容的模型文件夹前缀列表 ===
        function _compatModelPrefixes() {
            const wf = currentWorkflow.toLowerCase();
            if (wf.includes('anima')) return ['anima\\', 'anima/'];
            if (wf.includes('krea2')) return ['flux2-klein\\', 'flux2-klein/'];
            if (wf.includes('ideogram4')) return ['ideogram4\\', 'ideogram4/'];
            if (wf.includes('boogu')) return ['boogu\\', 'boogu/'];
            if (wf.includes('zimage') || wf.includes('z-image')) return ['z-image\\', 'z-image/'];
            return null; // unknown -> show all
        }
        // === 模型选择面板（UNET 模型文件） ===
        let selectedUnetModel = '';  // 用户选择的 UNET 模型文件名
        let unetModelsCache = null;  // 缓存：首次加载后不再重复请求

        // 按工作流记忆用户选择的 UNET 模型（持久化到 localStorage），
        // 下次打开同一工作流时自动恢复选择，而不是回退到工作流 JSON 默认值。
        const UNET_PER_WF_KEY = 'zimage_unet_per_wf';

        function _loadUnetMap() {
            try {
                const raw = localStorage.getItem(UNET_PER_WF_KEY);
                if (!raw) return {};
                const obj = JSON.parse(raw);
                return (obj && typeof obj === 'object') ? obj : {};
            } catch (e) { return {}; }
        }

        function _saveUnetMap(map) {
            try { localStorage.setItem(UNET_PER_WF_KEY, JSON.stringify(map || {})); }
            catch (e) {}
        }

        function _getSavedUnetForWorkflow(wfName) {
            if (!wfName) return '';
            return _loadUnetMap()[wfName] || '';
        }

        function _setSavedUnetForWorkflow(wfName, modelName) {
            if (!wfName) return;
            const map = _loadUnetMap();
            if (modelName) map[wfName] = modelName;
            else delete map[wfName];
            _saveUnetMap(map);
        }

        // 从已加载的工作流 JSON 中提取当前在用的 UNET/Diffusion 模型名。
        // 优先级：运行时选择的 selectedUnetModel > 该工作流上次记忆的模型 > 工作流 JSON 默认值。
        function getCurrentWorkflowUnet() {
            if (selectedUnetModel) return selectedUnetModel;
            const saved = _getSavedUnetForWorkflow(currentWorkflow);
            if (saved) return saved;
            try {
                const wf = window._wfCache && window._wfCache[currentWorkflow];
                if (!wf) return '';
                for (const nid in wf) {
                    const node = wf[nid];
                    if (!node || !node.inputs) continue;
                    if (node.class_type === 'UNETLoader' && node.inputs.unet_name) {
                        return node.inputs.unet_name;
                    }
                    if (typeof node.class_type === 'string'
                        && node.class_type.includes('LoadDiffusionModel')
                        && node.inputs.model_name) {
                        return node.inputs.model_name;
                    }
                }
            } catch (e) {}
            return '';
        }

        // 规范化模型名：统一反斜杠 + 去尾部 .safetensors + 小写，用于跨平台匹配
        function _normModelName(n) {
            if (!n) return '';
            return String(n).replace(/\\/g, '/').replace(/\.safetensors$/i, '').toLowerCase();
        }

        // 主动加载当前工作流到 _wfCache（如果还没有），让 getCurrentWorkflowUnet 能在
        // 打开弹窗时就拿到工作流 JSON 中默认的 UNET 模型名，免去必须先跑一次才能高亮的体验。
        async function ensureWorkflowCached() {
            if (!currentWorkflow) return;
            if (!window._wfCache) window._wfCache = {};
            if (window._wfCache[currentWorkflow]) return;
            try {
                const res = await fetch('/api/workflows/' + encodeURIComponent(currentWorkflow));
                if (!res.ok) return;
                const env = await res.json();
                window._wfCache[currentWorkflow] = env.workflow || env;
            } catch (e) {}
        }

        function openModelPicker() {
            closeAllMenus();
            const overlay = document.getElementById('modelPickerOverlay');
            const list = document.getElementById('modelPickerList');
            if (!overlay || !list) return;
            overlay.classList.add('open');
            // 先确保工作流已缓存（用于正确高亮默认模型），再渲染列表
            const renderAfter = () => {
                if (unetModelsCache) {
                    renderModelPickerList(list, unetModelsCache);
                    return;
                }
                list.innerHTML = '<div style="text-align:center;padding:20px;color:#999;font-size:12px;">加载模型列表中...</div>';
                fetchUnetModels().then(groups => {
                    unetModelsCache = groups;
                    renderModelPickerList(list, groups);
                }).catch(e => {
                    list.innerHTML = `<div style="text-align:center;padding:20px;color:#ef4444;font-size:12px;">加载失败: ${e.message}</div>`;
                });
            };
            ensureWorkflowCached().finally(renderAfter);
        }

        function renderModelPickerList(list, groups) {
            const prefixes = _compatModelPrefixes();
            const currentNorm = _normModelName(getCurrentWorkflowUnet());
            list.innerHTML = groups.map(g => {
                // 按当前工作流过滤：只显示兼容的模型
                const filteredItems = prefixes === null
                    ? g.items  // 未知模式显示全部
                    : g.items.filter(name => {
                        const lower = name.replace(/\\/g, '/').toLowerCase();
                        return prefixes.some(p => lower.startsWith(p.replace(/\\/, '/')));
                    });
                if (filteredItems.length === 0) return '';
                const cards = filteredItems.map(name => {
                    const shortName = name.replace(/\\/g, '/').split('/').pop().replace(/\.safetensors$/i, '');
                    // 匹配规则：按归一化名（反斜杠+大小写+扩展名）匹配，
                    // 工作流 JSON 中 "z-image\foo.safetensors" 和列表里的 "z-image/foo.safetensors" 都能对上
                    const isActive = !!(currentNorm && _normModelName(name) === currentNorm);
                    // 用 data-full-name + 事件委托：避免 HTML inline onclick 解析 JS 字符串时
                    // 把反斜杠（'anima\foo'）等不合法转义序列吞掉导致前缀被吃
                    return `<div class="model-picker-card${isActive ? ' active' : ''}" data-full-name="${encodeURIComponent(name)}">
                        <div class="model-picker-icon">📦</div>
                        <div class="model-picker-info">
                            <div class="model-picker-name">${shortName}</div>
                            <div class="model-picker-desc">${g.label}</div>
                        </div>
                        <div class="model-picker-check"></div>
                    </div>`;
                }).join('');
                return `<div class="model-picker-group-label">${g.label}</div>${cards}`;
            }).join('') || '<div style="text-align:center;padding:20px;color:#999;font-size:12px;">当前模式无可选模型</div>';
            // 一次性事件委托：保证反斜杠/单引号/换行等特殊字符能原样传回
            list.querySelectorAll('.model-picker-card').forEach(card => {
                card.addEventListener('click', () => {
                    const fullName = decodeURIComponent(card.dataset.fullName || '');
                    selectUnetModel(fullName);
                });
            });
        }

        async function fetchUnetModels() {
            const groups = [];
            // 直接查轻量接口，避免全量 object_info 响应过大超时
            const endpoints = [
                { url: '/api/comfyui/object_info/UNETLoader', key: 'UNETLoader', field: 'unet_name', label: 'UNET 模型' },
                { url: '/api/comfyui/object_info/LoadDiffusionModelShared%20%2F%2F%2FInspire', key: 'LoadDiffusionModelShared //Inspire', field: 'model_name', label: 'Shared Diffusion 模型' },
            ];
            for (const ep of endpoints) {
                try {
                    const res = await fetch(ep.url);
                    if (!res.ok) continue;
                    const data = await res.json();
                    const node = data[ep.key];
                    const models = node?.input?.required?.[ep.field]?.[0];
                    if (Array.isArray(models) && models.length) {
                        groups.push({ label: ep.label, items: models });
                    }
                } catch (e) {}
            }
            return groups;
        }

        function selectUnetModel(name) {
            selectedUnetModel = name;
            // 按工作流记住这个选择，下次回到该工作流时自动恢复
            _setSavedUnetForWorkflow(currentWorkflow, name);
            closeModelPicker();
            // 不再修改 modelText —— 按钮只显示类型名（Z-Image / ANIMA），
            // UNET 模型文件名只用于生成时传给后端，不要污染 UI 上的类型标识
        }

        function closeModelPicker() {
            const overlay = document.getElementById('modelPickerOverlay');
            if (overlay) overlay.classList.remove('open');
        }

        // === 通用下拉菜单助手(取代 4 套重复的 toggle*Menu/select* 逻辑) ===
        const __ALL_MENU_IDS = ['batchCountMenu', 'modelMenu', 'engineMenu', 'ratioMenu', 'resMenu', 'qualityMenu'];

        // 点击按钮时调用:打开当前菜单、关闭其它所有
        function toggleMenu(menuId) {
            const menu = document.getElementById(menuId);
            if (!menu) return;
            const willOpen = menu.style.display !== 'block' && menu.style.display !== 'grid';
            __ALL_MENU_IDS.forEach(id => {
                const m = document.getElementById(id);
                if (m) m.style.display = 'none';
            });
            if (willOpen) {
                // grid 菜单（多列）→ display:grid；普通菜单 → display:block
                menu.style.display = menu.classList.contains('anima-ctrl-menu-grid') ? 'grid' : 'block';
            } else {
                menu.style.display = 'none';
            }
        }

        // 关闭所有菜单
        function closeAllMenus() {
            __ALL_MENU_IDS.forEach(id => {
                const m = document.getElementById(id);
                if (m) m.style.display = 'none';
            });
        }

        // 设置某菜单的选中项:dataKey 对应 dataset.xxx(如 'model-key' / 'res-key')
        function setActiveMenuItem(menuId, dataKey, val) {
            const menu = document.getElementById(menuId);
            if (!menu) return;
            const target = String(val);
            menu.querySelectorAll('.anima-ctrl-menu-item').forEach(item => {
                const isActive = item.getAttribute('data-' + dataKey) === target;
                item.classList.toggle('active', isActive);
                const chk = item.querySelector('.chk');
                if (chk) chk.style.opacity = isActive ? '1' : '0';
            });
        }

        // === 模型上拉菜单 ===
        // === 紧凑切换模式 ===
        const COMPACT_WIDTH = 900;
        function isCompact() { return window.innerWidth <= COMPACT_WIDTH; }
        function applyCompactMode() {
            const bar = document.querySelector('.control-bar');
            if (!bar) return;
            if (isCompact()) {
                bar.classList.add('compact-toggle');
            } else {
                bar.classList.remove('compact-toggle');
            }
        }
        window.addEventListener('resize', applyCompactMode);
        document.addEventListener('DOMContentLoaded', applyCompactMode);

        // 紧凑模式下按钮直接切换
        const _modelOptions = ['Z-Image.json', 'anima 动漫文生图.json', 'Krea2-Turbo.json', 'Ideogram4-Structured.json'];
        const _modelLabels = ['Z-Image', 'ANIMA', 'Krea2', 'Ideogram4'];
        function _isCompact() { return document.querySelector('.control-bar')?.classList.contains('compact-toggle') || window.innerWidth <= 900; }
        function compactModelToggle() {
            if (!_isCompact()) return false;
            const idx = _modelOptions.indexOf(currentWorkflow);
            const next = (idx + 1) % _modelOptions.length;
            selectModel(_modelOptions[next]);
            return true;
        }
        const _engineOptions = ['local', 'cloud'];
        const _engineLabels = ['COMFYUI', 'ModelScope'];
        function compactEngineToggle() {
            if (!_isCompact()) return false;
            const idx = _engineOptions.indexOf(currentEngine);
            const next = (idx + 1) % _engineOptions.length;
            selectEngine(_engineOptions[next]);
            return true;
        }
        const _batchOptions = [1, 2, 3, 4];
        function compactBatchToggle() {
            if (!_isCompact()) return false;
            const idx = _batchOptions.indexOf(currentBatchCount);
            const next = (idx + 1) % _batchOptions.length;
            selectBatchCount(_batchOptions[next]);
            return true;
        }

        function selectModel(name) {
            switchWorkflow(name);
            closeAllMenus();
            setActiveMenuItem('modelMenu', 'model-key', name);
        }

        function switchEngine(mode) {
            currentEngine = mode;
            localStorage.setItem('zimage_engine', mode);
            // 同步上拉菜单的按钮文本、图标
            const txt = document.getElementById('engineText');
            const icon = document.getElementById('engineIcon');
            if (txt) txt.textContent = mode === 'cloud' ? 'ModelScope' : 'COMFYUI';
            if (icon) {
                icon.setAttribute('data-lucide', mode === 'cloud' ? 'cloud' : 'monitor');
                if (window.lucide && typeof window.lucide.createIcons === 'function') {
                    try { window.lucide.createIcons({ attrs: { class: 'w-3 h-3' } }); } catch (_) {}
                }
            }
            // 同步菜单选中态(交给通用函数)
            setActiveMenuItem('engineMenu', 'engine-key', mode);
        }

        // === 引擎上拉菜单 ===
        function selectEngine(mode) {
            switchEngine(mode);
            closeAllMenus();
        }

        // 存储 Ideogram4 JSON 提示词
        let ideogram4JsonPrompt = '';
        let ideogram4Quality = localStorage.getItem('ideogram4_quality') || 'Default';

        function setIdeogram4Quality(q) {
            ideogram4Quality = q;
            localStorage.setItem('ideogram4_quality', q);
            // 更新按钮文本
            const qualityText = document.getElementById('qualityText');
            if (qualityText) qualityText.textContent = q;
            // 更新菜单选中态
            document.querySelectorAll('[data-quality-key]').forEach(el => {
                const isActive = el.dataset.qualityKey === q;
                el.classList.toggle('active', isActive);
                const chk = el.querySelector('.chk');
                if (chk) chk.style.opacity = isActive ? 1 : 0;
            });
        }

        // Boogu 质量切换
        let booguQuality = localStorage.getItem('boogu_quality') || 'Turbo';

        function selectBoogu() {
            selectModel('Boogu-' + booguQuality + '.json');
        }

        function setBooguQuality(q) {
            booguQuality = q;
            localStorage.setItem('boogu_quality', q);
            // 如果当前是 Boogu 模型，切换对应变体
            if (currentWorkflow.includes('Boogu')) {
                selectModel('Boogu-' + q + '.json');
            }
            // 更新按钮状态
            document.querySelectorAll('[data-boogu-quality]').forEach(el => {
                el.classList.toggle('active', el.dataset.booguQuality === q);
            });
        }

        function updateParamsUI() {
            const el = document.getElementById('dynamicParams');
            const ctrlEl = document.getElementById('animaControls');
            const isAnima = currentWorkflow.includes('anima');
            const isKrea2 = currentWorkflow.includes('Krea2');
            const isIdeogram4 = currentWorkflow.includes('Ideogram4');
            const isBoogu = currentWorkflow.includes('Boogu');
            // Ideogram4 模式自动切换预设
            if (isIdeogram4 && typeof spPickerSelect === 'function') {
                // 延迟执行，确保预设列表已加载
                setTimeout(() => {
                    if (spPickerSelectedId !== 'ideogram4') {
                        spPickerLoadPresets().then(() => {
                            const hasIdeogram4Preset = spPickerPresets.some(p => p.id === 'ideogram4');
                            if (hasIdeogram4Preset) spPickerSelect('ideogram4');

            if (isAnima || isKrea2) {
                document.getElementById('animaTagSwitcher').style.display = '';
                el.innerHTML = `
                <div class="flex flex-col gap-2">
                    <div id="presetTags" class="preset-tags"></div>
                </div>`;
            } else if (isIdeogram4) {
                document.getElementById('animaTagSwitcher').style.display = 'none';
                el.innerHTML = '';
            } else if (isBoogu) {
                document.getElementById('animaTagSwitcher').style.display = 'none';
                el.innerHTML = `
                <div class="flex items-center gap-1">
                    <span class="text-[9px] font-bold text-gray-400 uppercase">质量</span>
                    <div class="flex gap-1">
                        <button onclick="setBooguQuality('Turbo')" data-boogu-quality="Turbo" class="anima-ctrl ${booguQuality === 'Turbo' ? 'active' : ''}" style="padding:2px 8px;font-size:10px;">Turbo</button>
                        <button onclick="setBooguQuality('Base')" data-boogu-quality="Base" class="anima-ctrl ${booguQuality === 'Base' ? 'active' : ''}" style="padding:2px 8px;font-size:10px;">Base</button>
                    </div>
                </div>`;
            } else {
                document.getElementById('animaTagSwitcher').style.display = 'none';
                el.innerHTML = '';
            }

            // 比例和分辨率：所有模式共享，放在生成按钮左侧
            if (ctrlEl) {
                let qualityHtml = '';
                if (isIdeogram4) {
                    qualityHtml = `
                        <!-- 质量控制 -->
                        <div class="anima-ctrl-wrap">
                            <button onclick="toggleMenu('qualityMenu')" id="qualityBtn" class="anima-ctrl">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                                <span id="qualityText">${ideogram4Quality}</span>
                                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
                            </button>
                            <div id="qualityMenu" class="anima-ctrl-menu">
                                ${['Quality','Default','Turbo'].map(q => {
                                    const isActive = ideogram4Quality === q;
                                    return '<div onclick="setIdeogram4Quality(\'' + q + '\');toggleMenu(\'qualityMenu\')" data-quality-key="' + q + '" class="anima-ctrl-menu-item' + (isActive ? ' active' : '') + '">' +
                                        '<span class="ratio-label">' + q + '</span>' +
                                        '<span class="chk" style="opacity:' + (isActive ? 1 : 0) + '">✓</span>' +
                                        '</div>';
                                }).join('')}
                            </div>
                        </div>`;
                }
                ctrlEl.innerHTML = `
                        ${qualityHtml}
                        <!-- 比例 -->

                                <svg class="ratio-icon-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
                                <span id="ratioText">${animaRatioW}:${animaRatioH}</span>

                                    const maxSide = 14;
                                    const iw = r.w >= r.h ? maxSide : Math.max(6, Math.round(maxSide * r.w / r.h));
                                    const ih = r.w >= r.h ? Math.max(6, Math.round(maxSide * r.h / r.w)) : maxSide;
                                    return '<div onclick="selectRatio(\'' + r.l + '\',' + r.w + ',' + r.h + ')" data-ratio-key="' + r.l + '" class="anima-ctrl-menu-item' + (isActive ? ' active' : '') + '">' +
                                        '<span class="ratio-icon" style="width:' + iw + 'px;height:' + ih + 'px;"></span>' +

                            </div>
                        </div>`;
            }
            setTimeout(updateSeedUI, 0);

        // === 种子模式 ===
        let animaSeedMode = 'random';
        let animaFixedSeed = 0;

        function toggleSeedMode() {
            animaSeedMode = animaSeedMode === 'random' ? 'fixed' : 'random';
            updateSeedUI();
        }
        function updateSeedUI() {
            const btn = document.getElementById('seedToggle');
            const inp = document.getElementById('seedInput');
            if (!btn || !inp) return;
            const isFixed = animaSeedMode === 'fixed';
            btn.classList.toggle('seed-locked', isFixed);
            btn.innerHTML = isFixed
                ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'
                : '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>';
            if (isFixed && animaFixedSeed > 0) inp.value = animaFixedSeed;
            else if (!isFixed) inp.value = '';
            inp.disabled = !isFixed;
            inp.style.opacity = isFixed ? '1' : '0.5';
            inp.style.cursor = isFixed ? 'text' : 'not-allowed';
        }
        function onSeedInput(v) {
            animaFixedSeed = parseInt(v) || 0;
        }

        // === 提示词翻译（Toggle 模式）===
        // 单击 = 在 [原文, 译文] 两态间切换，永远不重复调 API。
        //   - 当前 == 原文 → 切到译文
        //   - 当前 == 译文 → 切回原文
        //   - 都不匹配（用户改了 prompt）→ 视为新输入，调 API 翻译
        // 标签语言跟着切（en ↔ cn）。
        let _lastOriginalText = null;    // 上一次翻译前的原文
        let _lastTranslatedText = null;  // 上一次翻译后的译文
        function setPromptTagsLangByText(t) {
            const hasChinese = /[\u4e00-\u9fa5]/.test(t);
            window.PROMPT_TAGS_LANG_MODE = hasChinese ? 'cn' : 'en';
            localStorage.setItem('prompt_tags_lang_mode', window.PROMPT_TAGS_LANG_MODE);
            // 同步翻译按钮的 data-lang（控制颜色：中文=红 / 英文=蓝）
            const tBtn = document.getElementById('translateBtn');
            if (tBtn) tBtn.setAttribute('data-lang', window.PROMPT_TAGS_LANG_MODE);
            if (typeof updatePromptTags === 'function') updatePromptTags();
        }
        function applyTranslateResult(text) {
            const promptInput = document.getElementById('prompt');
            if (!promptInput) return;
            // 规范化：把中文标点（顿号、分号、全角逗号）替换成英文逗号+空格
            // —— 1) 避免 "黑发、金发" 被识别成一段
            // —— 2) 保持 toggle 模式原文/译文严格匹配
            const normalized = String(text)
                .replace(/[，、；;]/g, ', ')
                .replace(/\s*,\s*/g, ', ')
                .replace(/\s+/g, ' ')
                .trim();
            promptInput.value = normalized;
            promptInput.dispatchEvent(new Event('input', { bubbles: true }));
            setPromptTagsLangByText(normalized);
        }
        // tag 分隔符：英文逗号 + 中文标点（顿号、；，）
        const PROMPT_TAG_SPLITTER = /[，,、；;]/;
        // 反馈状态：用于按钮 SVG 颜色/旋转
        function _setTranslateBtnState(state) {
            const btn = document.getElementById('translateBtn');
            if (!btn) return;
            btn.setAttribute('data-state', state || '');
        }
        async function promptTranslateDo(e) {
            if (e) e.stopPropagation();
            const promptInput = document.getElementById('prompt');
            const btn = document.getElementById('translateBtn');
            if (!promptInput || !btn) return;
            const text = promptInput.value.trim();
            if (!text) return;

            // ① Toggle：当前是译文 → 切回原文（0 API）
            if (_lastTranslatedText !== null && _lastOriginalText !== null
                && text === _lastTranslatedText) {
                applyTranslateResult(_lastOriginalText);
                _setTranslateBtnState('ok');
                setTimeout(() => _setTranslateBtnState(''), 1200);
                return;
            }

            // ② Toggle：当前是原文 → 切到译文（0 API）
            if (_lastOriginalText !== null && _lastTranslatedText !== null
                && text === _lastOriginalText) {
                applyTranslateResult(_lastTranslatedText);
                _setTranslateBtnState('ok');
                setTimeout(() => _setTranslateBtnState(''), 1200);
                return;
            }

            // ③ 都不匹配 → 视为新输入，调 API 翻译
            _setTranslateBtnState('loading');
            btn.disabled = true;
            try {
                const hasChinese = /[\u4e00-\u9fa5]/.test(text);
                const targetDir = hasChinese ? 'zh2en' : 'en2zh';
                if (window.PromptTranslate.setDirection) {
                    window.PromptTranslate.setDirection(targetDir);
                }
                const result = await window.PromptTranslate.translate(text, null, {
                    cacheSource: null
                });
                if (result) {
                    applyTranslateResult(result.text);
                    _lastOriginalText = text;
                    _lastTranslatedText = result.text;
                    _setTranslateBtnState('ok');
                } else {
                    _setTranslateBtnState('fail');
                }
                setTimeout(() => _setTranslateBtnState(''), 1200);
            } catch (err) {
                console.error('[translate] 错误:', err);
                _setTranslateBtnState('fail');
                setTimeout(() => _setTranslateBtnState(''), 1500);
            } finally {
                btn.disabled = false;
                btn.style.opacity = '';
            }
        }
        // 兼容旧引用
        const translatePrompt = promptTranslateDo;

        // === 提示词预设（通过预设选择器管理） ===
        function getActivePresetPrompts() {
            // 从当前 prompt 文本中反推还保留着的预设，而不是依赖可能过期的 presetPickerSelected
            const promptInput = document.getElementById('prompt');
            if (!promptInput) return '';
            const currentText = promptInput.value.trim();
            if (!currentText) return '';
            const currentLower = currentText.toLowerCase();
            // 只返回 prompt 文本仍然完整存在于输入中的预设
            return (presetPickerSelected || []).filter(p => {
                const pt = (p.prompt || '').trim();
                if (!pt) return false;
                return currentLower.includes(pt.toLowerCase());
            }).map(p => p.prompt).filter(Boolean).join(', ');
        }

        // === 清空提示词 ===
        function clearPrompt() {
            const promptInput = document.getElementById('prompt');
            if (!promptInput) return;
            promptInput.value = '';
            promptInput.dispatchEvent(new Event('input', { bubbles: true }));
            if (typeof updatePromptTags === 'function') updatePromptTags();
            promptInput.focus();
        }

        // === 参考图管理 ===
        let refImages = []; // {file, url, name}

        function refImageHandleUpload(input) {
            const files = Array.from(input.files);
            files.forEach(file => {
                if (!file.type.startsWith('image/')) return;

            input.value = '';

            refImageAutoSwitch();
            // 刷新主界面按钮高亮

        }

        function refImageRenderPreviews() {
            const container = document.getElementById('refImagePreview');
            if (!container) return;
            if (refImages.length === 0) {
                container.style.display = 'none';
                container.innerHTML = '';
                return;
            }
            container.style.display = 'flex';
            container.style.alignItems = 'center';
            container.innerHTML = refImages.map((img, i) => `
                <div class="ref-thumb" onclick="refImageView(${i})" style="width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,0.15);flex-shrink:0;cursor:pointer;position:relative;transition:border-color 0.2s;" onmouseenter="this.style.borderColor='rgba(0,180,216,0.6)'" onmouseleave="this.style.borderColor='rgba(255,255,255,0.15)'">
                    <img src="${img.url}" style="width:100%;height:100%;object-fit:cover;pointer-events:none;" />
                    <button onclick="event.stopPropagation();refImageRemove(${i})" class="ref-del-btn" style="position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:rgba(239,68,68,0.85);color:#fff;border:none;font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity 0.15s;">&times;</button>
                    <div style="position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:8px;color:#fff;truncate px-1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:rgba(0,0,0,0.5);">${img.name}</div>
                </div>
            `).join('') + `
                <button onclick="refImageClearAll()" title="清空全部参考图" style="width:64px;height:64px;border-radius:8px;border:1px dashed rgba(255,255,255,0.2);background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.4);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s;" onmouseenter="this.style.borderColor='rgba(239,68,68,0.5)';this.style.color='#ef4444'" onmouseleave="this.style.borderColor='rgba(255,255,255,0.2)';this.style.color='rgba(255,255,255,0.4)'">🗑</button>
            `;
            // hover 显示删除按钮
            container.querySelectorAll('.ref-thumb').forEach(el => {
                el.onmouseenter = () => el.querySelector('.ref-del-btn').style.opacity = '1';
                el.onmouseleave = () => el.querySelector('.ref-del-btn').style.opacity = '0';
            });
        }

        function refImageView(index) {
            if (!refImages[index]) return;
            const overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(8px);';
            overlay.innerHTML = `<img src="${refImages[index].url}" style="max-width:90vw;max-height:90vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,0.5);" /><div style="position:absolute;top:16px;right:20px;color:#fff;font-size:28px;cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,0.1);transition:background 0.2s;" onmouseenter="this.style.background='rgba(255,255,255,0.2)'" onmouseleave="this.style.background='rgba(255,255,255,0.1)'">&times;</div><div style="position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.6);font-size:12px;">${refImages[index].name}</div>`;
            overlay.onclick = () => overlay.remove();
            document.body.appendChild(overlay);
        }

        function refImageRemove(index) {
            if (refImages[index]) {
                URL.revokeObjectURL(refImages[index].url);
                refImages.splice(index, 1);
                refImageRenderPreviews();
                refImageAutoSwitch();
                // 刷新主界面按钮高亮
                if (typeof updatePickerButtonsHighlight === 'function') updatePickerButtonsHighlight();
            }
        }

        function refImageClearAll() {
            refImages.forEach(img => URL.revokeObjectURL(img.url));
            refImages = [];
            refImageRenderPreviews();
            refImageAutoSwitch();
            // 刷新主界面按钮高亮
            if (typeof updatePickerButtonsHighlight === 'function') updatePickerButtonsHighlight();
        }

        // 自动切换工作流：有参考图→图生图，无参考图→文生图
        const WORKFLOW_TEXT2IMG = 'Z-Image.json';
        const WORKFLOW_IMG2IMG = 'anima_图生图.json';

        function refImageAutoSwitch() {
            const hasRef = refImages.length > 0;
            const target = hasRef ? WORKFLOW_IMG2IMG : WORKFLOW_TEXT2IMG;
            if (currentWorkflow !== target) {
                switchWorkflow(target);
            }
        }

        // === 智能提示词生成 ===
        async function smartPromptGenerate() {
            const promptInput = document.getElementById('prompt');
            const btn = document.getElementById('smartPromptBtn');
            if (!promptInput || !btn) return;
            
            const userText = promptInput.value.trim();
            if (!userText) return alert('请先输入中文描述');
            
            const isIdeogram4Mode = currentWorkflow.includes('Ideogram4');
            
            btn.disabled = true;
            btn.querySelector('span').textContent = '生成中...';
            
            try {
                const res = await fetch('/api/smart-prompt', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ prompt: userText })
                });
                const data = await res.json();
                
                if (data.success && data.prompt) {
                    if (isIdeogram4Mode) {
                        // Ideogram4 模式：存储 JSON 提示词，显示描述
                        try {
                            const parsed = JSON.parse(data.prompt);
                            ideogram4JsonPrompt = data.prompt;
                            promptInput.value = parsed.high_level_description || '';
                        } catch(e) {
                            promptInput.value = data.prompt;
                            ideogram4JsonPrompt = '';
                        }
                    } else {
                        // 普通模式
                        promptInput.value = data.prompt;
                        ideogram4JsonPrompt = '';
                    }
                    // 先同步选择器状态，再渲染标签
                    if (typeof syncPickerStatesFromPrompt === 'function') syncPickerStatesFromPrompt();
                    updatePromptTags();
                    // 显示负向提示词提示
                    if (data.negative) {
                        console.log('[SmartPrompt] 负向提示词:', data.negative);
                    }
                } else {
                    alert(data.error || '生成失败');
                }
            } catch(e) {
                alert('请求失败: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.querySelector('span').textContent = 'AI 生成';
            }
        }

        // === 智能提示词配置（已集成到 API 设置页面） ===
        let animaRatioW = parseInt(localStorage.getItem('anima_ratio_w')) || 9;
        let animaRatioH = parseInt(localStorage.getItem('anima_ratio_h')) || 16;
        let animaRes = parseInt(localStorage.getItem('anima_res')) || 1;

        const _ratioOptions = [['1:1',1,1],['4:3',4,3],['3:4',3,4],['16:9',16,9],['9:16',9,16],['3:2',3,2],['2:3',2,3],['21:9',21,9]];
        const _resOptions = [1, 2];
        function compactRatioToggle() {
            if (!_isCompact()) return false;
            try {
                const cur = animaRatioW + ':' + animaRatioH;
                let idx = _ratioOptions.findIndex(r => r[0] === cur);
                if (idx < 0) idx = 0;
                const next = (idx + 1) % _ratioOptions.length;
                const r = _ratioOptions[next];
                selectRatio(r[0], r[1], r[2]);
            } catch(e) { console.error('compactRatioToggle error:', e); }
            return true;
        }
        function compactResToggle() {
            if (!_isCompact()) return false;
            try {
                let idx = _resOptions.indexOf(animaRes);
                if (idx < 0) idx = 0;
                const next = (idx + 1) % _resOptions.length;
                selectRes(_resOptions[next]);
            } catch(e) { console.error('compactResToggle error:', e); }
            return true;
        }

        function selectRatio(label, w, h) {
            animaRatioW = w;
            animaRatioH = h;
            localStorage.setItem('anima_ratio_w', w);
            localStorage.setItem('anima_ratio_h', h);
            document.getElementById('ratioText').textContent = label;
            setActiveMenuItem('ratioMenu', 'ratio-key', label);
            closeAllMenus();
        }

        function selectRes(res) {
            animaRes = res;
            localStorage.setItem('anima_res', res);
            document.getElementById('resText').textContent = res + 'K';
            setActiveMenuItem('resMenu', 'res-key', String(res));
            closeAllMenus();
        }

        // 点击外部关闭所有菜单(统一处理)
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.anima-ctrl-wrap')) closeAllMenus();
        });
        
        function getAnimaSize() {
            // 根据比例和分辨率计算实际尺寸
            const baseSize = animaRes === 2 ? 2048 : 1024;
            const ratio = animaRatioW / animaRatioH;
            let w, h;
            if (ratio > 1) {
                w = baseSize;
                h = Math.round(baseSize / ratio);
            } else {
                h = baseSize;
                w = Math.round(baseSize * ratio);
            }
            // 确保是8的倍数
            w = Math.round(w / 8) * 8;
            h = Math.round(h / 8) * 8;
            return { width: w, height: h };
        }
        
        // === 提示词标签操作 ===
        function removePromptTag(tag) {
            const promptInput = document.getElementById('prompt');
            if (!promptInput) return;
            let raw = promptInput.value;
            // 尝试删除完整的预设
            if (raw.includes(tag)) {
                raw = raw.replace(tag, '');
            }
            // 清理多余的逗号和空格
            raw = raw.split(PROMPT_TAG_SPLITTER).map(p => p.trim()).filter(p => p).join(', ');
            promptInput.value = raw;
            // 隐藏悬浮预览
            if (typeof hideAnimaTagPreview === 'function') {
                hideAnimaTagPreview();
            }
            // 先同步选择器状态，再渲染标签
            if (typeof syncPickerStatesFromPrompt === 'function') syncPickerStatesFromPrompt();
            updatePromptTags();
        }
        
        // === 提示词标签预览 ===
        let PRESET_I18N_MAP = null;
        let PRESET_NAME_TO_ID = null;  // 中文名 → 预设 id，供 cn/en 切换反查用
        let PRESET_CN_TO_EN = null;    // i18n 反向：中文 token → 英文 token（供 lightbox 还原"翻译前英文"用）

        function loadPresetI18n() {
            if (PRESET_I18N_MAP !== null && PRESET_NAME_TO_ID !== null && PRESET_CN_TO_EN !== null) {
                return Promise.resolve(PRESET_I18N_MAP);
            }
            return Promise.all([
                fetch('/api/preset-i18n').then(r => r.json()),
                fetch('/api/preset-bidir').then(r => r.json())
            ]).then(([i18n, bidir]) => {
                PRESET_I18N_MAP = i18n || {};
                PRESET_NAME_TO_ID = (bidir && bidir.name_to_id) || {};
                // 构建反向 i18n 表：中文 → 英文 key
                const cn2en = {};
                Object.keys(PRESET_I18N_MAP).forEach(k => {
                    const cn = PRESET_I18N_MAP[k];
                    if (cn && !cn2en[cn]) cn2en[cn] = k;
                });
                // 预设名（中文） → 预设 id（id 本身是英文） 也并入
                if (bidir && bidir.id_to_name) {
                    Object.keys(bidir.id_to_name).forEach(id => {
                        const cn = bidir.id_to_name[id];
                        if (cn && !cn2en[cn]) cn2en[cn] = id;
                    });
                }
                PRESET_CN_TO_EN = cn2en;
                return PRESET_I18N_MAP;
            }).catch(e => { PRESET_I18N_MAP = {}; PRESET_NAME_TO_ID = {}; PRESET_CN_TO_EN = {}; return PRESET_I18N_MAP; });
        }

        // 把整段 prompt 翻译成中文（按 token 拆分，独立映射），未命中的 token 保持原文
        function translatePromptToCn(prompt) {
            if (!prompt) return '';
            const i18n = PRESET_I18N_MAP || {};
            return prompt.split(PROMPT_TAG_SPLITTER).map(p => p.trim()).filter(Boolean).map(token => {
                if (hasChinese(token)) {
                    // 中文 token 优先查预设双向表（精准反查预设原 id），其余保留中文
                    if (PRESET_NAME_TO_ID && PRESET_NAME_TO_ID[token]) {
                        // 已是预设中文名，保留
                        return token;
                    }
                    return token;
                }
                const key = normalizePresetKey(token);
                return i18n[key] || token;
            }).join(', ');
        }

        // 把 prompt 还原成"原始英文"形式：把中文 token 通过反向 i18n/预设表替换回英文
        // 用于在 lightbox 第二行展示"翻译前的英文 prompt"
        function translatePromptToEn(prompt) {
            if (!prompt) return '';
            const cn2en = PRESET_CN_TO_EN || {};
            return prompt.split(PROMPT_TAG_SPLITTER).map(p => p.trim()).filter(Boolean).map(token => {
                if (hasChinese(token)) {
                    // 优先预设名（精准），再回退到 i18n 反向表
                    if (PRESET_NAME_TO_ID && PRESET_NAME_TO_ID[token]) return PRESET_NAME_TO_ID[token];
                    if (cn2en[token]) return cn2en[token];
                }
                return token;
            }).join(', ');
        }

        // 把英文 token 归一化为 i18n 的 key
        function normalizePresetKey(token) {
            return token.toLowerCase()
                .replace(/[^a-z0-9]+/g, '_')
                .replace(/^_+|_+$/g, '');
        }

        function presetI18nText(token) {
            if (!PRESET_I18N_MAP) return null;
            const key = normalizePresetKey(token);
            const hit = PRESET_I18N_MAP[key] || null;
            return hit;
        }

        // 是否包含中文字符
        function hasChinese(s) {
            return /[\u4e00-\u9fa5]/.test(s);
        }

        // 全局：标签显示模式 'cn' (默认) / 'en'
        window.PROMPT_TAGS_LANG_MODE = window.PROMPT_TAGS_LANG_MODE || 'cn';

        // 切换中英文显示模式
        function togglePromptLang() {
            window.PROMPT_TAGS_LANG_MODE = window.PROMPT_TAGS_LANG_MODE === 'en' ? 'cn' : 'en';
            updatePromptTags();
        }

        // 渲染单个 tag 的最终显示文本
        // - 英文模式：含中文 token 通过 PRESET_NAME_TO_ID 反查预设 id；其余显示原文
        // - 中文模式：含中文直接显示；纯英文查 i18n
        function resolveTagDisplay(token) {
            const mode = window.PROMPT_TAGS_LANG_MODE;
            if (mode === 'en') {
                if (hasChinese(token)) {
                    if (PRESET_NAME_TO_ID && PRESET_NAME_TO_ID[token]) {
                        return { display: PRESET_NAME_TO_ID[token], original: token };
                    }
                    return { display: token, original: null };
                }
                return { display: token, original: null };
            }
            // cn 模式
            if (hasChinese(token)) return { display: token, original: null };
            // 先尝试直接匹配 i18n
            const cn = presetI18nText(token);
            if (cn) return { display: cn, original: token };
            // 尝试通过预设的 prompt 查找中文名（使用 name 字段）
            if (typeof presetPickerData !== 'undefined' && presetPickerData.categories) {
                for (const cat of presetPickerData.categories) {
                    if (cat.subcategories) {
                        for (const sub of cat.subcategories) {
                            if (sub.presets) {
                                for (const p of sub.presets) {
                                    if (p.prompt && p.prompt.trim() === token.trim()) {
                                        // 优先使用 name 字段（如果有中文）
                                        if (p.name && hasChinese(p.name)) {
                                            return { display: p.name, original: token };
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }
            return { display: token, original: null };
        }

        let promptTagsExpanded = false;
        function togglePromptTags() {
            const tags = document.getElementById('promptTags');
            const text = document.getElementById('promptTagsToggleText');
            const icon = document.getElementById('promptTagsToggleIcon');
            if (!tags) return;
            promptTagsExpanded = !promptTagsExpanded;
            tags.style.maxHeight = promptTagsExpanded ? '200px' : '80px';
            if (text) text.textContent = promptTagsExpanded ? '收起' : '展开';
            if (icon) icon.style.transform = promptTagsExpanded ? 'rotate(180deg)' : '';
        }

        function updatePromptTags() {
            const promptInput = document.getElementById('prompt');
            const tagsContainer = document.getElementById('promptTags');
            if (!promptInput || !tagsContainer) return;

            // 同步翻译按钮语言色（中文=红 / 英文=蓝）
            const tBtn = document.getElementById('translateBtn');
            if (tBtn) {
                const hasCn = /[\u4e00-\u9fa5]/.test(promptInput.value);
                tBtn.setAttribute('data-lang', hasCn ? 'cn' : 'en');
            }

            // 显示/隐藏清空按钮
            const hasText = !!promptInput.value.trim();
            const clearBtn = document.getElementById('clearPromptBtn');
            if (clearBtn) clearBtn.style.display = hasText ? 'flex' : 'none';
            // 翻译按键：有内容时才显示
            if (tBtn) tBtn.style.display = hasText ? 'inline-flex' : 'none';

            // i18n 还没加载好时，等加载完再渲染（避免首屏预设应用时显示原文）
            if (PRESET_I18N_MAP === null) {
                loadPresetI18n().then(() => updatePromptTags());

            }

            // 智能分拆：按逗号分拆后，尝试合并连续 token 还原多词预设，保持原始顺序
            const raw = promptInput.value;
            const simpleTokens = raw.split(PROMPT_TAG_SPLITTER).map(p => p.trim()).filter(p => p);
            const parts = [];

            // 使用懒加载预设 prompt 索引（仅含多词预设）
            const presetPromptSet = getPresetPromptSet();

            // 贪心合并：从左到右扫描 token，尝试将连续 token 组合成已知预设
            let i = 0;
            while (i < simpleTokens.length) {

                for (let len = Math.min(8, simpleTokens.length - i); len >= 2; len--) {

                    if (presetPromptSet.has(candidate)) {

                    html += '<span class="prompt-tag-anima prompt-tag-lora prompt-tag-drag" ' + dd + ' data-tag-type="lora" data-tag-name="' + part.replace(/"/g, '&quot;') + '" style="display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:rgba(255,140,50,0.3);color:#fff;border:1px solid rgba(255,140,50,0.4);cursor:grab;">' + part + '<button onclick="event.stopPropagation();removePromptTag(\'' + safePart + '\')" style="margin-left:2px;background:none;border:none;color:inherit;cursor:pointer;padding:0;font-size:14px;line-height:1;opacity:0.7;">&times;</button></span>';

        // === Tag drag-and-drop reorder (live preview, simplified) ===
        let _dragState = null; // { fromIdx, tags: [...], promptOriginal }
        
        function _mergePresetsForDrag(tokens) {
            // 使用懒加载预设 prompt 索引（避免每次拖拽都重建 3w+ 预设的 Map）
            const presetPromptSet = getPresetPromptSet();
            const merged = [];
            let i = 0;
            while (i < tokens.length) {
                let matched = false;
                for (let len = Math.min(8, tokens.length - i); len >= 2; len--) {
                    const candidate = tokens.slice(i, i + len).join(', ');
                    if (presetPromptSet.has(candidate)) { merged.push(candidate); i += len; matched = true; break; }
                }
                if (!matched) { merged.push(tokens[i]); i++; }
            }
            return merged;
        }
        
        const _TAG_STYLE_ID = 'prompt-tag-drag-css';
        if (!document.getElementById(_TAG_STYLE_ID)) {
            var _ds = document.createElement('style');
            _ds.id = _TAG_STYLE_ID;
            _ds.textContent = '.prompt-tag-dragging{opacity:0.25!important;transform:scale(0.92)!important}' +
                '.prompt-tag-drop-left{box-shadow:-3px 0 0 0 #a855f7!important}' +
                '.prompt-tag-drop-right{box-shadow:3px 0 0 0 #a855f7!important}' +

        function _clearDragVisuals() {
            document.querySelectorAll('.prompt-tag-dragging,.prompt-tag-drop-left,.prompt-tag-drop-right').forEach(el => {
                el.classList.remove('prompt-tag-dragging', 'prompt-tag-drop-left', 'prompt-tag-drop-right');
            });
        }
        
        function promptTagDragStart(e) {
            const el = e.target.closest('[data-idx]');
            if (!el) return;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', '');
            const fromIdx = parseInt(el.dataset.idx);
            const promptInput = document.getElementById('prompt');
            if (!promptInput) return;
            const tokens = promptInput.value.split(PROMPT_TAG_SPLITTER).map(p => p.trim()).filter(p => p);
            const tags = _mergePresetsForDrag(tokens);
            _dragState = { fromIdx, tags, promptOriginal: promptInput.value, lastOverIdx: -1, lastSide: '' };
            // Mark original as dragging
            el.classList.add('prompt-tag-dragging');
        }
        
        function promptTagDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            if (!_dragState) return;
            // Find closest tag by scanning all tags (more forgiving than e.target.closest)
            const allTags = document.querySelectorAll('#promptTags [data-idx]');
            if (!allTags.length) return;
            let closestEl = null, closestDist = Infinity;
            allTags.forEach(tag => {
                const rect = tag.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const dist = Math.abs(e.clientX - cx) + Math.abs(e.clientY - cy) * 0.5;
                if (dist < closestDist) { closestDist = dist; closestEl = tag; }
            });
            if (!closestEl || closestDist > 200) return;
            const overIdx = parseInt(closestEl.dataset.idx);
            const rect = closestEl.getBoundingClientRect();
            const side = e.clientX < rect.left + rect.width / 2 ? 'left' : 'right';
            if (overIdx === _dragState.lastOverIdx && side === _dragState.lastSide) return;
            _dragState.lastOverIdx = overIdx;
            _dragState.lastSide = side;
            document.querySelectorAll('.prompt-tag-drop-left,.prompt-tag-drop-right').forEach(s => s.classList.remove('prompt-tag-drop-left', 'prompt-tag-drop-right'));
            if (overIdx !== _dragState.fromIdx) {
                closestEl.classList.add(side === 'left' ? 'prompt-tag-drop-left' : 'prompt-tag-drop-right');
            }
        }
        
        function promptTagDrop(e) {
            e.preventDefault();
            if (!_dragState) return;
            // Find target same way as dragOver
            const allTags = document.querySelectorAll('#promptTags [data-idx]');
            if (!allTags.length) return;
            let closestEl = null, closestDist = Infinity;
            allTags.forEach(tag => {
                const rect = tag.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const dist = Math.abs(e.clientX - cx) + Math.abs(e.clientY - cy) * 0.5;
                if (dist < closestDist) { closestDist = dist; closestEl = tag; }
            });
            if (!closestEl) return;
            const toIdx = parseInt(closestEl.dataset.idx);
            const promptInput = document.getElementById('prompt');
            if (!promptInput) return;
            const tags = [..._dragState.tags];
            const [moved] = tags.splice(_dragState.fromIdx, 1);
            const rect = closestEl.getBoundingClientRect();
            const insertIdx = e.clientX < rect.left + rect.width / 2 ? toIdx : toIdx + 1;
            const adjustedIdx = _dragState.fromIdx < insertIdx ? insertIdx - 1 : insertIdx;
            tags.splice(adjustedIdx, 0, moved);
            promptInput.value = tags.join(', ');
            const droppedIdx = adjustedIdx;
            _dragState = null;
            _clearDragVisuals();
            updatePromptTags();
            requestAnimationFrame(() => {
                const dropped = document.querySelector('[data-idx="' + droppedIdx + '"]');
                if (dropped) {
                    dropped.classList.add('prompt-tag-just-dropped');
                    dropped.addEventListener('animationend', () => dropped.classList.remove('prompt-tag-just-dropped'), { once: true });
                }
            });
        }
        
        function promptTagDragEnd(e) {
            if (_dragState) {
                // Revert
                const promptInput = document.getElementById('prompt');
                if (promptInput) {
                    promptInput.value = _dragState.promptOriginal;
                    updatePromptTags();
                }
            }
            _clearDragVisuals();
            _dragState = null;
        }

        function buildAnimaTagThumbUrl(type, name) {
            if (type === 'artist') {
                if (typeof ANIMA_ARTIST_DB === 'undefined' || !ANIMA_ARTIST_DB.length) return '';
                const item = ANIMA_ARTIST_DB.find(a => a.name && a.name.toLowerCase() === name.toLowerCase());
                return (item && item.image_url) ? item.image_url : '';
            }
            if (type === 'char') {
                if (typeof ANIMA_CHAR_DB === 'undefined' || !ANIMA_CHAR_DB.length) return '';
                const item = ANIMA_CHAR_DB.find(c => c.name && c.name.toLowerCase() === name.toLowerCase());
                if (!item) return '';
                if (item.thumb_url) return item.thumb_url;
                const raw = item.trigger || (item.copyright ? item.name + ', ' + item.copyright : item.name);
                const encoded = encodeURIComponent(raw).replace(/%28/g, '(').replace(/%29/g, ')');
                return 'https://blobs.animadex.net/Outputs/thumbs/' + encoded + '.webp';
            }
            if (type === 'lora') {
                const lowerName = name.toLowerCase().replace(/^@/, '');
                // 1) 优先用 triggerWordMap 快速查找（O(1)）
                if (typeof loraState !== 'undefined' && loraState && loraState.triggerWordMap && loraState.triggerWordMap[lowerName]) {
                    return loraState.triggerWordMap[lowerName].preview || '';
                }
                // 2) 回退：遍历 loraMap 按触发词或 displayName/文件名匹配
                if (typeof loraState !== 'undefined' && loraState && loraState.loraMap) {
                    for (const key of Object.keys(loraState.loraMap)) {
                        const entry = loraState.loraMap[key];
                        if (!entry) continue;
                        // 按触发词匹配
                        const tw = entry.triggerWords || [];
                        if (tw.some(w => String(w).toLowerCase().replace(/^@/, '') === lowerName)) {
                            return entry.preview || '';
                        }
                        // 按 displayName 或文件名匹配（兜底：没有触发词的 LoRA）
                        const dn = (entry.displayName || '').toLowerCase();
                        const fn = key.split('/').pop().replace(/\.safetensors$/i, '').toLowerCase();
                        if (dn === lowerName || fn === lowerName) {
                            return entry.preview || '';
                        }
                    }
                }
                return '';
            }
            return '';
        }

        let animaTagPreviewEl = null;

        function _isLoraFallbackTag(tagLower) {
            if (!tagLower || !loraState || !loraState.loraMap) return false;
            for (const key of Object.keys(loraState.loraMap)) {
                const entry = loraState.loraMap[key];
                if (!entry) continue;
                // 1) 按触发词匹配（不管有没有 @ 前缀都能命中）
                const tw = entry.triggerWords || [];
                if (tw.some(w => String(w).toLowerCase().replace(/^@/, '') === tagLower)) return true;

                const dn = (entry.displayName || key.split('/').pop().replace(/\.safetensors$/i, '')).toLowerCase();

        // LoRA 预览滑块：全局 handler（避免内联引号转义问题）

        // 根据触发词查找对应的活跃 LoRA 条目（返回 {index, entry} 或 null）
        function _findActiveLoraByTrigger(triggerName) {
            if (!triggerName || !loraState) return null;
            const lower = triggerName.toLowerCase().replace(/^@/, '');
            // 优先查 loraState.active（有强度信息）
            if (loraState.active) {
                for (let i = 0; i < loraState.active.length; i++) {
                    const a = loraState.active[i];
                    if (!a || !a.name) continue;
                    const meta = loraState.loraMap && loraState.loraMap[a.name];
                    if (!meta) continue;
                    const tw = meta.triggerWords || [];
                    if (tw.some(w => String(w).toLowerCase().replace(/^@/, '') === lower)) {
                        return { index: i, entry: a, meta: meta };
                    }
                    const dn = (meta.displayName || '').toLowerCase();
                    const fn = a.name.split('/').pop().replace(/\.safetensors$/i, '').toLowerCase();
                    if (dn === lower || fn === lower) {
                        return { index: i, entry: a, meta: meta };
                    }
                }
            }
            // 回退：查 loraState.loraMap 全量（未加入 active 的也能找到）
            if (loraState.loraMap) {
                for (const key of Object.keys(loraState.loraMap)) {
                    const entry = loraState.loraMap[key];
                    if (!entry) continue;
                    const tw = entry.triggerWords || [];
                    if (tw.some(w => String(w).toLowerCase().replace(/^@/, '') === lower)) {
                        return { index: -1, entry: { name: key, strength: 0.8 }, meta: entry };
                    }
                    const dn = (entry.displayName || '').toLowerCase();
                    const fn = key.split('/').pop().replace(/\.safetensors$/i, '').toLowerCase();
                    if (dn === lower || fn === lower) {
                        return { index: -1, entry: { name: key, strength: 0.8 }, meta: entry };
                    }
                }
            }
            return null;
        }

        // === 进度条 ===

        // 每张卡片独立的计时器数据
        const _progressTimers = new Map();
        function _formatElapsed(ms) {
            const s = Math.floor(ms / 1000);
            const m = Math.floor(s / 60);
            return m > 0 ? m + 'm' + (s % 60) + 's' : s + 's';
        }
        function _clearProgressTimer(card) {
            if (_progressTimers.has(card)) {
                clearInterval(_progressTimers.get(card).timer);
                _progressTimers.delete(card);
            }
        }
        function _startProgressTimer(card, prefix) {
            _clearProgressTimer(card);
            const start = Date.now();
            const state = { timer: null, start };
            // 环形中间固定显示百分比（初始 0%），下方文字显示 "排队中 5s"
            const label = card.querySelector('.card-progress-label');
            const pctEl2 = card.querySelector('.card-progress-pct');
            if (pctEl2) { pctEl2.style.visibility = 'visible'; pctEl2.textContent = '0%'; }
            if (label) label.textContent = prefix + ' ' + _formatElapsed(0);
            state.timer = setInterval(() => {
                const elapsed = Date.now() - start;
                const l = card.querySelector('.card-progress-label');
                if (l) l.textContent = prefix + ' ' + _formatElapsed(elapsed);
            }, 1000);
            _progressTimers.set(card, state);
        }
        function updateCardProgress(card, status) {
            if (!card) return;
            const label = card.querySelector('.card-progress-label');
            const pctEl = card.querySelector('.card-progress-pct');
            const outer = card.querySelector('.pg-ring-outer');
            const inner = card.querySelector('.pg-ring-inner');
            if (!label) return;
            if (status.status === 'started' || status.status === 'executing') {
                // 环形中间：百分比（初始 0%）；下方文字：排队中/执行中 + 经过时间
                if (pctEl) pctEl.style.visibility = 'visible';
                const prefix = status.status === 'started' ? '排队中' : '执行中';
                _startProgressTimer(card, prefix);
            } else if (status.status === 'sampling') {
                _clearProgressTimer(card);
                const v = status.value || 0, m = status.max || 1;
                const p = Math.round((v / m) * 100);
                if (pctEl) { pctEl.style.visibility = 'visible'; pctEl.textContent = p + '%'; }
                const speed = Math.max(0.3, 1 - p * 0.007);
                if (outer) outer.style.animationDuration = speed + 's';
                if (inner) inner.style.animationDuration = (speed * 0.6) + 's';
                label.textContent = '采样 ' + v + '/' + m;
            } else if (status.status === 'done') {
                _clearProgressTimer(card);
                if (pctEl) { pctEl.style.visibility = 'visible'; pctEl.textContent = '95%'; }
                label.textContent = '解码中...';
            } else if (status.status === 'complete') {
                _clearProgressTimer(card);
                // 呼吸动画：缓慢旋转 + 透明度脉冲
                if (outer) { outer.style.animation = 'breathSpin 3s ease-in-out infinite'; outer.style.borderColor = '#8b5cf6'; }
                if (inner) { inner.style.animation = 'breathSpin 3s ease-in-out infinite reverse'; inner.style.borderColor = '#06b6d4'; }
                if (pctEl) { pctEl.style.visibility = 'visible'; pctEl.textContent = '100%'; }
                label.textContent = '完成!';
                label.style.color = '#8b5cf6';
            }
        }

        // === 主渲染逻辑 ===
        async function handleRender() {
            // 随机功能：如果 🎲 开关已开启，每次生成前自动应用激活方案
            if (typeof RandomPrompt !== 'undefined' && RandomPrompt.isRandomEnabled()) {
                const randomResult = await RandomPrompt.applyAutoRandom();
                if (randomResult && randomResult.positive) {
                    const promptEl = document.getElementById('prompt');
                    // 替换提示词（而不是追加）
                    promptEl.value = randomResult.positive;
                    promptEl.dispatchEvent(new Event('input'));
                    // LoRA：必须等 prompt 框被新 positive 覆盖后再调，否则触发词会被覆盖
                    if (randomResult.plan && randomResult.plan.loras) {
                        RandomPrompt.applyLoras(randomResult.plan.loras);
                    }
                }
            }
            
            const prompt = document.getElementById('prompt').value.trim();
            if (!prompt) return alert("请输入提示词");

            // 按当前生成分辨率设置 placeholder 宽高比，过渡时无尺寸跳变
            const _aspectSize = getAnimaSize();
