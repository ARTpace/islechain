    <script>
        lucide.createIcons();

        function generateUUID() {

            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16); });

        const CLIENT_ID = localStorage.getItem("client_id") || generateUUID();

        // ── LoRA 管理器兼容别名（替换旧的内联 LoRA 代码） ──

            // ── LoRA 激活栏渲染 ──
            window.renderLoraActiveBar = function() {
                var bar = document.getElementById('loraActiveBar');
                if (!bar) return;
                var active = (loraState && loraState.active) || [];
                if (active.length === 0) { bar.style.display = 'none'; bar.innerHTML = ''; return; }
                bar.style.display = '';
                var base = (typeof currentWorkflow !== 'undefined' && currentWorkflow) ? currentWorkflow : '';
                var htmls = [];
                active.forEach(function(item, idx) {
                var name = item.name || '';
                var strength = (item.strength || 0.8).toFixed(2);
                // 优先用 item.preview；其次从 loraMap 取(selected 可能未带 preview)；
                // 都没有则显示占位图,绝不请求后端不存在的 /loras/preview 路由(404 会隐藏缩略图)
                var previewUrl = item.preview || '';
                if (!previewUrl && name && loraState && loraState.loraMap && loraState.loraMap[name] && loraState.loraMap[name].preview) {
                    previewUrl = loraState.loraMap[name].preview;
                }
                var isOn = item.disabled !== true;
                var cls = isOn ? '' : ' lac-disabled';
                // 显示名去掉 loras/ 路径前缀
                var baseName = name.split(/[/\\]/).pop();
                htmls.push('<span class="lac-card' + cls + '" data-name="' + baseName.replace(/"/g,'&quot;') + '">');
                // 操作按钮放在缩略图内部上方(覆盖图片上沿,与中央强度数字垂直分离不重叠)
                var actionsHtml = '<span class="lac-actions-top">'
                    + '<button class="lac-action-btn lac-action-toggle' + (isOn ? ' lac-toggle-on' : '') + '" onclick="loraManagerToggle(' + idx + ')" title="' + (isOn ? '已启用，点击禁用' : '已禁用，点击启用') + '">' + (isOn ? '✓' : '○') + '</button>'
                    + '<button class="lac-action-btn lac-action-remove" onclick="loraManagerRemove(' + idx + ')" title="移除">×</button>'
                    + '</span>';
                if (previewUrl) {
                    htmls.push('<span class="lac-cover"><img src="' + previewUrl + '" alt="" loading="lazy" onerror="this.style.display=\'none\';this.parentNode.classList.add(\'lac-cover-empty\')"><span class="lac-strength-badge" id="lacStrengthBadge' + idx + '"></span>' + actionsHtml + '<span class="lac-slider-inner"><input type="range" min="0" max="2" step="0.05" value="' + strength + '" class="lac-slider" oninput="loraManagerSetStrength(' + idx + ',this.value)" onpointerup="loraManagerHideStrength(' + idx + ')" ontouchend="loraManagerHideStrength(' + idx + ')" onchange="loraManagerHideStrength(' + idx + ')"></span></span>');
                } else {
                    var _initial = ((baseName[0]) || 'L').toUpperCase();
                    htmls.push('<span class="lac-cover lac-cover-empty"><span class="lac-cover-ph">' + _initial + '</span><span class="lac-strength-badge" id="lacStrengthBadge' + idx + '"></span>' + actionsHtml + '<span class="lac-slider-inner"><input type="range" min="0" max="2" step="0.05" value="' + strength + '" class="lac-slider" oninput="loraManagerSetStrength(' + idx + ',this.value)" onpointerup="loraManagerHideStrength(' + idx + ')" ontouchend="loraManagerHideStrength(' + idx + ')" onchange="loraManagerHideStrength(' + idx + ')"></span></span>');
                }
                    // 名称仅在悬停时显示(见 .lac-hover-name),默认不展示
                    htmls.push('<span class="lac-hover-name">' + baseName.replace(/</g,'&lt;') + '</span>');
                    // 滑条已移到缩略图内部,此处不再需要
                    htmls.push('</span>');
                });
                bar.innerHTML = htmls.join('');
            };
            window._lacStrengthTimers = {};
            window.loraManagerSetStrength = function(idx, val) {
                if (loraState && loraState.active && loraState.active[idx]) {
                    loraState.active[idx].strength = parseFloat(val);
                    saveLoraConfig();
                }
                // 拖动时在缩略图上浮层显示强度数值
                var badge = document.getElementById('lacStrengthBadge' + idx);
                if (badge) {
                    badge.textContent = parseFloat(val).toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
                    badge.classList.add('show');
                    // 拖动期间隐藏左右按钮,避免遮挡中央数字
                    var _card = badge.closest('.lac-card');
                    if (_card) _card.classList.add('lac-dragging');
                }
                if (window._lacStrengthTimers[idx]) clearTimeout(window._lacStrengthTimers[idx]);
            };
            // 调节结束(松手)后短暂延时隐藏强度浮层
            window.loraManagerHideStrength = function(idx) {
                if (window._lacStrengthTimers[idx]) clearTimeout(window._lacStrengthTimers[idx]);
                window._lacStrengthTimers[idx] = setTimeout(function() {
                    var badge = document.getElementById('lacStrengthBadge' + idx);
                    if (badge) {
                        badge.classList.remove('show');
                        var _card = badge.closest('.lac-card');

            };
            window.loraManagerRemove = function(idx) {
                if (loraState && loraState.active && loraState.active.length > idx) {
                    loraState.active.splice(idx, 1);
                    saveLoraConfig();
                    renderLoraActiveBar();
                    updateLoraSwitcherVisibility();
                    if (typeof updatePickerButtonsHighlight === 'function') updatePickerButtonsHighlight();
                }
            };
            window.loraManagerToggle = function(idx) {
                if (loraState && loraState.active && loraState.active[idx]) {
                    var item = loraState.active[idx];
                    item.disabled = !item.disabled;
                    saveLoraConfig();
                    renderLoraActiveBar();
                }
            };
            // 初始化时渲染一次
            setTimeout(function(){ if (typeof renderLoraActiveBar === 'function') renderLoraActiveBar(); }, 100);
        }

        // ── PromptTags 可见性开关 ──
        window.promptTagsVisible = localStorage.getItem('prompt_tags_visible') !== 'false'; // 默认开启
        function togglePromptTagsVisibility() {

        // ── PromptTags 管理器兼容别名 ──
        if (typeof PromptTags !== 'undefined') {
            PromptTags.init();

            var togglePromptLang = () => PromptTags.toggleLang();
            var togglePromptTags = () => PromptTags.toggleExpand();

            var hideAnimaTagPreview = () => PromptTags.hidePreview();
            var _cancelHidePreview = () => PromptTags.cancelHidePreview();
            var buildAnimaTagThumbUrl = (t, n) => PromptTags.buildThumbUrl ? PromptTags.buildThumbUrl(t, n) : '';
            var _isLoraFallbackTag = (t) => PromptTags.isLoraFallbackTag ? PromptTags.isLoraFallbackTag(t) : false;
            var _findActiveLoraByTrigger = (t) => PromptTags.findActiveLoraByTrigger ? PromptTags.findActiveLoraByTrigger(t) : null;
            var _onLoraPreviewStrength = (el, i) => PromptTags.onLoraStrength(el, i);
            window.updatePromptTags = updatePromptTags;

        // 初始化提示词标签开关按钮状态
        (function initTagsSwitch() {
            const sw = document.getElementById('promptTagsSwitch');
            if (sw) sw.classList.toggle('active', window.promptTagsVisible);
        })();

        // === 通用工具函数（纯函数，无副作用） ===
        // - splitPrompt(text)             : 把提示词按逗号拆成 token 数组（trim + 过滤空）
        // - setPickerButtonState(btn, n, label)
        //                                   根据已选数量 n 设置按钮高亮 + 角标文案
        // - promptHasArtistToken(parts)  : 判断 parts 中是否含 @xxx / by xxx 风格的画师 token
        // - extractArtistName(token)     : 从 @xxx / by xxx 中提取画师名（无前缀则返回 null）
        // - safeDbAvailable(name)        : 延迟安全检查全局 DB 是否已加载
        // 注：以下函数都是无副作用的纯函数，专门用于消解 updatePickerButtonsHighlight / syncPickerStatesFromPrompt 内的重复样板
        function splitPrompt(text) {
            if (!text) return [];
            return text.split(',').map(p => p.trim()).filter(Boolean);
        }
        function setPickerButtonState(btnId, textId, count, baseLabel) {
            const btn = document.getElementById(btnId);
            const txt = document.getElementById(textId);
            if (!btn) return;
            if (count > 0) btn.classList.add('is-in-use');
            else btn.classList.remove('is-in-use');
            if (txt) txt.textContent = count > 0 ? `${baseLabel}(${count})` : baseLabel;
        }
        function promptHasArtistToken(token) {
            if (!token) return false;
            return token.startsWith('@') || token.startsWith('by ');
        }
        function extractArtistName(token) {
            if (!token) return null;
            if (token.startsWith('@')) return token.substring(1).trim();
            if (token.startsWith('by ')) return token.substring(3).trim();
            return null;
        }
        function safeDbAvailable(name) {
            // 注：本函数已弃用。原实现用 window[name] 查 let 声明的全局变量永远返回 false，
            // 导致 getCharIndex 锁死空缓存。已替换为 _readDb()（依赖 picker 脚本主动挂到 window）。
            // 保留定义仅为兼容外部脚本（lora-picker.js 等）可能的引用。
            try {
                const v = (typeof window !== 'undefined') ? window[name] : undefined;
                return Array.isArray(v) && v.length > 0;
            } catch (_) { return false; }
        }

        // === 额外负面提示词 ===
        function toggleExtraNegative() {
            const panel = document.getElementById('extraNegPanel');
            const btn = document.getElementById('extraNegToggle');
            const ta = document.getElementById('extraNegativePrompt');
            const isOpen = panel.classList.toggle('show');
            btn.classList.toggle('active', isOpen);
            if (isOpen) ta.focus();
        }

        function mergeExtraNegative(workflow, extraText) {
            if (!extraText) {
                console.log('[NegPrompt] 无额外负面提示词，跳过');
                return;
            }
            console.log('[NegPrompt] 用户额外负面提示词: ', JSON.stringify(extraText));

            // Step 1: 找到所有 KSampler/KSamplerAdvanced → negative 引用
            const pairs = []; // { samplerNid, samplerNode, negNid, negNode }
            for (const nid in workflow) {
                const node = workflow[nid];
                if (!node || !node.inputs) continue;
                const ct = node.class_type || '';
                if (ct === 'KSampler' || ct === 'KSamplerAdvanced') {
                    const negRef = node.inputs.negative;
                    if (Array.isArray(negRef) && negRef.length === 2) {
                        const negNid = String(negRef[0]);
                        const negNode = workflow[negNid];
                        pairs.push({ samplerNid: nid, samplerNode: node, negNid, negNode });
                        console.log('[NegPrompt] ', ct, nid, '→ negative 节点', negNid, '类型:', negNode ? negNode.class_type : 'MISSING');
                    }
                }
            }

            if (pairs.length === 0) {
                console.warn('[NegPrompt] 工作流中未找到任何 KSampler/KSamplerAdvanced — 无法注入负面提示词');
                return;
            }

            // Step 2: 逐对处理（原地修改，无需新增节点，节点ID不变）
            for (const { samplerNid, samplerNode, negNid, negNode } of pairs) {
                if (!negNode) {
                    console.warn('[NegPrompt] KSampler', samplerNid, '的 negative 节点', negNid, '不存在于工作流中');
                    continue;
                }

                if (negNode.class_type === 'CLIPTextEncode') {
                    // 已有 CLIPTextEncode（ANIMA 节点12）— 直接追加
                    const oldText = (negNode.inputs.text || '').trim();
                    const separator = oldText ? ', ' : '';
                    negNode.inputs.text = oldText + separator + extraText;
                    console.log('[NegPrompt] KSampler', samplerNid, '→ CLIPTextEncode', negNid, '追加负面');
                } else {
                    console.warn('[NegPrompt] KSampler', samplerNid, 'negative 节点', negNid,
                        '类型为', negNode.class_type, '— 非 CLIPTextEncode，跳过');
                }
            }

            // Step 3: 最终验证 — 遍历所有 KSampler，打印最终 negative text
            console.groupCollapsed('[NegPrompt] 最终验证: 所有 KSampler 的 negative 文本');
            for (const nid in workflow) {
                const node = workflow[nid];
                if (!node || !node.inputs) continue;
                const ct = node.class_type || '';
                if (ct === 'KSampler' || ct === 'KSamplerAdvanced') {
                    const negRef = node.inputs.negative;
                    if (Array.isArray(negRef) && negRef.length === 2) {
                        const finalNegNode = workflow[String(negRef[0])];
                        const finalText = (finalNegNode && finalNegNode.class_type === 'CLIPTextEncode')
                            ? (finalNegNode.inputs.text || '')
                            : '(非CLIPTextEncode)';
                        console.log('  KSampler', nid, '→', String(negRef[0]), ':', JSON.stringify(finalText));
                    }
                }
            }
            console.groupEnd();
        }

        // === DB 索引（懒加载单例） — 当前未使用 ===
        // 历史问题：原实现走 safeDbAvailable → window[name] 查 let 声明的全局变量永远失败，
        // 导致 getCharIndex 锁死空缓存，角色识别（紫色 tag + 缩略图）回归失效。
        // 现 updatePromptTags / updatePickerButtonsHighlight / syncPickerStatesFromPrompt
        // 全部改用"直接 typeof + 每次重建 Set"（对齐旧版本 C:\Users\ARTpace\Pictures\art-canvas），
        // 性能可接受（36k 元素 Set 重建约几毫秒，输入防抖 60ms 内不卡顿）。
        // 本套函数保留作为未来性能优化基础设施，但当前没有被任何调用点引用。
        function _readDb(name) {
            // 三个外部 picker 脚本（anima-character-picker.js / anima-artist-picker.js / preset-picker.js）
            // 在数据加载完后会同步挂到 window[name]，所以这里只读 window 即可。
            try {
                if (typeof window !== 'undefined') {
                    const v = window[name];
                    if (Array.isArray(v) && v.length > 0) return v;
                }
            } catch (_) {}
            return null;
        }
        let __charIndex = null;
        function getCharIndex() {
            const db = _readDb('ANIMA_CHAR_DB');
            // DB 还没就绪时绝不缓存空状态，否则首次空缓存会锁死
            if (!db) return { nameSet: new Set(), triggerSet: new Set(), triggerToName: new Map(), built: false, count: 0 };
            if (__charIndex && __charIndex.count === db.length) return __charIndex;
            const index = { nameSet: new Set(), triggerSet: new Set(), triggerToName: new Map(), built: false, count: 0 };
            db.forEach(c => {
                const name = (c.name || '').toLowerCase();
                if (name) index.nameSet.add(name);
                if (Array.isArray(c.triggers)) {
                    c.triggers.forEach(t => {
                        const tl = String(t).toLowerCase();
                        if (tl) {
                            index.triggerSet.add(tl);
                            if (name) index.triggerToName.set(tl, c.name);
                        }
                    });
                } else if (typeof c.trigger === 'string') {
                    const tl = c.trigger.toLowerCase();
                    if (tl) {
                        index.triggerSet.add(tl);
                        if (name) index.triggerToName.set(tl, c.name);
                    }
                }
            });
            index.built = true;
            index.count = db.length;
            __charIndex = index;
            return index;
        }
        function isCharToken(token) {
            if (!token) return false;
            if (promptHasArtistToken(token) || token.startsWith('[')) return false;
            const idx = getCharIndex();
            if (!idx.built) return false;
            const tl = token.toLowerCase();
            return idx.nameSet.has(tl) || idx.triggerSet.has(tl);
        }
        function findCharNameByTrigger(trigger) {
            if (!trigger) return null;
            return getCharIndex().triggerToName.get(trigger.toLowerCase()) || null;
        }

        let __artistIndex = null;
        function getArtistIndex() {
            const db = _readDb('ANIMA_ARTIST_DB');
            if (__artistIndex && db && __artistIndex.count === db.length) return __artistIndex;
            const index = { nameSet: new Set(), built: false, count: 0 };
            if (db) {
                db.forEach(a => {
                    const n = (a.name || '').toLowerCase();
                    if (n) index.nameSet.add(n);
                });
                index.built = true;
                index.count = db.length;
            }
            __artistIndex = index;
            return index;
        }
        function isArtistName(name) {
            if (!name) return false;
            return getArtistIndex().nameSet.has(name.toLowerCase());
        }
        function isArtistToken(token) {
            const n = extractArtistName(token);
            return n ? isArtistName(n) : false;
        }

        let __presetIndex = null;
        function getPresetIndex() {
            const db = _readDb('_flatIndex');
            if (!db) return { built: false, count: 0, byKey: new Map() };
            if (__presetIndex && __presetIndex.count === db.length) return __presetIndex;
            __presetIndex = { built: false, count: 0, byKey: new Map() };
            db.forEach(p => {
                if (!p) return;
                const key = (p.category_id || p.category || '') + ':' + (p.id || p.name);
                __presetIndex.byKey.set(key, p);
            });
            __presetIndex.built = true;
            __presetIndex.count = db.length;
            return __presetIndex;
        }
        // 预设在 prompt 中是否被命中（按预设 name 或预设 prompt 字符串匹配）
        function isPresetMatched(lowerSet, preset) {
            if (!preset) return null;
            const name = (preset.name || '').toLowerCase();
            const prompt = (preset.prompt || '').toLowerCase();
            if ((name && lowerSet.has(name)) || (prompt && lowerSet.has(prompt))) {
                return (preset.category_id || preset.category || '') + ':' + (preset.id || preset.name);
            }
            return null;
        }
        function invalidateDbIndexes() {
            __charIndex = null;
            __artistIndex = null;
            __presetIndex = null;

        let __presetPromptSet = null;
        function getPresetPromptSet() {

            try {
                if (typeof presetPickerData !== 'undefined' && presetPickerData && Array.isArray(presetPickerData.categories)) {
                    presetPickerData.categories.forEach(cat => {
                        if (!cat || !Array.isArray(cat.subcategories)) return;
                        cat.subcategories.forEach(sub => {
                            if (!sub || !Array.isArray(sub.presets)) return;
                            sub.presets.forEach(p => {
                                if (p && p.prompt && p.prompt.includes(',')) {

                                    if (k && !map.has(k)) map.set(k, p.id);

        let isGenerating = false;

        const COMFYUI_WS_URL = `${window.location.protocol==='https:'?'wss:':'ws:'}//${window.location.host}/api/comfyui/ws?client_id=${CLIENT_ID}`;

        // === 共享 WebSocket：实时进度分发 ===
        const _activeTasks = new Map(); // promptId → { card, onDone }
        let _sharedWs = null;
        let _wsReconnectTimer = null;
        function _ensureWs() {
            if (_sharedWs && _sharedWs.readyState === 1) return Promise.resolve();
            if (_sharedWs && _sharedWs.readyState === 0) return new Promise((r) => {
                _sharedWs.addEventListener('open', r, { once: true });
                setTimeout(r, 3000);
            });
            if (_wsReconnectTimer) { clearTimeout(_wsReconnectTimer); _wsReconnectTimer = null; }
            _sharedWs = null;
            return new Promise((resolve) => {
                try {
                    const ws = new WebSocket(COMFYUI_WS_URL);
                    _sharedWs = ws;
                    ws.onopen = () => resolve();
                    setTimeout(resolve, 3000);
                    ws.onmessage = (e) => {
                        try {
                            if (typeof e.data !== 'string') return;
                            const msg = JSON.parse(e.data);
                            const pid = msg.data?.prompt_id;
                            if (!pid) return;
                            const task = _activeTasks.get(pid);
                            if (!task) return;
                            if (msg.type === 'progress') {
                                CardProgress.update(task.card, { status: 'sampling', value: msg.data.value, max: msg.data.max });
                            } else if (msg.type === 'executing') {
                                if (msg.data.node === null) {
                                    CardProgress.update(task.card, { status: 'done' });
                                    if (task.onDone) task.onDone();
                                } else {
                                    CardProgress.update(task.card, { status: 'executing' });
                                }
                            } else if (msg.type === 'execution_start') {
                                CardProgress.update(task.card, { status: 'started' });
                            }
                        } catch(err) {}
                    };
                    ws.onclose = () => { _sharedWs = null; _wsReconnectTimer = setTimeout(_ensureWs, 2000); };
                    ws.onerror = () => {};
                } catch(e) { resolve(); }

        // 动态渲染模型菜单（从 BUILTIN_WF_META 推导）

        // === 内置工作流元数据（从后端动态加载） ===
        let BUILTIN_WF_META = [];  // [{name, title, has_unet, model_folder, unet_name}]
        // 暴露给独立模块（如 lora-manager），避免跨文件硬编码映射表

        // 元数据就绪后，重新同步依赖它的 UI：模型按钮文案 + LoRA 过滤

        async function loadBuiltinWorkflowMeta() {

                    {name:'text2image/anima.json', title:'ANIMA', has_unet:true, model_folder:'anima', model_folders:['Anima'], unet_name:''},
                    {name:'text2image/krea2-turbo.json', title:'Krea2', has_unet:true, model_folder:'Krea2', model_folders:['Krea 2'], unet_name:''},
                    {name:'text2image/ideogram4-structured.json', title:'Ideogram4 Structured', has_unet:true, model_folder:'ideogram4', model_folders:['ideogram4'], unet_name:''},

        // 根据工作流文件名查找元数据
        function _wfMeta(name) {
            // Boogu 动态变体：text2image/boogu-base.json / text2image/boogu-turbo.json
            const n = name || currentWorkflow;
            const direct = BUILTIN_WF_META.find(m => m.name === n);
            if (direct) return direct;
            // 前缀匹配（Boogu-xxx.json → 任何 Boogu 元数据）
            const prefix = n.split('/').pop().split('-')[0];

        // === 工作流切换 ===

        // === 当前工作流兼容的模型文件夹前缀列表 ===
        // 从后端元数据推导，不再硬编码
        function _compatModelPrefixes() {
            const meta = _wfMeta();
            if (meta && meta.model_folder) {
                return [meta.model_folder + '\\', meta.model_folder + '/'];
            }
            // 回退：尝试从 _wfCache 中的 unet_name 推导

            if (wf) {
                for (const nid in wf) {
                    const node = wf[nid];
                    if (!node || !node.inputs) continue;
                    const ct = node.class_type || '';
                    const unetField = ct === 'UNETLoader' ? node.inputs.unet_name : '';
                    if (!unetField) continue;
                    const sepIdx = Math.max(unetField.indexOf('\\'), unetField.indexOf('/'));
                    if (sepIdx > 0) {

        // === 模型选择面板（UNET 模型文件） ===

        function getCurrentWorkflowUnet() {
            if (selectedUnetModel) return selectedUnetModel;
            const saved = _getSavedUnetForWorkflow(currentWorkflow);
            if (saved) return saved;
            try {
                const wf = window._wfCache && window._wfCache[currentWorkflow];
                if (!wf) return '';
                for (const nid in wf) {
                    const node = wf[nid];
                    if (!node || !node.inputs) continue;
                    if (node.class_type === 'UNETLoader' && node.inputs.unet_name) {
                        return node.inputs.unet_name;
                    }
                    if (typeof node.class_type === 'string'
                        && node.class_type.includes('LoadDiffusionModel')
                        && node.inputs.model_name) {
                        return node.inputs.model_name;
                    }
                }
            } catch (e) {}
            return '';
        }

        // 规范化模型名：统一反斜杠 + 去尾部 .safetensors + 小写，用于跨平台匹配
        function _normModelName(n) {
            if (!n) return '';
            return String(n).replace(/\\/g, '/').replace(/\.safetensors$/i, '').toLowerCase();
        }
        // 规范化文件夹段：小写 + 去空格 + 反斜杠转正斜杠，用于跨平台 / 带空格文件夹前缀匹配。
        // ComfyUI 里 Krea2 权重可能存于 "Krea2" 或 "Krea 2" 文件夹，两种写法都要命中前缀。
        function _normFolderPart(s) {

        function _applySelectedUnet(wf) {

            for (const nid in wf) {
                const node = wf[nid];
                if (!node || !node.inputs) continue;
                if (node.class_type === 'UNETLoader' && node.inputs.unet_name !== undefined) {

        async function ensureWorkflowCached() {

        async function fetchUnetModels() {

        function getModelOptions() {

        // 作为 AssetLibrary 的 onApply 回调：把选中的资产图 URL 转成 File，加入参考图管理器
        function applyAssetToRef(url, name) {

        // ── prompt 输入框兼容层（textarea → contenteditable） ──
        // 让 ta.value 之类的老代码继续工作
        (function () {
            function sync(el) { el.textContent = el.textContent.replace(/`/g, ''); }
            function init() {
                var el = document.getElementById('prompt');
                if (!el || el._compatReady) return;
                el._compatReady = true;

                // 工具：从 prompt 中收集所有 ref chip（保留它们）
                function preserveChips() {
                    return Array.prototype.slice.call(el.querySelectorAll('.ref-chip'));
                }

                // 工具：恢复 chips 到 prompt 开头
                function restoreChips(chips) {
                    if (!chips || chips.length === 0) return;
                    // 把每个 chip 重新塞到 prompt 第一个文字节点之前
                    var firstText = null;
                    for (var i = 0; i < el.childNodes.length; i++) {
                        if (el.childNodes[i].nodeType === 3) { firstText = el.childNodes[i]; break; }
                    }
                    chips.forEach(function (chip) {
                        el.insertBefore(chip, firstText);
                    });
                    // 每个 chip 后补一个空格
                    chips.forEach(function (chip) {
                        if (chip.nextSibling && chip.nextSibling.nodeType === 3) return;
                        el.insertBefore(document.createTextNode(' '), chip.nextSibling);
                    });
                }

                // .value getter/setter
                Object.defineProperty(el, 'value', {
                    get: function () {
                        // 收集所有后代文本节点（剔除 .ref-chip 子树里的文本）
                        // 修复：从网页/Notion 等富文本源粘贴时，浏览器会把文本包在 <div>/<span> 里，
                        //       只看直接子节点会返回空字符串，触发"请输入提示词"
                        var out = '';
                        var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {
                            acceptNode: function (n) {
                                var p = n.parentNode;
                                while (p && p !== el) {
                                    if (p.nodeType === 1 && p.classList && p.classList.contains('ref-chip')) {
                                        return NodeFilter.FILTER_REJECT;
                                    }
                                    p = p.parentNode;
                                }
                                return NodeFilter.FILTER_ACCEPT;
                            }
                        }, false);
                        var tn;
                        while ((tn = walker.nextNode())) out += tn.nodeValue;
                        return out;
                    },
                    set: function (v) {
                        // 关键修复：保留 .ref-chip 节点，只清掉文字节点
                        var savedChips = preserveChips();
                        var vStr = v == null ? '' : String(v);
                        // 清掉所有非 ref-chip 子节点（连包裹的 <div>/<span> 一起清）
                        Array.prototype.slice.call(el.childNodes).forEach(function (n) {
                            if (n.nodeType === 1 && n.classList && n.classList.contains('ref-chip')) return;
                            el.removeChild(n);
                        });
                        // 插入新文字
                        if (vStr) el.appendChild(document.createTextNode(vStr));
                        // 恢复 chips
                        restoreChips(savedChips);
                        if (typeof updatePromptTags === 'function') updatePromptTags();
                    }
                });

                // input 事件触发 updatePromptTags（兼容原 oninput）
                el.addEventListener('input', function () {
                    // 只清理反引号；不要重建结构（chip 仍保留）
                    var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null, false);
                    var n;
                    while ((n = walker.nextNode())) {
                        if (n.nodeValue.indexOf('`') >= 0) n.nodeValue = n.nodeValue.replace(/`/g, '');
                    }
                    if (typeof updatePromptTags === 'function') updatePromptTags();
                });

                // 强制粘贴为纯文本，避免富文本包在 <div>/<span> 里让 .value 读不到
                el.addEventListener('paste', function (e) {
                    if (!e.clipboardData && !window.clipboardData) return;
                    e.preventDefault();
                    var text = '';
                    if (e.clipboardData) {
                        text = e.clipboardData.getData('text/plain') || '';
                    } else if (window.clipboardData) {
                        text = window.clipboardData.getData('text') || '';
                    }
                    text = text.replace(/`/g, '');
                    if (!text) return;
                    // 在当前光标/选区位置插入纯文本：若选中了文字则先删除选区，实现“覆盖”而非“追加”
                    var sel = window.getSelection();
                    if (sel && sel.rangeCount > 0) {
                        var range = sel.getRangeAt(0);
                        // 删除选区内容（select-all 粘贴即整段替换；纯光标态删除为空操作）
                        range.deleteContents();
                        var node = document.createTextNode(text);
                        range.insertNode(node);
                        range.setStartAfter(node);
                        range.collapse(true);
                        sel.removeAllRanges();
                        sel.addRange(range);
                    } else {
                        // 退化：没有选区信息，整体替换（setter 会保留 ref-chip 到首部）
                        el.value = text;
                    }
                    // 通知其他监听器（updatePromptTags / syncPickerStatesFromPrompt）
                    el.dispatchEvent(new Event('input', { bubbles: true }));
                });

                // placeholder 通过 :empty::before 显示（CSS 已加）
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();

                async function saveToUserOutput(comfyUrl, featureName) {
            try {
                const u=new URL(comfyUrl,window.location.origin),fn=u.searchParams.get('filename')||'',sf=u.searchParams.get('subfolder')||'',tp=u.searchParams.get('type')||'output';
                if(!fn)return comfyUrl;
                const token=localStorage.getItem('xy_auth_token')||'';
                const res=await fetch('/api/comfyui/save-to-output?filename='+encodeURIComponent(fn)+'&subfolder='+encodeURIComponent(sf)+'&type='+encodeURIComponent(tp)+'&feature='+encodeURIComponent(featureName)+'&token='+encodeURIComponent(token));
                if(!res.ok)return comfyUrl; const data=await res.json(); return data.url||comfyUrl;
            } catch(e){return comfyUrl;}
        }

        // 供 Krea2 图片编辑工作流注入 LoadImage 节点使用
        async function ensureRefComfyNames() {
            if (!_refImgMgr) return [];
            const imgs = _refImgMgr.getFiles() || [];
            const names = [];
            for (const img of imgs) {
                if (img._comfyName) { names.push(img._comfyName); continue; }
                const fd = new FormData();
                fd.append('files', img.file);
                const res = await fetch('/api/upload', { method: 'POST', body: fd });
                if (!res.ok) throw new Error('参考图上传失败: ' + res.status);
                const data = await res.json();
                const f = data.files && data.files[0];
                if (!f || !f.comfy_name) throw new Error('参考图上传未返回文件名');
                img._comfyName = f.comfy_name;
                names.push(f.comfy_name);
            }
            return names;
        }

                            }).catch(function () { resolve(url); });
                        });
                    } catch (e) {}
                }
                if (url) out.push({ url: url, name: it.name || '' });
            }

        async function handleRenderCloud() {
            const promptEl = document.getElementById('prompt');
            const prompt = ((promptEl && promptEl.value) || '').trim();

            if (!_cloudProviderId) { alert('请先选择在线平台'); return; }
            startProgress();
            const btn = document.getElementById('mainGenBtn');
            if (btn) setLoading(true);
            const _aspectSize = getAnimaSize();
            const _aspectRatio = _aspectSize.width + ' / ' + _aspectSize.height;
            const placeholder = document.createElement('div');
            placeholder.className = 'masonry-item bg-gray-50 flex flex-col items-center justify-center border-dashed border-2 border-gray-200';
            placeholder.style.minHeight = '180px';
            placeholder.style.aspectRatio = _aspectRatio;
            placeholder.style.transition = 'all 0.4s ease';
            placeholder.innerHTML = (typeof CardProgress !== 'undefined' ? CardProgress.HTML : '');
            const masonry = document.getElementById('masonry');
            if (masonry) masonry.prepend(placeholder);
            // 激活卡片进度（与 ComfyUI 模式一致：排队中 → 执行中 → 完成）
            let _cloudSimTimer = null;
            if (typeof CardProgress !== 'undefined') {
                CardProgress.update(placeholder, { status: 'started' });
                setTimeout(function () { CardProgress.update(placeholder, { status: 'executing' }); }, 300);
                // 在线API 无真实采样进度，模拟百分比爬升以给出可见的进度反馈
                const _pctEl = placeholder.querySelector('.card-progress-pct');
                let _simPct = 0;
                _cloudSimTimer = setInterval(function () {
                    _simPct = Math.min(95, _simPct + Math.random() * 7 + 2);
                    if (_pctEl) { _pctEl.style.visibility = 'visible'; _pctEl.textContent = Math.floor(_simPct) + '%'; }
                }, 600);
            }
            try {
                const refs = await cloudCollectRefs();
                const size = cloudSize();
                const body = {
                    prompt: prompt,
                    model: _cloudModel || '',
                    size: size,
                    protocol: cloudProtocol(_cloudProviderId),
                    provider_id: _cloudProviderId,
                    reference_images: refs,
                    quality: _cloudQuality,
                    image_request_mode: '',
                    feature: 'zimage'
                };
                const res = await fetch('/api/online-image', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (!res.ok) {
                    const err = await res.json().catch(function () { return { detail: '生成失败' }; });
                    throw new Error(err.detail || err.message || '生成失败');
                }
                const data = await res.json();
                if (_cloudSimTimer) { clearInterval(_cloudSimTimer); _cloudSimTimer = null; }
                if (typeof CardProgress !== 'undefined') CardProgress.update(placeholder, { status: 'complete' });
                const imgs = (data.images || []).filter(Boolean);
                if (!imgs.length) throw new Error('未返回图片');
                const record = {
                    timestamp: data.timestamp || Date.now(),
                    prompt: prompt,
                    images: imgs,
                    type: 'zimage',
                    model: (_cloudProviderId || '') + (data.model ? ' · ' + data.model : ''),
                    genParams: { engine: 'cloud', provider: _cloudProviderId, model: _cloudModel, size: size, quality: _cloudQuality }
                };
                if (window.GalleryList) GalleryList.pushNewImage(record, { _skipRender: true });
                if (placeholder.parentNode && window.GalleryCard && typeof window.GalleryCard.render === 'function') {
                    const tempContainer = document.createElement('div');
                    window.GalleryCard.render(Object.assign({ container: tempContainer, record: record, isNew: true }, { eagerFirstImage: true }));
                    const tempCard = tempContainer.querySelector('.masonry-item');
                    if (tempCard) {
                        tempCard.style.aspectRatio = _aspectRatio;
                        const _fullImg = tempCard.querySelector('img');
                        if (_fullImg && imgs[0]) {
                            const progress = placeholder.querySelector('.card-progress');
                            if (progress) progress.remove();
                            placeholder.classList.remove('bg-gray-50', 'border-dashed', 'border-2', 'border-gray-200');
                            const _parent = placeholder.parentNode;
                            const _sibling = placeholder.nextSibling;
                            _parent.insertBefore(tempCard, _sibling);
                            placeholder.remove();
                        } else {
                            const _parent = placeholder.parentNode;
                            const _sibling = placeholder.nextSibling;
                            if (_parent) { _parent.insertBefore(tempCard, _sibling); placeholder.remove(); }
                        }
                    } else {
                        placeholder.remove();
                    }
                } else {
                    placeholder.remove();
                }
                try {
                    fetch('/api/history/save', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(record)
                    });
                } catch (e) {}
                if (btn) setLoading(false);
                hideProgress();
            } catch (e) {
                if (_cloudSimTimer) { clearInterval(_cloudSimTimer); _cloudSimTimer = null; }
                if (placeholder.parentNode) placeholder.remove();

        function updateLightboxThumbnails() {
            const container = document.getElementById('lightboxThumbnails');
            if (!container || lightboxImages.length <= 1) {
                if (container) container.style.display = 'none';
                return;
            }
            container.style.display = 'flex';
            container.innerHTML = lightboxImages.map((url, i) => 
                `<div class="lightbox-thumb${i === lightboxCurrentIndex ? ' active' : ''}" data-index="${i}">
                    <img src="/api/media-preview?w=96&url=${encodeURIComponent(url)}" alt="缩略图 ${i + 1}" draggable="false">
                </div>`
            ).join('');
            // 滚动到当前缩略图
            const activeThumb = container.querySelector('.active');
            if (activeThumb) activeThumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            // 绑定鼠标滚轮和拖动滚动
            if (!container._thumbScrollBound) {
                container._thumbScrollBound = true;
                let isDragging = false;
                let hasMoved = false;
                let startX = 0;
                let startScrollLeft = 0;
                const DRAG_THRESHOLD = 5;

                // 鼠标滚轮水平滚动
                container.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    container.scrollLeft += e.deltaY * 2;
                }, { passive: false });

                // 拖动滚动
                container.addEventListener('mousedown', (e) => {
                    isDragging = true;
                    hasMoved = false;
                    startX = e.pageX;
                    startScrollLeft = container.scrollLeft;
                    container.style.cursor = 'grabbing';
                    e.preventDefault();
                });

                document.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    const dx = e.pageX - startX;
                    if (Math.abs(dx) > DRAG_THRESHOLD) {
                        hasMoved = true;
                    }
                    if (hasMoved) {
                        container.scrollLeft = startScrollLeft - dx;
                    }
                });

                document.addEventListener('mouseup', () => {
                    if (isDragging) {
                        isDragging = false;
                        container.style.cursor = 'grab';
                    }
                });

                // 点击缩略图切换图片（只在没有拖动时触发）
                container.addEventListener('click', (e) => {
                    if (hasMoved) return;
                    const thumb = e.target.closest('.lightbox-thumb');
                    if (thumb) {
                        const index = parseInt(thumb.dataset.index);
                        if (!isNaN(index)) switchLightboxImage(index);
                    }
                });
            }
        }

        GalleryDisplay.init({

            onPromptDisplay: (prompt) => {
                if (typeof loadPresetI18n === 'function' && typeof translatePromptToEn === 'function') {

            },
            onUsePrompt: async (record) => {

                // 1. 提示词

                if (el) { el.value = record.prompt || ''; el.dispatchEvent(new Event('input', {bubbles:true})); }
                // 1.5 解析角色和画师，设置到选择器
                if (typeof pickerSelected !== 'undefined' && typeof artistPickerSelected !== 'undefined') {
                    const tokens = splitPrompt(record.prompt);
                    // 只把「在角色数据库中真实存在」的 token 视为角色，避免将普通提示词误判为角色
                    const idx = getCharIndex();
                    const isCharToken = (t) => {
                        if (!idx.built) return false;
                        if (promptHasArtistToken(t)) return false;
                        const tl = t.toLowerCase();
                        return idx.nameSet.has(tl) || idx.triggerSet.has(tl);
                    };
                    pickerSelected = tokens.filter(isCharToken);
                    // 同步初始化「上次应用写入的角色 token 快照」，避免关闭时把非角色 token 一并清掉
                    if (typeof pickerLastAppliedTokens !== 'undefined') {
                        pickerLastAppliedTokens = new Set(pickerSelected.map(t => t.toLowerCase()));
                    }
                    artistPickerSelected = tokens.filter(t => t.startsWith('@')).map(t => t.substring(1));
                    if (typeof artistPickerLastAppliedTokens !== 'undefined') {
                        artistPickerLastAppliedTokens = new Set(
                            tokens.filter(promptHasArtistToken).map(t => t.toLowerCase())
                        );
                    }
                    if (typeof pickerRenderGrid === 'function') pickerRenderGrid();
                    if (typeof artistPickerRenderGrid === 'function') artistPickerRenderGrid();

                }
                // 2. 工作流
                if (p.workflow && typeof switchWorkflow === 'function') switchWorkflow(p.workflow);
                // 3. 比例和分辨率
                if (p.ratioW) { GenerationControls.setState({ ratioW: p.ratioW, ratioH: p.ratioH }); }
                if (p.resolution) { GenerationControls.setState({ res: p.resolution }); }
                // 4. 种子（设为固定模式）
                if (p.seed) {
                    GenerationControls.setState({ seedMode: 'fixed', fixedSeed: p.seed });
                    if (typeof updateSeedUI === 'function') updateSeedUI();
                }
                // 5. 批量数量
                if (p.batchCount) { GenerationControls.setState({ batchCount: p.batchCount }); if (typeof updateBatchCountUI === 'function') updateBatchCountUI(); }
                // 6. LoRA（过滤掉工作流内置的，避免重复注入）
                if (Array.isArray(p.loras) && p.workflow) {
                    try {
                        const wfRes = await fetch('/api/workflows/' + encodeURIComponent(p.workflow));
                        if (wfRes.ok) {
                            const wfEnv = await wfRes.json();
                            const wf = wfEnv.workflow || wfEnv;
                            // 收集工作流里已有的 LoRA 名称
                            const builtinNames = new Set();
                            for (const nid in wf) {
                                const n = wf[nid];
                                if (n && n.class_type && n.class_type.includes('LoraLoader') && n.inputs && n.inputs.lora_name) {
                                    builtinNames.add(n.inputs.lora_name);

                if (typeof updateParamsUI === 'function') updateParamsUI();
                // 8. 刷新按钮高亮（LoRA 数量变化等）

        // 收藏图片时自动保存到资产库；取消收藏时同步从资产库删除（仅删本功能新建的，去重命中的既有资产不删）
        (function() {
            var _favInFlight = {};   // galleryUrl -> true（请求进行中，防重复）
            var _favSavedAsset = {}; // galleryUrl -> { assetUrl, dedup }（本功能存入的资产库条目）
            function _favAssetToast(msg) {
                try {
                    var t = document.createElement('div');
                    t.textContent = msg;
                    t.style.cssText = 'position:fixed;left:50%;bottom:32px;transform:translateX(-50%);z-index:9999;' +
                        'background:rgba(15,23,42,.92);color:#e2e8f0;padding:8px 16px;border-radius:8px;' +
                        'font-size:13px;letter-spacing:.03em;box-shadow:0 4px 18px rgba(0,0,0,.35);pointer-events:none;';
                    document.body.appendChild(t);
                    setTimeout(function() { t.style.transition = 'opacity .4s'; t.style.opacity = '0'; }, 1600);
                    setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 2100);
                } catch (_) {}
            }
            if (window.GalleryDisplay && GalleryDisplay.Base && GalleryDisplay.Base.bus &&
                typeof GalleryDisplay.Base.bus.on === 'function') {
                function _findPromptByUrl(u) {
                    try {
                        var items = (window.GalleryList && GalleryList.allHistory) || [];
                        for (var i = 0; i < items.length; i++) {
                            var r = items[i];
                            if (r && r.images && r.images.indexOf(u) !== -1) return r.prompt || '';
                        }
                    } catch (e) {}
                    return '';
                }
                GalleryDisplay.Base.bus.on('fav:changed', function(ev) {
                    if (!ev || !ev.url) return;
                    var gUrl = ev.url;
                    var gPrompt = _findPromptByUrl(gUrl);
                    if (ev.added) {
                        // 已收藏且在同步中或已存过，跳过
                        if (_favInFlight[gUrl] || _favSavedAsset[gUrl]) return;
                        _favInFlight[gUrl] = true;
                        fetch('/api/user/assets/save-from-url', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ url: gUrl, prompt: gPrompt })
                        }).then(function(r) {
                            if (r.ok) {
                                return r.json().then(function(data) {
                                    // data: { url, name, dedup }
                                    _favSavedAsset[gUrl] = { assetUrl: data.url || gUrl, dedup: !!data.dedup };
                                    console.log('[收藏] 已保存到资产库:', gUrl, 'dedup=', !!data.dedup);
                                    _favAssetToast(data.dedup ? '已收藏（资产库已有该图）' : '已收藏并保存到资产库');
                                    // 资产库面板已加缓存，通知其失效以便立即显示新收藏
                                    if (window.AssetLibrary && typeof AssetLibrary.invalidate === 'function') {
                                        try { AssetLibrary.invalidate(); } catch (_) {}
                                    }
                                });
                            } else {
                                console.warn('[收藏] 保存到资产库失败:', r.status, r.statusText);
                                _favAssetToast('收藏成功，但保存到资产库失败');
                            }
                        }).catch(function(e) {
                            console.warn('[收藏] 保存到资产库异常:', e);
                            _favAssetToast('收藏成功，但保存到资产库失败');
                        }).then(function() {
                            delete _favInFlight[gUrl];
                        });
                    } else {
                        // 取消收藏：若本功能曾存入该图（且非去重命中），同步删除
                        var rec = _favSavedAsset[gUrl];
                        delete _favSavedAsset[gUrl];
                        delete _favInFlight[gUrl];
                        if (rec && !rec.dedup) {
                            fetch('/api/user/assets/delete', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ url: rec.assetUrl })
                            }).then(function(r) {
                                if (r.ok) {
                                    console.log('[取消收藏] 已从资产库删除:', rec.assetUrl);
                                    _favAssetToast('已取消收藏并从资产库删除');
                                    if (window.AssetLibrary && typeof AssetLibrary.invalidate === 'function') {
                                        try { AssetLibrary.invalidate(); } catch (_) {}
                                    }
                                } else {
                                    console.warn('[取消收藏] 删除资产库失败:', r.status, r.statusText);
                                    _favAssetToast('已取消收藏，但资产库删除失败');
                                }
                            }).catch(function(e) {
                                console.warn('[取消收藏] 删除资产库异常:', e);
                                _favAssetToast('已取消收藏，但资产库删除失败');
                            });
                        } else if (rec && rec.dedup) {
                            // 去重命中：该图在收藏前已存在于资产库，不删除
                            console.log('[取消收藏] 资产库原已存在该图，保留:', rec.assetUrl);
                        }
                    }
                });
            }
        })();
        // 长按批量管理已通过上方 GalleryDisplay.init({ longPressToSelect: true }) 接入，
        // 由 gallery-display.js 内真正的 HistoryBulkManager.attach 生效（避免重复 attach 被 return）。

        const LEGACY_WF_MAP = {

        // ============================================================

        function updatePickerButtonsHighlight() {
            const promptInput = document.getElementById('prompt');

            // ---- 角色（旧版本写法：直接 typeof + 每次重建 Set，绕开 safeDbAvailable / getCharIndex 缓存链 bug） ----
            let charCount = 0;
            try {
                if (typeof ANIMA_CHAR_DB !== 'undefined' && ANIMA_CHAR_DB && ANIMA_CHAR_DB.length > 0) {
                    const _charNameSet = new Set(ANIMA_CHAR_DB.map(c => (c.name || '').toLowerCase()).filter(Boolean));
                    const _charTriggerSet = new Set();
                    ANIMA_CHAR_DB.forEach(c => {

                        else if (typeof c.trigger === 'string') _charTriggerSet.add(c.trigger.toLowerCase());

                    parts.forEach(t => {
                        if (!t) return;
                        if (promptHasArtistToken(t) || t.startsWith('[')) return;

                    });

            updateLoraSwitcherVisibility();

        // 暴露到 window 供各选择器脚本调用
        window.updatePickerButtonsHighlight = updatePickerButtonsHighlight;

        function syncPickerStatesFromPrompt() {
            const promptInput = document.getElementById('prompt');
            if (!promptInput) return;
            const parts = splitPrompt(promptInput.value);
            const lowerSet = new Set(parts.map(p => p.toLowerCase()));

            // ---- 角色（旧版本写法：直接 typeof + 每次重建 Set，绕开 safeDbAvailable / getCharIndex 缓存链 bug） ----
            try {
                if (typeof pickerSelected !== 'undefined' && typeof ANIMA_CHAR_DB !== 'undefined' && ANIMA_CHAR_DB && ANIMA_CHAR_DB.length > 0) {
                    const _charNameSet = new Set(ANIMA_CHAR_DB.map(c => (c.name || '').toLowerCase()).filter(Boolean));
                    const _charTriggerSet = new Set();
                    ANIMA_CHAR_DB.forEach(c => {
                        if (Array.isArray(c.triggers)) c.triggers.forEach(t => _charTriggerSet.add(String(t).toLowerCase()));
                        else if (typeof c.trigger === 'string') _charTriggerSet.add(c.trigger.toLowerCase());
                    });
                    // 1) 移除：pickerSelected 中已不在 prompt 的项
                    let newPickerSelected = pickerSelected.filter(name => {
                        if (!name) return false;
                        const nl = name.toLowerCase();
                        if (_charNameSet.has(nl)) return true;
                        return lowerSet.has(nl);
                    });
                    // 2) 添加：prompt 中「确实是角色」的 token 但 pickerSelected 还没有的
                    const existing = new Set(newPickerSelected.map(n => n.toLowerCase()));
                    parts.forEach(t => {
                        if (!t) return;
                        if (promptHasArtistToken(t) || t.startsWith('[')) return;
                        const tl = t.toLowerCase();
                        if (existing.has(tl)) return;
                        if (_charNameSet.has(tl) && !_charTriggerSet.has(tl)) {
                            newPickerSelected.push(t);
                            existing.add(tl);
                        } else if (_charTriggerSet.has(tl)) {
                            // 是 trigger：从 DB 里找对应的真实 name
                            const hit = ANIMA_CHAR_DB.find(c => (c.trigger || '').toLowerCase() === tl || (Array.isArray(c.triggers) && c.triggers.some(x => String(x).toLowerCase() === tl)));
                            if (hit && !existing.has(hit.name.toLowerCase())) {
                                newPickerSelected.push(hit.name);
                                existing.add(hit.name.toLowerCase());
                            }
                        }
                    });
                    pickerSelected = newPickerSelected;
                    if (typeof pickerLastAppliedTokens !== 'undefined') {
                        pickerLastAppliedTokens = new Set(pickerSelected.map(t => t.toLowerCase()));
                    }
                }
            } catch (_) {}

            // ---- 画师（旧版本写法） ----
            try {
                if (typeof artistPickerSelected !== 'undefined' && typeof ANIMA_ARTIST_DB !== 'undefined' && ANIMA_ARTIST_DB && ANIMA_ARTIST_DB.length > 0) {
                    const _artistNameSet = new Set(ANIMA_ARTIST_DB.map(a => (a.name || '').toLowerCase()).filter(Boolean));
                    // 1) 移除
                    let newArtistSel = artistPickerSelected.filter(name => {
                        if (!name) return false;
                        const nl = name.toLowerCase();
                        if (_artistNameSet.has(nl)) return true;
                        return lowerSet.has('@' + nl) || lowerSet.has('by ' + nl);
                    });
                    // 2) 添加
                    const existingArtist = new Set(newArtistSel.map(n => n.toLowerCase()));
                    parts.forEach(t => {
                        if (!t) return;
                        const name = extractArtistName(t);
                        if (!name) return;
                        const nl = name.toLowerCase();
                        if (existingArtist.has(nl)) return;
                        if (_artistNameSet.has(nl)) {
                            newArtistSel.push(name);
                            existingArtist.add(nl);
                        }
                    });
                    artistPickerSelected = newArtistSel;
                    if (typeof artistPickerLastAppliedTokens !== 'undefined') {
                        // 只记录已知画师的 @ token，排除 LoRA 触发词
                        const currentArtistTokens = parts.filter(p => {
                            if (!promptHasArtistToken(p)) return false;
                            const n = extractArtistName(p);
                            return n && _artistNameSet.has(n.toLowerCase());
                        });
                        artistPickerLastAppliedTokens = new Set(currentArtistTokens.map(t => t.toLowerCase()));
                    }
                }
            } catch (_) {}

            // ---- 预设 ----
            try {
                if (typeof presetPickerSelected !== 'undefined') {
                    const pidx = getPresetIndex();
                    if (pidx.built) {
                        const matchedIds = new Set();
                        pidx.byKey.forEach(p => {
                            const k = isPresetMatched(lowerSet, p);
                            if (k) matchedIds.add(k);
                        });
                        // 1) 移除
                        let newPresetSel = presetPickerSelected.filter(p => {
                            const key = (p.category_id || p.category || '') + ':' + (p.id || p.name);
                            return matchedIds.has(key);
                        });
                        // 2) 添加：prompt 命中的预设（但 pickerSelected 中没有的）
                        const existingKeys = new Set(newPresetSel.map(p => (p.category_id || p.category || '') + ':' + (p.id || p.name)));
                        pidx.byKey.forEach(p => {
                            const key = isPresetMatched(lowerSet, p);
                            if (key && !existingKeys.has(key)) {
                                newPresetSel.push(p);
                                existingKeys.add(key);
                            }
                        });
                        presetPickerSelected = newPresetSel;
                        if (typeof presetPickerLastAppliedTokens !== 'undefined') {
                            const newSet = new Set();
                            pidx.byKey.forEach(p => {
                                const key = isPresetMatched(lowerSet, p);
                                if (key) {
                                    const t = (p.prompt || p.name || p.id || '').trim().toLowerCase();
                                    if (t) newSet.add(t);
                                }
                            });
                            presetPickerLastAppliedTokens = newSet;
                        }
                    }
                }
            } catch (_) {}

            // ---- LoRA：自动按触发词/文件名匹配的功能已移除 ----
            // 现在 LoRA 仅由用户在 LoRA 选择器中手动勾选，勾选结果记入图片生成参数。

            // ---- 刷新按钮高亮/角标 ----
            if (typeof updatePickerButtonsHighlight === 'function') {
                updatePickerButtonsHighlight();
            }
        }
        // 暴露到 window，方便其他模块/调试调用

        // 监听 prompt 输入变化：用户手动修改或清空时，反向同步选择器状态
        document.addEventListener('DOMContentLoaded', () => {

            // === 「⚡ 生成」按钮长按 → 启动/停止自动生成 ===
            (function bindMainGenLongPress() {
                const btn = document.getElementById('mainGenBtn');
                if (!btn) return;
                btn.title = '单击生成 | 长按自动生成';

                let pressTimer = null;
                let longPressFired = false;
                const LONG_PRESS_MS = 600;

                function startPress(e) {
                    longPressFired = false;
                    btn.classList.add('btn-render-longpress');
                    pressTimer = setTimeout(() => {
                        longPressFired = true;

                        // 防止 long-press 之后 mouseup 意外触发原生 onclick
                        setTimeout(() => { longPressFired = false; }, 100);
                    }, LONG_PRESS_MS);
                }
                function endPress() {
                    btn.classList.remove('btn-render-longpress');
                    if (pressTimer) {
                        clearTimeout(pressTimer);
                        pressTimer = null;
                    }
                    // 短按不拦截（让原生 onclick 继续处理生成）
                }
                function cancelPress() {
                    btn.classList.remove('btn-render-longpress');
                    if (pressTimer) {
                        clearTimeout(pressTimer);
                        pressTimer = null;
                    }
                }

                btn.addEventListener('mousedown', startPress);
                btn.addEventListener('mouseup', endPress);
                btn.addEventListener('mouseleave', cancelPress);
                btn.addEventListener('touchstart', startPress, { passive: true });
                btn.addEventListener('touchend', endPress);
                btn.addEventListener('touchcancel', cancelPress);

                // 拦截 long-press 之后的 click，避免双触发
                btn.addEventListener('click', (e) => {
                    if (longPressFired) {
                        e.stopImmediatePropagation();
                        e.preventDefault();
                        longPressFired = false;
                    }
                }, true);

                // === 自动生成状态同步：轮询快照 → 按钮上显示计数/倒计时 + 动效 ===
                const btnIcon = document.getElementById('btnIcon');
                const btnText = document.getElementById('btnText');
                const btnBadge = document.getElementById('btnAutoBadge');
                const origIconHTML = btnIcon ? btnIcon.outerHTML : '';
                const origText = btnText ? btnText.textContent : '生成';

                function fmtCountdown(ms) {
                    const total = Math.ceil(ms / 1000);
                    const m = Math.floor(total / 60);
                    const s = total % 60;
                    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
                }

                function applyAutoGenVisual(snap) {
                    if (snap.running) {
                        btn.classList.add('btn-render-autogen');
                        if (btnText) btnText.textContent = '自动';
                        if (btnIcon) btnIcon.outerHTML = '<i data-lucide="loader" id="btnIcon" class="w-3.5 h-3.5" style="animation:spin 1s linear infinite"></i>';
                        if (btnBadge) {
                            btnBadge.style.display = 'inline-block';
                            if (snap.mode === 'count') {
                                const cur = snap.currentCount || 0;
                                const tot = snap.totalCount || 0;
                                btnBadge.textContent = cur + '/' + tot;
                            } else {
                                btnBadge.textContent = snap.remainingMs > 0 ? fmtCountdown(snap.remainingMs) : '00:00';
                            }
                        }
                    } else {
                        btn.classList.remove('btn-render-autogen');
                        if (btnText) btnText.textContent = origText;
                        // 复原 zap 图标
                        const cur = document.getElementById('btnIcon');
                        if (cur && !cur.getAttribute('data-lucide')) {
                            cur.outerHTML = origIconHTML;
                        } else if (cur && cur.getAttribute('data-lucide') !== 'zap') {
                            cur.outerHTML = origIconHTML;
                        }
                        if (btnBadge) {
                            btnBadge.style.display = 'none';
                            btnBadge.textContent = '00:00';
                        }
                    }
                }

                // 补一个 spin 动画
                if (!document.getElementById('btn-render-spin-style')) {
                    const st = document.createElement('style');
                    st.id = 'btn-render-spin-style';
                    st.textContent = '@keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }';
                    document.head.appendChild(st);
                }

                // 轮询 250ms（足够丝滑，消耗可忽略）
                setInterval(() => {
                    if (typeof RandomPrompt === 'undefined' || !RandomPrompt.getAutoGenSnapshot) return;
                    const snap = RandomPrompt.getAutoGenSnapshot();
                    applyAutoGenVisual(snap);
                }, 250);
            })();

            // 时间轴：复用画廊模块（timeline.js）GalleryTimeline，挂载到 #masonry（自带 MutationObserver + 轮询兜底）
            // [已暂时停用] 时间轴功能暂不稳定，先不接入使用；保留模块与脚本，需要时取消下一行注释即可恢复。
            // if (window.GalleryTimeline) GalleryTimeline.attach({ container: '#masonry' });

        };
    </script>
<!-- ── 反推设置面板（悬浮模态：缩略图条 + 三视图无缝切换） ── -->
    <div id="reverseImageMount"></div>
    <script src="/static/modules/reverse-image.js"></script>
    <script>
        ReverseImage.init({
            mountId: 'reverseImageMount',
            onApply: function (text, mode) {
                var ta = document.getElementById('prompt');
                if (!ta || !text) return;
                if (mode === 'append' && ta.value.trim()) ta.value = ta.value.trim() + ', ' + text;
                else ta.value = text;
                ta.dispatchEvent(new Event('input', { bubbles: true }));
                if (window.updatePromptTags) window.updatePromptTags();
            }
        });
    </script>

<!-- ── 资产库选择面板（独立模块） ── -->
    <div id="assetLibraryMount"></div>
    <script src="/static/modules/asset-library.js"></script>
    <script>
        AssetLibrary.init({
            mountId: 'assetLibraryMount',
            allowDelete: true,
            onApply: function (url, name) {
                // 把选中的资产图作为参考图加入（URL → File → RefImageManager）
                if (typeof applyAssetToRef === 'function') applyAssetToRef(url, name);
            }
        });
    </script>
