    <script>
        // 回到顶部按钮
        (function() {
            const btn = document.getElementById('scrollToTopBtn');
            if (!btn) return;
            let ticking = false;
            const mainEl = document.querySelector('main');
            if (!mainEl) return;
            mainEl.addEventListener('scroll', function() {
                if (!ticking) {
                    window.requestAnimationFrame(function() {
                        if (mainEl.scrollTop > 400) {
                            btn.style.display = '';
                            btn.style.opacity = '1';
                            btn.style.pointerEvents = 'auto';
                        } else {
                            btn.style.opacity = '0';
                            btn.style.pointerEvents = 'none';
                            setTimeout(() => { if (btn.style.opacity === '0') btn.style.display = 'none'; }, 300);
                        }
                        ticking = false;
                    });
                    ticking = true;
                }
            });
        })();
        lucide.createIcons();

        function generateUUID() {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) { try { return crypto.randomUUID(); } catch(e){} }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16); });
        }
        const CLIENT_ID = localStorage.getItem("client_id") || generateUUID();
        localStorage.setItem("client_id", CLIENT_ID);

        let isGenerating = false;
        let currentPromptId = null;
        const COMFYUI_WS_URL = `${window.location.protocol==='https:'?'wss:':'ws:'}//${window.location.host}/api/comfyui/ws?client_id=${CLIENT_ID}`;

        // === 工作流切换 ===
        let currentWorkflow = 'Z-Image.json';
        let currentEngine = 'local';
        let currentBatchCount = parseInt(localStorage.getItem('zimage_batch_count')) || 1;

        function switchWorkflow(name) {
            currentWorkflow = name;
            localStorage.setItem('zimage_workflow', name);
            // 同步上拉菜单的选中态 + 按钮文本
            const displayMap = {
                'Z-Image.json': 'Z-Image',
                'anima_图生图.json': 'Anima 图生图',
                'anima 动漫文生图.json': 'ANIMA',
            };
            const display = displayMap[name] || name.replace('.json', '');
            const txt = document.getElementById('modelText');
            if (txt) txt.textContent = display;
            const items = document.querySelectorAll('#modelMenu .anima-ctrl-menu-item');
            items.forEach(it => {
                const isOn = it.getAttribute('data-model-key') === name;
                const chk = it.querySelector('.chk');
                if (chk) chk.style.opacity = isOn ? '1' : '0';
            });
            updateParamsUI();
        }

        // === 通用下拉菜单助手(取代 4 套重复的 toggle*Menu/select* 逻辑) ===
        const __ALL_MENU_IDS = ['batchCountMenu', 'modelMenu', 'engineMenu', 'ratioMenu', 'resMenu'];

        // 点击按钮时调用:打开当前菜单、关闭其它所有
        function toggleMenu(menuId) {
            const menu = document.getElementById(menuId);
            if (!menu) return;
            const willOpen = menu.style.display !== 'block';
            __ALL_MENU_IDS.forEach(id => {
                const m = document.getElementById(id);
                if (m) m.style.display = 'none';
            });
            menu.style.display = willOpen ? 'block' : 'none';
        }

        // 关闭所有菜单
        function closeAllMenus() {
            __ALL_MENU_IDS.forEach(id => {
                const m = document.getElementById(id);
                if (m) m.style.display = 'none';
            });
        }

        // 设置某菜单的选中项:dataKey 对应 dataset.xxx(如 'model-key' / 'res-key')
        function setActiveMenuItem(menuId, dataKey, val) {
            const menu = document.getElementById(menuId);
            if (!menu) return;
            const target = String(val);
            menu.querySelectorAll('.anima-ctrl-menu-item').forEach(item => {
                const isActive = item.getAttribute('data-' + dataKey) === target;
                item.classList.toggle('active', isActive);
                const chk = item.querySelector('.chk');
                if (chk) chk.style.opacity = isActive ? '1' : '0';
            });
        }

        // === 模型上拉菜单 ===
        function selectModel(name) {
            switchWorkflow(name);
            closeAllMenus();
            setActiveMenuItem('modelMenu', 'model-key', name);
        }

        function switchEngine(mode) {

        // 自动切换工作流：有参考图→图生图，无参考图→文生图

        // === 智能提示词生成 ===
        async function smartPromptGenerate() {
            const promptInput = document.getElementById('prompt');
            const btn = document.getElementById('smartPromptBtn');

            const userText = promptInput.value.trim();
            if (!userText) return alert('请先输入中文描述');
            
            btn.disabled = true;
            btn.querySelector('span').textContent = '生成中...';
            
            try {
                const res = await fetch('/api/smart-prompt', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ prompt: userText })
                });
                const data = await res.json();
                
                if (data.success && data.prompt) {
                    promptInput.value = data.prompt;
                    updatePromptTags();
                    // 显示负向提示词提示
                    if (data.negative) {

        // === 智能提示词配置（已集成到 API 设置页面） ===

        function getAnimaSize() {
            // 根据比例和分辨率计算实际尺寸
            const baseSize = animaRes === 2 ? 2048 : 1024;
            const ratio = animaRatioW / animaRatioH;
            let w, h;
            if (ratio > 1) {
                w = baseSize;
                h = Math.round(baseSize / ratio);
            } else {
                h = baseSize;
                w = Math.round(baseSize * ratio);
            }
            // 确保是8的倍数
            w = Math.round(w / 8) * 8;
            h = Math.round(h / 8) * 8;
            return { width: w, height: h };
        }
        
        // === 提示词标签操作 ===
        function removePromptTag(tag) {
            const promptInput = document.getElementById('prompt');
            if (!promptInput) return;
            let raw = promptInput.value;
            // 尝试删除完整的预设
            if (raw.includes(tag)) {

            raw = raw.split(',').map(p => p.trim()).filter(p => p).join(', ');

        // === 提示词标签预览 ===
        let PRESET_I18N_MAP = null;
        let PRESET_NAME_TO_ID = null;  // 中文名 → 预设 id，供 cn/en 切换反查用
        let PRESET_CN_TO_EN = null;    // i18n 反向：中文 token → 英文 token（供 lightbox 还原"翻译前英文"用）

        function loadPresetI18n() {
            if (PRESET_I18N_MAP !== null && PRESET_NAME_TO_ID !== null && PRESET_CN_TO_EN !== null) {
                return Promise.resolve(PRESET_I18N_MAP);
            }
            return Promise.all([
                fetch('/api/preset-i18n').then(r => r.json()),
                fetch('/api/preset-bidir').then(r => r.json())
            ]).then(([i18n, bidir]) => {
                PRESET_I18N_MAP = i18n || {};
                PRESET_NAME_TO_ID = (bidir && bidir.name_to_id) || {};
                // 构建反向 i18n 表：中文 → 英文 key
                const cn2en = {};
                Object.keys(PRESET_I18N_MAP).forEach(k => {
                    const cn = PRESET_I18N_MAP[k];
                    if (cn && !cn2en[cn]) cn2en[cn] = k;
                });
                // 预设名（中文） → 预设 id（id 本身是英文） 也并入
                if (bidir && bidir.id_to_name) {
                    Object.keys(bidir.id_to_name).forEach(id => {
                        const cn = bidir.id_to_name[id];
                        if (cn && !cn2en[cn]) cn2en[cn] = id;
                    });
                }
                PRESET_CN_TO_EN = cn2en;
                return PRESET_I18N_MAP;
            }).catch(e => { PRESET_I18N_MAP = {}; PRESET_NAME_TO_ID = {}; PRESET_CN_TO_EN = {}; return PRESET_I18N_MAP; });
        }

        // 把整段 prompt 翻译成中文（按 token 拆分，独立映射），未命中的 token 保持原文
        function translatePromptToCn(prompt) {
            if (!prompt) return '';
            const i18n = PRESET_I18N_MAP || {};
            return prompt.split(',').map(p => p.trim()).filter(Boolean).map(token => {
                if (hasChinese(token)) {
                    // 中文 token 优先查预设双向表（精准反查预设原 id），其余保留中文
                    if (PRESET_NAME_TO_ID && PRESET_NAME_TO_ID[token]) {
                        // 已是预设中文名，保留
                        return token;
                    }
                    return token;
                }
                const key = normalizePresetKey(token);
                return i18n[key] || token;
            }).join(', ');
        }

        // 把 prompt 还原成"原始英文"形式：把中文 token 通过反向 i18n/预设表替换回英文
        // 用于在 lightbox 第二行展示"翻译前的英文 prompt"
        function translatePromptToEn(prompt) {
            if (!prompt) return '';
            const cn2en = PRESET_CN_TO_EN || {};
            return prompt.split(',').map(p => p.trim()).filter(Boolean).map(token => {
                if (hasChinese(token)) {
                    // 优先预设名（精准），再回退到 i18n 反向表
                    if (PRESET_NAME_TO_ID && PRESET_NAME_TO_ID[token]) return PRESET_NAME_TO_ID[token];
                    if (cn2en[token]) return cn2en[token];
                }
                return token;
            }).join(', ');
        }

        // 把英文 token 归一化为 i18n 的 key
        function normalizePresetKey(token) {
            return token.toLowerCase()
                .replace(/[^a-z0-9]+/g, '_')
                .replace(/^_+|_+$/g, '');
        }

        function presetI18nText(token) {
            if (!PRESET_I18N_MAP) return null;
            const key = normalizePresetKey(token);
            const hit = PRESET_I18N_MAP[key] || null;
            return hit;
        }

        // 是否包含中文字符
        function hasChinese(s) {
            return /[\u4e00-\u9fa5]/.test(s);
        }

        // 全局：标签显示模式 'cn' (默认) / 'en'
        window.PROMPT_TAGS_LANG_MODE = window.PROMPT_TAGS_LANG_MODE || 'cn';

        // 切换中英文显示模式
        function togglePromptLang() {
            window.PROMPT_TAGS_LANG_MODE = window.PROMPT_TAGS_LANG_MODE === 'en' ? 'cn' : 'en';
            updatePromptTags();
        }

        // 渲染单个 tag 的最终显示文本
        // - 英文模式：含中文 token 通过 PRESET_NAME_TO_ID 反查预设 id；其余显示原文
        // - 中文模式：含中文直接显示；纯英文查 i18n
        function resolveTagDisplay(token) {
            const mode = window.PROMPT_TAGS_LANG_MODE;
            if (mode === 'en') {
                if (hasChinese(token)) {
                    if (PRESET_NAME_TO_ID && PRESET_NAME_TO_ID[token]) {
                        return { display: PRESET_NAME_TO_ID[token], original: token };
                    }
                    return { display: token, original: null };
                }
                return { display: token, original: null };
            }
            // cn 模式
            if (hasChinese(token)) return { display: token, original: null };
            // 先尝试直接匹配 i18n
            const cn = presetI18nText(token);
            if (cn) return { display: cn, original: token };
            // 尝试通过预设的 prompt 查找中文名（使用 name 字段）
            if (typeof presetPickerData !== 'undefined' && presetPickerData.categories) {
                for (const cat of presetPickerData.categories) {
                    if (cat.subcategories) {
                        for (const sub of cat.subcategories) {
                            if (sub.presets) {
                                for (const p of sub.presets) {
                                    if (p.prompt && p.prompt.trim() === token.trim()) {
                                        // 优先使用 name 字段（如果有中文）
                                        if (p.name && hasChinese(p.name)) {
                                            return { display: p.name, original: token };
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }
            return { display: token, original: null };
        }

        function updatePromptTags() {
            const promptInput = document.getElementById('prompt');
            const tagsContainer = document.getElementById('promptTags');
            if (!promptInput || !tagsContainer) return;

            // 显示/隐藏清空 + 切换键
            const hasText = !!promptInput.value.trim();
            const clearBtn = document.getElementById('clearPromptBtn');
            if (clearBtn) clearBtn.style.display = hasText ? 'flex' : 'none';
            const langBtn = document.getElementById('toggleLangBtn');
            if (langBtn) {
                langBtn.style.display = hasText ? 'flex' : 'none';
                langBtn.title = window.PROMPT_TAGS_LANG_MODE === 'en' ? '切换为中文' : '切换为英文';
                langBtn.classList.toggle('lang-active', window.PROMPT_TAGS_LANG_MODE === 'en');
            }

            // i18n 还没加载好时，等加载完再渲染（避免首屏预设应用时显示原文）
            if (PRESET_I18N_MAP === null) {
                loadPresetI18n().then(() => updatePromptTags());
                return;
            }

            // 智能分拆：先匹配完整预设，再分拆普通token
            const raw = promptInput.value;
            const parts = [];
            let remaining = raw;
            
            // 构建所有预设 prompt 的列表（按长度降序排列，优先匹配长的）
            const allPresets = [];
            if (typeof presetPickerData !== 'undefined' && presetPickerData.categories) {
                presetPickerData.categories.forEach(cat => {
                    if (cat.subcategories) {
                        cat.subcategories.forEach(sub => {
                            if (sub.presets) {
                                sub.presets.forEach(p => {
                                    if (p.prompt && p.prompt.includes(',')) {
                                        allPresets.push({ prompt: p.prompt.trim(), id: p.id });
                                    }
                                });
                            }
                        });
                    }
                });
            }
            allPresets.sort((a, b) => b.prompt.length - a.prompt.length);
            
            // 从原始文本中提取完整的多词预设
            while (remaining.trim() && remaining.trim() !== ',') {
                let matched = false;
                for (const preset of allPresets) {
                    if (remaining.includes(preset.prompt)) {
                        parts.push(preset.prompt);
                        remaining = remaining.replace(preset.prompt, ',').replace(/,+,/g, ',').replace(/^,|,$/g, '');
                        matched = true;
                        break;
                    }
                }
                if (!matched) {
                    // 没有匹配到完整预设，按逗号分拆
                    const commaIdx = remaining.indexOf(',');
                    if (commaIdx > -1) {
                        const token = remaining.substring(0, commaIdx).trim();
                        if (token) parts.push(token);
                        remaining = remaining.substring(commaIdx + 1);
                    } else {
                        const token = remaining.trim();
                        if (token && token !== ',') parts.push(token);
                        remaining = '';
                    }
                }
            }
            // 过滤空字符串
            const filteredParts = parts.filter(p => p && p.trim());
            let html = '';
            
            // 构建角色名称集合
            const charNames = new Set();
            if (typeof ANIMA_CHAR_DB !== 'undefined' && ANIMA_CHAR_DB.length > 0) {

        function buildAnimaTagThumbUrl(type, name) {
            if (type === 'artist') {
                if (typeof ANIMA_ARTIST_DB === 'undefined' || !ANIMA_ARTIST_DB.length) return '';
                const item = ANIMA_ARTIST_DB.find(a => a.name && a.name.toLowerCase() === name.toLowerCase());
                return (item && item.image_url) ? item.image_url : '';
            }
            if (type === 'char') {
                if (typeof ANIMA_CHAR_DB === 'undefined' || !ANIMA_CHAR_DB.length) return '';
                const item = ANIMA_CHAR_DB.find(c => c.name && c.name.toLowerCase() === name.toLowerCase());
                if (!item) return '';
                const raw = item.copyright ? item.name + ', ' + item.copyright : item.name;
                return 'https://blobs.animadex.net/Outputs/thumbs/' + encodeURIComponent(raw) + '.webp';
            }
            return '';
        }

        // === 进度条 ===
        function startProgress() { const el=document.getElementById('progressInline'); if(el) el.classList.add('active'); }
        function updateRealProgress(msg) {
            const fill=document.getElementById('progressFill'), pct=document.getElementById('progressPercent'), status=document.getElementById('progressStatus');
            if(msg.status==='sampling'){const v=msg.value||0,m=msg.max||1,p=10+Math.round((v/m)*80);fill.style.width=p+'%';pct.textContent=p+'%';status.textContent='采样中 '+v+'/'+m;}
            else if(msg.status==='done'){fill.style.width='95%';pct.textContent='95%';status.textContent='解码保存中...';}
            else if(msg.status==='started'){fill.style.width='2%';pct.textContent='2%';status.textContent='开始执行...';}
        }
        function completeProgress(){const el=document.getElementById('progressFill');if(el)el.style.width='100%';document.getElementById('progressPercent').textContent='100%';document.getElementById('progressStatus').textContent='生成完成!';}
        function hideProgress(){const el=document.getElementById('progressInline');if(el)el.classList.remove('active');}

        async function saveToUserOutput(comfyUrl, featureName) {
            try {
                const u=new URL(comfyUrl,window.location.origin),fn=u.searchParams.get('filename')||'',sf=u.searchParams.get('subfolder')||'',tp=u.searchParams.get('type')||'output';
                if(!fn)return comfyUrl;
                const token=localStorage.getItem('xy_auth_token')||'';
                const res=await fetch('/api/comfyui/save-to-output?filename='+encodeURIComponent(fn)+'&subfolder='+encodeURIComponent(sf)+'&type='+encodeURIComponent(tp)+'&feature='+encodeURIComponent(featureName)+'&token='+encodeURIComponent(token));
                if(!res.ok)return comfyUrl; const data=await res.json(); return data.url||comfyUrl;
            } catch(e){return comfyUrl;}
        }

        // === 主渲染逻辑 ===
        async function handleRender() {
            const prompt = document.getElementById('prompt').value.trim();
            if (!prompt) return alert("请输入提示词");
            if (currentEngine !== 'local') return alert("请切换到 COMFYUI 引擎");
            if (isGenerating) return;

            isGenerating = true;
            setLoading(true);
            startProgress();

            const placeholder = document.createElement('div');
            placeholder.className = 'masonry-item bg-gray-50 flex flex-col items-center justify-center border-dashed border-2 border-gray-200';
            placeholder.innerHTML = '<div class="w-6 h-6 border-2 border-gray-100 border-t-black rounded-full animate-spin mb-3"></div><span class="text-[8px] font-bold text-gray-400 uppercase">Rendering...</span>';
            document.getElementById('masonry').prepend(placeholder);

            try {
                // 加载工作流
                const wfRes = await fetch('/api/workflows/' + encodeURIComponent(currentWorkflow));
                if (!wfRes.ok) throw new Error('工作流加载失败');
                const wfEnvelope = await wfRes.json();
                const workflow = wfEnvelope.workflow || wfEnvelope;
                const seed = Math.floor(Math.random() * 10**15);

                if (currentWorkflow.includes('anima')) {
                    // 解析提示词，分离角色和画师标签
                    const parts = prompt.split(',').map(p => p.trim()).filter(p => p);
                    const charTags = parts.filter(p => !p.startsWith('by ') && !p.startsWith('@')).join(', ');
                    const artistTags = parts.filter(p => p.startsWith('by ') || p.startsWith('@')).map(p => '@' + p.replace(/^by /, '').replace(/^@/, '')).join(', ');
                    
                    const node51 = workflow["51"];
                    if (node51?.inputs) {
                        node51.inputs.character_tags = charTags;
                        // 合并画师标签和预设提示词
                        const presetPrompts = getActivePresetPrompts();
                        let optParts = [];
                        if (artistTags) optParts.push(artistTags);
                        if (presetPrompts) optParts.push(presetPrompts);
                        node51.inputs.opt_prompt = optParts.length > 0 ? optParts.join(', ') + ', ' : '';
                    }
                    // 设置图片尺寸
                    const size = getAnimaSize();
                    const node69 = workflow["69"];
                    if (node69?.inputs) {
                        node69.inputs.width = size.width;
                        node69.inputs.height = size.height;
                    }
                    // 种子：随机模式用随机值，固定模式用用户指定值
                    const finalSeed = animaSeedMode === 'fixed' && animaFixedSeed > 0 ? animaFixedSeed : seed;
                    if (workflow["19"]?.inputs) workflow["19"].inputs.seed = finalSeed;
                    // 覆盖 batch_size（使用与 KSampler(19).latent_image 来源节点对齐的值）
                    if (workflow["69"]?.inputs) workflow["69"].inputs.batch_size = currentBatchCount;
                    if (workflow["64"]?.inputs) workflow["64"].inputs.batch_size = currentBatchCount;
                } else {
                    // Z-Image：使用与 ANIMA 相同的 ratio+res 尺寸计算
                    const size = getAnimaSize();
                    if (workflow["23"]?.inputs) workflow["23"].inputs.text = prompt;
                    if (workflow["144"]?.inputs) { workflow["144"].inputs.width = size.width; workflow["144"].inputs.height = size.height; }
                    if (workflow["22"]?.inputs) workflow["22"].inputs.seed = seed;
                    if (workflow["144"]?.inputs) workflow["144"].inputs.batch_size = currentBatchCount;
                }
                console.log('[BatchCount] model=' + (currentWorkflow.includes('anima') ? 'ANIMA' : 'Z-Image') + ' currentBatchCount=' + currentBatchCount + ' n69=' + (workflow['69']?.inputs?.batch_size) + ' n64=' + (workflow['64']?.inputs?.batch_size) + ' n144=' + (workflow['144']?.inputs?.batch_size));

                currentPromptId = generateUUID();

                // WebSocket
                let ws = null;
                try {
                    ws = await new Promise((resolve, reject) => {
                        const socket = new WebSocket(COMFYUI_WS_URL);
                        socket.onopen = () => resolve(socket);
                        socket.onerror = () => reject(new Error('WebSocket连接失败'));
                        setTimeout(() => reject(new Error('WebSocket连接超时')), 5000);
                    });
                    ws.onmessage = (event) => {
                        try {
                            if (typeof event.data !== 'string') return;
                            const msg = JSON.parse(event.data);
                            if (msg.type === 'progress' && msg.data?.prompt_id === currentPromptId) updateRealProgress({status:'sampling',value:msg.data.value,max:msg.data.max});
                            else if (msg.type === 'executing' && msg.data?.prompt_id === currentPromptId) {
                                if (msg.data.node === null) updateRealProgress({status:'done'});
                                else updateRealProgress({status:'executing'});
                            } else if (msg.type === 'execution_start') updateRealProgress({status:'started'});
                        } catch(e){}
                    };
                } catch(e) { ws = null; }

                // 提交
                const res = await fetch('/api/comfyui/prompt', {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ prompt: workflow, client_id: CLIENT_ID, prompt_id: currentPromptId })
                });
                if (!res.ok) throw new Error('提交失败: ' + await res.text());

                // 等待结果（多张生成：收集所有图片）
                const finalUrls = await new Promise((resolve, reject) => {
                    const checkInterval = setInterval(async () => {
                        try {
                            const r = await fetch('/api/comfyui/history/' + currentPromptId);
                            const history = await r.json();
                            const pd = history[currentPromptId];
                            if (!pd) return;
                            if (pd.status?.status_str === 'error') { clearInterval(checkInterval); reject(new Error('执行错误')); return; }
                            if (pd.outputs) {
                                // 收集所有节点的所有图片
                                // ⚠ 注意：ANIMA 工作流中 PreviewImage(1) 和 SaveImage(70) 都接 VAEDecode(8)，
                                //   如果两个都采集会产生 2× 重复。优先只采 SaveImage，
                                //   如果 workflow 中没有 SaveImage，再退而求其次采集 PreviewImage。
                                const SAVE_NODE = currentWorkflow.includes('anima') ? '70' : null;
                                const allImgs = [];
                                const seenFilenames = new Set();
                                const collectFrom = (nid) => {
                                    const imgs = pd.outputs[nid]?.images;
                                    if (!imgs) return;
                                    for (const img of imgs) {
                                        const key = (img.filename||'') + '|' + (img.subfolder||'') + '|' + (img.type||'output');
                                        if (seenFilenames.has(key)) continue;
                                        seenFilenames.add(key);
                                        allImgs.push('/api/comfyui/view?filename='+encodeURIComponent(img.filename)+'&subfolder='+encodeURIComponent(img.subfolder||'')+'&type='+encodeURIComponent(img.type||'output'));
                                    }
                                };
                                if (SAVE_NODE && pd.outputs[SAVE_NODE]) {
                                    collectFrom(SAVE_NODE);
                                } else {
                                    // 退路：采所有输出节点，并去重
                                    for (const nid in pd.outputs) collectFrom(nid);
                                }
                                if (allImgs.length > 0) {
                                    clearInterval(checkInterval);
                                    resolve(allImgs);
                                    return;
                                }
                            }
                        } catch(e){}
                    }, 1000);
                    setTimeout(() => { clearInterval(checkInterval); reject(new Error('超时')); }, 180000);
                });

                if (ws) try { ws.close(); } catch(e){}

                const featureName = currentWorkflow.includes('anima') ? 'anima' : 'zimage';
                // 多张生成：逐个保存到用户目录
                const localUrls = [];
                for (let i = 0; i < finalUrls.length; i++) {
                    const localUrl = await saveToUserOutput(finalUrls[i], featureName);
                    localUrls.push(localUrl);
                    if (finalUrls.length > 1) {
                        const pct = Math.round(95 + ((i+1)/finalUrls.length) * 5);
                        const el = document.getElementById('progressFill');
                        const pctEl = document.getElementById('progressPercent');
                        const statusEl = document.getElementById('progressStatus');
                        if (el) el.style.width = pct + '%';
                        if (pctEl) pctEl.textContent = pct + '%';
                        if (statusEl) statusEl.textContent = `保存 ${i+1}/${finalUrls.length}...`;
                    }
                }
                completeProgress();
                // 从URL路径提取文件夹名作为类型标识
                const folderMatch = localUrls[0].match(/\/output\/[^/]+\/([^/]+)\//);
                const folderName = folderMatch ? folderMatch[1] : featureName;
                const record = { timestamp: Date.now(), prompt, images: localUrls, type: currentWorkflow.includes('anima') ? 'anima' : 'zimage', model: folderName.toUpperCase() };
                // 保存到历史记录
                try {
                    await fetch('/api/history/save', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(record)
                    });
                } catch(e) { console.error('保存历史记录失败:', e); }
                GalleryList.pushNewImage(record);

                if (placeholder.parentNode) placeholder.remove();
            } catch(e) {
                if (placeholder.parentNode) placeholder.remove();
                alert(e.message || "生成失败");
            } finally {
                isGenerating = false;
                setLoading(false);
                setTimeout(() => hideProgress(), 2000);
            }
        }

        function lightboxAction(action) {
            if (!lightboxCurrentRecord) return;
            const record = lightboxCurrentRecord;
            const imgUrl = (record.images && record.images[lightboxCurrentIndex]) || '';
            const ts = record.timestamp;

            switch (action) {
                case 'openFolder':
                    if (window.GalleryActions && GalleryActions.openImageFolder) {
                        GalleryActions.openImageFolder(record, event);
                    }
                    break;
                case 'download':
                    if (window.GalleryActions && GalleryActions.downloadImage) {
                        GalleryActions.downloadImage(imgUrl, String(ts) + '.png', event);
                    }
                    break;
                case 'favorite':
                    if (window.GalleryActions && GalleryActions.toggleFavorite) {
                        GalleryActions.toggleFavorite(record, event);
                        updateLightboxFavBtn();
                    }
                    break;
                case 'copyPrompt':
                    if (window.GalleryActions && GalleryActions.copyPrompt) {
                        GalleryActions.copyPrompt(record, event);
                    }
                    break;
                case 'usePrompt':
                    if (window.GalleryActions && GalleryActions.usePrompt) {
                        GalleryActions.usePrompt(record, event);
                    }
                    break;
                case 'delete':
                    if (window.GalleryActions && GalleryActions.deleteHistoryItem) {
                        if (confirm('确认删除这张图片？')) {

        function updateLightboxThumbnails() {
            const container = document.getElementById('lightboxThumbnails');
            if (!container || lightboxImages.length <= 1) {
                if (container) container.style.display = 'none';
                return;
            }
            container.style.display = 'flex';
            container.innerHTML = lightboxImages.map((url, i) => 
                `<div class="lightbox-thumb${i === lightboxCurrentIndex ? ' active' : ''}" data-index="${i}">
                    <img src="/api/media-preview?w=96&url=${encodeURIComponent(url)}" alt="缩略图 ${i + 1}" draggable="false">
                </div>`
            ).join('');
            // 滚动到当前缩略图
            const activeThumb = container.querySelector('.active');
            if (activeThumb) activeThumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            // 绑定鼠标滚轮和拖动滚动
            if (!container._thumbScrollBound) {
                container._thumbScrollBound = true;
                let isDragging = false;
                let hasMoved = false;
                let startX = 0;
                let startScrollLeft = 0;
                const DRAG_THRESHOLD = 5;

                // 鼠标滚轮水平滚动
                container.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    container.scrollLeft += e.deltaY * 2;
                }, { passive: false });

                // 拖动滚动
                container.addEventListener('mousedown', (e) => {
                    isDragging = true;
                    hasMoved = false;
                    startX = e.pageX;
                    startScrollLeft = container.scrollLeft;
                    container.style.cursor = 'grabbing';
                    e.preventDefault();
                });

                document.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    const dx = e.pageX - startX;
                    if (Math.abs(dx) > DRAG_THRESHOLD) {
                        hasMoved = true;
                    }
                    if (hasMoved) {
                        container.scrollLeft = startScrollLeft - dx;
                    }
                });

                document.addEventListener('mouseup', () => {
                    if (isDragging) {
                        isDragging = false;
                        container.style.cursor = 'grab';
                    }
                });

                // 点击缩略图切换图片（只在没有拖动时触发）
                container.addEventListener('click', (e) => {
                    if (hasMoved) return;
                    const thumb = e.target.closest('.lightbox-thumb');
                    if (thumb) {
                        const index = parseInt(thumb.dataset.index);
                        if (!isNaN(index)) switchLightboxImage(index);
                    }
                });
            }
        }

        window.switchLightboxImage = function(index) {
            if (index >= 0 && index < lightboxImages.length) {
                lightboxCurrentIndex = index;
                const img = document.getElementById('lightboxImg');
                if (img) img.src = lightboxImages[index];
                updateLightboxThumbnails();
                // 触发 ImageViewer 切换
                if (ImageViewer && typeof ImageViewer.goTo === 'function') {
                    ImageViewer.goTo(index);
                }
            }
        };

        function openLightbox(url, imagesOrPrompt, startIndexOrPrompt, promptParam) {
            const promptEl = document.getElementById('lightboxPrompt');
            const promptCnEl = document.getElementById('lightboxPromptCn');
            const promptEnEl = document.getElementById('lightboxPromptEn');
            const actionsEl = document.getElementById('lightboxActions');

            // 查找当前图片对应的 record
            function findRecord(imgUrl) {
                try {
                    const allHistory = (window.GalleryList && window.GalleryList.allHistory) || [];
                    for (const h of allHistory) {
                        if (h.images && h.images.includes(imgUrl)) {
                            return h;
                        }
                    }
                } catch (e) {}
                return null;
            }

            // 切图后回调：更新提示词、缩略图和操作按钮
            const onImageChange = (idx, imgUrl, newPrompt) => {
                lightboxCurrentIndex = idx;
                lightboxCurrentRecord = findRecord(imgUrl);
                updateLightboxThumbnails();
                updateLightboxFavBtn();
                if (!promptEl) return;
                currentLightboxPrompt = newPrompt || '';
                if (!currentLightboxPrompt) {
                    promptEl.style.display = 'none';
                    return;
                }
                const raw = currentLightboxPrompt;
                if (promptEnEl) promptEnEl.textContent = '';
                if (promptCnEl) promptCnEl.textContent = raw;
                promptEl.style.display = '';
                loadPresetI18n().then(() => {
                    if (promptEnEl && document.getElementById('lightbox') && !document.getElementById('lightbox').classList.contains('hidden')) {
                        promptEnEl.textContent = translatePromptToEn(raw);
                    }
                });
            };

            // 初始记录
            const firstImgUrl = Array.isArray(imagesOrPrompt) ? (imagesOrPrompt[startIndexOrPrompt || 0] || url) : url;
            lightboxCurrentRecord = findRecord(firstImgUrl);
            if (actionsEl) {
                actionsEl.style.display = lightboxCurrentRecord ? 'flex' : 'none';
            }
            updateLightboxFavBtn();

            // 获取所有历史记录的图片列表
            function getAllHistoryImages() {
                const allHistory = (window.GalleryList && window.GalleryList.allHistory) || [];
                const allImages = [];
                allHistory.forEach(h => {
                    if (h.images && h.images.length) {
                        h.images.forEach(u => { if (u) allImages.push(u); });
                    }
                });
                return allImages;
            }

            if (Array.isArray(imagesOrPrompt)) {
                // 3/4/5 param版本：openLightbox(image, allImages, startIndex[, prompt[, allPrompts]])
                // 4 参版本 promptParam 是当前首图 prompt；5 参版本 allPrompts 包含每张图对应的 prompt
                currentLightboxPrompt = promptParam || '';
                // 使用所有历史记录的图片
                lightboxImages = getAllHistoryImages();
                // 找到当前图片在所有图片中的索引
                lightboxCurrentIndex = lightboxImages.indexOf(firstImgUrl);
                if (lightboxCurrentIndex === -1) lightboxCurrentIndex = 0;
                if (lightboxImages.length > 1) {
                    // 从 allHistory 获取所有图片的提示词
                    let prompts = [];
                    try {
                        const allHistory = (window.GalleryList && window.GalleryList.allHistory) || [];
                        const historyByImage = new Map();
                        allHistory.forEach(h => {
                            if (h.images && h.images.length) {
                                h.images.forEach(u => { if (u) historyByImage.set(u, h); });
                            }
                        });
                        prompts = lightboxImages.map(imgUrl => {
                            const h = historyByImage.get(imgUrl);
                            return (h && h.prompt) || '';
                        });
                    } catch (e) {}
                    // 如果调用方传入了 5 参 allPrompts，用它覆写（更准确）
                    if (arguments.length >= 5 && Array.isArray(arguments[4]) && arguments[4].length === imagesOrPrompt.length) {
                        prompts = arguments[4];
                    }
                    ImageViewer.init(lightboxImages, lightboxCurrentIndex, { prompts, onShow: onImageChange });
                    document.getElementById('lightboxPrevBtn').style.display = '';
                    document.getElementById('lightboxNextBtn').style.display = '';
                } else {
                    lightboxImages = getAllHistoryImages();
                    lightboxCurrentIndex = lightboxImages.indexOf(url);
                    if (lightboxCurrentIndex === -1) lightboxCurrentIndex = 0;
                    ImageViewer.init(lightboxImages, lightboxCurrentIndex);
                    document.getElementById('lightboxPrevBtn').style.display = lightboxImages.length > 1 ? '' : 'none';
                    document.getElementById('lightboxNextBtn').style.display = lightboxImages.length > 1 ? '' : 'none';
                }
            } else {
                // 2 param版本：openLightbox(image, prompt) — url 也可能是图片数组
                currentLightboxPrompt = imagesOrPrompt || '';
                if (Array.isArray(url)) {
                    lightboxImages = getAllHistoryImages();
                    lightboxCurrentIndex = lightboxImages.indexOf(url[0]);
                    if (lightboxCurrentIndex === -1) lightboxCurrentIndex = 0;
                    ImageViewer.init(lightboxImages, lightboxCurrentIndex);
                    document.getElementById('lightboxPrevBtn').style.display = lightboxImages.length > 1 ? '' : 'none';
                    document.getElementById('lightboxNextBtn').style.display = lightboxImages.length > 1 ? '' : 'none';
                } else {
                    lightboxImages = getAllHistoryImages();
                    lightboxCurrentIndex = lightboxImages.indexOf(url);
                    if (lightboxCurrentIndex === -1) lightboxCurrentIndex = 0;
                    ImageViewer.init(lightboxImages, lightboxCurrentIndex);
                    document.getElementById('lightboxPrevBtn').style.display = lightboxImages.length > 1 ? '' : 'none';
                    document.getElementById('lightboxNextBtn').style.display = lightboxImages.length > 1 ? '' : 'none';
                }
            }
            updateLightboxThumbnails();
            if (promptEl) {
                if (currentLightboxPrompt) {
                    const raw = currentLightboxPrompt;
                    // 第一行：翻译前的英文 prompt（中文 token 通过反向表还原回英文）
                    // 第二行：原文（可能是中文，淡色辅助显示）
                    if (promptEnEl) promptEnEl.textContent = ''; // 等待翻译
                    if (promptCnEl) promptCnEl.textContent = raw;
                    promptEl.style.display = '';
                    // 异步等待 i18n 表加载完再填英文
                    loadPresetI18n().then(() => {
                        if (promptEnEl && document.getElementById('lightbox') && !document.getElementById('lightbox').classList.contains('hidden')) {
                            promptEnEl.textContent = translatePromptToEn(raw);
                        }
                    });
                } else {
                    promptEl.style.display = 'none';
                }
            }
        }
        function closeLightbox() {
            document.getElementById('lightbox').classList.add('hidden');
            document.body.style.overflow = '';
            const actionsEl = document.getElementById('lightboxActions');
            if (actionsEl) actionsEl.style.display = 'none';
            lightboxCurrentRecord = null;
            setTimeout(() => { document.getElementById('lightboxImg').src = ''; }, 300);
        }
        function handleOutsideClick(e) { if (e.target.id === 'lightbox') closeLightbox(); }
        function downloadImage() {
            const img = document.getElementById('lightboxImg');
            if (!img.src) return;
            const a = document.createElement('a');
            a.href = img.src; a.download = 'generated_' + Date.now() + '.png';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }
        window.openLightbox = openLightbox;

        // === 初始化 ===
        window.GALLERY_CONFIG = {
            type: 'zimage,anima',
            container: '#masonry',
            trigger: '#loadMoreTrigger',
            pageSize: 15,
            features: { delete: true, openFolder: true, download: true, copyToCanvas: false, regenerate: false, batchSelect: false, contextMenu: true, imageFallback: true, modelBadge: 'auto', favorite: true, copyPrompt: true, usePrompt: true }
        };
        // 初始化收藏 Set（从 localStorage 读取）
        try {
            const arr = JSON.parse(localStorage.getItem('zimage_favorites') || '[]');
            window.__galleryFavorites = new Set((arr || []).map(String));
        } catch (_) { window.__galleryFavorites = new Set(); }
        GalleryList.init({ type:'zimage,anima', container:'#masonry', trigger:'#loadMoreTrigger', pageSize:15, batchSelect:false });
        // 移动工具栏到固定位置
        setTimeout(() => {
            const toolbar = document.querySelector('.history-bulk-toolbar');
            const placeholder = document.getElementById('toolbarPlaceholder');
            if (toolbar && placeholder) {
                placeholder.appendChild(toolbar);
            }
        }, 100);
        // MutationObserver 监听新图片插入，不再强制重新布局
        // CSS columns 会自动处理新插入的元素
        window.HistoryBulkManager?.attach({
            masonry: '#masonry',
            extraButtons: [
                {
                    id: 'thumb-size',
                    label: '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="3" width="10" height="10" rx="2"/><rect x="12" y="3" width="3" height="5" rx="1" opacity="0.4"/><rect x="12" y="9" width="3" height="4" rx="1" opacity="0.4"/></svg>',
                    title: '切换缩略图尺寸（默认）',
                    onClick: (btn) => {
                        const modes = ['thumb-large', 'thumb-medium', 'thumb-small'];
                        const icons = [
                            '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="14" height="14" rx="2"/></svg>',
                            '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="3" width="10" height="10" rx="2"/><rect x="12" y="3" width="3" height="5" rx="1" opacity="0.4"/><rect x="12" y="9" width="3" height="4" rx="1" opacity="0.4"/></svg>',
                            '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="5" height="5" rx="1"/><rect x="7" y="1" width="5" height="5" rx="1" opacity="0.6"/><rect x="1" y="7" width="5" height="5" rx="1" opacity="0.6"/><rect x="7" y="7" width="5" height="5" rx="1" opacity="0.4"/></svg>'
                        ];
                        const grid = document.getElementById('masonry');
                        if (!grid) return;
                        const cur = modes.findIndex(m => grid.classList.contains(m));
                        const next = (cur + 1) % modes.length;
                        modes.forEach(m => grid.classList.remove(m));
                        grid.classList.add(modes[next]);
                        btn.innerHTML = icons[next];
                        btn.title = ['大图', '默认', '小图'][next];
                        try { localStorage.setItem('zimage_thumb_size', String(next)); } catch (_) {}
                    }
                },
                {
                    id: 'fav-toggle',
                    label: '★ 收藏',
                    title: '仅显示已收藏的图',
                    onClick: (btn) => {
                        const on = !document.body.classList.contains('fav-mode');
                        document.body.classList.toggle('fav-mode', on);
                        btn.classList.toggle('is-on', on);
                        try { localStorage.setItem('zimage_fav_mode', on ? '1' : '0'); } catch (_) {}
                    }
                },
                {
                    id: 'nsfw-toggle',
                    label: '🚫 屏蔽 NSFW',
                    title: '将 prompt 中含 NSFW 关键词的生成图替换为蒙版',
                    onClick: (btn) => {
                        const on = !document.body.classList.contains('nsfw-mode');
                        document.body.classList.toggle('nsfw-mode', on);
                        btn.classList.toggle('is-on', on);
                        try { localStorage.setItem('zimage_nsfw_block', on ? '1' : '0'); } catch (_) {}
                    }
                }
            ]
        });
        // 恢复 NSFW / 收藏过滤偏好
        try {
            if (localStorage.getItem('zimage_fav_mode') === '1') {
                document.body.classList.add('fav-mode');
                setTimeout(() => {
                    const btn = document.querySelector('[data-extra-btn="fav-toggle"]');
                    if (btn) btn.classList.add('is-on');
                }, 0);
            }
        } catch (_) {}
        try {
            if (localStorage.getItem('zimage_nsfw_block') === '1') {
                document.body.classList.add('nsfw-mode');
                // 等工具栏注入后同步按钮态
                setTimeout(() => {
                    const btn = document.querySelector('[data-extra-btn="nsfw-toggle"]');
                    if (btn) btn.classList.add('is-on');
                }, 0);
            }
        } catch (_) {}
        // 恢复缩略图尺寸偏好
        try {
            const savedThumb = parseInt(localStorage.getItem('zimage_thumb_size')) || 0;
            if (savedThumb >= 0 && savedThumb <= 2) {
                const modes = ['thumb-large', 'thumb-medium', 'thumb-small'];
                const icons = [
                    '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="14" height="14" rx="2"/></svg>',
                    '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="3" width="10" height="10" rx="2"/><rect x="12" y="3" width="3" height="5" rx="1" opacity="0.4"/><rect x="12" y="9" width="3" height="4" rx="1" opacity="0.4"/></svg>',
                    '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="5" height="5" rx="1"/><rect x="7" y="1" width="5" height="5" rx="1" opacity="0.6"/><rect x="1" y="7" width="5" height="5" rx="1" opacity="0.6"/><rect x="7" y="7" width="5" height="5" rx="1" opacity="0.4"/></svg>'
                ];
                setTimeout(() => {
                    const grid = document.getElementById('masonry');
                    const btn = document.querySelector('[data-extra-btn="thumb-size"]');
                    if (grid) { grid.classList.add(modes[savedThumb]); }
                    if (btn) { btn.innerHTML = icons[savedThumb]; btn.title = ['大图', '默认', '小图'][savedThumb]; }
                }, 0);
            }
        } catch (_) {}
        const savedWf = localStorage.getItem('zimage_workflow');
        if (savedWf && (savedWf === 'Z-Image.json' || savedWf.includes('anima'))) switchWorkflow(savedWf);
        else updateParamsUI();
        window.onload = () => { GalleryList.load(0); updatePromptTags(); };
        updateBatchCountUI();
    </script>
</body>
</html>
