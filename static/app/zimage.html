        async function parseJsonResponse(res, label) {
            const raw = await res.text();
            if (!raw.trim()) {
                throw new Error((label || '接口') + ' 返回了空响应（HTTP ' + res.status + '），多为服务瞬时中断，请重试一次');

            try {
                return JSON.parse(raw);

                throw new Error((label || '接口') + ' 返回了无效 JSON（HTTP ' + res.status + '）：'
                    + String(e.message) + ' | 内容开头: ' + raw.slice(0, 120));
            }
        }

            if (_sharedWs && _sharedWs.readyState === 1) return Promise.resolve();
            if (_sharedWs && _sharedWs.readyState === 0) return new Promise((r) => {
                _sharedWs.addEventListener('open', r, { once: true });
                setTimeout(r, 3000);
            });
            if (_wsReconnectTimer) { clearTimeout(_wsReconnectTimer); _wsReconnectTimer = null; }
            _sharedWs = null;
            return new Promise((resolve) => {
                try {
                    const ws = new WebSocket(COMFYUI_WS_URL);

                    ws.onopen = () => resolve();
                    setTimeout(resolve, 3000);
                    ws.onmessage = (e) => {
                        try {

        function getCurrentWorkflowUnet() {

        function chooseReplacementModel(missing, models) {

            const exact = models.find(name => norm(name) === wanted);
            if (exact) return exact;
            const folder = wanted.slice(0, wanted.lastIndexOf('/') + 1);
            if (!folder) return '';
            // Turbo 与常规采样配置不同，不跨此边界自动替换。
            const turbo = /turbo/.test(wanted);
            return models.filter(name => {
                const path = norm(name);
                return path.slice(0, path.lastIndexOf('/') + 1) === folder && /turbo/.test(path) === turbo;
            }).sort((a, b) => a.localeCompare(b))[0] || '';

        async function resolveWorkflowModels(workflow) {
            const schemas = new Map();
            const replacements = [];
            for (const node of Object.values(workflow)) {
                const type = node?.class_type || '';
                const field = type === 'UNETLoader' ? 'unet_name' : type.includes('LoadDiffusionModel') ? 'model_name' : '';
                const original = field && node.inputs?.[field];
                if (!original) continue;
                if (!schemas.has(type)) {
                    const res = await fetch('/api/comfyui/object_info/' + encodeURIComponent(type));
                    if (!res.ok) throw new Error('无法检查 ComfyUI 模型列表，请确认服务正常');
                    const data = await res.json();
                    const models = data[type]?.input?.required?.[field]?.[0];
                    if (!Array.isArray(models)) throw new Error('无法读取模型列表：' + type);
                    schemas.set(type, models);
                }
                const replacement = chooseReplacementModel(original, schemas.get(type));
                if (!replacement) throw new Error('模型已不存在，且无可自动替换的同目录、同采样类型模型：' + original + '。请在模型设置中选择。');

        async function fetchUnetModels() {
            const groups = [];
            // 直接查轻量接口，避免全量 object_info 响应过大超时
            const endpoints = [
                { url: '/api/comfyui/object_info/UNETLoader', key: 'UNETLoader', field: 'unet_name', label: 'UNET 模型' },
                { url: '/api/comfyui/object_info/LoadDiffusionModelShared%20%2F%2F%2FInspire', key: 'LoadDiffusionModelShared //Inspire', field: 'model_name', label: 'Shared Diffusion 模型' },
            ];
            for (const ep of endpoints) {
                try {
                    const res = await fetch(ep.url);
                    if (!res.ok) continue;
                    const data = await res.json();
                    const node = data[ep.key];
                    const models = node?.input?.required?.[ep.field]?.[0];
                    if (Array.isArray(models) && models.length) {
                        groups.push({ label: ep.label, items: models });
                    }
                } catch (e) {}
            }
            return groups;
        }

        function renderDropdown({ btnId, textId, menuId, menuClass, value, options, dataKey, onChange, toggleFn, iconSvg, grid }) {

        async function cloudRunOnlineTask(body, card, startedAt, chatTask) {

            const created = await fetch('/api/canvas-image-tasks', {
                signal, method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
            });
            const task = await created.json();
            if (!created.ok || !task.task_id) throw new Error(task.detail || '创建生成任务失败');
            while (true) {
                chatTask?.check();
                const response = await fetch('/api/canvas-image-tasks/' + encodeURIComponent(task.task_id), { signal });
                const state = await response.json();
                if (!response.ok) throw new Error(state.detail || '查询生成状态失败');
                if (state.status === 'failed') throw new Error(state.error || '生成失败');
                if (state.status === 'succeeded') return state.result;
                cloudReportProgress(card, state.progress, startedAt, chatTask);
                await new Promise((resolve, reject) => {
                    const abort = () => { clearTimeout(timer); signal?.removeEventListener('abort', abort); reject(new DOMException('已停止等待；远端任务可能仍在运行', 'AbortError')); };
                    const timer = setTimeout(() => { signal?.removeEventListener('abort', abort); resolve(); }, 1000);

            if (!container._thumbScrollBound) {
                container._thumbScrollBound = true;
                let isDragging = false;
                let hasMoved = false;
                let startX = 0;
                let startScrollLeft = 0;
                const DRAG_THRESHOLD = 5;

                // 鼠标滚轮水平滚动
                container.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    container.scrollLeft += e.deltaY * 2;
                }, { passive: false });

                // 拖动滚动
                container.addEventListener('mousedown', (e) => {
                    isDragging = true;
                    hasMoved = false;
                    startX = e.pageX;
                    startScrollLeft = container.scrollLeft;
                    container.style.cursor = 'grabbing';
                    e.preventDefault();
                });

                document.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    const dx = e.pageX - startX;
                    if (Math.abs(dx) > DRAG_THRESHOLD) {
                        hasMoved = true;
                    }
                    if (hasMoved) {
                        container.scrollLeft = startScrollLeft - dx;
                    }

                document.addEventListener('mouseup', () => {
                    if (isDragging) {

                            console.log('[取消收藏] 资产库原已存在该图，保留:', rec.url);
                        }
                    }
                });
            }
        })();

        bootZimageGallery();

        const LEGACY_WF_MAP = {
            'Z-Image.json': 'text2image/z-image.json',
            'anima 动漫文生图.json': 'text2image/anima.json',
            'Krea2-Turbo.json': 'text2image/krea2-turbo.json',

            'Boogu-Base.json': 'text2image/boogu-base.json',
            'Boogu-Turbo.json': 'text2image/boogu-turbo.json',
        };
        const savedRaw = localStorage.getItem('zimage_workflow');
        const savedWf = (savedRaw && LEGACY_WF_MAP[savedRaw]) || savedRaw;
        if (savedWf && (savedWf.startsWith('text2image/') || LEGACY_WF_MAP[savedRaw])) switchWorkflow(savedWf);
        else updateParamsUI();
        ModelVisibility.subscribe(syncVisibleModels);
        // 可用性快照是后台到的：到达后把当前已选中的不可用模型切走并重绘菜单
        if (window.ModelAvailability) window.ModelAvailability.subscribe(function () {
            syncVisibleModels();

        loadBuiltinWorkflowMeta();
        // 瀑布流自愈：任何路径往 #masonry 增删卡片都触发一次分栏重算（消除多列陈旧碎片导致的重叠）
        (function watchMasonryReflow() {
            const setup = () => {
                const el = document.getElementById('masonry');

        })();

        // ============================================================
        //  LoRA 管理器（已提取为独立模块 static/modules/lora-manager.js）
        //  兼容别名定义在脚本顶部
        // ============================================================
        function bootLoraManager() {
            if (typeof LoraManager === 'undefined') {
                document.addEventListener('DOMContentLoaded', bootLoraManager, { once: true });

            // 初始化时根据当前工作流设置 LoRA 过滤
            if (currentWorkflow) LoraManager.setWorkflowFilter(currentWorkflow);

        bootLoraManager();

        function updatePickerButtonsHighlight() {
            const promptInput = document.getElementById('prompt');
            const parts = splitPrompt(promptInput ? promptInput.value : '');
            const lowerSet = new Set(parts.map(p => p.toLowerCase()));

            // ---- 角色（旧版本写法：直接 typeof + 每次重建 Set，绕开 safeDbAvailable / getCharIndex 缓存链 bug） ----
            let charCount = 0;
            try {
                if (typeof ANIMA_CHAR_DB !== 'undefined' && ANIMA_CHAR_DB && ANIMA_CHAR_DB.length > 0) {
                    const _charNameSet = new Set(ANIMA_CHAR_DB.map(c => (c.name || '').toLowerCase()).filter(Boolean));
                    const _charTriggerSet = new Set();
                    ANIMA_CHAR_DB.forEach(c => {
                        if (Array.isArray(c.triggers)) c.triggers.forEach(t => _charTriggerSet.add(String(t).toLowerCase()));
                        else if (typeof c.trigger === 'string') _charTriggerSet.add(c.trigger.toLowerCase());
                    });
                    parts.forEach(t => {
                        if (!t) return;
                        if (promptHasArtistToken(t) || t.startsWith('[')) return;
                        const tl = t.toLowerCase();
                        if (_charNameSet.has(tl) || _charTriggerSet.has(tl)) charCount++;
                    });
                }
            } catch (_) {}
            setPickerButtonState('charPickerBtn', 'charPickerBtnText', charCount, ' 角色');

            // ---- 画师（旧版本写法） ----
            let artistCount = 0;
            try {
                if (typeof ANIMA_ARTIST_DB !== 'undefined' && ANIMA_ARTIST_DB && ANIMA_ARTIST_DB.length > 0) {
                    const _artistNameSet = new Set(ANIMA_ARTIST_DB.map(a => (a.name || '').toLowerCase()).filter(Boolean));
                    parts.forEach(t => {
                        const name = extractArtistName(t);
                        if (name && _artistNameSet.has(name.toLowerCase())) artistCount++;
                    });
                }
            } catch (_) {}
            setPickerButtonState('artistPickerBtn', 'artistPickerBtnText', artistCount, ' 画师');

            // ---- 预设（旧版本写法） ----
            let presetCount = 0;
            try {
                if (typeof _flatIndex !== 'undefined' && _flatIndex && _flatIndex.length > 0) {
                    const seenKeys = new Set();
                    _flatIndex.forEach(p => {
                        if (!p) return;
                        const name = (p.name || '').toLowerCase();
                        const prompt = (p.prompt || '').toLowerCase();
                        if ((name && lowerSet.has(name)) || (prompt && lowerSet.has(prompt))) {
                            const key = (p.category_id || p.category || '') + ':' + (p.id || p.name);
                            if (!seenKeys.has(key)) { seenKeys.add(key); presetCount++; }
                        }
                    });
                }
            } catch (_) {}
            setPickerButtonState('presetPickerBtn', 'presetPickerBtnText', presetCount, ' 预设');
            setPickerButtonState('promptPickerBtn', 'promptPickerBtnText', window.GenerationPromptLibrary ? GenerationPromptLibrary.count() : charCount + artistCount + presetCount, ' 提示词');

            // ---- 参考图 ----
            var refCount = (typeof _refImgMgr !== 'undefined' && _refImgMgr) ? _refImgMgr.getCount() : 0;
            setPickerButtonState('refImageBtn', 'refImageBtnText', refCount, ' 参考图');

            // LoRA
            updateLoraSwitcherVisibility();
        }
        // 暴露到 window 供各选择器脚本调用
        window.updatePickerButtonsHighlight = updatePickerButtonsHighlight;

        function syncPickerStatesFromPrompt() {
            const promptInput = document.getElementById('prompt');
            if (!promptInput) return;
            const parts = splitPrompt(promptInput.value);
            const lowerSet = new Set(parts.map(p => p.toLowerCase()));

            // ---- 角色（旧版本写法：直接 typeof + 每次重建 Set，绕开 safeDbAvailable / getCharIndex 缓存链 bug） ----
            try {
                if (typeof pickerSelected !== 'undefined' && typeof ANIMA_CHAR_DB !== 'undefined' && ANIMA_CHAR_DB && ANIMA_CHAR_DB.length > 0) {
                    const _charNameSet = new Set(ANIMA_CHAR_DB.map(c => (c.name || '').toLowerCase()).filter(Boolean));
                    const _charTriggerSet = new Set();
                    ANIMA_CHAR_DB.forEach(c => {
                        if (Array.isArray(c.triggers)) c.triggers.forEach(t => _charTriggerSet.add(String(t).toLowerCase()));
                        else if (typeof c.trigger === 'string') _charTriggerSet.add(c.trigger.toLowerCase());
                    });
                    // 1) 移除：pickerSelected 中已不在 prompt 的项
                    let newPickerSelected = pickerSelected.filter(name => {
                        if (!name) return false;
                        const nl = name.toLowerCase();
                        if (lowerSet.has(nl)) return true;
                        const char = ANIMA_CHAR_DB.find(c => (c.name || '').toLowerCase() === nl);
                        if (!char) return false;
                        const triggers = Array.isArray(char.triggers) ? char.triggers : (char.trigger ? [char.trigger] : []);
                        return triggers.some(t => lowerSet.has(String(t || '').toLowerCase()));
                    });
                    // 2) 添加：prompt 中「确实是角色」的 token 但 pickerSelected 还没有的
                    const existing = new Set(newPickerSelected.map(n => n.toLowerCase()));
                    parts.forEach(t => {
                        if (!t) return;
                        if (promptHasArtistToken(t) || t.startsWith('[')) return;
                        const tl = t.toLowerCase();
                        if (existing.has(tl)) return;
                        if (_charNameSet.has(tl) && !_charTriggerSet.has(tl)) {
                            newPickerSelected.push(t);
                            existing.add(tl);
                        } else if (_charTriggerSet.has(tl)) {
                            // 是 trigger：从 DB 里找对应的真实 name
                            const hit = ANIMA_CHAR_DB.find(c => (c.trigger || '').toLowerCase() === tl || (Array.isArray(c.triggers) && c.triggers.some(x => String(x).toLowerCase() === tl)));
                            if (hit && !existing.has(hit.name.toLowerCase())) {
                                newPickerSelected.push(hit.name);
                                existing.add(hit.name.toLowerCase());
                            }
                        }
                    });
                    pickerSelected = newPickerSelected;
                    if (typeof pickerLastAppliedTokens !== 'undefined') {
                        pickerLastAppliedTokens = new Set(pickerSelected.map(t => t.toLowerCase()));
                    }
                }
            } catch (_) {}

            // ---- 画师（旧版本写法） ----
            try {
                if (typeof artistPickerSelected !== 'undefined' && typeof ANIMA_ARTIST_DB !== 'undefined' && ANIMA_ARTIST_DB && ANIMA_ARTIST_DB.length > 0) {
                    const _artistNameSet = new Set(ANIMA_ARTIST_DB.map(a => (a.name || '').toLowerCase()).filter(Boolean));
                    // 1) 移除
                    let newArtistSel = artistPickerSelected.filter(name => {
                        if (!name) return false;
                        const nl = name.toLowerCase();
                        return lowerSet.has('@' + nl) || lowerSet.has('by ' + nl);
                    });
                    // 2) 添加
                    const existingArtist = new Set(newArtistSel.map(n => n.toLowerCase()));
                    parts.forEach(t => {
                        if (!t) return;
                        const name = extractArtistName(t);
                        if (!name) return;
                        const nl = name.toLowerCase();
                        if (existingArtist.has(nl)) return;
                        if (_artistNameSet.has(nl)) {
                            newArtistSel.push(name);
                            existingArtist.add(nl);
                        }
                    });
                    artistPickerSelected = newArtistSel;
                    if (typeof artistPickerLastAppliedTokens !== 'undefined') {
                        // 只记录已知画师的 @ token，排除 LoRA 触发词
                        const currentArtistTokens = parts.filter(p => {
                            if (!promptHasArtistToken(p)) return false;
                            const n = extractArtistName(p);
                            return n && _artistNameSet.has(n.toLowerCase());
                        });
                        artistPickerLastAppliedTokens = new Set(currentArtistTokens.map(t => t.toLowerCase()));
                    }
                }
            } catch (_) {}

            // ---- 预设 ----
            try {
                if (typeof presetPickerSelected !== 'undefined') {
                    const pidx = getPresetIndex();
                    if (pidx.built) {
                        const matchedIds = new Set();
                        pidx.byKey.forEach(p => {
                            const k = isPresetMatched(lowerSet, p);
                            if (k) matchedIds.add(k);
                        });
                        // 1) 移除
                        let newPresetSel = presetPickerSelected.filter(p => {
                            const key = (p.category_id || p.category || '') + ':' + (p.id || p.name);
                            return matchedIds.has(key);
                        });
                        // 2) 添加：prompt 命中的预设（但 pickerSelected 中没有的）
                        const existingKeys = new Set(newPresetSel.map(p => (p.category_id || p.category || '') + ':' + (p.id || p.name)));
                        pidx.byKey.forEach(p => {
                            const key = isPresetMatched(lowerSet, p);
                            if (key && !existingKeys.has(key)) {
                                newPresetSel.push(p);
                                existingKeys.add(key);
                            }
                        });
                        presetPickerSelected = newPresetSel;
                        if (typeof presetPickerLastAppliedTokens !== 'undefined') {
                            const newSet = new Set();
                            pidx.byKey.forEach(p => {
                                const key = isPresetMatched(lowerSet, p);
                                if (key) {
                                    const t = (p.prompt || p.name || p.id || '').trim().toLowerCase();
                                    if (t) newSet.add(t);
                                }
                            });
                            presetPickerLastAppliedTokens = newSet;
                        }
                    }
                }
            } catch (_) {}

            // ---- LoRA：自动按触发词/文件名匹配的功能已移除 ----
            // 现在 LoRA 仅由用户在 LoRA 选择器中手动勾选，勾选结果记入图片生成参数。
            // 不再根据提示词文本自动增删 loraState.active（避免写实提示词里的通用词
            // 如 detailed/photorealistic/sharp 被误挂上对应 LoRA）。

            // ---- 刷新按钮高亮/角标 ----
            if (typeof updatePickerButtonsHighlight === 'function') {
                updatePickerButtonsHighlight();
            }
        }
        // 暴露到 window，方便其他模块/调试调用
        window.syncPickerStatesFromPrompt = syncPickerStatesFromPrompt;

        // 监听 prompt 输入变化：用户手动修改或清空时，反向同步选择器状态
        document.addEventListener('DOMContentLoaded', () => {
            const promptEl = document.getElementById('prompt');
            if (promptEl) {
                // 打字时的同步由 schedulePromptSync 合并，避免每个字都扫描角色库和重绘标签
                promptEl.addEventListener('input', () => {
                    if (promptEl._composing) return;
                    if (typeof window.schedulePromptSync === 'function') window.schedulePromptSync();
                });
                // 额外保底：paste 事件
                promptEl.addEventListener('paste', () => {
                    // 需等 paste 完成后 value 才更新，microtask 够了
                    Promise.resolve().then(() => {
                        if (typeof syncPickerStatesFromPrompt === 'function') {
                            syncPickerStatesFromPrompt();
                        }
                        if (typeof PromptTranslateUI !== 'undefined' && typeof PromptTranslateUI.updateVisibility === 'function') {
                            PromptTranslateUI.updateVisibility();
                        }
                    });
                });
                // Shift+Enter 触发生成
                promptEl.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && e.shiftKey) {
                        e.preventDefault();
                        const btn = document.getElementById('mainGenBtn');
                        if (btn && !btn.disabled) btn.click();
                    }
                });
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide && typeof lucide.createIcons === 'function') {
                try { lucide.createIcons(); } catch (e) {}
            }
            if (typeof window.updatePromptTags === 'function') updatePromptTags();
            if (typeof spPickerInit === 'function') spPickerInit();
            if (typeof spmInit === 'function') spmInit();

            // 初始化翻译 Toggle
            if (typeof PromptTranslateUI !== 'undefined') {
                const promptEl = document.getElementById('prompt');
                // 读取提示词: 兼容 textarea (value) 和 contenteditable div (innerText)
                function readPromptText() {
                    if (!promptEl) return '';
                    // contenteditable div 没有 .value, 用 innerText
                    return promptEl.innerText || promptEl.textContent || promptEl.value || '';
                }
                PromptTranslateUI.init('translateBtnContainer', {
                    getText: readPromptText,
                    onApply: function(text) {
                        if (promptEl) {
                            // contenteditable 模式: 替换文本节点内容,保留 ref-chip
                            Array.from(promptEl.childNodes).forEach(node => {
                                if (!(node.nodeType === 1 && node.classList && node.classList.contains('ref-chip'))) {
                                    promptEl.removeChild(node);
                                }
                            });
                            // 追加新文本
                            promptEl.appendChild(document.createTextNode(text));
                            promptEl.dispatchEvent(new Event('input', { bubbles: true }));
                        }
                    },
                    onLangChange: function(mode) {
                        window.PROMPT_TAGS_LANG_MODE = mode;
                        localStorage.setItem('prompt_tags_lang_mode', mode);
                        if (typeof updatePromptTags === 'function') updatePromptTags();
                    }
                });
            }

            // 初始化智能提示词组件
            if (typeof SmartPrompt !== 'undefined') {
                const promptEl = document.getElementById('prompt');
                SmartPrompt.init('smartPromptContainer', {
                    getText: () => promptEl ? promptEl.value : '',
                    setText: function(text) {
                        if (promptEl) {
                            promptEl.value = text;
                            promptEl.dispatchEvent(new Event('input'));
                        }
                    },
                    isIdeogram4Mode: function() {
                        return typeof currentWorkflow !== 'undefined' && currentWorkflow.toLowerCase().includes('ideogram4');
                    },
                    setIdeogram4Json: function(json) {
                        ideogram4JsonPrompt = json || '';
                    },
                    syncPicker: function() {
                        if (typeof syncPickerStatesFromPrompt === 'function') syncPickerStatesFromPrompt();
                    },
                    onPromptUpdate: function() {
                        if (typeof updatePromptTags === 'function') updatePromptTags();
                    },
                    onLongPress: function() {
                        if (typeof spPickerOpen === 'function') spPickerOpen();
                    }
                });
            }

            // 初始化提示词方案组件
            if (typeof RandomPrompt !== 'undefined') {
                RandomPrompt.init('randomPromptContainer', {
                    onApply: function(result) {
                        // 将随机结果覆盖到提示词框
                        const promptEl = document.getElementById('prompt');
                        if (promptEl && result.positive) {
                            promptEl.value = result.positive;
                            promptEl.dispatchEvent(new Event('input'));
                        }

                        // 如果有负向提示词，应用到负向框
                        if (result.negative) {
                            const negEl = document.getElementById('negativePrompt');
                            if (negEl) {
                                negEl.value = result.negative;
                            }
                        }
                    }
                });
            }

            // === 「⚡ 生成」按钮长按 → 启动/停止自动生成 ===
            (function bindMainGenLongPress() {
                const btn = document.getElementById('mainGenBtn');
                if (!btn || document.body.classList.contains('chat-layout')) return;
                btn.title = '单击生成 | 长按自动生成';

                let pressTimer = null;
                let longPressFired = false;
                const LONG_PRESS_MS = 600;

                function startPress(e) {
                    longPressFired = false;
                    btn.classList.add('btn-render-longpress');
                    pressTimer = setTimeout(() => {
                        longPressFired = true;
                        pressTimer = null;
                        btn.classList.remove('btn-render-longpress');
                        // 调用 RandomPrompt 的自动生成 API
                        if (typeof RandomPrompt !== 'undefined' && RandomPrompt.toggleAutoGen) {
                            RandomPrompt.toggleAutoGen();
                        }
                        // 防止 long-press 之后 mouseup 意外触发原生 onclick
                        setTimeout(() => { longPressFired = false; }, 100);
                    }, LONG_PRESS_MS);
                }
                function endPress() {
                    btn.classList.remove('btn-render-longpress');
                    if (pressTimer) {
                        clearTimeout(pressTimer);
                        pressTimer = null;
                    }
                    // 短按不拦截（让原生 onclick 继续处理生成）
                }
                function cancelPress() {
                    btn.classList.remove('btn-render-longpress');
                    if (pressTimer) {
                        clearTimeout(pressTimer);
                        pressTimer = null;
                    }
                }

                btn.addEventListener('mousedown', startPress);
                btn.addEventListener('mouseup', endPress);
                btn.addEventListener('mouseleave', cancelPress);
                btn.addEventListener('touchstart', startPress, { passive: true });
                btn.addEventListener('touchend', endPress);
                btn.addEventListener('touchcancel', cancelPress);

                // 拦截 long-press 之后的 click，避免双触发
                btn.addEventListener('click', (e) => {
                    if (longPressFired) {
                        e.stopImmediatePropagation();
                        e.preventDefault();
                        longPressFired = false;
                    }
                }, true);

                // === 自动生成状态同步：轮询快照 → 按钮上显示计数/倒计时 + 动效 ===
                const btnIcon = document.getElementById('btnIcon');
                const btnText = document.getElementById('btnText');
                const btnBadge = document.getElementById('btnAutoBadge');
                const origIconHTML = btnIcon ? btnIcon.outerHTML : '';
                const origText = btnText ? btnText.textContent : '生成';

                function fmtCountdown(ms) {
                    const total = Math.ceil(ms / 1000);
                    const m = Math.floor(total / 60);
                    const s = total % 60;
                    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
                }

                function applyAutoGenVisual(snap) {
                    if (snap.running) {
                        btn.classList.add('btn-render-autogen');
                        if (btnText) btnText.textContent = '自动';
                        if (btnIcon) btnIcon.outerHTML = '<i data-lucide="loader" id="btnIcon" class="w-3.5 h-3.5" style="animation:spin 1s linear infinite"></i>';
                        if (btnBadge) {
                            btnBadge.style.display = 'inline-block';
                            if (snap.mode === 'count') {
                                const cur = snap.currentCount || 0;
                                const tot = snap.totalCount || 0;
                                btnBadge.textContent = cur + '/' + tot;
                            } else {
                                btnBadge.textContent = snap.remainingMs > 0 ? fmtCountdown(snap.remainingMs) : '00:00';
                            }
                        }
                    } else {
                        btn.classList.remove('btn-render-autogen');
                        if (btnText) btnText.textContent = origText;
                        // 复原 zap 图标
                        const cur = document.getElementById('btnIcon');
                        if (cur && !cur.getAttribute('data-lucide')) {
                            cur.outerHTML = origIconHTML;
                        } else if (cur && cur.getAttribute('data-lucide') !== 'zap') {
                            cur.outerHTML = origIconHTML;
                        }
                        if (btnBadge) {
                            btnBadge.style.display = 'none';
                            btnBadge.textContent = '00:00';
                        }
                    }
                }

                // 补一个 spin 动画
                if (!document.getElementById('btn-render-spin-style')) {
                    const st = document.createElement('style');
                    st.id = 'btn-render-spin-style';
                    st.textContent = '@keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }';
                    document.head.appendChild(st);
                }

                // 轮询 250ms（足够丝滑，消耗可忽略）
                setInterval(() => {
                    if (typeof RandomPrompt === 'undefined' || !RandomPrompt.getAutoGenSnapshot) return;
                    const snap = RandomPrompt.getAutoGenSnapshot();
                    applyAutoGenVisual(snap);
                }, 250);
            })();

            // 时间轴：复用画廊模块（timeline.js）GalleryTimeline，挂载到 #masonry（自带 MutationObserver + 轮询兜底）
            // [已暂时停用] 时间轴功能暂不稳定，先不接入使用；保留模块与脚本，需要时取消下一行注释即可恢复。
            // if (window.GalleryTimeline) GalleryTimeline.attach({ container: '#masonry' });

        });
    </script>

    <script>
        if (new URLSearchParams(location.search).get('chat') === '1') {
            document.body.classList.add('chat-layout');
            // 输入栏排版：工具键移到底栏左侧，模型紧邻发送键，参数留在模型左边
            (() => {
                const composer = document.getElementById('generationComposer');
                const bar = composer?.querySelector('.control-bar');
                const tools = composer?.querySelector('.prompt-row');
                const model = document.getElementById('unifiedModelWrap');
                const send = document.getElementById('mainGenBtn');
                if (!bar || !tools || !model || !send) return;
                bar.prepend(tools);
                send.parentElement.insertBefore(model, send);
            })();
            const topbar = document.getElementById('chatTopbar');
            const thread = document.createElement('div');
            thread.id = 'chatThread';
            if (topbar) topbar.after(thread);
            else document.body.insertBefore(thread, document.body.firstChild);
            window.ChatOutline.mount(thread);
            const drawer = document.createElement('div');
            drawer.className = 'chat-drawer';
            drawer.innerHTML = '<div class="chat-drawer-header"></div><div class="chat-drawer-body"></div>';
            const drawerBody = drawer.querySelector('.chat-drawer-body');
            const toolbar = document.getElementById('toolbarFixed');
            const gallery = document.querySelector('main');
            function parkGalleryChrome(el) {
                if (!el) return;
                const pinTop = el.classList && el.classList.contains('history-bulk-toolbar');
                if (pinTop) {
                    if (el.parentElement !== drawerBody || drawerBody.firstElementChild !== el) drawerBody.insertBefore(el, drawerBody.firstChild);
                    return;
                }
                if (el.parentElement !== drawerBody) drawerBody.appendChild(el);
            }
            parkGalleryChrome(toolbar);
            parkGalleryChrome(gallery);
            parkGalleryChrome(document.querySelector('.history-bulk-toolbar'));
            parkGalleryChrome(document.getElementById('galleryScrollToTop'));
            document.body.appendChild(drawer);
            new MutationObserver(() => {
                parkGalleryChrome(document.querySelector('.history-bulk-toolbar'));
                parkGalleryChrome(document.getElementById('galleryScrollToTop'));
                syncGalleryDrawer();
            }).observe(document.body, { childList: true });
            const galleryBtn = document.getElementById('chatGalleryBtn');
            function syncGalleryDrawer() {
                if (!galleryBtn) return;
                const open = drawer.classList.contains('open');
                const host = open ? drawer.querySelector('.history-bulk-toolbar') || drawer.querySelector('.chat-drawer-header') : topbar;
                if (host && galleryBtn.parentElement !== host) host.appendChild(galleryBtn);
                galleryBtn.classList.toggle('active', open);
                galleryBtn.title = open ? '收起生成图' : '生成图';
                galleryBtn.setAttribute('aria-label', galleryBtn.title);
                galleryBtn.setAttribute('aria-expanded', String(open));
            }
            new MutationObserver(syncGalleryDrawer).observe(drawer, { attributes: true, attributeFilter: ['class'] });
            syncGalleryDrawer();
            if (galleryBtn) galleryBtn.onclick = () => {
                drawer.classList.toggle('open');
                syncGalleryDrawer();
            };
            const seen = new Set();
            let armed = false;
            let conversationId = '';
            let chatBusy = false;
            let selectedChatImage = null;
            let selectedChatRegion = null;
            let lastChatError = '';
            let referenceRevision = 0, sentReferenceRevision = -1;
            window.addEventListener('chat-reference-upload-changed', () => { referenceRevision++; selectChatImage(null); });
            // 引用改成「单轮上下文」：只保留选中状态与图片高亮，不再渲染操作条。
            // 修改意图统一由 sendChat 现算，选中状态发完即清，不用手动取消引用。
            function selectChatImage(src, card) {
                if (selectedChatImage !== src) selectedChatRegion = null;
                selectedChatImage = src;
                thread.querySelectorAll('.is-reference').forEach(node => node.classList.remove('is-reference'));
                if (card && src) card.classList.add('is-reference');
            }
            function recentChatImages(limit) {
                return Array.from(thread.querySelectorAll('.chat-image-content')).slice(-(limit || 10))
                    .map(node => ({ url:node.dataset.originalSrc || node.src, name:'会话中的图片' }))
                    .filter(item => item.url);
            }
            function pickSpokenChatImage(text) {
                const images = recentChatImages();
                if (!images.length) return null;
                const value = String(text || '');
                if (/上一张|上张|上面(那|这|的)?张|刚才(那|这)?张|最后(一|那|这)?张|上一幅|上一轮(的)?图|刚才(那|这)?图/.test(value)) return images.at(-1);
                const match = value.match(/(?:倒数第|第)\s*(\d+|[一二三四五六七八九十])\s*张/);
                if (match) {
                    const cn = '一二三四五六七八九十'.indexOf(match[1]) + 1;
                    const index = cn > 0 ? cn : Number(match[1]);
                    if (Number.isInteger(index) && index > 0) return images.at(-index) || null;
                }
                return null;
            }
            function chatUserId() {
                try {
                    const user = JSON.parse(localStorage.getItem('xy_auth_user') || 'null');
                    if (user && user.username) return String(user.username);
                } catch (e) {}
                return 'anonymous';
            }
            const CID_KEY = 'studio_chat_cid:' + chatUserId();
            function chatHeaders() {
                // HTTP 头只允许 ISO-8859-1，中文用户名直接塞进去会让 fetch 抛
                // "String contains non ISO-8859-1 code point"。后端归属由 token 决定，
                // 这里统一做百分号编码，保证任何用户名都不会炸。
                let uid = 'anonymous';
                try { uid = encodeURIComponent(chatUserId()); } catch (e) {}
                return { 'Content-Type': 'application/json', 'X-User-ID': uid };
            }
            function rememberConversation(id) {
                if (!id) return;
                conversationId = id;
                localStorage.setItem(CID_KEY, id);
            }
            const AGENT_GUIDE = '你是创作助手，用中文和用户聊天。用户消息里如果带了参考图，你能直接看到这些图片，要根据画面内容来写提示词，不要说自己看不到图。只有用户明确要求画图、出图、改图或生成图片时，才在回复最后单独一行输出 IMAGE {"prompt":"给绘图模型的完整画面描述"}。不要输出代码块。普通聊天不要输出 IMAGE，也不要声称图片已经生成。参数修改严格遵循后附的当前设置与白名单。参考图会由页面在出图时一并提交。请同时遵循后附的参数控制规则。';
            const promptBox = document.getElementById('prompt');
            if (promptBox) promptBox.dataset.placeholder = '和 AI 对话，Enter 发送。要出图时直接说';
            document.addEventListener('click', event => {
                if (!event.target.closest?.('#chatAdvancedBtn')) return;
                const panel = document.getElementById('chatAdvancedPanel');
                if (!panel || panel.querySelector('[data-region-control]')) return;
                const regionButton = document.createElement('button'); regionButton.type = 'button';
                regionButton.dataset.regionControl = '1'; regionButton.className = 'anima-ctrl';
                regionButton.textContent = '框选图片修改区域';
                regionButton.title = '使用选中的图片；未选择时使用第一张上传参考图或最后生成图';
                regionButton.onclick = async () => {
                    if (chatBusy) return;
                    try {
                        const uploads = selectedChatImage ? [] : await cloudCollectRefs();
                        const latest = Array.from(thread.querySelectorAll('.chat-image-content')).at(-1);
                        const src = selectedChatImage || uploads[0]?.url || latest?.dataset.originalSrc || latest?.src;
                        if (!src) { alert('请先添加参考图，或在生成图片上右键选择“局部修改图片”'); return; }
                        const selection = await ChatAssistant.chooseRegion(src, selectedChatRegion);
                        if (selection) { selectChatImage(src); selectedChatRegion = selection; selectChatImage(src); promptBox.focus(); }
                    } catch (error) { alert(error.message); }
                };
                panel.appendChild(regionButton);
            });
            const CHAT_PICK_KEY = 'studio_chat_target';
            let chatProviders = [];
            function savedChatTarget() {
                try { return JSON.parse(localStorage.getItem(CHAT_PICK_KEY) || '{}'); } catch (e) { return {}; }
            }
            function chatTargetValue(providerId, model) {
                return String(providerId || '') + '\t' + String(model || '');
            }
            function readChatTarget() {
                const raw = document.getElementById('chatTargetPick')?.value || '';
                const splitAt = raw.indexOf('\t');
                if (splitAt < 0) return { provider: raw || 'comfly', model: '' };
                return { provider: raw.slice(0, splitAt) || 'comfly', model: raw.slice(splitAt + 1) };
            }
            function renderChatTarget(list) {
                const pick = document.getElementById('chatTargetPick');
                if (!pick) return;
                const saved = savedChatTarget();
                const escAttr = value => String(value == null ? '' : value).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
                pick.innerHTML = (list || []).map(item => {
                    const models = item.models || [];
                    const options = models.map(model => {
                        const shown = String((item.labels && item.labels[model]) || '').trim() || model;
                        return '<option value="' + escAttr(chatTargetValue(item.id, model)) + '" title="' + escAttr(model) + '">' + escAttr((item.name || item.id) + ' · ' + shown) + '</option>';
                    }).join('');
                    return '<optgroup label="' + escAttr(item.name || item.id) + '">' + options + '</optgroup>';
                }).join('');
                const wanted = chatTargetValue(saved.provider, saved.model);
                if ([...pick.options].some(opt => opt.value === wanted)) pick.value = wanted;
                syncChatModelMenu();
            }
            const modelToggle = document.getElementById('chatModelToggle');
            const modelMenu = document.getElementById('chatModelMenu');
            function closeChatModelMenu() {
                modelMenu.hidden = true;
                modelToggle.setAttribute('aria-expanded', 'false');
            }
            function syncChatModelMenu() {
                const pick = document.getElementById('chatTargetPick');
                modelToggle.querySelector('span').textContent = pick.selectedOptions[0]?.textContent || '选择对话模型';
                modelToggle.title = modelToggle.querySelector('span').textContent;
                modelMenu.replaceChildren();
                for (const child of pick.children) {
                    if (child.tagName === 'OPTGROUP') {
                        const label = document.createElement('div');
                        label.className = 'unified-model-group';
                        const name = document.createElement('span');
                        name.textContent = child.label;
                        label.appendChild(name);
                        modelMenu.appendChild(label);
                    }
                    for (const option of child.tagName === 'OPTGROUP' ? child.children : [child]) {
                        const full = option.textContent || '';
                        const mark = full.indexOf(' · ');
                        const button = document.createElement('button');
                        button.type = 'button';
                        button.className = 'anima-ctrl-menu-item' + (option.selected ? ' active' : '');
                        button.title = option.title || full;
                        button.setAttribute('role', 'option');
                        button.setAttribute('aria-selected', String(option.selected));
                        const name = document.createElement('span');
                        name.textContent = mark >= 0 ? full.slice(mark + 3) : full;
                        const chk = document.createElement('span');
                        chk.className = 'chk';
                        chk.textContent = '✓';
                        chk.style.opacity = option.selected ? '1' : '0';
                        button.append(name, chk);
                        button.onclick = () => {
                            pick.value = option.value;
                            pick.dispatchEvent(new Event('change', { bubbles:true }));
                            closeChatModelMenu();
                            modelToggle.focus();
                        };
                        modelMenu.appendChild(button);
                    }
                }
            }
            modelToggle.onclick = () => {
                modelMenu.hidden = !modelMenu.hidden;
                modelToggle.setAttribute('aria-expanded', String(!modelMenu.hidden));
            };
            modelMenu.addEventListener('keydown', event => {
                if (event.key === 'Escape') { closeChatModelMenu(); modelToggle.focus(); }
                if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
                    event.preventDefault();
                    const buttons = [...modelMenu.querySelectorAll('button')];
                    const index = buttons.indexOf(document.activeElement);
                    buttons[(index + (event.key === 'ArrowDown' ? 1 : -1) + buttons.length) % buttons.length]?.focus();
                }
            });
            document.addEventListener('click', event => {
                if (!event.composedPath().includes(modelToggle.parentElement)) closeChatModelMenu();
            });
            document.getElementById('chatTargetPick').addEventListener('change', syncChatModelMenu);
            function rememberChatTarget() {
                const target = readChatTarget();
                if (!target.provider) return;
                localStorage.setItem(CHAT_PICK_KEY, JSON.stringify(target));
            }
            async function loadChatModels() {
                const pick = document.getElementById('chatTargetPick');
                if (!pick) return;
                try {
                    const data = await fetch('/api/config').then(res => res.json());
                    const list = [];
                    (data.api_providers || []).forEach(item => {
                        if (item.enabled === false || !(item.chat_models || []).length) return;
                        const av = window.ModelAvailability;
                        if (av && !av.isProviderAvailable(item.id)) return;
                        const chatModels = av ? av.filterModels('chat', item.id, item.chat_models) : item.chat_models.slice();
                        if (!chatModels.length) return;
                        list.push({ id: item.id, name: item.name || item.id, models: chatModels, labels: item.model_labels || {}, primary: !!item.primary });
                    });
                    chatProviders = list;
                    try { localStorage.setItem('studio_chat_providers', JSON.stringify(list)); } catch (e) {}
                    const saved = savedChatTarget();
                    const savedOk = list.some(item => item.id === saved.provider && (item.models || []).indexOf(saved.model) >= 0);
                    if (!savedOk) {
                        const preferred = list.find(item => item.primary) || list[0];
                        if (preferred) localStorage.setItem(CHAT_PICK_KEY, JSON.stringify({ provider: preferred.id, model: (preferred.models || [])[0] || '' }));
                        else localStorage.removeItem(CHAT_PICK_KEY);
                    }
                    renderChatTarget(list);
                    rememberChatTarget();
                } catch (e) {
                    pick.innerHTML = '';
                    syncChatModelMenu();
                }
            }
            document.getElementById('chatTargetPick')?.addEventListener('change', rememberChatTarget);
            loadChatModels();
            if (window.ModelAvailability) window.ModelAvailability.subscribe(() => loadChatModels());
            try {
                const chatApiUpdates = new BroadcastChannel('studio-api');
                chatApiUpdates.onmessage = () => loadChatModels();
            } catch (_) {}
            // 预设注入曾经依赖 window.spPickerPresets / spPickerSelectedId，但选择器拆分到
            // modules/prompt-picker.js 之后这两个全局就没有来源了，预设规则一直没进 system_prompt。
            // 这里改为页面自己拉 /api/prompt-module；宿主仍可用 studioPresetInject === false 显式关闭。
            let chatPresetState = { presets: [], selectedId: 'default', loaded: 0 };
            async function loadChatPresetState(force) {
                if (!force && Date.now() - chatPresetState.loaded < 5000) return chatPresetState;
                try {
                    const [presetsRes, selectedRes] = await Promise.all([
                        fetch('/api/prompt-module/presets').then(r => r.json()),
                        fetch('/api/prompt-module/selected-preset').then(r => r.json())
                    ]);
                    chatPresetState = {
                        presets: presetsRes.presets || [],
                        selectedId: selectedRes.preset_id || 'default',
                        loaded: Date.now()
                    };
                } catch (e) {
                    chatPresetState.loaded = Date.now();
                }
                return chatPresetState;
            }
            function selectedChatPreset() {
                // 「无设定」时 studio_ai_setting 存的是空串，绝不能回退到服务端 selected-preset：
                // 切换 Ideogram4 等工作流会自动把后者改成 ideogram4，导致空状态徽标、
                // 输入占位文案、system_prompt 都误显示/误注入用户的预设。对话只认 AI 设定。
                let settingId = '';
                try { settingId = localStorage.getItem('studio_ai_setting') || ''; } catch (e) {}
                if (!settingId || settingId === 'default') return null;
                return (window.spPickerPresets || []).find(item => item.id === settingId) || (chatPresetState.presets || []).find(item => item.id === settingId) || null;
            }
            let chatSampling = {};
            let chatSamplingModel = null;
            function chatParameterContext() {
                const modelKey = currentEngine + ':' + (currentEngine === 'local' ? currentWorkflow : _cloudModel);
                if (chatSamplingModel !== modelKey) {
                    chatSampling = {}; chatSamplingModel = modelKey;
                    document.querySelector('[data-chat-sampling]')?.remove();
                }
                const workflow = currentEngine === 'local' ? window._wfCache?.[currentWorkflow] : null;
                const allowedSampling = ChatParameters.samplingFields(workflow);
                return {
                    engine:currentEngine, model:currentEngine === 'local' ? currentWorkflow : _cloudModel,
                    protocol:currentEngine === 'cloud' ? cloudProtocol(_cloudProviderId) : '',
                    controls:{ ...GenerationControls.getState() }, size:getAnimaSize(),
                    negative:document.getElementById('extraNegativePrompt')?.value || '',
                    sampling:{ ...allowedSampling, ...chatSampling }, allowedSampling,
                    loras:currentEngine === 'local' ? loraState.active.map(l => ({ name:l.name, strength:l.strength })) : []
                };
            }
            function applyChatParameters(spec, bubble, context) {
                if (!Object.prototype.hasOwnProperty.call(spec, 'params')) return;
                const current = chatParameterContext();
                if (context && (current.engine !== context.engine || current.model !== context.model)) throw new Error('生图模型已切换，请按当前模型重新发送要求');
                const result = ChatParameters.plan(spec.params, { ...current, sampling:chatSampling });
                const gc = GenerationControls;
                gc.setState(result.controls);
                if (current.engine === 'cloud') {
                    cloudSelectRatio(result.controls.ratioW + ':' + result.controls.ratioH);
                    cloudSelectRes(result.controls.res);
                } else {
                    gc.selectRatio(result.controls.ratioW + ':' + result.controls.ratioH, result.controls.ratioW, result.controls.ratioH);
                    gc.selectRes(result.controls.res);
                }
                gc.updateBatchCountUI(); gc.updateSeedUI();
                document.getElementById('extraNegativePrompt').value = result.negative;
                chatSampling = result.sampling;
                const advanced = document.getElementById('chatAdvancedPanel');
                if (advanced) {
                    let summary = advanced.querySelector('[data-chat-sampling]');
                    if (!summary) { summary = document.createElement('p'); summary.dataset.chatSampling = '1'; advanced.appendChild(summary); }
                    summary.textContent = '当前采样参数：' + Object.entries({ ...current.allowedSampling, ...chatSampling }).map(([key, value]) => key + ' ' + value).join(' · ');
                }
                if (!result.labels.length) return;
                // 参数说明不再单独占一行，交给图片卡片下方的执行信息行合并展示
                bubble._chatParamLabels = (bubble._chatParamLabels || []).concat(result.labels);
            }
            // 没有参考图时必须显式说清，否则提示词里「你能看到参考图、不要说自己看不到图」
            // 会让模型凭空编造一张图（曾出现「我看到你上传了一张 Blender 默认场景的截图」）
            function chatNoRefRule(hasRefs) {
                return hasRefs ? '' : '\n\n【本轮事实】用户这条消息没有附带任何图片或参考图。不要声称看到、收到或分析过图片，不要描述或猜测画面内容，也不要问「你想用这张图做什么」。确实需要图片才能完成时，请用户先添加参考图。';
            }
            function chatSystemPrompt(hasRefs) {
                const preset = selectedChatPreset();
                const rules = preset && preset.system_prompt ? String(preset.system_prompt).trim() : '';
                if (window.studioPresetInject === false || !rules) return AGENT_GUIDE + chatNoRefRule(hasRefs);
                const imageRule = hasRefs

                        throw failure;
                    }
                    for await (const event of window.ChatSession.readEvents(res, responseTask.controller.signal)) {
                            waitMonitor.activity();
                            if (event.type === 'meta' && event.conversation) {
                                invalidateHistory();
                                rememberConversation(event.conversation.id || conversationId);
                                const savedUser = [...(event.conversation.messages || [])].reverse().find(item => item.role === 'user');
                                if (savedUser && savedUser.id) userRow.dataset.msgId = savedUser.id;
                                if (savedUser && savedUser.created_at) stampChatTime(userRow.querySelector('.chat-bubble-wrap'), savedUser.created_at);
                            }
                            if (event.type === 'reasoning' && event.delta) {
                                thinking += event.delta;
                                paintThinking(bubble, thinking);
                                scrollThread();
                            }
                            if (event.type === 'delta') {
                                full += event.delta || '';
                                replyStream.push(full);
                            }
                            if (event.type === 'progress' && event.message) {
                                responseTask.setStage(event.message);
                            }
                            if (event.type === 'tool' && event.name) {
                                const state = event.status === 'running' ? '调用工具 ' : event.status === 'failed' ? '工具不可用 ' : '完成 ';
                                responseTask.setStage(state + event.name);
                            }
                            if (event.type === 'error') throw chatUnavailableError(event.detail || '对话失败');
                            if (event.type === 'done' && event.conversation) {
                                invalidateHistory();
                                rememberConversation(event.conversation.id || conversationId);
                                const last = (event.conversation.messages || []).slice(-1)[0];
                                if (last && last.content) full = last.content;
                                if (last && last.reasoning) thinking = last.reasoning;
                                if (last && last.id) bubble.closest('.chat-row').dataset.msgId = last.id;
                                if (last && last.created_at) stampChatTime(bubble.parentElement, last.created_at);
                            }
                    }
                    // SSE 结束（后面可能进入生图阶段），撤掉等待监控，避免误中断出图任务。
                    waitMonitor.stop();
                    responseTask.check();
                    if (thinking) paintThinking(bubble, thinking);
                    replyStream.push(full || '好的。');
                    await replyStream.finish();
                    responseTask.check();
                    if (descriptionOnly) mountDescriptionActions(bubble, full, userRow._chatRefs || []);
                    const videoSpec = !descriptionOnly && videoRequested ? ChatVideo.readSpec(full, videoRequested, chatControlSuffix(full)) : null;
                    if (videoRequested && !videoSpec) throw new Error('对话模型未返回有效的视频生成指令，请点重新回答重试');
                    const spec = descriptionOnly ? null : videoRequested ? null : readImageSpec(full, typed);
                    const settingsOnly = !descriptionOnly && String(full).match(/PARAMS\s*(\{[\s\S]*\})\s*$/i);
                    if (videoSpec) {
                        window.__chatResultTarget = bubble;
                        const binding = chatGenIds();
                        responseTask.engine = 'cloud';
                        responseTask.videoBody = ChatVideo.validate(videoSpec, videoContext);
                        handedToImage = true;
                        responseTask.snapshot = { engine:'video' };
                        responseTask.rerun = async () => {
                            if (chatBusy) return;
                            conversationLoader.cancel();
                            chatBusy = true;
                            const next = ChatTasks.create(bubble); next.engine = 'cloud'; next.videoBody = responseTask.videoBody; next.snapshot = responseTask.snapshot; next.rerun = responseTask.rerun; next.answerAgain = responseTask.answerAgain;
                            try { await ChatVideo.generate(bubble, videoSpec, refs, next, binding, scrollThread); }
                            catch (error) { next.finish(error); }
                            finally { chatBusy = false; }
                        };
                        await ChatVideo.generate(bubble, videoSpec, refs, responseTask, binding, scrollThread);
                    }
                    else if (spec) {
                        const caps = ChatAssistant.capabilities(parameterContext.engine, parameterContext.model, parameterContext.protocol);
                        if (refs.length && caps.edit === false) throw new Error('当前模型不支持参考图编辑，请选择 Qwen 2.1、MOSS、FLUX.3 Klein 或 Krea2');
                        if (Number.isInteger(caps.maxReferences) && refs.length > caps.maxReferences) throw new Error('当前模型最多支持 ' + caps.maxReferences + ' 张参考图');
                        if (spec.region || regionSelection) {
                            const area = regionSelection || ChatAssistant.region(spec.region);
                            const source = regionSelection?.source || refs[area.image - 1]?.url;
                            if (!source) throw new Error('区域修改需要对应的参考图，请先添加或选择图片');
                            responseTask.setStage('等待确认修改区域');
                            responseTask.region = regionSelection || await ChatAssistant.chooseRegion(source, area, responseTask.controller.signal);
                            responseTask.check();
                            if (!responseTask.region) throw new Error('已取消区域修改，未提交生图');
                            const confirmed = responseTask.region;
                            spec.prompt += '\n以图 ' + confirmed.image + ' 为底图；仅编辑以下矩形范围：左侧 ' + (confirmed.x*100).toFixed(1) + '%、顶部 ' + (confirmed.y*100).toFixed(1) + '%、宽度 ' + (confirmed.width*100).toFixed(1) + '%、高度 ' + (confirmed.height*100).toFixed(1) + '%。保持参考图整体构图、镜头、画幅和位置完全一致，其他内容不变，不要裁剪、放大或画出区域边框。';
                        }
                        if (currentEngine !== parameterContext.engine || (currentEngine === 'local' ? currentWorkflow : _cloudModel) !== parameterContext.model) throw new Error('模型已切换，请按当前模型重新发送要求');
                        applyChatParameters(spec, bubble, parameterContext);
                    }
                    else if (settingsOnly && !videoRequested) {
                        try {
                            applyChatParameters(JSON.parse(settingsOnly[1]), bubble, parameterContext);
                        } catch (e) {
                            throw new Error('对话返回的 PARAMS 参数块不是合法 JSON（多为模型输出被截断），请重新发送');
                        }
                    }
                    const preferenceOnly = !descriptionOnly && !spec && !settingsOnly && String(full).match(/PREFS\s*(\{[\s\S]*\})\s*$/i);
                    if (preferenceOnly) {
                        if (!ChatAssistant.isPreferenceRequest(typed)) throw new Error('请明确说“记住偏好”或“清除偏好”后再保存');
                        const preference = JSON.parse(preferenceOnly[1]);
                        ChatAssistant.savePreferences(preference.text);
                        const status = document.createElement('div'); status.className = 'chat-task-bar';
                        status.textContent = preference.text.trim() ? '创作偏好已保存，可在高级参数中查看或清除' : '创作偏好已清除';
                        bubble.appendChild(status);
                    }
                    if (spec) {
                        const before = thread.querySelectorAll('.chat-imgs img').length;
                        showPending(bubble);
                        handedToImage = true;
                        await drawWithConsole(spec, userRow._chatRefs || [], responseTask);
                        clearSparePending(before);
                    } else if (!videoRequested && !descriptionOnly && !settingsOnly && !preferenceOnly && !/(?:不要|别|不需要|无需|不用|只.{0,4}(?:文本|文字|提示词)|解释|代码|示例|JSON|markdown)|\b(?:don't|do not)\b/i.test(typed)) {
                        const candidate = readImageSpec(full, '生图');
                        if (candidate) offerChatImageGeneration(bubble, candidate, userRow._chatRefs || [], parameterContext);
                    }
                } catch (err) {
                    // 降级生图前结束对话监控，不能让旧 watchdog 中断后续生成。
                    waitMonitor.stop();
                    replyStream.stop();
                    const failure = waitMonitor.timedOut
                        ? new Error('超过 2 分钟没有收到模型响应，已自动停止等待，可点「重新回答」重试')
                        : err;
                    if (videoRequested) responseTask.finish(failure);
                    // 对话模型压根用不了：不弹错误，改成和「右键直接出图」一样，把提示词直接交给生图模型
                    if (failure && failure.chatUnavailable && !videoRequested && !waitMonitor.timedOut && !responseTask.cancelled && typed) {
                        handedToImage = true;
                        try {
                            await fallBackToDirectImage(typed, refs, bubble, responseTask, failure.message);
                        } catch (fallbackError) {
                            responseTask.error = fallbackError;
                            lastChatError = fallbackError.message;
                            paintAssistant(bubble, fallbackError.message || '生成失败');
                        }
                    } else {
                        responseTask.error = failure;
                        if (!responseTask.cancelled) lastChatError = failure.message;
                        if (!responseTask.cancelled) paintAssistant(bubble, failure.message || '对话失败');
                    }
                } finally {
                    replyStream.stop();
                    responseTask.controller.signal.removeEventListener('abort', replyStream.stop);
                    waitMonitor.stop();
                    if (!handedToImage) responseTask.finish(responseTask.error);
                    chatBusy = false;
                    if (sendBtn) sendBtn.disabled = false;
                }
            }
            // 对话模型不可用的统一降级：不弹错误，改成「右键直接出图」那条路径，把提示词原样交给生图模型
            function chatUnavailableError(message) {
                const err = new Error(message || '对话模型不可用');
                err.chatUnavailable = true;
                return err;
            }
            // 左键发送前先判断当前对话目标能不能用；没有检测结果/已强制显示一律放行（绝不误杀）
            function chatUnavailableReason() {
                const av = window.ModelAvailability;
                if (!av || typeof av.isProviderAvailable !== 'function' || !av.ready || !av.ready()) return '';
                const target = readChatTarget();
                const provider = target.provider || 'comfly';
                const model = target.model || '';
                const keyOf = av.keys || {};
                if (!av.isProviderAvailable(provider)) {
                    return av.reason(keyOf.provider ? keyOf.provider(provider) : 'provider:' + provider) || '对话渠道不可用';
                }
                if (model && !av.isModelAvailable('chat', provider, model)) {
                    return av.reason(keyOf.model ? keyOf.model('chat', provider, model) : 'chat:' + provider + '/' + model) || '对话模型不可用';
                }
                // 整张对话模型列表都被筛空 = 一个能用的对话渠道都没有
                if (!chatProviders.length) return '当前没有可用的对话模型';
                return '';
            }
            // 后端给的原因是给开发者看的（含「请在 API/.env 中填写」这类指引），展示前收拾成人话
            function friendlyChatReason(raw) {
                let text = String(raw || '').trim();
                text = text.replace(/[,，;；]?\s*请在?\s*API\s*[\/\\]?\s*\.?env[^。]*。?\s*$/i, '');
                text = text.replace(/\s+/g, ' ').replace(/[,，:：]$/, '');
                if (text.length > 40) text = text.slice(0, 40) + '…';
                return text || '未配置可用渠道';
            }
            async function fallBackToDirectImage(text, refs, bubble, existingTask, reason) {
                const why = friendlyChatReason(reason);
                // 原因本身已经点明「对话模型」时不再套一层括号，避免读成「对话模型不可用（对话模型不可用）」
                const note = (/对话模型|对话渠道/.test(why) ? why : '对话模型不可用（' + why + '）') + '，已跳过对话，直接用当前生图模型生成';
                paintAssistant(bubble, note);
                if (existingTask) {
                    existingTask.error = null;
                    if (typeof existingTask.setStage === 'function') existingTask.setStage('对话模型不可用，改为直接出图');
                }
                const before = thread.querySelectorAll('.chat-imgs img').length;
                showPending(bubble);
                try {
                    await drawWithConsole({ prompt: text }, refs || [], existingTask);
                } finally {
                    clearSparePending(before);
                }
            }
            const genBtn = document.getElementById('mainGenBtn');
            const genLabel = document.getElementById('btnText');
            if (genLabel) genLabel.textContent = '发送';
            async function drawChatDirect() {
                const text = ((promptBox && promptBox.value) || '').trim();
                if (!text || chatBusy) return;
                conversationLoader.cancel();
                chatBusy = true;
                if (genBtn) genBtn.disabled = true;
                const bubble = addAssistant();
                bubble.textContent = '按当前设置直接出图';
                const before = thread.querySelectorAll('.chat-imgs img').length;
                showPending(bubble);
                armed = true;
                markExistingImages();
                try {
                    const refs = await chatReferencePayload(); sentReferenceRevision = referenceRevision;
                    await drawWithConsole({ prompt:text }, refs);
                }
                finally {
                    // 出图流程要读输入框内容，所以等结束后再清；若期间用户已重新输入则不覆盖
                    if (((promptBox && promptBox.value) || '').trim() === text) resetChatInput();
                    sentReferenceRevision = referenceRevision;
                    chatBusy = false; if (genBtn) genBtn.disabled = false;
                }
                clearSparePending(before);
            }
            if (genBtn) {
                genBtn.title = '左键发送，右键按当前提示词直接出图（对话模型不可用时左键会自动改为直接出图）';
                genBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopImmediatePropagation();
                    sendChat();
                }, true);
                genBtn.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    drawChatDirect();
                });
            }
            if (promptBox) {
                promptBox.addEventListener('keydown', (e) => {
                    if (e.isComposing || e.keyCode === 229) return;
                    if (e.key !== 'Enter') return;
                    if (e.shiftKey) {
                        e.stopPropagation();
                        return;
                    }
                    e.preventDefault();
                    e.stopPropagation();
                    sendChat();
                }, true);
            }
            // 只接收真实生成结果；画廊的历史加载、筛选和重绘不属于新生成。
            window.addEventListener('studio-gen-complete', (event) => {
                const { record, target } = event.detail || {};
                if (!armed || !target || !target.isConnected || !thread.contains(target)) return;
                (record && record.images || []).forEach(src => addImage(src, target));
            });
            function clearSparePending(beforeCount) {
                if (thread.querySelectorAll('.chat-imgs img').length <= beforeCount) return;
                thread.querySelectorAll('[data-pending]:not([data-image-loading])').forEach(node => node.remove());
                window.__chatPendingCards = (window.__chatPendingCards || []).filter(card => card.isConnected);
            }
            window.addEventListener('studio-gen-failed', (event) => {
                const message = (event.detail && event.detail.message) || '生成失败';
                const hosts = new Set();
                thread.querySelectorAll('[data-pending]').forEach(pending => {
                    const host = pending.closest('.chat-asst');
                    if (host) hosts.add(host);
                    const row = pending.parentElement;
                    pending.remove();
                    if (row && row.classList.contains('chat-imgs') && !row.querySelector('img, [data-pending]')) row.remove();
                });
                window.__chatPendingCards = [];
                hosts.forEach(host => {
                    if (host.querySelector('img')) return;
                    let note = host.querySelector('.chat-gen-fail');
                    if (!note) {
                        note = document.createElement('div');
                        note.className = 'chat-gen-fail';
                        host.appendChild(note);
                    }
                    note.textContent = message;
                });
            });
            // 等待 defer 加载的画廊组件就绪，避免历史图片恢复中途报错。
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', restoreChat, { once: true });
            } else {
                restoreChat();
            }
        }
    </script>
