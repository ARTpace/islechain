    <script>
        lucide.createIcons();

        function generateUUID() {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) { try { return crypto.randomUUID(); } catch(e){} }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16); });
        }
        const CLIENT_ID = localStorage.getItem("client_id") || generateUUID();
        localStorage.setItem("client_id", CLIENT_ID);

        // ── LoRA 管理器兼容别名（替换旧的内联 LoRA 代码） ──
        if (typeof LoraManager !== 'undefined') {
            var loraState = LoraManager.state;
            var loadAvailableLoras = () => LoraManager.load();
            var updateLoraSwitcherVisibility = () => LoraManager.updateVisibility();
            var toggleLoraPanel = () => LoraManager.togglePanel();
            var injectLoraNodes = (wf) => LoraManager.injectNodes(wf);
            var _loraSyncTriggerWords = (arr) => LoraManager.syncTriggerWords(arr);
            var _loraCollectTriggerWords = (arr) => LoraManager.collectTriggerWords(arr);
            var extractLoraModel = (n) => LoraManager.getModel(n);
            var getFilteredLoras = () => LoraManager.getFiltered();
            var cnFolder = (n) => LoraManager.cnFolder(n);
            var saveLoraConfig = () => LoraManager.saveConfig();
            var loadLoraConfig = () => LoraManager.loadConfig();
            var groupLoraVersions = () => {};
            var _rebuildTriggerWordMap = () => {};
            var _loraBuildEntry = () => {};
            var _loraBuildManagerEntry = () => {};
            var _loraEnrichFromManager = () => {};
            var _loraFetchScanRaw = () => Promise.resolve({ paths: [], previews: {}, entries: [] });
            var _loraBuildScanEntries = () => [];
            var _loraExtractFolder = () => '';
            var _loraExtractFileName = () => '';
            var _loraIsVideoUrl = () => false;
            var _loraSplitPreview = () => ({ preview: '', videoUrl: '' });
            var _loraExtractVideoUrl = () => '';
            var LORA_NODE_BASE = 9000;
        }

        // ── PromptTags 管理器兼容别名 ──
        if (typeof PromptTags !== 'undefined') {
            PromptTags.init();
            var updatePromptTags = () => PromptTags.update();
            var togglePromptLang = () => PromptTags.toggleLang();
            var togglePromptTags = () => PromptTags.toggleExpand();
            var removePromptTag = (tag) => PromptTags.removeTag(tag);
            var loadPresetI18n = () => PromptTags.loadI18n();
            var translatePromptToCn = (p) => PromptTags.translateToCn(p);
            var translatePromptToEn = (p) => PromptTags.translateToEn(p);
            var promptTagDragStart = (e) => PromptTags.dragStart(e);
            var promptTagDragOver = (e) => PromptTags.dragOver(e);
            var promptTagDrop = (e) => PromptTags.drop(e);
            var promptTagDragEnd = (e) => PromptTags.dragEnd(e);
            var showAnimaTagPreview = (el) => PromptTags.showPreview(el);
            var hideAnimaTagPreview = () => PromptTags.hidePreview();
            var _cancelHidePreview = () => PromptTags.cancelHidePreview();
            var buildAnimaTagThumbUrl = (t, n) => PromptTags.buildThumbUrl ? PromptTags.buildThumbUrl(t, n) : '';
            var _isLoraFallbackTag = (t) => PromptTags.isLoraFallbackTag ? PromptTags.isLoraFallbackTag(t) : false;
            var _findActiveLoraByTrigger = (t) => PromptTags.findActiveLoraByTrigger ? PromptTags.findActiveLoraByTrigger(t) : null;
            var _onLoraPreviewStrength = (el, i) => PromptTags.onLoraStrength(el, i);
            window.updatePromptTags = updatePromptTags;
            window.togglePromptLang = togglePromptLang;
            window.loadPresetI18n = loadPresetI18n;
            window.PROMPT_TAGS_LANG_MODE = window.PROMPT_TAGS_LANG_MODE || 'cn';
        }

        // === 通用工具函数（纯函数，无副作用） ===
        // - splitPrompt(text)             : 把提示词按逗号拆成 token 数组（trim + 过滤空）
        // - setPickerButtonState(btn, n, label)
        //                                   根据已选数量 n 设置按钮高亮 + 角标文案
        // - promptHasArtistToken(parts)  : 判断 parts 中是否含 @xxx / by xxx 风格的画师 token
        // - extractArtistName(token)     : 从 @xxx / by xxx 中提取画师名（无前缀则返回 null）
        // - safeDbAvailable(name)        : 延迟安全检查全局 DB 是否已加载
        // 注：以下函数都是无副作用的纯函数，专门用于消解 updatePickerButtonsHighlight / syncPickerStatesFromPrompt 内的重复样板
        function splitPrompt(text) {
            if (!text) return [];
            return text.split(',').map(p => p.trim()).filter(Boolean);
        }
        function setPickerButtonState(btnId, textId, count, baseLabel) {
            const btn = document.getElementById(btnId);
            const txt = document.getElementById(textId);
            if (!btn) return;
            if (count > 0) btn.classList.add('is-in-use');
            else btn.classList.remove('is-in-use');
            if (txt) txt.textContent = count > 0 ? `${baseLabel}(${count})` : baseLabel;
        }
        function promptHasArtistToken(token) {
            if (!token) return false;
            return token.startsWith('@') || token.startsWith('by ');
        }
        function extractArtistName(token) {
            if (!token) return null;
            if (token.startsWith('@')) return token.substring(1).trim();
            if (token.startsWith('by ')) return token.substring(3).trim();
            return null;
        }
        function safeDbAvailable(name) {
            // 注：本函数已弃用。原实现用 window[name] 查 let 声明的全局变量永远返回 false，
            // 导致 getCharIndex 锁死空缓存。已替换为 _readDb()（依赖 picker 脚本主动挂到 window）。
            // 保留定义仅为兼容外部脚本（lora-picker.js 等）可能的引用。
            try {
                const v = (typeof window !== 'undefined') ? window[name] : undefined;
                return Array.isArray(v) && v.length > 0;
            } catch (_) { return false; }
        }

        // === 额外负面提示词 ===
        function toggleExtraNegative() {
            const panel = document.getElementById('extraNegPanel');
            const btn = document.getElementById('extraNegToggle');
            const ta = document.getElementById('extraNegativePrompt');
            const isOpen = panel.classList.toggle('show');
            btn.classList.toggle('active', isOpen);
            if (isOpen) ta.focus();
        }

        function mergeExtraNegative(workflow, extraText) {
            if (!extraText) {
                console.log('[NegPrompt] 无额外负面提示词，跳过');
                return;
            }
            console.log('[NegPrompt] 用户额外负面提示词: ', JSON.stringify(extraText));

            // Step 1: 找到所有 KSampler/KSamplerAdvanced → negative 引用
            const pairs = []; // { samplerNid, samplerNode, negNid, negNode }
            for (const nid in workflow) {
                const node = workflow[nid];
                if (!node || !node.inputs) continue;
                const ct = node.class_type || '';
                if (ct === 'KSampler' || ct === 'KSamplerAdvanced') {
                    const negRef = node.inputs.negative;
                    if (Array.isArray(negRef) && negRef.length === 2) {
                        const negNid = String(negRef[0]);
                        const negNode = workflow[negNid];
                        pairs.push({ samplerNid: nid, samplerNode: node, negNid, negNode });
                        console.log('[NegPrompt] ', ct, nid, '→ negative 节点', negNid, '类型:', negNode ? negNode.class_type : 'MISSING');
                    }
                }
            }

            if (pairs.length === 0) {
                console.warn('[NegPrompt] 工作流中未找到任何 KSampler/KSamplerAdvanced — 无法注入负面提示词');
                return;
            }

            // Step 2: 逐对处理（原地修改，无需新增节点，节点ID不变）
            for (const { samplerNid, samplerNode, negNid, negNode } of pairs) {
                if (!negNode) {
                    console.warn('[NegPrompt] KSampler', samplerNid, '的 negative 节点', negNid, '不存在于工作流中');
                    continue;
                }

                if (negNode.class_type === 'CLIPTextEncode') {
                    // 已有 CLIPTextEncode（ANIMA 节点12）— 直接追加
                    const oldText = (negNode.inputs.text || '').trim();
                    const separator = oldText ? ', ' : '';
                    negNode.inputs.text = oldText + separator + extraText;
                    console.log('[NegPrompt] KSampler', samplerNid, '→ CLIPTextEncode', negNid, '追加负面');
                } else {
                    console.warn('[NegPrompt] KSampler', samplerNid, 'negative 节点', negNid,
                        '类型为', negNode.class_type, '— 非 CLIPTextEncode，跳过');
                }
            }

            // Step 3: 最终验证 — 遍历所有 KSampler，打印最终 negative text
            console.groupCollapsed('[NegPrompt] 最终验证: 所有 KSampler 的 negative 文本');
            for (const nid in workflow) {
                const node = workflow[nid];
                if (!node || !node.inputs) continue;
                const ct = node.class_type || '';
                if (ct === 'KSampler' || ct === 'KSamplerAdvanced') {
                    const negRef = node.inputs.negative;
                    if (Array.isArray(negRef) && negRef.length === 2) {
                        const finalNegNode = workflow[String(negRef[0])];
                        const finalText = (finalNegNode && finalNegNode.class_type === 'CLIPTextEncode')
                            ? (finalNegNode.inputs.text || '')
                            : '(非CLIPTextEncode)';
                        console.log('  KSampler', nid, '→', String(negRef[0]), ':', JSON.stringify(finalText));
                    }
                }
            }
            console.groupEnd();
        }

        // === DB 索引（懒加载单例） — 当前未使用 ===
        // 历史问题：原实现走 safeDbAvailable → window[name] 查 let 声明的全局变量永远失败，
        // 导致 getCharIndex 锁死空缓存，角色识别（紫色 tag + 缩略图）回归失效。
        // 现 updatePromptTags / updatePickerButtonsHighlight / syncPickerStatesFromPrompt
        // 全部改用"直接 typeof + 每次重建 Set"（对齐旧版本 C:\Users\ARTpace\Pictures\art-canvas），
        // 性能可接受（36k 元素 Set 重建约几毫秒，输入防抖 60ms 内不卡顿）。
        // 本套函数保留作为未来性能优化基础设施，但当前没有被任何调用点引用。
        function _readDb(name) {
            // 三个外部 picker 脚本（anima-character-picker.js / anima-artist-picker.js / preset-picker.js）
            // 在数据加载完后会同步挂到 window[name]，所以这里只读 window 即可。
            try {
                if (typeof window !== 'undefined') {
                    const v = window[name];
                    if (Array.isArray(v) && v.length > 0) return v;
                }
            } catch (_) {}
            return null;
        }
        let __charIndex = null;
        function getCharIndex() {
            const db = _readDb('ANIMA_CHAR_DB');
            // DB 还没就绪时绝不缓存空状态，否则首次空缓存会锁死
            if (!db) return { nameSet: new Set(), triggerSet: new Set(), triggerToName: new Map(), built: false, count: 0 };
            if (__charIndex && __charIndex.count === db.length) return __charIndex;
            const index = { nameSet: new Set(), triggerSet: new Set(), triggerToName: new Map(), built: false, count: 0 };
            db.forEach(c => {
                const name = (c.name || '').toLowerCase();
                if (name) index.nameSet.add(name);
                if (Array.isArray(c.triggers)) {
                    c.triggers.forEach(t => {
                        const tl = String(t).toLowerCase();
                        if (tl) {
                            index.triggerSet.add(tl);
                            if (name) index.triggerToName.set(tl, c.name);
                        }
                    });
                } else if (typeof c.trigger === 'string') {
                    const tl = c.trigger.toLowerCase();
                    if (tl) {
                        index.triggerSet.add(tl);
                        if (name) index.triggerToName.set(tl, c.name);
                    }
                }
            });
            index.built = true;
            index.count = db.length;
            __charIndex = index;
            return index;
        }
        function isCharToken(token) {
            if (!token) return false;
            if (promptHasArtistToken(token) || token.startsWith('[')) return false;
            const idx = getCharIndex();
            if (!idx.built) return false;
            const tl = token.toLowerCase();
            return idx.nameSet.has(tl) || idx.triggerSet.has(tl);
        }
        function findCharNameByTrigger(trigger) {
            if (!trigger) return null;
            return getCharIndex().triggerToName.get(trigger.toLowerCase()) || null;
        }

        let __artistIndex = null;
        function getArtistIndex() {
            const db = _readDb('ANIMA_ARTIST_DB');
            if (__artistIndex && db && __artistIndex.count === db.length) return __artistIndex;
            const index = { nameSet: new Set(), built: false, count: 0 };
            if (db) {
                db.forEach(a => {
                    const n = (a.name || '').toLowerCase();
                    if (n) index.nameSet.add(n);
                });
                index.built = true;
                index.count = db.length;
            }
            __artistIndex = index;
            return index;
        }
        function isArtistName(name) {
            if (!name) return false;
            return getArtistIndex().nameSet.has(name.toLowerCase());
        }
        function isArtistToken(token) {
            const n = extractArtistName(token);
            return n ? isArtistName(n) : false;
        }

        let __presetIndex = null;
        function getPresetIndex() {
            const db = _readDb('_flatIndex');
            if (!db) return { built: false, count: 0, byKey: new Map() };
            if (__presetIndex && __presetIndex.count === db.length) return __presetIndex;
            __presetIndex = { built: false, count: 0, byKey: new Map() };
            db.forEach(p => {
                if (!p) return;
                const key = (p.category_id || p.category || '') + ':' + (p.id || p.name);
                __presetIndex.byKey.set(key, p);
            });
            __presetIndex.built = true;
            __presetIndex.count = db.length;
            return __presetIndex;
        }
        // 预设在 prompt 中是否被命中（按预设 name 或预设 prompt 字符串匹配）
        function isPresetMatched(lowerSet, preset) {
            if (!preset) return null;
            const name = (preset.name || '').toLowerCase();
            const prompt = (preset.prompt || '').toLowerCase();
            if ((name && lowerSet.has(name)) || (prompt && lowerSet.has(prompt))) {
                return (preset.category_id || preset.category || '') + ':' + (preset.id || preset.name);
            }
            return null;
        }
        function invalidateDbIndexes() {
            __charIndex = null;
            __artistIndex = null;
            __presetIndex = null;
            __presetPromptSet = null;
        }

        // 预设 prompt 字符串 → id 的索引（懒加载单例）
        // - 用于 updatePromptTags / _mergePresetsForDrag 贪心合并连续 token
        // - 仅包含「prompt 包含 , 的多词预设」，单词预设不需要合并
        let __presetPromptSet = null;
        function getPresetPromptSet() {
            if (__presetPromptSet) return __presetPromptSet;
            const map = new Map();
            try {
                if (typeof presetPickerData !== 'undefined' && presetPickerData && Array.isArray(presetPickerData.categories)) {
                    presetPickerData.categories.forEach(cat => {
                        if (!cat || !Array.isArray(cat.subcategories)) return;
                        cat.subcategories.forEach(sub => {
                            if (!sub || !Array.isArray(sub.presets)) return;
                            sub.presets.forEach(p => {
                                if (p && p.prompt && p.prompt.includes(',')) {
                                    const k = p.prompt.trim();
                                    if (k && !map.has(k)) map.set(k, p.id);
                                }
                            });
                        });
                    });
                }
            } catch (_) {}
            __presetPromptSet = map;
            return map;
        }

        let isGenerating = false;
        let currentPromptId = null;
        const COMFYUI_WS_URL = `${window.location.protocol==='https:'?'wss:':'ws:'}//${window.location.host}/api/comfyui/ws?client_id=${CLIENT_ID}`;

        // === 共享 WebSocket：实时进度分发 ===
        const _activeTasks = new Map(); // promptId → { card, onDone }
        let _sharedWs = null;
        let _wsReconnectTimer = null;
        function _ensureWs() {
            if (_sharedWs && _sharedWs.readyState === 1) return Promise.resolve();
            if (_sharedWs && _sharedWs.readyState === 0) return new Promise((r) => {
                _sharedWs.addEventListener('open', r, { once: true });
                setTimeout(r, 3000);
            });
            if (_wsReconnectTimer) { clearTimeout(_wsReconnectTimer); _wsReconnectTimer = null; }
            _sharedWs = null;
            return new Promise((resolve) => {
                try {
                    const ws = new WebSocket(COMFYUI_WS_URL);
                    _sharedWs = ws;
                    ws.onopen = () => resolve();
                    setTimeout(resolve, 3000);
                    ws.onmessage = (e) => {
                        try {
                            if (typeof e.data !== 'string') return;
                            const msg = JSON.parse(e.data);
                            const pid = msg.data?.prompt_id;
                            if (!pid) return;
                            const task = _activeTasks.get(pid);
                            if (!task) return;
                            if (msg.type === 'progress') {
                                CardProgress.update(task.card, { status: 'sampling', value: msg.data.value, max: msg.data.max });
                            } else if (msg.type === 'executing') {
                                if (msg.data.node === null) {
                                    CardProgress.update(task.card, { status: 'done' });
                                    if (task.onDone) task.onDone();
                                } else {
                                    CardProgress.update(task.card, { status: 'executing' });
                                }
                            } else if (msg.type === 'execution_start') {
                                CardProgress.update(task.card, { status: 'started' });
                            }
                        } catch(err) {}
                    };
                    ws.onclose = () => { _sharedWs = null; _wsReconnectTimer = setTimeout(_ensureWs, 2000); };
                    ws.onerror = () => {};
                } catch(e) { resolve(); }
            });
        }
        async function _registerTask(promptId, card, onDone) {
            _activeTasks.set(promptId, { card, onDone });
            await _ensureWs();

        function _unregisterTask(promptId) {

            const prefixes = _compatModelPrefixes();
            const isCompatible = (modelName) => {
                if (!modelName) return true;
                if (prefixes === null) return true;
                const lower = modelName.replace(/\\/g, '/').toLowerCase();
                return prefixes.some(p => lower.startsWith(p.replace(/\\/, '/')));
            };
            if (selectedUnetModel && !isCompatible(selectedUnetModel)) {
                selectedUnetModel = '';

            // 恢复该工作流上次记忆的 UNET 模型（按工作流持久化到 localStorage）
            const saved = _getSavedUnetForWorkflow(currentWorkflow);

                // 记忆里的模型已经不属于该工作流了（例如工作流被改成另一个前缀），

                // 非 ANIMA: inline display:none 彻底隐藏

        // === 当前工作流兼容的模型文件夹前缀列表 ===
        function _compatModelPrefixes() {
            const wf = currentWorkflow.toLowerCase();
            if (wf.includes('anima')) return ['anima\\', 'anima/'];
            if (wf.includes('krea2')) return ['flux2-klein\\', 'flux2-klein/'];
            if (wf.includes('ideogram4')) return ['ideogram4\\', 'ideogram4/'];
            if (wf.includes('boogu')) return ['boogu\\', 'boogu/'];
            if (wf.includes('zimage') || wf.includes('z-image')) return ['z-image\\', 'z-image/'];
            return null; // unknown -> show all
        }
        // === 模型选择面板（UNET 模型文件） ===
        let selectedUnetModel = '';  // 用户选择的 UNET 模型文件名
        let unetModelsCache = null;  // 缓存：首次加载后不再重复请求

        // 按工作流记忆用户选择的 UNET 模型（持久化到 localStorage），
        // 下次打开同一工作流时自动恢复选择，而不是回退到工作流 JSON 默认值。
        const UNET_PER_WF_KEY = 'zimage_unet_per_wf';

        function _loadUnetMap() {
            try {
                const raw = localStorage.getItem(UNET_PER_WF_KEY);
                if (!raw) return {};
                const obj = JSON.parse(raw);
                return (obj && typeof obj === 'object') ? obj : {};
            } catch (e) { return {}; }
        }

        function _saveUnetMap(map) {
            try { localStorage.setItem(UNET_PER_WF_KEY, JSON.stringify(map || {})); }
            catch (e) {}
        }

        function _getSavedUnetForWorkflow(wfName) {
            if (!wfName) return '';
            return _loadUnetMap()[wfName] || '';
        }

        function _setSavedUnetForWorkflow(wfName, modelName) {
            if (!wfName) return;
            const map = _loadUnetMap();
            if (modelName) map[wfName] = modelName;
            else delete map[wfName];
            _saveUnetMap(map);
        }

        // 从已加载的工作流 JSON 中提取当前在用的 UNET/Diffusion 模型名。
        // 优先级：运行时选择的 selectedUnetModel > 该工作流上次记忆的模型 > 工作流 JSON 默认值。
        function getCurrentWorkflowUnet() {
            if (selectedUnetModel) return selectedUnetModel;
            const saved = _getSavedUnetForWorkflow(currentWorkflow);
            if (saved) return saved;
            try {
                const wf = window._wfCache && window._wfCache[currentWorkflow];
                if (!wf) return '';
                for (const nid in wf) {
                    const node = wf[nid];
                    if (!node || !node.inputs) continue;
                    if (node.class_type === 'UNETLoader' && node.inputs.unet_name) {
                        return node.inputs.unet_name;
                    }
                    if (typeof node.class_type === 'string'
                        && node.class_type.includes('LoadDiffusionModel')
                        && node.inputs.model_name) {
                        return node.inputs.model_name;
                    }
                }
            } catch (e) {}
            return '';
        }

        // 规范化模型名：统一反斜杠 + 去尾部 .safetensors + 小写，用于跨平台匹配
        function _normModelName(n) {
            if (!n) return '';
            return String(n).replace(/\\/g, '/').replace(/\.safetensors$/i, '').toLowerCase();
        }

        // 主动加载当前工作流到 _wfCache（如果还没有），让 getCurrentWorkflowUnet 能在
        // 打开弹窗时就拿到工作流 JSON 中默认的 UNET 模型名，免去必须先跑一次才能高亮的体验。
        async function ensureWorkflowCached() {
            if (!currentWorkflow) return;
            if (!window._wfCache) window._wfCache = {};
            if (window._wfCache[currentWorkflow]) return;
            try {
                const res = await fetch('/api/workflows/' + encodeURIComponent(currentWorkflow));
                if (!res.ok) return;
                const env = await res.json();
                window._wfCache[currentWorkflow] = env.workflow || env;

        function openModelPicker() {

            const renderAfter = () => {
                if (unetModelsCache) {

                list.innerHTML = '<div style="text-align:center;padding:20px;color:#999;font-size:12px;">加载模型列表中...</div>';

                if (filteredItems.length === 0) return '';

                    const shortName = name.replace(/\\/g, '/').split('/').pop().replace(/\.safetensors$/i, '');
                    // 匹配规则：按归一化名（反斜杠+大小写+扩展名）匹配，
                    // 工作流 JSON 中 "z-image\foo.safetensors" 和列表里的 "z-image/foo.safetensors" 都能对上

        async function fetchUnetModels() {

            const endpoints = [

                { url: '/api/comfyui/object_info/LoadDiffusionModelShared%20%2F%2F%2FInspire', key: 'LoadDiffusionModelShared //Inspire', field: 'model_name', label: 'Shared Diffusion 模型' },
            ];
            for (const ep of endpoints) {
                try {
                    const res = await fetch(ep.url);
                    if (!res.ok) continue;
                    const data = await res.json();
                    const node = data[ep.key];
                    const models = node?.input?.required?.[ep.field]?.[0];
                    if (Array.isArray(models) && models.length) {
                        groups.push({ label: ep.label, items: models });
                    }
                } catch (e) {}
            }
            return groups;

                async function saveToUserOutput(comfyUrl, featureName) {
            try {
                const u=new URL(comfyUrl,window.location.origin),fn=u.searchParams.get('filename')||'',sf=u.searchParams.get('subfolder')||'',tp=u.searchParams.get('type')||'output';

                const res=await fetch('/api/comfyui/save-to-output?filename='+encodeURIComponent(fn)+'&subfolder='+encodeURIComponent(sf)+'&type='+encodeURIComponent(tp)+'&feature='+encodeURIComponent(featureName)+'&token='+encodeURIComponent(token));
                if(!res.ok)return comfyUrl; const data=await res.json(); return data.url||comfyUrl;

        // === 主渲染逻辑 ===
        async function handleRender() {
            // 生成前同步提示词 → 各选择器状态（确保粘贴的 LoRA 触发词能被检测到）
            if (typeof syncPickerStatesFromPrompt === 'function') {
                syncPickerStatesFromPrompt();
            }
            // 随机功能：如果 🎲 开关已开启，每次生成前自动应用激活方案
            if (typeof RandomPrompt !== 'undefined' && RandomPrompt.isRandomEnabled()) {
                const randomResult = await RandomPrompt.applyAutoRandom();
                if (randomResult && randomResult.positive) {
                    const promptEl = document.getElementById('prompt');
                    // 替换提示词（而不是追加）
                    promptEl.value = randomResult.positive;
                    promptEl.dispatchEvent(new Event('input'));
                    // LoRA：必须等 prompt 框被新 positive 覆盖后再调，否则触发词会被覆盖
                    if (randomResult.plan && randomResult.plan.loras) {
                        RandomPrompt.applyLoras(randomResult.plan.loras);
                    }
                }
            }
            
            const prompt = document.getElementById('prompt').value.trim();
            if (!prompt) return alert("请输入提示词");
            if (currentEngine !== 'local') return alert("请切换到 COMFYUI 引擎");

            // 不再锁定按钮，允许连续点击排队
            startProgress();
            // 锁定当前工作流，生成期间切换模型不影响保存路径
            const lockedWorkflow = currentWorkflow;
            const lockedFeatureName = lockedWorkflow.includes('anima') ? 'anima' : lockedWorkflow.includes('Krea2') ? 'krea2' : lockedWorkflow.includes('Ideogram4') ? 'ideogram4' : lockedWorkflow.includes('Boogu') ? 'boogu' : 'zimage';

            // 按当前生成分辨率设置 placeholder 宽高比，过渡时无尺寸跳变
            const _aspectSize = getAnimaSize();
            const _aspectRatio = _aspectSize.width + ' / ' + _aspectSize.height;
            const placeholder = document.createElement('div');
            placeholder.className = 'masonry-item bg-gray-50 flex flex-col items-center justify-center border-dashed border-2 border-gray-200';
            placeholder.style.minHeight = '180px';
            placeholder.style.aspectRatio = _aspectRatio;
            placeholder.style.transition = 'all 0.4s ease';
            placeholder.innerHTML = CardProgress.HTML;
            document.getElementById('masonry').prepend(placeholder);

            try {
                const _gc = GenerationControls.getState();
                // 加载工作流（带缓存，避免重复请求）
                if (!window._wfCache) window._wfCache = {};
                let workflow;
                if (window._wfCache[currentWorkflow]) {
                    workflow = JSON.parse(JSON.stringify(window._wfCache[currentWorkflow]));
                } else {
                    const wfRes = await fetch('/api/workflows/' + encodeURIComponent(currentWorkflow));
                    if (!wfRes.ok) throw new Error('工作流加载失败');
                    const wfEnvelope = await wfRes.json();
                    window._wfCache[currentWorkflow] = wfEnvelope.workflow || wfEnvelope;

                const seed = (_gc.seedMode === 'fixed' && _gc.fixedSeed > 0) ? _gc.fixedSeed : Math.floor(Math.random() * 10**15);

                // 注入用户选择的 UNET 模型
                if (selectedUnetModel) {
                    for (const nid in workflow) {
                        const node = workflow[nid];

                        // UNETLoader 节点
                        if (node.class_type === 'UNETLoader' && node.inputs.unet_name !== undefined) {
                            node.inputs.unet_name = selectedUnetModel;
                        }
                        // LoadDiffusionModelShared //Inspire 节点
                        if (node.class_type && node.class_type.includes('LoadDiffusionModel') && node.inputs.model_name !== undefined) {
                            node.inputs.model_name = selectedUnetModel;
                        }
                    }

                if (currentWorkflow.includes('anima')) {
                    // 解析提示词，分离角色和画师标签
                    const parts = prompt.split(PROMPT_TAG_SPLITTER).map(p => p.trim()).filter(p => p);
                    const charTags = parts.filter(p => !p.startsWith('by ') && !p.startsWith('@')).join(', ');
                    const artistTags = parts.filter(p => p.startsWith('by ') || p.startsWith('@')).map(p => '@' + p.replace(/^by /, '').replace(/^@/, '')).join(', ');
                    
                    const node51 = workflow["51"];
                    if (node51?.inputs) {
                        node51.inputs.character_tags = charTags;
                        // 合并画师标签和预设提示词
                        const presetPrompts = getActivePresetPrompts();
                        let optParts = [];
                        if (artistTags) optParts.push(artistTags);
                        if (presetPrompts) optParts.push(presetPrompts);
                        node51.inputs.opt_prompt = optParts.length > 0 ? optParts.join(', ') + ', ' : '';
                    }
                    // 设置图片尺寸

                        node69.inputs.width = size.width;
                        node69.inputs.height = size.height;

                    // 种子：随机模式用随机值，固定模式用用户指定值
                    const finalSeed = _gc.seedMode === 'fixed' && _gc.fixedSeed > 0 ? _gc.fixedSeed : seed;
                    if (workflow["19"]?.inputs) workflow["19"].inputs.seed = finalSeed;
                    // 覆盖 batch_size（使用与 KSampler(19).latent_image 来源节点对齐的值）
                    if (workflow["69"]?.inputs) workflow["69"].inputs.batch_size = _gc.batchCount;
                    if (workflow["64"]?.inputs) workflow["64"].inputs.batch_size = _gc.batchCount;

                    if (workflow["22"]?.inputs) workflow["22"].inputs.seed = seed;

                }
                console.log('[BatchCount] model=' + (currentWorkflow.includes('anima') ? 'ANIMA' : currentWorkflow.includes('Krea2') ? 'Krea2' : currentWorkflow.includes('Ideogram4') ? 'Ideogram4' : 'Z-Image') + ' currentBatchCount=' + _gc.batchCount + ' n69=' + (workflow['69']?.inputs?.batch_size) + ' n64=' + (workflow['64']?.inputs?.batch_size) + ' n144=' + (workflow['144']?.inputs?.batch_size) + ' n185=' + (workflow['185']?.inputs?.batch_size));

                // 注入自定义 LoRA 节点

                // 为本次任务生成独立 ID
                const taskPid = generateUUID();

                // 提交任务到 ComfyUI，捕获真实的 prompt_id
                const submitRes = await fetch('/api/comfyui/prompt', {

                let _pollDone = false;

            if (!container._thumbScrollBound) {
                container._thumbScrollBound = true;
                let isDragging = false;
                let hasMoved = false;
                let startX = 0;
                let startScrollLeft = 0;
                const DRAG_THRESHOLD = 5;

                // 鼠标滚轮水平滚动
                container.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    container.scrollLeft += e.deltaY * 2;
                }, { passive: false });

                // 拖动滚动
                container.addEventListener('mousedown', (e) => {
                    isDragging = true;
                    hasMoved = false;
                    startX = e.pageX;
                    startScrollLeft = container.scrollLeft;
                    container.style.cursor = 'grabbing';
                    e.preventDefault();
                });

                document.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    const dx = e.pageX - startX;
                    if (Math.abs(dx) > DRAG_THRESHOLD) {
                        hasMoved = true;
                    }
                    if (hasMoved) {
                        container.scrollLeft = startScrollLeft - dx;
                    }
                });

                document.addEventListener('mouseup', () => {
                    if (isDragging) {
                        isDragging = false;
                        container.style.cursor = 'grab';
                    }

        function syncPickerStatesFromPrompt() {
            const promptInput = document.getElementById('prompt');
            if (!promptInput) return;
            const parts = splitPrompt(promptInput.value);
            const lowerSet = new Set(parts.map(p => p.toLowerCase()));

            // ---- 角色（旧版本写法：直接 typeof + 每次重建 Set，绕开 safeDbAvailable / getCharIndex 缓存链 bug） ----
            try {
                if (typeof pickerSelected !== 'undefined' && typeof ANIMA_CHAR_DB !== 'undefined' && ANIMA_CHAR_DB && ANIMA_CHAR_DB.length > 0) {
                    const _charNameSet = new Set(ANIMA_CHAR_DB.map(c => (c.name || '').toLowerCase()).filter(Boolean));
                    const _charTriggerSet = new Set();
                    ANIMA_CHAR_DB.forEach(c => {
                        if (Array.isArray(c.triggers)) c.triggers.forEach(t => _charTriggerSet.add(String(t).toLowerCase()));
                        else if (typeof c.trigger === 'string') _charTriggerSet.add(c.trigger.toLowerCase());
                    });
                    // 1) 移除：pickerSelected 中已不在 prompt 的项
                    let newPickerSelected = pickerSelected.filter(name => {
                        if (!name) return false;
                        const nl = name.toLowerCase();
                        if (_charNameSet.has(nl)) return true;
                        return lowerSet.has(nl);
                    });
                    // 2) 添加：prompt 中「确实是角色」的 token 但 pickerSelected 还没有的
                    const existing = new Set(newPickerSelected.map(n => n.toLowerCase()));
                    parts.forEach(t => {
                        if (!t) return;
                        if (promptHasArtistToken(t) || t.startsWith('[')) return;
                        const tl = t.toLowerCase();
                        if (existing.has(tl)) return;
                        if (_charNameSet.has(tl) && !_charTriggerSet.has(tl)) {
                            newPickerSelected.push(t);
                            existing.add(tl);
                        } else if (_charTriggerSet.has(tl)) {
                            // 是 trigger：从 DB 里找对应的真实 name
                            const hit = ANIMA_CHAR_DB.find(c => (c.trigger || '').toLowerCase() === tl || (Array.isArray(c.triggers) && c.triggers.some(x => String(x).toLowerCase() === tl)));
                            if (hit && !existing.has(hit.name.toLowerCase())) {
                                newPickerSelected.push(hit.name);
                                existing.add(hit.name.toLowerCase());
                            }
                        }
                    });
                    pickerSelected = newPickerSelected;
                    if (typeof pickerLastAppliedTokens !== 'undefined') {
                        pickerLastAppliedTokens = new Set(pickerSelected.map(t => t.toLowerCase()));
                    }
                }
            } catch (_) {}

            // ---- 画师（旧版本写法） ----
            try {
                if (typeof artistPickerSelected !== 'undefined' && typeof ANIMA_ARTIST_DB !== 'undefined' && ANIMA_ARTIST_DB && ANIMA_ARTIST_DB.length > 0) {
                    const _artistNameSet = new Set(ANIMA_ARTIST_DB.map(a => (a.name || '').toLowerCase()).filter(Boolean));
                    // 1) 移除
                    let newArtistSel = artistPickerSelected.filter(name => {
                        if (!name) return false;
                        const nl = name.toLowerCase();
                        if (_artistNameSet.has(nl)) return true;
                        return lowerSet.has('@' + nl) || lowerSet.has('by ' + nl);
                    });
                    // 2) 添加
                    const existingArtist = new Set(newArtistSel.map(n => n.toLowerCase()));
                    parts.forEach(t => {
                        if (!t) return;
                        const name = extractArtistName(t);
                        if (!name) return;
                        const nl = name.toLowerCase();
                        if (existingArtist.has(nl)) return;
                        if (_artistNameSet.has(nl)) {
                            newArtistSel.push(name);
                            existingArtist.add(nl);
                        }
                    });
                    artistPickerSelected = newArtistSel;
                    if (typeof artistPickerLastAppliedTokens !== 'undefined') {
                        // 只记录已知画师的 @ token，排除 LoRA 触发词
                        const currentArtistTokens = parts.filter(p => {
                            if (!promptHasArtistToken(p)) return false;
                            const n = extractArtistName(p);
                            return n && _artistNameSet.has(n.toLowerCase());
                        });
                        artistPickerLastAppliedTokens = new Set(currentArtistTokens.map(t => t.toLowerCase()));
                    }
                }
            } catch (_) {}

            // ---- 预设 ----
            try {
                if (typeof presetPickerSelected !== 'undefined') {
                    const pidx = getPresetIndex();
                    if (pidx.built) {
                        const matchedIds = new Set();
                        pidx.byKey.forEach(p => {
                            const k = isPresetMatched(lowerSet, p);
                            if (k) matchedIds.add(k);
                        });
                        // 1) 移除
                        let newPresetSel = presetPickerSelected.filter(p => {
                            const key = (p.category_id || p.category || '') + ':' + (p.id || p.name);
                            return matchedIds.has(key);
                        });
                        // 2) 添加：prompt 命中的预设（但 pickerSelected 中没有的）
                        const existingKeys = new Set(newPresetSel.map(p => (p.category_id || p.category || '') + ':' + (p.id || p.name)));
                        pidx.byKey.forEach(p => {
                            const key = isPresetMatched(lowerSet, p);
                            if (key && !existingKeys.has(key)) {
                                newPresetSel.push(p);
                                existingKeys.add(key);
                            }
                        });
                        presetPickerSelected = newPresetSel;
                        if (typeof presetPickerLastAppliedTokens !== 'undefined') {
                            const newSet = new Set();
                            pidx.byKey.forEach(p => {
                                const key = isPresetMatched(lowerSet, p);
                                if (key) {
                                    const t = (p.prompt || p.name || p.id || '').trim().toLowerCase();
                                    if (t) newSet.add(t);
                                }
                            });
                            presetPickerLastAppliedTokens = newSet;
                        }
                    }
                }
            } catch (_) {}

            // ---- LoRA：双向同步（手动增删触发词/文件名 ↔ loraState.active） ----
            // 辅助：判断 prompt 中是否包含某个词（支持 (word:1.2) / [word] 等格式）
            function _loraPromptHas(lowerSet, parts, word) {
                const wl = word.toLowerCase().replace(/^@/, '');
                if (lowerSet.has(wl) || lowerSet.has('@' + wl)) return true;
                return parts.some(p => {
                    const t = p.toLowerCase();
                    return t.includes(wl) || t.includes('@' + wl);
                });
            }
            try {
                if (loraState && loraState.loraMap) {
                    const prevCount = (loraState.active || []).length;

                    // ① 移除：active 中触发词/文件名已不在 prompt 里的
                    loraState.active = (loraState.active || []).filter(a => {
                        if (!a || !a.name) return false;
                        const meta = loraState.loraMap[a.name];
                        const tw = (meta && meta.triggerWords) || [];
                        if (tw.length > 0) {
                            return tw.some(w => _loraPromptHas(lowerSet, parts, w));
                        } else {
                            const dn = (meta && meta.displayName ? meta.displayName : a.name.split('/').pop().replace(/\.safetensors$/i, ''));
                            return _loraPromptHas(lowerSet, parts, dn);
                        }
                    });

                    // ② 添加：prompt 中出现的触发词/文件名但 active 里还没有的
                    const activeNames = new Set(loraState.active.map(a => a.name));
                    for (const key of Object.keys(loraState.loraMap)) {
                        if (activeNames.has(key)) continue;
                        const entry = loraState.loraMap[key];
                        if (!entry) continue;
                        const tw = entry.triggerWords || [];
                        let matched = false;
                        if (tw.length > 0) {
                            matched = tw.some(w => _loraPromptHas(lowerSet, parts, w));
                        } else {
                            const dn = (entry.displayName || key.split('/').pop().replace(/\.safetensors$/i, ''));
                            matched = _loraPromptHas(lowerSet, parts, dn);
                        }
                        if (matched) {
                            loraState.active.push({ name: key, strength: 0.8 });
                        }
                    }

                    // ③ 同步触发词记录
                    if (loraState.active.length !== prevCount) {
                        _loraActiveTriggerWords = new Set(_loraCollectTriggerWords(loraState.active));
                    }
                }
            } catch (_) {}

            // ---- 刷新按钮高亮/角标 ----
            if (typeof updatePickerButtonsHighlight === 'function') {
                updatePickerButtonsHighlight();
            }
        }
        // 暴露到 window，方便其他模块/调试调用
        window.syncPickerStatesFromPrompt = syncPickerStatesFromPrompt;

        // 监听 prompt 输入变化：用户手动修改或清空时，反向同步选择器状态
        document.addEventListener('DOMContentLoaded', () => {
            const promptEl = document.getElementById('prompt');
            if (promptEl) {
                // input 事件（打字/粘贴等）：立即同步，不加防抖
                promptEl.addEventListener('input', () => {
                    if (typeof syncPickerStatesFromPrompt === 'function') {
                        syncPickerStatesFromPrompt();
                    }
                    if (typeof PromptTranslateUI !== 'undefined' && typeof PromptTranslateUI.updateVisibility === 'function') {
                        PromptTranslateUI.updateVisibility();
                    }
                });
                // 额外保底：paste 事件
                promptEl.addEventListener('paste', () => {
                    // 需等 paste 完成后 value 才更新，microtask 够了
                    Promise.resolve().then(() => {
                        if (typeof syncPickerStatesFromPrompt === 'function') {
                            syncPickerStatesFromPrompt();
                        }
                        if (typeof PromptTranslateUI !== 'undefined' && typeof PromptTranslateUI.updateVisibility === 'function') {
                            PromptTranslateUI.updateVisibility();
                        }
                    });
                });
                // Shift+Enter 触发生成
                promptEl.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && e.shiftKey) {
                        e.preventDefault();
                        const btn = document.getElementById('mainGenBtn');
                        if (btn && !btn.disabled) btn.click();
                    }
                });
            }
        });

        window.onload = () => { 
            updatePromptTags(); 
            spPickerInit(); 
            spmInit(); 
            
            // 初始化生成参数控制
            GenerationControls.init();

            // 初始化翻译 Toggle
            if (typeof PromptTranslateUI !== 'undefined') {
                const promptEl = document.getElementById('prompt');
                PromptTranslateUI.init('translateBtnContainer', {
                    getText: () => promptEl ? promptEl.value : '',
                    onApply: function(text) {
                        if (promptEl) {
                            promptEl.value = text;
                            promptEl.dispatchEvent(new Event('input', { bubbles: true }));
                        }
                    },
                    onLangChange: function(mode) {
                        window.PROMPT_TAGS_LANG_MODE = mode;
                        localStorage.setItem('prompt_tags_lang_mode', mode);
                        if (typeof updatePromptTags === 'function') updatePromptTags();
                    }
                });
            }

            // 初始化智能提示词组件
            if (typeof SmartPrompt !== 'undefined') {
                const promptEl = document.getElementById('prompt');
                SmartPrompt.init('smartPromptContainer', {
                    getText: () => promptEl ? promptEl.value : '',
                    setText: function(text) {
                        if (promptEl) {
                            promptEl.value = text;
                            promptEl.dispatchEvent(new Event('input'));
                        }
                    },
                    isIdeogram4Mode: function() {
                        return typeof currentWorkflow !== 'undefined' && currentWorkflow.includes('Ideogram4');
                    },
                    setIdeogram4Json: function(json) {
                        ideogram4JsonPrompt = json || '';
                    },
                    syncPicker: function() {
                        if (typeof syncPickerStatesFromPrompt === 'function') syncPickerStatesFromPrompt();
                    },
                    onPromptUpdate: function() {
                        if (typeof updatePromptTags === 'function') updatePromptTags();
                    },
                    onLongPress: function() {
                        if (typeof spPickerOpen === 'function') spPickerOpen();
                    }
                });
            }
            
            // 初始化随机提示词组件
            if (typeof RandomPrompt !== 'undefined') {
                RandomPrompt.init('randomPromptContainer', {
                    onApply: function(result) {
                        // 将随机结果覆盖到提示词框
                        const promptEl = document.getElementById('prompt');
                        if (promptEl && result.positive) {
                            promptEl.value = result.positive;
                            promptEl.dispatchEvent(new Event('input'));
                        }
                        
                        // 如果有负向提示词，应用到负向框
                        if (result.negative) {
                            const negEl = document.getElementById('negativePrompt');
                            if (negEl) {
                                negEl.value = result.negative;
                            }
                        }
                    }
                });
            }
        };
    </script>
</body>
</html>
