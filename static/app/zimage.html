            const placeholder = document.createElement('div');
            placeholder.className = 'masonry-item bg-gray-50 flex flex-col items-center justify-center border-dashed border-2 border-gray-200';
            placeholder.style.minHeight = '180px';
            placeholder.style.aspectRatio = _aspectRatio;
            placeholder.style.transition = 'all 0.4s ease';
            placeholder.innerHTML = `
                <div class="card-progress" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;">
                    <div style="position:relative;width:48px;height:48px;display:flex;align-items:center;justify-content:center;">
                        <div class="pg-ring-outer" style="position:absolute;inset:0;border:3px solid transparent;border-top-color:#3b82f6;border-right-color:#8b5cf6;border-radius:50%;animation:renderSpin 1s linear infinite;"></div>
                        <div class="pg-ring-inner" style="position:absolute;inset:7px;border:2px solid transparent;border-top-color:#06b6d4;border-radius:50%;animation:renderSpin 0.6s linear infinite reverse;"></div>
                        <span class="card-progress-pct" style="position:absolute;font-size:9px;font-weight:700;color:#6b7280;">0%</span>
                    </div>
                    <span class="card-progress-label" style="font-size:8px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:0.05em;">排队中...</span>
                    <style>
                        @keyframes renderSpin { to { transform: rotate(360deg); } }
                        @keyframes renderPulse { 0%,100% { transform:scale(1);opacity:1; } 50% { transform:scale(1.4);opacity:0.7; } }
                        @keyframes breathSpin { 0%{transform:rotate(0deg) scale(0.9);opacity:0.4;} 50%{transform:rotate(180deg) scale(1.05);opacity:1;} 100%{transform:rotate(360deg) scale(0.9);opacity:0.4;} }
                    </style>
                </div>
            `;
            document.getElementById('masonry').prepend(placeholder);

            try {
                // 加载工作流（带缓存，避免重复请求）
                if (!window._wfCache) window._wfCache = {};
                let workflow;
                if (window._wfCache[currentWorkflow]) {
                    workflow = JSON.parse(JSON.stringify(window._wfCache[currentWorkflow]));
                } else {
                    const wfRes = await fetch('/api/workflows/' + encodeURIComponent(currentWorkflow));
                    if (!wfRes.ok) throw new Error('工作流加载失败');
                    const wfEnvelope = await wfRes.json();
                    window._wfCache[currentWorkflow] = wfEnvelope.workflow || wfEnvelope;
                    workflow = JSON.parse(JSON.stringify(window._wfCache[currentWorkflow]));
                }
                const seed = (animaSeedMode === 'fixed' && animaFixedSeed > 0) ? animaFixedSeed : Math.floor(Math.random() * 10**15);

                // 注入用户选择的 UNET 模型
                if (selectedUnetModel) {
                    for (const nid in workflow) {
                        const node = workflow[nid];
                        if (!node || !node.inputs) continue;
                        // UNETLoader 节点
                        if (node.class_type === 'UNETLoader' && node.inputs.unet_name !== undefined) {
                            node.inputs.unet_name = selectedUnetModel;

                        // LoadDiffusionModelShared //Inspire 节点
                        if (node.class_type && node.class_type.includes('LoadDiffusionModel') && node.inputs.model_name !== undefined) {
                            node.inputs.model_name = selectedUnetModel;

                if (currentWorkflow.includes('anima')) {
                    // 解析提示词，分离角色和画师标签
                    const parts = prompt.split(PROMPT_TAG_SPLITTER).map(p => p.trim()).filter(p => p);
                    const charTags = parts.filter(p => !p.startsWith('by ') && !p.startsWith('@')).join(', ');
                    const artistTags = parts.filter(p => p.startsWith('by ') || p.startsWith('@')).map(p => '@' + p.replace(/^by /, '').replace(/^@/, '')).join(', ');
                    
                    const node51 = workflow["51"];
                    if (node51?.inputs) {
                        node51.inputs.character_tags = charTags;
                        // 合并画师标签和预设提示词
                        const presetPrompts = getActivePresetPrompts();

                        if (presetPrompts) optParts.push(presetPrompts);

                        node69.inputs.height = size.height;

                    // 种子：随机模式用随机值，固定模式用用户指定值
                    const finalSeed = animaSeedMode === 'fixed' && animaFixedSeed > 0 ? animaFixedSeed : seed;
                    if (workflow["19"]?.inputs) workflow["19"].inputs.seed = finalSeed;
                    // 覆盖 batch_size（使用与 KSampler(19).latent_image 来源节点对齐的值）
                    if (workflow["69"]?.inputs) workflow["69"].inputs.batch_size = currentBatchCount;
                    if (workflow["64"]?.inputs) workflow["64"].inputs.batch_size = currentBatchCount;
                } else if (currentWorkflow.includes('Krea2')) {

                    if (workflow["7"]?.inputs) workflow["7"].inputs.seed = seed;

                    if (workflow["193"]?.inputs) workflow["193"].inputs.value = size.height;

                    if (workflow["185"]?.inputs) workflow["185"].inputs.batch_size = currentBatchCount;
                    if (workflow["206"]?.inputs) workflow["206"].inputs.choice = ideogram4Quality;
                    // 注入提示词
                    if (ideogram4JsonPrompt) {

                            const j = JSON.parse(ideogram4JsonPrompt);

                            if (workflow["220"]?.inputs) {

                                workflow["220"].inputs.medium = j.style?.medium || '';

                            if (workflow["190"]?.inputs) workflow["190"].inputs.text = prompt;
                        }
                    } else if (workflow["190"]?.inputs) {
                        // 无 JSON，直接注入普通提示词
                        workflow["190"].inputs.text = prompt;
                    }
                } else if (currentWorkflow.includes('Boogu')) {
                    // Boogu：注入 prompt、尺寸、seed
                    const size = getAnimaSize();
                    if (workflow["11"]?.inputs) workflow["11"].inputs.text = prompt;
                    if (workflow["8"]?.inputs) { workflow["8"].inputs.width = size.width; workflow["8"].inputs.height = size.height; }
                    if (workflow["32"]?.inputs) workflow["32"].inputs.seed = seed;
                } else {
                    // Z-Image：使用与 ANIMA 相同的 ratio+res 尺寸计算
                    const size = getAnimaSize();
                    if (workflow["23"]?.inputs) workflow["23"].inputs.text = prompt;
                    if (workflow["144"]?.inputs) { workflow["144"].inputs.width = size.width; workflow["144"].inputs.height = size.height; }
                    if (workflow["22"]?.inputs) workflow["22"].inputs.seed = seed;
                    if (workflow["144"]?.inputs) workflow["144"].inputs.batch_size = currentBatchCount;
                }
                console.log('[BatchCount] model=' + (currentWorkflow.includes('anima') ? 'ANIMA' : currentWorkflow.includes('Krea2') ? 'Krea2' : currentWorkflow.includes('Ideogram4') ? 'Ideogram4' : 'Z-Image') + ' currentBatchCount=' + currentBatchCount + ' n69=' + (workflow['69']?.inputs?.batch_size) + ' n64=' + (workflow['64']?.inputs?.batch_size) + ' n144=' + (workflow['144']?.inputs?.batch_size) + ' n185=' + (workflow['185']?.inputs?.batch_size));

                // 注入自定义 LoRA 节点

                if (wfLower.includes('anima') || wfLower.includes('z-image') || wfLower.includes('z_image') || wfLower.includes('krea2') || wfLower.includes('ideogram4') || wfLower.includes('boogu')) {
                    injectLoraNodes(workflow);
                }
                // LoRA 触发词已在选择器勾选/取消时实时同步到提示词框，此处无需重复添加

                // 为本次任务生成独立 ID
                const taskPid = generateUUID();

                // 提交任务到 ComfyUI，捕获真实的 prompt_id
                const submitRes = await fetch('/api/comfyui/prompt', {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ prompt: workflow, client_id: CLIENT_ID, prompt_id: taskPid })
                });
                if (!submitRes.ok) throw new Error('提交失败: ' + await submitRes.text());
                const submitResult = await submitRes.json();
                const realPromptId = submitResult.prompt_id;  // ComfyUI 返回的真正 prompt_id

                // 注册到共享 WebSocket 接收实时采样进度（百分比 0%~100%）
                // 先用 taskPid 注册（若 WS 在 submit 和 getRealId 之间发来 msg），
                // 拿到 realPromptId 后再补注册一次（ComfyUI 的 WS 消息带的是 realPromptId）
                _registerTask(taskPid, placeholder, null);

                // HTTP 轮询兜底（WS 连接失败或不可用时仍有进度显示）
                updateCardProgress(placeholder, { status: 'started' });
                let _pollDone = false;

                    if (_pollDone) return;
                    try {
                        const qr = await fetch('/api/comfyui/queue');
                        const qd = await qr.json();
                        const running = (qd.queue_running || []).length;
                        if (running > 0 && !_pollExecutingShown) {
                            _pollExecutingShown = true;
                            updateCardProgress(placeholder, { status: 'executing' });

                    } catch(e) {}
                }, 1000);

                // 拿到真实 prompt_id 后更新 WS 注册（ComfyUI WS 消息靠真实的 id 匹配）
                _registerTask(realPromptId, placeholder, null);

                        feature: lockedFeatureName
                    })
                });
                _pollDone = true;
                clearInterval(_pollTimer);

                    model: lockedFeatureName.toUpperCase(),
                    genParams: {
                        workflow: lockedWorkflow,

                try {
                    await fetch('/api/history/save', {

                if (window.GalleryList) GalleryList.pushNewImage(record, { _skipRender: true });
                updateCardProgress(placeholder, { status: 'complete' });

                let hasMoved = false;
                let startX = 0;
                let startScrollLeft = 0;

                // 鼠标滚轮水平滚动

                    e.preventDefault();
                    container.scrollLeft += e.deltaY * 2;

        // ============================================================
        // === LoRA 管理 ===
        // ============================================================
        const LORA_STORAGE_KEY = 'zimage_lora_config';
        const LORA_NODE_BASE = 9000; // 动态 LoRA 节点 ID 起始

        // LoRA 状态
        let loraState = {
            loraMap: {},         // name → {name, preview, videoUrl, triggerWords, baseModel, description, ...}
            triggerWordMap: {},  // triggerWord(小写) → {preview, name, displayName}（反查索引）
            available: [],       // LoRA 文件名列表（从 loraMap keys 生成）

        // 重建 triggerWordMap：从 loraMap 中提取所有触发词 → 预览图映射
        function _rebuildTriggerWordMap() {
            loraState.triggerWordMap = {};
            if (!loraState.loraMap) return;
            for (const key of Object.keys(loraState.loraMap)) {
                const entry = loraState.loraMap[key];

                for (const tw of entry.triggerWords) {

                        };

                }
            }
        }

        // 文件夹名 → 中文显示名（未匹配的原样返回）
        const FOLDER_CN_MAP = {
            'anima': '动画角色', 'custom_anima': '自定义动画',
            'flux1': 'FLUX1', 'flux2': 'FLUX2', 'custom_flux2': '自定义FLUX2',
            'qwen': 'Qwen', 'qwen-edit': 'Qwen编辑',

            'recipes': '配方', 'character': '角色', 'style': '风格',
            'lighting': '光影', 'concept': '概念', 'poses': '姿势',
            'clothing': '服装', 'background': '背景', 'composition': '构图',

        };
        function cnFolder(name) { return FOLDER_CN_MAP[name] || name; }

        // 判断一个 URL 路径是否指向视频文件（用于 LoRA 预览）
        // 对齐 ComfyUI-Lora-Manager 的做法：preview_url 字段既能放图也能放视频，靠后缀适配
        // 注意：经 art-canvas 代理后，原始后缀被移到 query string（如 ?url=...mp4），
        //      需要同时检查 query 里的 url= 参数本体
        const LORA_VIDEO_EXT_RE = /\.(mp4|webm|mov|avi|mkv)(\?|&|$|%|$)/i;
        function _loraIsVideoUrl(url) {
            if (!url) return false;
            const s = String(url);
            // 1) 路径后缀（直链 /api/foo.mp4）
            const noQuery = s.split('?')[0];
            if (LORA_VIDEO_EXT_RE.test(noQuery)) return true;
            // 2) 整 URL 内是否含视频扩展名（覆盖 ?url=...mp4 的代理场景）
            if (LORA_VIDEO_EXT_RE.test(s)) return true;
            // 3) 解码后的 query 路径（兜底：双层编码 %2520 等）
            try {
                const u = new URL(s, window.location.origin);
                const innerUrl = u.searchParams.get('url') || '';
                if (innerUrl) {
                    const decoded = decodeURIComponent(innerUrl);
                    if (LORA_VIDEO_EXT_RE.test(decoded.split('?')[0])) return true;
                    if (LORA_VIDEO_EXT_RE.test(decoded)) return true;
                }
            } catch (e) { /* 忽略 URL 解析错误 */ }
            return false;
        }
        // 把代理后的 preview URL 按是否为视频分配到 preview / videoUrl
        function _loraSplitPreview(proxyUrl, rawUrl) {
            if (!proxyUrl) return { preview: '', videoUrl: '' };
            if (_loraIsVideoUrl(rawUrl || proxyUrl)) {
                return { preview: '', videoUrl: proxyUrl };
            }
            return { preview: proxyUrl, videoUrl: '' };
        }

        // ============================================================
        // LoRA 加载器（统一助手 + 4 条回退链）
        // 数据源优先级：ComfyUI+本地扫描 → 本地扫描 → LoRA Manager → 兜底(扫描→ComfyUI 极简)
        // ============================================================
        const _LORA_EXT_RE = /\.(safetensors|ckpt|pt|bin|pth)$/i;
        const _LORA_STEM_VER_RE = /[-_][vV](\d+(?:\.\d+)*)$/;

        // 从路径中提取文件夹（路径用 / 或 \\ 都可以）
        function _loraExtractFolder(name) {
            const parts = name.replace(/\\/g, '/').split('/');
            return parts.length > 1 ? parts[0] : '';
        }
        // 从路径中提取纯文件名（支持 \\ 和 /）
        function _loraExtractFileName(name) {
            return name.split('\\').pop().split('/').pop();
        }

        // 单条 LoRA entry 构造（用于分支 1/2/4a 这类"从 raw 列表 + previews 字典"加载）
        //   name:        loraMap 的 key（通常是带文件夹的完整路径）
        //   fileName:    用于 displayName 的文件名（已 strip / 不 strip 由 opts 决定）
        //   previews:    preview URL 字典（可按 name 或 fileName 查找）
        //   opts.stripExt:    displayName 是否去掉 .safetensors 后缀
        //   opts.splitPreview: 是否走 _loraSplitPreview 拆分 video
        function _loraBuildEntry(name, fileName, previews, opts) {
            const { stripExt = false, splitPreview = false } = opts || {};
            const pv = previews[name] || previews[fileName] || '';
            const { preview, videoUrl } = splitPreview
                ? _loraSplitPreview(pv, pv)
                : { preview: pv, videoUrl: '' };
            return {
                name,
                displayName: stripExt ? fileName.replace(_LORA_EXT_RE, '') : fileName,
                preview,
                videoUrl,
                triggerWords: [],
                baseModel: '',
                folder: _loraExtractFolder(name)
            };
        }

        // 从 civitai.images / 兼容字段中提取视频预览 URL（Manager / Enrich 共用）
        function _loraExtractVideoUrl(civitai, fallbackRaw) {
            if (civitai && civitai.images) {
                for (const img of civitai.images) {
                    if (img.type === 'video' && img.url) {
                        return img.url.startsWith('/')
                            ? `/api/lora-manager/proxy-preview?url=${encodeURIComponent(img.url)}`
                            : img.url;
                    }
                }
            }
            const raw = fallbackRaw || '';
            return raw
                ? (raw.startsWith('/') ? `/api/lora-manager/proxy-preview?url=${encodeURIComponent(raw)}` : raw)
                : '';
        }

        // Manager 单条 entry（含 civitai 元数据 + 视频预览抽取）
        function _loraBuildManagerEntry(m) {
            const folder = m.folder || '';
            const fileName = m.file_name || '';
            const filePath = m.file_path || '';
            const fullFileName = filePath
                ? filePath.split(/\\/).pop().split('/').pop()
                : (fileName.endsWith('.safetensors') ? fileName : fileName + '.safetensors');
            const loraName = folder ? `${folder}\\${fullFileName}` : fullFileName;
            if (!loraName) return null;
            const previewRaw = m.preview_url || '';
            const previewProxy = previewRaw
                ? `/api/lora-manager/proxy-preview?url=${encodeURIComponent(previewRaw)}`
                : '';
            const split = _loraSplitPreview(previewProxy, previewRaw);
            const civitai = m.civitai;
            const triggerWords = (civitai && civitai.trainedWords && Array.isArray(civitai.trainedWords))
                ? civitai.trainedWords.slice()
                : [];
            const videoUrl = _loraExtractVideoUrl(civitai, m.video_url || m.animated_preview || m.preview_video) || split.videoUrl;
            return {
                name: loraName,
                displayName: m.model_name || fileName,
                preview: split.preview,
                videoUrl,
                triggerWords,
                baseModel: m.base_model || '',
                tags: m.tags || '',
                folder
            };
        }

        // 后置：用 LoRA Manager 的 civitai 元数据补充已有 loraMap（分支 1 用）
        function _loraEnrichFromManager(metaItems) {
            if (!Array.isArray(metaItems)) return;
            for (const m of metaItems) {
                const folder = m.folder || '';
                const fileName = m.file_name || '';
                const filePath = m.file_path || '';
                const fullFileName = filePath
                    ? filePath.split(/\\/).pop().split('/').pop()
                    : (fileName.endsWith('.safetensors') ? fileName : fileName + '.safetensors');
                const key = folder ? `${folder}\\${fullFileName}` : fullFileName;
                const matchedKey = loraState.loraMap[key] ? key
                    : (loraState.loraMap[fullFileName] ? fullFileName : null);
                if (!matchedKey) continue;
                const entry = loraState.loraMap[matchedKey];
                const previewRaw = m.preview_url || '';
                const previewProxy = previewRaw
                    ? `/api/lora-manager/proxy-preview?url=${encodeURIComponent(previewRaw)}`
                    : '';
                const split = _loraSplitPreview(previewProxy, previewRaw);
                const civitai = m.civitai;
                const triggerWords = (civitai && civitai.trainedWords && Array.isArray(civitai.trainedWords))
                    ? civitai.trainedWords.slice()
                    : [];
                const videoUrl = _loraExtractVideoUrl(civitai, m.video_url || m.animated_preview || m.preview_video) || split.videoUrl;
                if (split.preview) entry.preview = split.preview;
                if (videoUrl) entry.videoUrl = videoUrl;
                if (triggerWords.length) entry.triggerWords = triggerWords;
                if (m.base_model) entry.baseModel = m.base_model;
                if (m.tags) entry.tags = m.tags;
                if (m.model_name) entry.displayName = m.model_name;
            }
        }

        // 从 raw 列表自建 scanEntries（分支 2 用；分支 1/3/4b 不需要，因为不走 scanEntries）
        function _loraBuildScanEntries(raw) {
            return raw.map(name => {
                const fileName = _loraExtractFileName(name);
                const stem = fileName.replace(_LORA_EXT_RE, '');
                const m = _LORA_STEM_VER_RE.exec(stem);
                return {
                    name,
                    modelRoot: m ? stem.slice(0, m.index) : stem,
                    versionLabel: m ? m[0].replace(/^[-_]/, '') : ''
                };
            });
        }

        // 原始本地扫描 fetcher（不 catch 异常，由调用方决定如何处理）
        async function _loraFetchScanRaw() {
            const res = await fetch('/api/loras/scan');
            if (!res.ok) return { paths: [], previews: {}, entries: [] };
            const data = await res.json();
            return {
                paths: data.loras || [],
                previews: data.previews || {},
                entries: data.entries || []
            };
        }

        async function loadAvailableLoras() {
            // ① 优先从 ComfyUI API 获取完整列表
            try {
                const res = await fetch('/api/comfyui/loras');
                if (res.ok) {
                    const data = await res.json();
                    const raw = data.loras || [];
                    if (raw.length > 0) {
                        // 同时获取本地扫描数据（带文件夹路径）；内层 try 容错
                        let scan = { paths: [], previews: {}, entries: [] };
                        try {
                            scan = await _loraFetchScanRaw();
                        } catch (e) {
                            console.warn('[LoRA] 本地扫描失败:', e);
                        }
                        // 构建纯文件名 → 完整路径（带文件夹）的映射
                        const fileNameToFullPath = {};
                        for (const fullPath of scan.paths) {
                            const fileName = fullPath.split('\\').pop();
                            if (!fileNameToFullPath[fileName]) fileNameToFullPath[fileName] = fullPath;
                        }
                        // 用本地扫描的完整路径作为主数据源，只保留 ComfyUI 中存在的
                        loraState.available = [];
                        loraState.loraMap = {};
                        for (const comfyName of raw) {
                            const fullPath = fileNameToFullPath[comfyName] || comfyName;
                            loraState.available.push(fullPath);
                            loraState.loraMap[fullPath] = _loraBuildEntry(fullPath, comfyName, scan.previews, { stripExt: true, splitPreview: false });
                        }
                        loraState.available.sort();
                        loraState.models = [...new Set(loraState.available.map(n => _loraExtractFolder(n) || '通用'))].sort();
                        // 把同 modelRoot 的多个 LoRA 合并为"多版本组"
                        groupLoraVersions();
                        console.log('[LoRA] ComfyUI + 本地扫描加载成功，共', loraState.available.length, '个，文件夹', loraState.models.length, '个');
                        // 尝试从 LoRA Manager 补充元数据（预览图、触发词等）
                        try {
                            const metaRes = await fetch('/api/lora-manager/loras');
                            if (metaRes.ok) {
                                const metaData = await metaRes.json();
                                _loraEnrichFromManager(metaData.items || metaData.models || []);
                                _rebuildTriggerWordMap();
                                console.log('[LoRA] LoRA Manager 元数据补充完成，触发词索引', Object.keys(loraState.triggerWordMap).length, '个');
                            }
                        } catch (e) {
                            console.warn('[LoRA] LoRA Manager 元数据补充失败:', e);
                        }
                        return;
                    }
                }
            } catch (e) {
                console.warn('[LoRA] ComfyUI API 失败:', e);
            }

            // ② 回退：本地文件夹扫描
            try {
                const scan = await _loraFetchScanRaw();
                if (scan.paths.length > 0) {
                    loraState.available = scan.paths;
                    loraState.loraMap = {};
                    for (const name of scan.paths) {
                        loraState.loraMap[name] = _loraBuildEntry(name, _loraExtractFileName(name), scan.previews, { splitPreview: true });
                    }
                    loraState.models = [...new Set(scan.paths.map(n => _loraExtractFolder(n) || '通用'))].sort();
                    // 设置 scanEntries 供 groupLoraVersions 使用
                    loraState.scanEntries = _loraBuildScanEntries(scan.paths);
                    groupLoraVersions();
                    _rebuildTriggerWordMap();
                    console.log('[LoRA] 本地扫描加载成功，共', scan.paths.length, '个，预览图', Object.keys(scan.previews).length, '个，文件夹', loraState.models.length, '个');
                    return;
                }
            } catch (e) {
                console.warn('[LoRA] 本地扫描失败:', e);
            }

            // ③ 最后回退：LoRA Manager（自带 civitai 元数据 + 视频预览抽取）
            try {
                const res = await fetch('/api/lora-manager/loras');
                if (res.ok) {
                    const data = await res.json();
                    const items = data.items || data.models || [];
                    if (Array.isArray(items) && items.length > 0) {
                        loraState.loraMap = {};
                        for (const m of items) {
                            const entry = _loraBuildManagerEntry(m);
                            if (!entry) continue;
                            loraState.loraMap[entry.name] = entry;
                        }
                        loraState.available = Object.keys(loraState.loraMap).sort();
                        loraState.models = [...new Set(loraState.available.map(n => _loraExtractFolder(n) || '通用'))].sort();
                        // Manager 数据里通常没有 modelRoot/versionLabel，groupLoraVersions() 会兜底从 name 自行提取
                        groupLoraVersions();
                        _rebuildTriggerWordMap();
                        console.log('[LoRA] LoRA Manager 加载成功，共', loraState.available.length, '个，触发词索引', Object.keys(loraState.triggerWordMap).length, '个');
                        return;
                    }
                }
            } catch (e) {
                console.warn('[LoRA] LoRA Manager 不可用，回退到 ComfyUI:', e);
            }

            // ④ 兜底：先尝试本地扫描（用后端 entries），再尝试 ComfyUI 极简版
            try {
                const scan = await _loraFetchScanRaw();
                if (scan.paths.length > 0) {
                    loraState.available = scan.paths;
                    loraState.loraMap = {};
                    for (const name of scan.paths) {
                        loraState.loraMap[name] = _loraBuildEntry(name, _loraExtractFileName(name), scan.previews, { stripExt: true, splitPreview: true });
                    }
                    loraState.scanEntries = scan.entries;
                    groupLoraVersions();
                    _rebuildTriggerWordMap();
                    loraState.models = [...new Set(scan.paths.map(n => _loraExtractFolder(n) || '通用'))].sort();
                    console.log('[LoRA] 本地扫描加载成功，共', scan.paths.length, '个，文件夹', loraState.models.length, '个');
                    return;
                }
            } catch (e) {
                console.warn('[LoRA] 本地扫描失败，尝试 ComfyUI:', e);
            }
            // 极简回退：与原行为一致（displayName 用 split('/') 不剥扩展名）
            try {
                const res = await fetch('/api/comfyui/loras');
                if (!res.ok) return;
                const data = await res.json();
                const raw = data.loras || [];
                loraState.available = raw;
                loraState.loraMap = {};
                const modelSet = new Set();
                for (const name of raw) {
                    const folder = _loraExtractFolder(name);
                    loraState.loraMap[name] = { name, displayName: name.split('/').pop(), preview: '', videoUrl: '', triggerWords: [], baseModel: '', folder };
                    modelSet.add(folder || '通用');
                }
                loraState.models = [...modelSet].sort();
                console.log('[LoRA] ComfyUI 回退加载成功，共', raw.length, '个，文件夹', modelSet.size, '个');
            } catch (e) {
                console.warn('[LoRA] 加载可用列表失败:', e);
            }
        }

        // 把同 modelRoot 的多个 LoRA 合并为"多版本组"
        // 数据来源：loraState.scanEntries（后端 /api/loras/scan 返回的 entries）
        // 合并后：loraState.groups[root] = { isGroup, modelRoot, displayName, name, preview, videoUrl, ..., versions: [{name,label,preview,videoUrl,baseModel}], currentVersionIdx }
        function groupLoraVersions() {
            let entries = loraState.scanEntries || [];
            // 兜底：LoRA Manager / ComfyUI 等分支没有 scanEntries 时，从 loraMap.name 自行提取
            if (entries.length === 0 && loraState.loraMap) {
                const stemRe = /[-_][vV](\d+(?:\.\d+)*)$/;
                const newEntries = [];
                for (const name of Object.keys(loraState.loraMap)) {
                    const fileName = name.split('\\').pop().split('/').pop();
                    const stem = fileName.replace(/\.(safetensors|ckpt|pt|bin|pth)$/i, '');
                    const m = stemRe.exec(stem);
                    newEntries.push({
                        name,
                        modelRoot: m ? stem.slice(0, m.index) : stem,
                        versionLabel: m ? m[0].replace(/^[-_]/, '') : ''
                    });
                }
                entries = newEntries;
            }
            // 1. 按 modelRoot 分组（只统计有 versionLabel 的 entries）
            const buckets = {};
            for (const e of entries) {
                if (!e.modelRoot) continue;
                if (!buckets[e.modelRoot]) buckets[e.modelRoot] = [];
                buckets[e.modelRoot].push(e);
            }
            // 2. 版本号智能比较：v0.2 > v0.1 > v0.0.1；V2 > V1；v11 > v2（按数字段）
            const compareVersion = (a, b) => {
                const parse = (s) => (s || '').replace(/^[vV]/, '').split('.').map(n => parseInt(n, 10) || 0);
                const arrA = parse(a);
                const arrB = parse(b);
                const maxLen = Math.max(arrA.length, arrB.length);
                for (let i = 0; i < maxLen; i++) {
                    const x = arrA[i] || 0;
                    const y = arrB[i] || 0;
                    if (x !== y) return y - x; // 降序：新的在前
                }
                return 0;
            };
            loraState.groups = {};
            for (const [root, list] of Object.entries(buckets)) {
                // 至少 2 个、且至少有 2 个非空 versionLabel，才算真正的"多版本组"
                if (list.length < 2) continue;
                const distinctVer = new Set(list.map(x => (x.versionLabel || '').toLowerCase()).filter(Boolean));
                if (distinctVer.size < 2) continue;
                list.sort((a, b) => compareVersion(a.versionLabel, b.versionLabel));
                const versions = list.map(e => {
                    const meta = loraState.loraMap[e.name] || {};
                    return {
                        name: e.name,
                        label: e.versionLabel,
                        preview: meta.preview || '',
                        videoUrl: meta.videoUrl || '',
                        baseModel: meta.baseModel || '',
                        triggerWords: meta.triggerWords || [],
                        folder: meta.folder || ''
                    };
                });
                const defaultVer = versions[0]; // 最新版本
                // 根名同名的所有 LoRA 共用同一个"displayName"（不再带版本号）
                // 组的 folder 用 versions 里第一个非空 folder（兼容 v0.2 在根目录 + v0.1 在子目录的情况）
                const groupFolder = versions.map(v => v.folder).find(f => f) || '';
                loraState.groups[root] = {
                    isGroup: true,
                    modelRoot: root,
                    name: defaultVer.name,  // 默认指向最新版本
                    displayName: root,
                    preview: defaultVer.preview,
                    videoUrl: defaultVer.videoUrl,
                    baseModel: defaultVer.baseModel,
                    triggerWords: defaultVer.triggerWords,
                    folder: groupFolder,
                    versions,
                    currentVersionIdx: 0
                };
                // 同时在 loraState.loraMap 里插入 modelRoot 合并条目（用 modelRoot 作为 key）
                // 这样 lora-picker 能直接通过 loraMap[modelRoot] 取到带 versions 的合并卡片
                loraState.loraMap[root] = loraState.groups[root];
            }
            const groupCount = Object.keys(loraState.groups).length;
            if (groupCount > 0) {
                console.log('[LoRA] 多版本组合并完成，共', groupCount, '组:', Object.keys(loraState.groups));
            }
        }

        // 从 LoRA 数据提取模型分类（优先用 folder，回退到路径解析）
        function extractLoraModel(loraName) {
            const meta = loraState.loraMap[loraName];
            if (meta && meta.folder) return meta.folder;
            if (!loraName) return '通用';
            const parts = loraName.replace(/\\/g, '/').split('/');
            if (parts.length > 1) return parts[0];
            return '通用';
        }

        // 获取筛选后的 LoRA 列表
        function getFilteredLoras() {
            if (!loraState.modelFilter || loraState.modelFilter === 'all') return loraState.available;
            return loraState.available.filter(name => extractLoraModel(name) === loraState.modelFilter);
        }

        // 持久化（已禁用，每次刷新重置）
        function saveLoraConfig() {}
        function loadLoraConfig() {}

        // UI: 显示/隐藏 LoRA 按钮（仅 anima 工作流时显示）
        function updateLoraSwitcherVisibility() {
            const btn = document.getElementById('loraBtn');
            if (!btn) return;
            const lower = currentWorkflow.toLowerCase();
            const showLora = lower.includes('anima') || lower.includes('z-image') || lower.includes('z_image') || lower.includes('krea2') || lower.includes('ideogram4');
            btn.style.display = showLora ? '' : 'none';

            }

        // ── LoRA 触发词实时同步 ──────────────────────────────────────────────
        // 用户在 LoRA 选择器中勾选/取消时，即时把对应的 triggerWords 写入/移出提示词框
        // _loraActiveTriggerWords: 记录当前由 LoRA 注入到提示词中的所有词（用于精准删除）
        let _loraActiveTriggerWords = new Set();

        function _loraCollectTriggerWords(selectedArr) {
            const words = [];
            for (const lora of (selectedArr || [])) {
                if (!lora.name) continue;
                const meta = loraState.loraMap[lora.name];
                if (meta && Array.isArray(meta.triggerWords) && meta.triggerWords.length > 0) {
                    // 只取第一个触发词（主触发词），避免大量触发词淹没提示词
                    words.push(meta.triggerWords[0]);
                } else {
                    // 没有触发词时，用 LoRA 文件名（去扩展名）作为兜底标签
                    const fallbackName = (meta && meta.displayName) ? meta.displayName : lora.name.split('/').pop().replace(/\.safetensors$/i, '');
                    if (fallbackName) words.push(fallbackName);
                }
            }
            return words;
        }

        function _loraSyncTriggerWords(selectedArr) {
            const promptEl = document.getElementById('prompt');
            if (!promptEl) return;
            const newTriggerWords = _loraCollectTriggerWords(selectedArr);
            const newSet = new Set(newTriggerWords);

            // 1) 移除：旧的 LoRA 触发词中，不再被任何活跃 LoRA 使用的
            if (_loraActiveTriggerWords.size > 0) {
                const parts = splitPrompt(promptEl.value);
                const filtered = parts.filter(p => !_loraActiveTriggerWords.has(p.toLowerCase()));
                promptEl.value = filtered.join(', ');
            }

            // 2) 添加：新的触发词中，提示词里还没有的
            if (newTriggerWords.length > 0) {
                const currentParts = splitPrompt(promptEl.value);
                const currentLowerSet = new Set(currentParts.map(p => p.toLowerCase()));
                const toAdd = newTriggerWords.filter(t => !currentLowerSet.has(t.toLowerCase()));
                if (toAdd.length > 0) {
                    const cur = promptEl.value.trim();
                    promptEl.value = cur ? cur + ', ' + toAdd.join(', ') : toAdd.join(', ');
                }
            }

            // 3) 更新记录
            _loraActiveTriggerWords = newSet;

            // 4) 刷新标签显示（.value 赋值不触发 oninput，需手动调用）
            if (typeof updatePromptTags === 'function') updatePromptTags();
            if (typeof updatePickerButtonsHighlight === 'function') updatePickerButtonsHighlight();
        }

        // UI: 切换面板（使用 LoRA Picker）
        function toggleLoraPanel() {
            // 打开前：记录当前提示词中由 LoRA 注入的触发词，便于取消时精准移除
            _loraActiveTriggerWords = new Set(_loraCollectTriggerWords(loraState.active));

            // 设置实时回调：每次勾选/取消即时同步触发词
            loraPickerOnSelectionChange = function(selected) {
                _loraSyncTriggerWords(selected);
            };

            loraPickerOpen(function(selected) {
                // 确认后：最终同步 + 更新状态
                loraPickerOnSelectionChange = null;
                loraState.active = selected;
                _loraSyncTriggerWords(selected);
                saveLoraConfig();
                updateLoraSwitcherVisibility();
            });
        }

        // UI: 刷新所有选择器按钮的高亮/数量状态
        // - 直接扫描当前提示词内容来识别各功能是否被使用，不依赖 pickerSelected 内部状态
        //   这样无论用户通过选择器勾选、还是手动输入/删除 token，按钮角标与高亮都能正确同步
        // - 角色：prompt 中命中 ANIMA_CHAR_DB 名称 / trigger 的 token 数
        // - 画师：prompt 中以 @/by 开头且名称命中 ANIMA_ARTIST_DB 的 token 数
        // - 预设：prompt 中命中预设名或预设 prompt 的项数
        // - 参考图：根据 refImages 数量
        // - LoRA：调用 updateLoraSwitcherVisibility() 处理
        function updatePickerButtonsHighlight() {
            const promptInput = document.getElementById('prompt');
            const parts = splitPrompt(promptInput ? promptInput.value : '');
            const lowerSet = new Set(parts.map(p => p.toLowerCase()));

            // ---- 角色（旧版本写法：直接 typeof + 每次重建 Set，绕开 safeDbAvailable / getCharIndex 缓存链 bug） ----
            let charCount = 0;
            try {
                if (typeof ANIMA_CHAR_DB !== 'undefined' && ANIMA_CHAR_DB && ANIMA_CHAR_DB.length > 0) {
                    const _charNameSet = new Set(ANIMA_CHAR_DB.map(c => (c.name || '').toLowerCase()).filter(Boolean));
                    const _charTriggerSet = new Set();
                    ANIMA_CHAR_DB.forEach(c => {
                        if (Array.isArray(c.triggers)) c.triggers.forEach(t => _charTriggerSet.add(String(t).toLowerCase()));
                        else if (typeof c.trigger === 'string') _charTriggerSet.add(c.trigger.toLowerCase());
                    });
                    parts.forEach(t => {
                        if (!t) return;
                        if (promptHasArtistToken(t) || t.startsWith('[')) return;
                        const tl = t.toLowerCase();
                        if (_charNameSet.has(tl) || _charTriggerSet.has(tl)) charCount++;
                    });
                }
            } catch (_) {}
            setPickerButtonState('charPickerBtn', 'charPickerBtnText', charCount, ' 角色');

            // ---- 画师（旧版本写法） ----
            let artistCount = 0;
            try {
                if (typeof ANIMA_ARTIST_DB !== 'undefined' && ANIMA_ARTIST_DB && ANIMA_ARTIST_DB.length > 0) {
                    const _artistNameSet = new Set(ANIMA_ARTIST_DB.map(a => (a.name || '').toLowerCase()).filter(Boolean));
                    parts.forEach(t => {
                        const name = extractArtistName(t);
                        if (name && _artistNameSet.has(name.toLowerCase())) artistCount++;
                    });
                }
            } catch (_) {}
            setPickerButtonState('artistPickerBtn', 'artistPickerBtnText', artistCount, ' 画师');

            // ---- 预设（旧版本写法） ----
            let presetCount = 0;
            try {
                if (typeof _flatIndex !== 'undefined' && _flatIndex && _flatIndex.length > 0) {
                    const seenKeys = new Set();
                    _flatIndex.forEach(p => {
                        if (!p) return;
                        const name = (p.name || '').toLowerCase();
                        const prompt = (p.prompt || '').toLowerCase();
                        if ((name && lowerSet.has(name)) || (prompt && lowerSet.has(prompt))) {
                            const key = (p.category_id || p.category || '') + ':' + (p.id || p.name);
                            if (!seenKeys.has(key)) { seenKeys.add(key); presetCount++; }
                        }
                    });
                }
            } catch (_) {}
            setPickerButtonState('presetPickerBtn', 'presetPickerBtnText', presetCount, ' 预设');

            // ---- 参考图 ----
            const refCount = (typeof refImages !== 'undefined' && Array.isArray(refImages)) ? refImages.length : 0;
            setPickerButtonState('refImageBtn', 'refImageBtnText', refCount, ' 参考图');

            // LoRA
            updateLoraSwitcherVisibility();
        }
        // 暴露到 window 供各选择器脚本调用
        window.updatePickerButtonsHighlight = updatePickerButtonsHighlight;

        // === 提示词同步：手动修改/清空提示词时，反向同步各选择器的"已选"状态 ===
        // - 角色：双向同步
        //     ① 提示词中「真实存在」于 ANIMA_CHAR_DB 的 token → 自动加入 pickerSelected
        //     ② 提示词中已移除的 token → 从 pickerSelected 中删除
        // - 画师：双向同步，以 @/by 开头的 token 命中艺术家数据库则纳入
        // - 预设：双向同步，命中预设名/prompt 则纳入
        // - 同时同步各选择器的「上次应用快照」，避免下次打开时被误删普通提示词
        function syncPickerStatesFromPrompt() {
            const promptInput = document.getElementById('prompt');
            if (!promptInput) return;
            const parts = splitPrompt(promptInput.value);
            const lowerSet = new Set(parts.map(p => p.toLowerCase()));

            // ---- 角色（旧版本写法：直接 typeof + 每次重建 Set，绕开 safeDbAvailable / getCharIndex 缓存链 bug） ----
            try {
                if (typeof pickerSelected !== 'undefined' && typeof ANIMA_CHAR_DB !== 'undefined' && ANIMA_CHAR_DB && ANIMA_CHAR_DB.length > 0) {
                    const _charNameSet = new Set(ANIMA_CHAR_DB.map(c => (c.name || '').toLowerCase()).filter(Boolean));
                    const _charTriggerSet = new Set();
                    ANIMA_CHAR_DB.forEach(c => {
                        if (Array.isArray(c.triggers)) c.triggers.forEach(t => _charTriggerSet.add(String(t).toLowerCase()));
                        else if (typeof c.trigger === 'string') _charTriggerSet.add(c.trigger.toLowerCase());
                    });
                    // 1) 移除：pickerSelected 中已不在 prompt 的项
                    let newPickerSelected = pickerSelected.filter(name => {
                        if (!name) return false;
                        const nl = name.toLowerCase();
                        if (_charNameSet.has(nl)) return true;
                        return lowerSet.has(nl);
                    });
                    // 2) 添加：prompt 中「确实是角色」的 token 但 pickerSelected 还没有的
                    const existing = new Set(newPickerSelected.map(n => n.toLowerCase()));
                    parts.forEach(t => {
                        if (!t) return;
                        if (promptHasArtistToken(t) || t.startsWith('[')) return;
                        const tl = t.toLowerCase();
                        if (existing.has(tl)) return;
                        if (_charNameSet.has(tl) && !_charTriggerSet.has(tl)) {
                            newPickerSelected.push(t);
                            existing.add(tl);
                        } else if (_charTriggerSet.has(tl)) {
                            // 是 trigger：从 DB 里找对应的真实 name
                            const hit = ANIMA_CHAR_DB.find(c => (c.trigger || '').toLowerCase() === tl || (Array.isArray(c.triggers) && c.triggers.some(x => String(x).toLowerCase() === tl)));
                            if (hit && !existing.has(hit.name.toLowerCase())) {
                                newPickerSelected.push(hit.name);
                                existing.add(hit.name.toLowerCase());
                            }
                        }
                    });
                    pickerSelected = newPickerSelected;
                    if (typeof pickerLastAppliedTokens !== 'undefined') {
                        pickerLastAppliedTokens = new Set(pickerSelected.map(t => t.toLowerCase()));
                    }
                }
            } catch (_) {}

            // ---- 画师（旧版本写法） ----
            try {
                if (typeof artistPickerSelected !== 'undefined' && typeof ANIMA_ARTIST_DB !== 'undefined' && ANIMA_ARTIST_DB && ANIMA_ARTIST_DB.length > 0) {
                    const _artistNameSet = new Set(ANIMA_ARTIST_DB.map(a => (a.name || '').toLowerCase()).filter(Boolean));
                    // 1) 移除
                    let newArtistSel = artistPickerSelected.filter(name => {
                        if (!name) return false;
                        const nl = name.toLowerCase();
                        if (_artistNameSet.has(nl)) return true;
                        return lowerSet.has('@' + nl) || lowerSet.has('by ' + nl);
                    });
                    // 2) 添加
                    const existingArtist = new Set(newArtistSel.map(n => n.toLowerCase()));
                    parts.forEach(t => {
                        if (!t) return;
                        const name = extractArtistName(t);
                        if (!name) return;
                        const nl = name.toLowerCase();
                        if (existingArtist.has(nl)) return;
                        if (_artistNameSet.has(nl)) {
                            newArtistSel.push(name);
                            existingArtist.add(nl);
                        }
                    });
                    artistPickerSelected = newArtistSel;
                    if (typeof artistPickerLastAppliedTokens !== 'undefined') {
                        // 只记录已知画师的 @ token，排除 LoRA 触发词
                        const currentArtistTokens = parts.filter(p => {
                            if (!promptHasArtistToken(p)) return false;
                            const n = extractArtistName(p);
                            return n && _artistNameSet.has(n.toLowerCase());
                        });
                        artistPickerLastAppliedTokens = new Set(currentArtistTokens.map(t => t.toLowerCase()));
                    }
                }
            } catch (_) {}

            // ---- 预设 ----
            try {
                if (typeof presetPickerSelected !== 'undefined') {
                    const pidx = getPresetIndex();
                    if (pidx.built) {
                        const matchedIds = new Set();
                        pidx.byKey.forEach(p => {
                            const k = isPresetMatched(lowerSet, p);
                            if (k) matchedIds.add(k);
                        });
                        // 1) 移除
                        let newPresetSel = presetPickerSelected.filter(p => {
                            const key = (p.category_id || p.category || '') + ':' + (p.id || p.name);
                            return matchedIds.has(key);
                        });
                        // 2) 添加：prompt 命中的预设（但 pickerSelected 中没有的）
                        const existingKeys = new Set(newPresetSel.map(p => (p.category_id || p.category || '') + ':' + (p.id || p.name)));
                        pidx.byKey.forEach(p => {
                            const key = isPresetMatched(lowerSet, p);
                            if (key && !existingKeys.has(key)) {
                                newPresetSel.push(p);
                                existingKeys.add(key);
                            }
                        });
                        presetPickerSelected = newPresetSel;
                        if (typeof presetPickerLastAppliedTokens !== 'undefined') {
                            const newSet = new Set();
                            pidx.byKey.forEach(p => {
                                const key = isPresetMatched(lowerSet, p);
                                if (key) {
                                    const t = (p.prompt || p.name || p.id || '').trim().toLowerCase();
                                    if (t) newSet.add(t);
                                }
                            });
                            presetPickerLastAppliedTokens = newSet;
                        }
                    }
                }
            } catch (_) {}

            // ---- LoRA：双向同步（手动增删触发词/文件名 ↔ loraState.active） ----
            try {
                if (loraState && loraState.loraMap) {
                    const prevCount = (loraState.active || []).length;

                    // ① 移除：active 中触发词/文件名已不在 prompt 里的
                    loraState.active = (loraState.active || []).filter(a => {
                        if (!a || !a.name) return false;
                        const meta = loraState.loraMap[a.name];
                        const tw = (meta && meta.triggerWords) || [];
                        if (tw.length > 0) {
                            return tw.some(w => {
                                const wl = String(w).toLowerCase().replace(/^@/, '');
                                return lowerSet.has(wl) || lowerSet.has('@' + wl);
                            });
                        } else {
                            const dn = (meta && meta.displayName ? meta.displayName : a.name.split('/').pop().replace(/\.safetensors$/i, '')).toLowerCase();
                            return lowerSet.has(dn);
                        }
                    });

                    // ② 添加：prompt 中出现的触发词/文件名但 active 里还没有的
                    const activeNames = new Set(loraState.active.map(a => a.name));
                    for (const key of Object.keys(loraState.loraMap)) {
                        if (activeNames.has(key)) continue;
                        const entry = loraState.loraMap[key];
                        if (!entry) continue;
                        const tw = entry.triggerWords || [];
                        let matched = false;
                        if (tw.length > 0) {
                            matched = tw.some(w => {
                                const wl = String(w).toLowerCase().replace(/^@/, '');
                                return lowerSet.has(wl) || lowerSet.has('@' + wl);
                            });
                        } else {
                            const dn = (entry.displayName || key.split('/').pop().replace(/\.safetensors$/i, '')).toLowerCase();
                            matched = lowerSet.has(dn);
                        }
                        if (matched) {
                            loraState.active.push({ name: key, strength: 0.8 });
                        }
                    }

                    // ③ 同步触发词记录
                    if (loraState.active.length !== prevCount) {
                        _loraActiveTriggerWords = new Set(_loraCollectTriggerWords(loraState.active));
                    }
                }
            } catch (_) {}

            // ---- 刷新按钮高亮/角标 ----
            if (typeof updatePickerButtonsHighlight === 'function') {
                updatePickerButtonsHighlight();
            }
        }
        // 暴露到 window，方便其他模块/调试调用
        window.syncPickerStatesFromPrompt = syncPickerStatesFromPrompt;

        // 监听 prompt 输入变化：用户手动修改或清空时，反向同步选择器状态
        document.addEventListener('DOMContentLoaded', () => {
            const promptEl = document.getElementById('prompt');
            if (promptEl) {
                promptEl.addEventListener('input', () => {
                    // 防抖：避免每个字符都重算，60ms 一次足够
                    clearTimeout(window.__syncPickerStatesTimer);
                    window.__syncPickerStatesTimer = setTimeout(() => {
                        if (typeof syncPickerStatesFromPrompt === 'function') {
                            syncPickerStatesFromPrompt();
                        }
                    }, 60);
                });
                // Shift+Enter 触发生成
                promptEl.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && e.shiftKey) {
                        e.preventDefault();
                        const btn = document.getElementById('mainGenBtn');
                        if (btn && !btn.disabled) btn.click();
                    }
                });
            }
        });

        // UI: 渲染面板内容（已移至 lora-picker.js）

        // === 工作流注入 ===
        function renderLoraPanel() {
            if (builtinEl) {
                const filterOptions = [
                    { value: 'all', label: '全部模型' },
                    ...loraState.models.map(m => ({ value: m, label: m === '通用' ? '通用（根目录）' : cnFolder(m) }))
                ];
                const filterHtml = filterOptions.map(o =>
                    `<option value="${o.value}" ${loraState.modelFilter === o.value ? 'selected' : ''}>${o.label}</option>`
                ).join('');
                builtinEl.innerHTML = `
                    <div class="lora-card-row" style="margin-bottom:12px;">
                        <span style="font-size:10px;font-weight:700;color:#999;flex-shrink:0;">筛选模型</span>
                        <select class="lora-select" onchange="setLoraModelFilter(this.value)" style="flex:1;">
                            ${filterHtml}
                        </select>
                    </div>
                `;
            }

            // 用户 LoRA 列表
            const filteredLoras = getFilteredLoras();
            const listEl = document.getElementById('loraCardList');
            if (!listEl) return;
            if (loraState.active.length === 0) {
                listEl.innerHTML = '<div class="lora-empty-msg">点击「添加」按钮添加自定义 LoRA</div>';
                return;
            }
            listEl.innerHTML = loraState.active.map((lora, i) => {
                const loraModel = extractLoraModel(lora.name);
                const showInFilter = loraState.modelFilter === 'all' || loraModel === loraState.modelFilter;
                const meta = loraState.loraMap[lora.name] || {};
                const preview = meta.preview || '';
                const triggerWords = meta.triggerWords || [];
                const baseModel = meta.baseModel || '';
                const options = filteredLoras.map(name => {
                    const m = loraState.loraMap[name] || {};
                    const bm = m.baseModel ? ` (${m.baseModel})` : '';
                    return `<option value="${name}" ${name === lora.name ? 'selected' : ''}>${m.displayName || name.split('/').pop()}${bm}</option>`;
                }).join('');

                // 触发词 HTML
                const triggerHtml = triggerWords.length > 0 ? `
                    <div class="lora-card-row">
                        <span class="lora-trigger-label">触发词</span>
                        <div class="lora-trigger-words">
                            ${triggerWords.slice(0, 5).map(w =>
                                `<span class="lora-trigger-tag" onclick="copyTriggerWord(this, '${w.replace(/'/g, "\\'")}')" title="点击复制">${w}</span>`
                            ).join('')}
                            ${triggerWords.length > 5 ? `<span class="lora-trigger-tag" style="opacity:0.6;">+${triggerWords.length - 5}</span>` : ''}
                        </div>
                    </div>
                ` : '';

                return `
                    <div class="lora-card" style="${!showInFilter && lora.name ? 'opacity:0.5;' : ''}">
                        <div class="lora-card-row">
                            ${preview ? `<div class="lora-preview"><img src="${preview}" onerror="this.parentElement.innerHTML='<svg width=\'24\' height=\'24\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'#ccc\' stroke-width=\'1.5\'><rect x=\'3\' y=\'3\' width=\'18\' height=\'18\' rx=\'2\'/></svg>'"></div>` : ''}
                            <select class="lora-select" onchange="updateLora(${i}, 'name', this.value)" style="${preview ? 'flex:1;' : ''}">
                                <option value="" disabled ${!lora.name ? 'selected' : ''}>选择 LoRA...</option>
                                ${options}
                                ${lora.name && !filteredLoras.includes(lora.name) ? `<option value="${lora.name}" selected>${lora.name}（不在筛选范围）</option>` : ''}
                            </select>
                            <button class="lora-remove-btn" onclick="removeLora(${i})" title="移除">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                            </button>
                        </div>
                        ${triggerHtml}
                        <div class="lora-card-row">
                            ${baseModel ? `<span style="font-size:9px;font-weight:700;color:#999;">${baseModel}</span>` : ''}
                            <div class="lora-strength-wrap" style="margin-left:auto;">
                                <span style="font-size:10px;font-weight:700;color:#999;">强度</span>
                                <input type="range" min="0.05" max="1.5" step="0.05" value="${lora.strength}" oninput="updateLora(${i}, 'strength', parseFloat(this.value))">
                                <span class="lora-strength-val">${lora.strength.toFixed(2)}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 复制触发词到剪贴板
        function copyTriggerWord(el, word) {
            navigator.clipboard.writeText(word).then(() => {
                const orig = el.textContent;
                el.textContent = '✓ 已复制';
                el.style.background = 'rgba(74,222,128,0.15)';
                el.style.color = '#16a34a';
                setTimeout(() => {
                    el.textContent = orig;
                    el.style.background = '';
                    el.style.color = '';
                }, 1200);
            });
        }

        // 设置模型筛选
        function setLoraModelFilter(model) {
            loraState.modelFilter = model;
            saveLoraConfig();
            renderLoraPanel();
        }

        // 操作
        function addLora() {
            loraState.active.push({ name: '', strength: 0.8 });
            saveLoraConfig();
            renderLoraPanel();
            updateLoraSwitcherVisibility();
        }

        function removeLora(index) {
            loraState.active.splice(index, 1);
            saveLoraConfig();
            renderLoraPanel();
            updateLoraSwitcherVisibility();
        }

        function updateLora(index, field, value) {
            const lora = loraState.active[index];
            if (!lora) return;
            lora[field] = value;
            saveLoraConfig();
            if (field === 'strength') {
                const vals = document.querySelectorAll('.lora-strength-val');
                if (vals[index]) vals[index].textContent = value.toFixed(2);
            } else {
                renderLoraPanel();
            }
            updateLoraSwitcherVisibility();
        }

        // === 工作流注入 ===
        function injectLoraNodes(workflow) {
            // 清理之前注入的动态节点 (ID >= LORA_NODE_BASE)
            for (const key of Object.keys(workflow)) {
                if (parseInt(key) >= LORA_NODE_BASE) delete workflow[key];
            }

            // 过滤出有效的用户 LoRA
            const validLoras = loraState.active.filter(l => l.name);
            if (validLoras.length === 0) return;

            let nextNodeId = LORA_NODE_BASE;

            // 动态查找需要注入 LoRA 的节点（按 class_type 匹配）
            const targetClassTypes = ['KSampler', 'KSamplerAdvanced', 'SamplerCustom', 'SamplerCustomAdvanced'];
            const injectedNodes = new Set();

            for (const [wNodeId, node] of Object.entries(workflow)) {
                if (!node?.class_type || !node?.inputs) continue;
                if (!targetClassTypes.includes(node.class_type)) continue;
                if (injectedNodes.has(wNodeId)) continue;

                // 查找 model 输入来源
                const modelInput = node.inputs.model;
                if (!modelInput || !Array.isArray(modelInput)) continue;

                let currentModelInput = modelInput;
                for (const lora of validLoras) {
                    const nid = String(nextNodeId++);
                    workflow[nid] = {
                        inputs: {
                            lora_name: lora.name,
                            strength_model: lora.strength,
                            model: currentModelInput
                        },
                        class_type: 'LoraLoaderModelOnly',
                        _meta: { title: '自定义 LoRA: ' + lora.name.split('/').pop() }
                    };
                    currentModelInput = [nid, 0];
                }
                node.inputs.model = currentModelInput;
                injectedNodes.add(wNodeId);
            }

            console.log('[LoRA] 注入完成，用户 LoRA:', validLoras.length);
        }

        // 页面加载时初始化 LoRA
        loadLoraConfig();
        loadAvailableLoras();
        // 监听工作流切换，更新 LoRA 按钮可见性
        const _origSwitchWorkflow = switchWorkflow;
        switchWorkflow = function(name) {
            _origSwitchWorkflow(name);
            updateLoraSwitcherVisibility();
        };
        updateLoraSwitcherVisibility();

        window.onload = () => { 
            updatePromptTags(); 
            spPickerInit(); 
            spmInit(); 
            
            // 初始化随机提示词组件
            if (typeof RandomPrompt !== 'undefined') {
                RandomPrompt.init('randomPromptContainer', {
                    onApply: function(result) {
                        // 将随机结果覆盖到提示词框
                        const promptEl = document.getElementById('prompt');
                        if (promptEl && result.positive) {
                            promptEl.value = result.positive;
                            promptEl.dispatchEvent(new Event('input'));
                        }
                        
                        // 如果有负向提示词，应用到负向框
                        if (result.negative) {
                            const negEl = document.getElementById('negativePrompt');
                            if (negEl) {
                                negEl.value = result.negative;
                            }
                        }
                    }
                });
            }
        };
        updateBatchCountUI();
    </script>
</body>
</html>
