        .theme-dark .bg-gray-100 { background: #20201e !important; }
        .theme-dark .pad-input input { background: #151515; border-color: rgba(0, 240, 255, 0.15); color: #e3e1d9; }

        .btn-render:disabled { background: #cccccc; cursor: not-allowed; }
        .btn-glow { background: linear-gradient(135deg, #0891b2, #06b6d4); color: #fbfaf9; border: none; box-shadow: 0 0 15px rgba(8, 145, 178, 0.3), 0 0 30px rgba(6, 182, 212, 0.15); transition: all 0.3s ease; }
        .btn-glow:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 0 20px rgba(8, 145, 178, 0.5), 0 0 40px rgba(6, 182, 212, 0.3); }
        .btn-glow:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-glow .btn-icon { filter: drop-shadow(0 0 4px rgba(8, 145, 178, 0.5)); }
        input::-webkit-inner-spin-button { display: none; }

        .progress-inline {

        }
        .progress-inline.active { display: block; }
        .theme-dark .progress-inline {
            background: linear-gradient(135deg, rgba(8, 145, 178, 0.1), rgba(6, 182, 212, 0.06));
            border-color: rgba(0, 240, 255, 0.2);

        .theme-dark .progress-bar-percent { color: #00f0ff; }

        .theme-dark .console-card { position: relative; }

<style id="ui-responsive">
/* 响应式底座：避免横向溢出；flex/grid 子项允许收缩 */
body { overflow-x: hidden; }
.layout-container, .container-box { width: 100%; }
.layout-container > *, .container-box > * { min-width: 0; }
/* 左右分栏（参数+预览+按钮）在 ≤1024px 改为上下堆叠 */
@media (max-width: 1024px) {
  .flex.flex-col.md\:flex-row { flex-direction: column !important; align-items: stretch !important; }
  .flex.flex-col.md\:flex-row > * { min-width: 0; }
}
/* 移动端：单列、控件全宽、≥40px 高 */
@media (max-width: 640px) {
  .layout-container { padding: 0 16px; }
  .console-card .rounded-\[22px\] { padding: 16px !important; }
  .flex.flex-col.md\:flex-row { gap: 16px !important; }

  .upload-zone { padding: 1.5rem 1rem !important; min-height: 150px !important; }

  .param-stepper, select, input[type="number"], input[type="text"], textarea { min-height: 40px; }

  .btn-remove-glow, .btn-glow { width: 100% !important; }
  .grid.grid-cols-2, .grid.grid-cols-3 { grid-template-columns: 1fr !important; }
}
/* 图片/结果自适应 */
img, .preview-image, .preview-image-large, .result-img, .masonry-item img { max-width: 100%; height: auto; }

    <header class="pt-20 pb-12">

    <script>
        lucide.createIcons();

        const _isLocalAccess = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost';
        let COMFYUI_SERVER = 'http://127.0.0.1:8188';
        let IS_LOCAL_SERVER = _isLocalAccess;

        const WORKFLOW_CONFIG = {
            name: "扩图",
            type: "kuotu",
            workflow: {
                "10": {
                    "inputs": { "vae_name": "flux2-vae.safetensors" },
                    "class_type": "VAELoader",
                    "_meta": { "title": "加载VAE" }
                },
                "11": {
                    "inputs": { "conditioning": ["19", 0] },
                    "class_type": "ConditioningZeroOut",
                    "_meta": { "title": "条件零化" }
                },
                "13": {
                    "inputs": { "unet_name": "flux-2-klein-9b-fp8.safetensors", "weight_dtype": "default" },
                    "class_type": "UNETLoader",
                    "_meta": { "title": "UNET加载器" }
                },
                "14": {
                    "inputs": { "clip_name": "qwen_3_8b_fp8mixed.safetensors", "type": "flux2", "device": "default" },
                    "class_type": "CLIPLoader",
                    "_meta": { "title": "加载CLIP" }
                },
                "17": {
                    "inputs": { "samples": ["95", 0], "vae": ["10", 0] },
                    "class_type": "VAEDecode",
                    "_meta": { "title": "VAE解码" }
                },
                "19": {
                    "inputs": { "text": "移除绿色区域", "clip": ["14", 0] },
                    "class_type": "CLIPTextEncode",
                    "_meta": { "title": "CLIP文本编码器" }
                },
                "62": {
                    "inputs": { "filename_prefix": "ComfyUI", "images": ["124", 0] },
                    "class_type": "SaveImage",
                    "_meta": { "title": "保存图像" }
                },
                "63": {
                    "inputs": { "image": "" },
                    "class_type": "LoadImage",
                    "_meta": { "title": "加载图像" }
                },
                "73": {
                    "inputs": { "conditioning": ["11", 0], "latent": ["75", 0] },
                    "class_type": "ReferenceLatent",
                    "_meta": { "title": "参考Latent" }
                },
                "74": {
                    "inputs": { "conditioning": ["19", 0], "latent": ["75", 0] },
                    "class_type": "ReferenceLatent",
                    "_meta": { "title": "参考Latent" }
                },
                "75": {
                    "inputs": { "pixels": ["123", 0], "vae": ["10", 0] },
                    "class_type": "VAEEncode",
                    "_meta": { "title": "VAE编码" }
                },
                "83": {
                    "inputs": { "width": ["131", 3], "height": ["131", 4], "batch_size": 1 },
                    "class_type": "EmptyFlux2LatentImage",
                    "_meta": { "title": "Flux2代 空Latent" }
                },
                "95": {
                    "inputs": { "seed": 45157923637773, "steps": 6, "cfg": 1, "sampler_name": "euler", "scheduler": "simple", "denoise": 1, "model": ["13", 0], "positive": ["74", 0], "negative": ["73", 0], "latent_image": ["83", 0] },
                    "class_type": "KSampler",
                    "_meta": { "title": "K采样器" }
                },
                "108": {
                    "inputs": { "left": 504, "top": 0, "right": 504, "bottom": 0, "feathering": 0, "image": ["116", 0] },
                    "class_type": "ImagePadForOutpaint",
                    "_meta": { "title": "外补画板" }
                },
                "116": {
                    "inputs": { "upscale_method": "lanczos", "megapixels": 1, "resolution_steps": 1, "image": ["63", 0] },
                    "class_type": "ImageScaleToTotalPixels",
                    "_meta": { "title": "缩放图像（像素）" }
                },
                "123": {
                    "inputs": { "color": "0, 255, 0", "device": "cpu", "image": ["131", 0], "mask": ["131", 1] },
                    "class_type": "DrawMaskOnImage",
                    "_meta": { "title": "合并图像与遮罩" }
                },
                "124": {
                    "inputs": { "method": "mkl", "strength": 0.4, "multithread": true, "image_ref": ["116", 0], "image_target": ["17", 0] },
                    "class_type": "ColorMatch",
                    "_meta": { "title": "图像调色" }
                },
                "131": {
                    "inputs": { "aspect_ratio": "original", "proportional_width": 1, "proportional_height": 1, "fit": "letterbox", "method": "lanczos", "round_to_multiple": "8", "scale_to_side": "longest", "scale_to_length": 1024, "background_color": "#0b0b0a", "image": ["108", 0], "mask": ["108", 1] },
                    "class_type": "LayerUtility: ImageScaleByAspectRatio V2",
                    "_meta": { "title": "图层工具：按宽高比缩放_V2" }
                }
            },
            nodeMappings: {
                "63": { param: "image", label: "输入图像", type: "upload" },
                "19": { param: "text", label: "提示词", type: "textarea" },
                "95": { param: "seed", label: "随机种子", type: "number" },
                "108": { params: ["left", "top", "right", "bottom"], label: "扩展参数", type: "pad" },
                "131": { param: "scale_to_length", label: "缩放最长边", type: "number" }
            },
            apiEndpoint: "/api/generate"
        };


        /** 保存到用户 output 文件夹 */
        // 图片归档复用 comfyui-utils.js 的 saveToUserOutput。
        function generateUUID() {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) { try { return crypto.randomUUID(); } catch (e) { } }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        const CLIENT_ID = localStorage.getItem("client_id") || generateUUID();
        localStorage.setItem("client_id", CLIENT_ID);

        async function loadConfig() {
            const localConfig = localStorage.getItem('comfyui_config');
            if (localConfig) {
                try {
                    const config = JSON.parse(localConfig);
                    const activeServer = config.active_server || '本地服务器';
                    IS_LOCAL_SERVER = (activeServer === '本地服务器');
                    if (activeServer === '云端服务器' && config.cloud_address) {
                        COMFYUI_SERVER = (config.cloud_address.startsWith('http') ? config.cloud_address : `https://${config.cloud_address}`).replace(/\/+$/, '');
                    } else if (config.local_address) {
                        COMFYUI_SERVER = (config.local_address.startsWith('http') ? config.local_address : `http://${config.local_address}`).replace(/\/+$/, '');
                    }
                    return;
                } catch (e) {
                    console.error('解析本地配置失败:', e);
                }
            }
        }

        async function apiFetch(url, options = {}) {
            if (IS_LOCAL_SERVER) {
                const directUrl = COMFYUI_SERVER + url;
                const response = await fetch(directUrl, options);
                return response;
            }
            const headers = {
                'X-ComfyUI-Server-Url': COMFYUI_SERVER,
                ...(options.headers || {})
            };
            const response = await fetch(url, { ...options, headers });
            return response;
        }

        function buildWsUrl() {
            // 始终通过后端代理连接 ComfyUI WebSocket，避免直连端口问题
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            return `${protocol}//${window.location.host}/api/comfyui/ws?client_id=${CLIENT_ID}`;
        }

        async function checkServerConnection() {
            try {
                const statsUrl = IS_LOCAL_SERVER ? '/system_stats' : '/api/comfyui/system_stats';
                const response = await apiFetch(statsUrl);
                if (response.ok) {
                    document.getElementById("statusText").innerText = "System Ready";
                    document.getElementById("dotColor").className = "w-1.5 h-1.5 bg-green-500 rounded-full";
                } else {
                    throw new Error('Server not responding');
                }
            } catch (e) {
                document.getElementById("statusText").innerText = "System Offline";
                document.getElementById("dotColor").className = "w-1.5 h-1.5 bg-red-500 rounded-full";
            }
        }
        // 统一缩略图模块配置（一处改全处同步）
        window.GALLERY_CONFIG = {
            type: 'kuotu',
            container: '#masonry',
            trigger: '#loadMoreTrigger',
            pageSize: 15,
            batchSelectBtn: '#batchSelectBtn',
            deleteSelectedBtn: '#deleteSelectedBtn',
            selectedCount: '#selectedCount',
            features: {
                delete: true,
                openFolder: true,
                download: true,
                copyToCanvas: true,
                regenerate: true,
                batchSelect: true,
                contextMenu: true,
                imageFallback: true,
                modelBadge: 'auto'
            }
        };
        GalleryDisplay.init({
            historyType: 'kuotu',
            masonrySelector: '#masonry',
            loadMoreSelector: '#loadMoreTrigger',
            favoritesEnabled: true,
        });

        let uploadedImageName = null;

        const socket = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}/ws/stats`);
        socket.onmessage = (e) => {
            try {
                const msg = JSON.parse(e.data);
                if (msg.type === 'new_image' && msg.data?.type === 'kuotu') {
                        GalleryList.pushNewImage(msg.data);
                    }
            } catch (err) { }
        };

        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const sizeInput = document.getElementById('sizeInput');
        const seedInput = document.getElementById('seedInput');
        const scaleEnabledToggle = document.getElementById('scaleEnabledToggle');
        const scaleSizeRow = document.getElementById('scaleSizeRow');
        scaleEnabledToggle.addEventListener('change', () => {
            scaleSizeRow.style.display = scaleEnabledToggle.checked ? '' : 'none';
        });
        const mainGenBtn = document.getElementById('mainGenBtn');

        UploadZone.bind(uploadZone, fileInput, handleFileUpload);

        async function handleFileUpload(file) {
            if (!file.type.startsWith('image/')) return alert('请上传图片文件');
            const reader = new FileReader();
            reader.onload = (e) => { preview.src = e.target.result; preview.classList.add('active'); };
            reader.readAsDataURL(file);
            const formData = new FormData();
            formData.append('files', file);
            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.files?.length > 0) {
                    uploadedImageName = data.files[0].comfy_name;
                    updateGenButtonState();
                    setStatus('Image uploaded');
                }
            } catch (e) { alert('上传失败'); }
        }

        function updateGenButtonState() { mainGenBtn.disabled = !uploadedImageName; }
        function randomizeSeed() { seedInput.value = Math.floor(Math.random() * 1000000000000000); }
        function setStatus(text) {
            document.getElementById("statusText").innerText = text;
            document.getElementById("dotColor").className = "w-1.5 h-1.5 bg-black rounded-full";
        }

        function setLoading(loading) {
            const btn = document.getElementById('mainGenBtn');
            const text = document.getElementById('btnText');
            if (loading) {
                btn.disabled = true;
                text.textContent = "扩图中...";
            } else {
                btn.disabled = !uploadedImageName;
                text.textContent = "扩图";
            }
        }

        let isGenerating = false;
        let currentPromptId = null;

        function startProgress() {
            document.getElementById('progressInline').classList.add('active');
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('progressPercent').textContent = '0%';
            document.getElementById('progressStatus').textContent = '正在提交任务...';
        }

        function updateRealProgress(msg) {
            const fill = document.getElementById('progressFill');
            const percent = document.getElementById('progressPercent');
            const status = document.getElementById('progressStatus');
            if (msg.status === 'started') {
                fill.style.width = '2%'; percent.textContent = '2%'; status.textContent = 'ComfyUI 开始执行...';
            } else if (msg.status === 'executing') {
                fill.style.width = '5%'; percent.textContent = '5%'; status.textContent = `执行节点: ${getNodeTitle(msg.node)}`;
            } else if (msg.status === 'cached') { status.textContent = '部分节点命中缓存';
            } else if (msg.status === 'sampling') {
                const value = msg.value || 0, max = msg.max || 1;
                const finalPct = 10 + Math.round((value / max) * 80);
                fill.style.width = `${finalPct}%`; percent.textContent = `${finalPct}%`; status.textContent = `采样中 ${value}/${max}`;
            } else if (msg.status === 'done') {
                fill.style.width = '95%'; percent.textContent = '95%'; status.textContent = '解码保存中...';
            }
        }

        function getNodeTitle(nodeId) {
            const node = WORKFLOW_CONFIG.workflow[nodeId];
            return node?._meta?.title || `节点 ${nodeId}`;
        }

        function completeProgress() {
            document.getElementById('progressFill').style.width = '100%';
            document.getElementById('progressPercent').textContent = '100%';
            document.getElementById('progressStatus').textContent = '生成完成！';
        }

        function hideProgress() {
            document.getElementById('progressInline').classList.remove('active');
            currentPromptId = null;
        }

        async function handleRender() {
            if (!uploadedImageName) return alert("请先上传图像");
            isGenerating = true;
            startProgress();
            setLoading(true);
            const placeholder = createPlaceholder("Canvas Expand");
            document.getElementById('masonry').prepend(placeholder);
            try {
                const workflowData = JSON.parse(JSON.stringify(WORKFLOW_CONFIG.workflow));
                const promptText = "移除绿色区域";
                const seed = parseInt(seedInput.value) || 45157923637773;
                const size = parseInt(sizeInput.value) || 1024;
                const padLeft = parseInt(document.getElementById('padLeft').value) || 0;
                const padRight = parseInt(document.getElementById('padRight').value) || 0;
                const padTop = parseInt(document.getElementById('padTop').value) || 0;
                const padBottom = parseInt(document.getElementById('padBottom').value) || 0;

                workflowData["63"]["inputs"]["image"] = uploadedImageName;
                workflowData["19"]["inputs"]["text"] = promptText;
                workflowData["95"]["inputs"]["seed"] = seed;
                workflowData["108"]["inputs"]["left"] = padLeft;
                workflowData["108"]["inputs"]["right"] = padRight;
                workflowData["108"]["inputs"]["top"] = padTop;
                workflowData["108"]["inputs"]["bottom"] = padBottom;
                const scaleEnabled = document.getElementById('scaleEnabledToggle').checked;
                if (scaleEnabled) {
                    workflowData["131"]["inputs"]["scale_to_length"] = size;
                } else {
                    delete workflowData["131"];
                    workflowData["123"]["inputs"]["image"] = ["108", 0];
                    workflowData["123"]["inputs"]["mask"] = ["108", 1];
                    workflowData["83"]["inputs"]["width"] = ["132", 0];
                    workflowData["83"]["inputs"]["height"] = ["132", 1];
                    workflowData["132"] = { "inputs": { "image": ["108", 0] }, "class_type": "GetImageSize", "_meta": { "title": "获取图像尺寸" } };
                }

                currentPromptId = generateUUID();
                const wsUrl = buildWsUrl();
                const ws = await new Promise((resolve, reject) => {
                    const socket = new WebSocket(wsUrl);
                    socket.onopen = () => { console.log('[ComfyUI WS] 连接成功'); resolve(socket); };
                    socket.onerror = () => reject(new Error('WebSocket 连接失败'));
                    setTimeout(() => reject(new Error('WebSocket 连接超时')), 5000);
                });

                await new Promise((resolve, reject) => {
                    ws.onmessage = (event) => {
                        try {
                            if (typeof event.data !== 'string') return;
                            const message = JSON.parse(event.data);
                            if (message.data?.prompt_id && message.data.prompt_id !== currentPromptId) return;
                            if (message.type === 'execution_start') { updateRealProgress({ type: 'comfyui_progress', status: 'started', value: 0, max: 1, node: '' });
                            } else if (message.type === 'progress') {
                                updateRealProgress({ type: 'comfyui_progress', status: 'sampling', value: message.data.value || 0, max: message.data.max || 1, node: message.data.node || '' });
                            } else if (message.type === 'executing') {
                                if (message.data.node === null) {
                                    updateRealProgress({ type: 'comfyui_progress', status: 'done', value: 1, max: 1, node: '' });
                                    setTimeout(() => { ws.close(); resolve(getResult(currentPromptId, promptText, placeholder)); }, 500);
                                } else { updateRealProgress({ type: 'comfyui_progress', status: 'executing', value: 0, max: 1, node: message.data.node || '' }); }
                            } else if (message.type === 'execution_cached') { updateRealProgress({ type: 'comfyui_progress', status: 'cached', value: 0, max: 1, node: 'cached' });
                            } else if (message.type === 'execution_error') { ws.close(); reject(new Error(message.data.exception_message || '执行错误')); }
                        } catch (e) { reject(e); }
                    };
                    fetch(`/api/comfyui/prompt`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: workflowData, client_id: CLIENT_ID, prompt_id: currentPromptId })
                    }).then(async (response) => {
                        if (!response.ok) { const errorText = await response.text(); reject(new Error(`HTTP ${response.status}: ${errorText}`)); return; }
                        const result = await response.json();
                        currentPromptId = result.prompt_id;
                        document.getElementById('progressStatus').textContent = '任务已提交，等待执行...';
                    }).catch(reject);
                });
            } catch (e) {
                placeholder.remove();
                alert(e.message || '扩图失败');
            } finally {
                isGenerating = false;
                completeProgress();
                setTimeout(() => hideProgress(), 800);
                setLoading(false);
            }
        }

        async function getResult(promptId, promptText, placeholder) {
            try {
                const res = await fetch(`/api/comfyui/history/${promptId}`);
                if (!res.ok) throw new Error('获取历史记录失败');
                const history = await res.json();
                const promptData = history[promptId];
                if (!promptData) throw new Error('历史记录中未找到该任务');
                if (promptData.status && promptData.status.status_str === 'error') throw new Error('任务执行错误');
                const outputs = promptData.outputs || {};
                let imageUrl = null;
                for (const nodeId in outputs) {
                    const nodeOutput = outputs[nodeId];
                    if (nodeOutput.images && nodeOutput.images.length > 0) {
                        const image = nodeOutput.images[0];
                        imageUrl = `/api/comfyui/view?filename=${encodeURIComponent(image.filename)}&subfolder=${encodeURIComponent(image.subfolder || '')}&type=${encodeURIComponent(image.type || 'output')}`;
                        break;
                    }
                }
                if (imageUrl) {
                    imageUrl = await saveToUserOutput(imageUrl, '扩图');
                    const timestamp = Date.now();
                    const record = { timestamp, images: [imageUrl], prompt: promptText, type: 'kuotu' };
                    GalleryList.pushNewImage(record);;
                                        await fetch('/api/history/save', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(record)
                    });
                    
                    if (placeholder) placeholder.remove();
                } else { throw new Error('未找到生成结果'); }
            } catch (e) {
                if (placeholder) placeholder.remove();
                alert('获取结果失败: ' + e.message);
            }
        }

        function createPlaceholder(text) {
            const div = document.createElement('div');
            div.className = 'masonry-item bg-gray-50 flex flex-col items-center justify-center border-dashed border-2 border-gray-200';
            div.innerHTML = `<div class="w-6 h-6 border-2 border-gray-100 border-t-black rounded-full animate-spin mb-3"></div><span class="text-[8px] font-bold text-gray-400 uppercase tracking-tighter">${text}</span>`;
            return div;
        }

        window.onload = async () => {
            await loadConfig();
            checkServerConnection();
            setInterval(checkServerConnection, 5000);
            GalleryList.load(0).then(() => {
                const trigger = document.getElementById('loadMoreTrigger');
                if (trigger) { trigger.onclick = () => GalleryList.load(1); }
                window.HistoryBulkManager?.attach({masonry:'#masonry'});
            });
            setInterval(async () => {
                try {
                    const res = await fetch("/api/queue_status?client_id=" + encodeURIComponent(CLIENT_ID));
                    const data = await res.json();
                    if (data.total > 0) {
                        document.getElementById("statusText").innerText = `Queueing ${data.position}/${data.total}`;
                        document.getElementById("dotColor").className = "w-1.5 h-1.5 bg-orange-500 rounded-full animate-pulse";
                    } else {
                        document.getElementById("statusText").innerText = "System Ready";
                        document.getElementById("dotColor").className = "w-1.5 h-1.5 bg-black rounded-full";
                    }
                } catch (e) { }
            }, 3000);
        };
    </script>
</body>
