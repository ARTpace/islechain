<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/logo.png" type="image/png">
    <title>视频生成 | ART AI</title>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'dark';
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                }
            } catch(e) {}
        })();
    </script>
    <script src="/static/modules/auth-token.js"></script>
    <link rel="stylesheet" href="/static/tailwind.min.css">
    <script src="/static/lucide.min.js"></script>
    <script src="/static/theme.js"></script>
    <link rel="stylesheet" href="/static/modules/gallery/style.css?v=20260614">
    <style>
        :root {
            --bg-base: #f8f8f8;
            --bg-card: #ffffff;
            --bg-soft: #fafafa;
            --bg-soft-hover: #f0f0f0;
            --bg-btn-ghost-hover: #f5f5f5;
            --text-main: #1a1a1a;
            --text-soft: #666666;
            --text-mute: #888888;
            --text-faint: #999999;
            --border: #e5e5e5;
            --border-strong: #d4d4d4;
            --accent: #000000;
            --accent-soft: #222222;
            --primary: #007aff;
            --primary-soft: #5ac8fa;
            --success: #16a34a;
            --warn: #d97706;
            --scrollbar-thumb: #d8d8d8;
            --stage-bg: #000000;
            --overlay-bg: rgba(0,0,0,0.6);
            --slider-track: #e5e5e5;
            --slider-thumb: #000000;
            --max-w: 1280px;
            --easing: cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* 暗色主题变量重定义 (与 zimage.html 一致的赛博青风格) */
        body.studio-theme-dark {
            --bg-base: #0a0e17;
            --bg-card: #0d1520;
            --bg-soft: #0a0e17;
            --bg-soft-hover: #142030;
            --bg-btn-ghost-hover: #1a3050;
            --text-main: #e0e7ef;
            --text-soft: #a0b8c8;
            --text-mute: #6a8fa8;
            --text-faint: #4a5a6a;
            --border: rgba(0,240,255,0.12);
            --border-strong: rgba(0,240,255,0.20);
            --accent: #00f0ff;
            --accent-soft: #00b8cc;
            --primary: #00f0ff;
            --primary-soft: #5ac8fa;
            --success: #34d399;
            --warn: #fbbf24;
            --scrollbar-thumb: rgba(0,240,255,0.18);
            --stage-bg: #050810;
            --overlay-bg: rgba(10,14,23,0.78);
            --slider-track: rgba(0,240,255,0.12);
            --slider-thumb: #00f0ff;
        }
        *::-webkit-scrollbar { width:10px!important; height:10px!important; background:transparent!important; }
        *::-webkit-scrollbar-track { background:transparent!important; border:none!important; }
        *::-webkit-scrollbar-thumb { background-color:var(--scrollbar-thumb)!important; border:3px solid transparent!important; border-right-width:5px!important; background-clip:padding-box!important; border-radius:10px!important; }
        * { scrollbar-width:thin!important; scrollbar-color:var(--scrollbar-thumb) transparent!important; }
        body { background-color:var(--bg-base); font-family:"Inter",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--text-main); -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; height:100vh; overflow:hidden; transition:background-color .3s, color .3s; }
        .layout-container { max-width:var(--max-w); margin:0 auto; padding:0 40px; width:100%; }
        @media(max-width:768px){ .layout-container{ padding:0 16px; } }
        .lv-root { display:flex; flex-direction:column; height:100vh; overflow:hidden; }
        .lv-header { padding:18px 0 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; flex-shrink:0; transition:border-color .3s; }
        .lv-title { font-size:18px; font-weight:600; display:flex; align-items:center; gap:8px; color:var(--text-main); }
        .lv-wf-select { padding:8px 14px; border-radius:8px; border:1px solid var(--border-strong); background:var(--bg-card); color:var(--text-main); font-size:13px; cursor:pointer; min-width:220px; transition:border-color .2s, background .2s; }
        .lv-wf-select:hover { border-color:var(--primary); }
        .lv-body { flex:1; overflow:hidden; display:grid; grid-template-columns: 320px 1fr; gap:14px; padding:12px 0; }
        .lv-side { overflow-y:auto; padding-right:4px; }
        .lv-main { display:flex; flex-direction:column; gap:12px; overflow:hidden; }
        .lv-card { background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:10px 12px; transition:background .3s, border-color .3s; }
        .lv-card-title { font-size:12px; font-weight:600; margin-bottom:6px; color:var(--text-main); display:flex; align-items:center; gap:5px; }
        .lv-card-title [data-lucide] { color:var(--primary); }
        .lv-field { margin-bottom:8px; }
        .lv-label { font-size:11px; color:var(--text-soft); margin-bottom:4px; display:flex; justify-content:space-between; }
        .lv-input, .lv-textarea { width:100%; padding:6px 10px; border:1px solid var(--border-strong); border-radius:7px; font-size:12px; background:var(--bg-card); color:var(--text-main); box-sizing:border-box; font-family:inherit; transition:border-color .2s, background .2s; }
        .lv-input:focus, .lv-textarea:focus { outline:none; border-color:var(--primary); background:var(--bg-soft); }
        .lv-input::placeholder, .lv-textarea::placeholder { color:var(--text-faint); }
        .lv-textarea { min-height:56px; resize:vertical; }
        .lv-slider { width:100%; -webkit-appearance:none; appearance:none; height:4px; background:var(--slider-track); border-radius:2px; outline:none; transition:background .3s; }
        .lv-slider::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:14px; height:14px; border-radius:50%; background:var(--slider-thumb); cursor:pointer; box-shadow:0 0 6px rgba(0,240,255,0.4); transition:transform .15s; }
        .lv-slider::-webkit-slider-thumb:hover { transform:scale(1.15); }
        .lv-slider::-moz-range-thumb { width:12px; height:12px; border-radius:50%; background:var(--slider-thumb); cursor:pointer; border:none; }
        .lv-img-drop { width:100%; min-height:90px; max-height:220px; border:2px dashed var(--border-strong); border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; background:var(--bg-soft); transition:.2s; overflow:hidden; position:relative; box-sizing:border-box; }
        .lv-img-drop:hover { border-color:var(--primary); background:var(--bg-soft-hover); }
        .lv-img-drop.drag-over { border-color:var(--primary); background:var(--bg-soft-hover); box-shadow:inset 0 0 0 3px rgba(0,240,255,0.18); }
        .lv-img-drop.has-image { border-style:solid; padding:0; background:#000; min-height:160px; }
        .lv-img-drop .lv-img-preview { display:block; max-width:100%; max-height:280px; width:auto; height:auto; object-fit:contain; background:#000; margin:auto; }
        .lv-img-drop .placeholder { color:var(--text-faint); font-size:13px; text-align:center; padding:0 16px; pointer-events:none; }
        .lv-img-clear { position:absolute; top:8px; right:8px; width:28px; height:28px; border-radius:50%; background:rgba(0,0,0,.6); color:#fff; border:none; cursor:pointer; display:none; align-items:center; justify-content:center; z-index:5; backdrop-filter:blur(6px); transition:background .2s, transform .2s; }
        .lv-img-clear:hover { background:rgba(220,38,38,.85); transform:scale(1.1); }
        .lv-img-drop.has-image .lv-img-clear { display:flex; }
        .lv-img-clear [data-lucide] { width:14px; height:14px; }
        .lv-img-info { display:flex; align-items:center; gap:6px; margin-top:8px; font-size:11px; color:var(--text-faint); }
        .lv-img-info .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .lv-img-info .size { color:var(--text-mute); }
        /* 反向提示词折叠 */
        details.lv-collapse { margin-top:8px; }
        details.lv-collapse > summary { list-style:none; cursor:pointer; padding:6px 0; font-size:12px; color:var(--text-soft); display:flex; align-items:center; gap:4px; user-select:none; }
        details.lv-collapse > summary::-webkit-details-marker { display:none; }
        details.lv-collapse > summary::after { content:''; width:0; height:0; border-left:4px solid transparent; border-right:4px solid transparent; border-top:5px solid currentColor; transition:transform .2s; margin-left:auto; opacity:.6; }
        details.lv-collapse[open] > summary::after { transform:rotate(180deg); }
        details.lv-collapse > summary:hover { color:var(--text-main); }
        details.lv-collapse[open] > summary { margin-bottom:6px; }
        details.lv-collapse .lv-field { margin-bottom:0; }
        .lv-btn { padding:10px 18px; border-radius:10px; font-size:13px; font-weight:500; cursor:pointer; border:none; transition:.2s; display:inline-flex; align-items:center; gap:6px; font-family:inherit; }
        .lv-btn-primary { background:var(--accent); color:var(--bg-card); }
        body.studio-theme-dark .lv-btn-primary { color:#0a0e17; box-shadow:0 0 16px rgba(0,240,255,0.25); }
        .lv-btn-primary:hover { background:var(--accent-soft); }
        body.studio-theme-dark .lv-btn-primary:hover { box-shadow:0 0 22px rgba(0,240,255,0.45); }
        .lv-btn-primary:disabled { background:var(--text-faint); cursor:not-allowed; box-shadow:none; }
        .lv-btn-ghost { background:transparent; color:var(--text-main); border:1px solid var(--border-strong); }
        .lv-btn-ghost:hover { background:var(--bg-btn-ghost-hover); border-color:var(--primary); }
        .lv-stage { flex:1; min-height:300px; background:var(--stage-bg); border-radius:12px; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; box-shadow:inset 0 0 60px rgba(0,0,0,.4); transition:background .3s; }
        body.studio-theme-dark .lv-stage { border:1px solid var(--border); box-shadow:inset 0 0 80px rgba(0,240,255,0.04); }
        .lv-stage video { max-width:100%; max-height:100%; width:auto; height:auto; }
        .lv-stage .empty { color:var(--text-mute); font-size:14px; text-align:center; }
        .lv-progress { width:100%; height:6px; background:rgba(255,255,255,.18); border-radius:3px; overflow:hidden; position:absolute; bottom:0; left:0; }
        body.studio-theme-dark .lv-progress { background:rgba(0,240,255,0.08); }
        .lv-progress-bar { height:100%; background:linear-gradient(90deg,var(--primary-soft),var(--primary)); width:0; transition:width .3s; box-shadow:0 0 12px rgba(0,240,255,0.4); }
        .lv-overlay-msg { position:absolute; top:12px; left:12px; background:var(--overlay-bg); color:#fff; padding:6px 12px; border-radius:6px; font-size:12px; backdrop-filter:blur(8px); }
        .lv-status { font-size:12px; color:var(--text-mute); }
        .lv-status.active { color:var(--primary); }
        .lv-history { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; flex-shrink:0; }
        .lv-history-item { width:80px; height:60px; border-radius:6px; overflow:hidden; cursor:pointer; background:#222; flex-shrink:0; position:relative; border:1px solid var(--border); transition:transform .2s, border-color .2s; }
        .lv-history-item:hover { transform:scale(1.05); border-color:var(--primary); }
        .lv-history-item video { width:100%; height:100%; object-fit:cover; }
        .lv-row { display:flex; gap:8px; align-items:center; }
        .lv-note { font-size:11px; color:var(--text-faint); margin-top:4px; }
        .lv-tip-warn { color:var(--warn); font-size:11px; }
        .lv-tip-ok { color:var(--success); font-size:11px; }
        .lv-select { position:relative; }
        .lv-select-trigger { display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; border:1px solid var(--border-strong); border-radius:8px; background:var(--bg-soft); color:var(--text-main); cursor:pointer; font:inherit; transition:.2s; }
        .lv-select-trigger:hover { border-color:var(--primary); }
        .lv-select.open .lv-select-trigger { border-color:var(--primary); box-shadow:0 0 0 1px var(--primary), 0 0 8px rgba(0,240,255,0.15); }
        .lv-select-preview { width:34px; height:22px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .lv-select-preview-rect { border:1.5px solid var(--primary); border-radius:2px; opacity:.9; }
        .lv-select-text { flex:1; font-size:12px; text-align:left; }
        .lv-select-text .lv-select-name { font-weight:600; }
        .lv-select-text .lv-select-sub { font-size:10px; color:var(--text-faint); margin-left:6px; }
        .lv-select-chev { width:14px; height:14px; color:var(--text-faint); transition:transform .2s; flex-shrink:0; }
        .lv-select.open .lv-select-chev { transform:rotate(180deg); color:var(--primary); }
        .lv-select-panel { position:absolute; bottom:calc(100% + 4px); left:0; right:0; z-index:50; background:var(--bg-card); border:1px solid var(--border-strong); border-radius:8px; box-shadow:0 -8px 24px rgba(0,0,0,0.4); max-height:300px; overflow-y:auto; padding:4px; display:none; grid-template-columns:repeat(2, 1fr); gap:2px; }
        .lv-select.open .lv-select-panel { display:grid; }
        .lv-select-opt { display:flex; align-items:center; gap:8px; padding:5px 6px; border-radius:6px; cursor:pointer; transition:.15s; }
        .lv-select-opt:hover { background:var(--bg-soft); }
        .lv-select-opt.active { background:rgba(0,240,255,0.1); }
        .lv-select-opt-preview { width:34px; height:22px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .lv-select-opt-preview-rect { border:1.5px solid var(--text-soft); border-radius:2px; }
        .lv-select-opt:hover .lv-select-opt-preview-rect, .lv-select-opt.active .lv-select-opt-preview-rect { border-color:var(--primary); }
        .lv-select-opt-text { flex:1; font-size:12px; color:var(--text-main); }
        .lv-select-opt-sub { font-size:10px; color:var(--text-faint); margin-left:6px; }
        .lv-select-opt-check { width:14px; height:14px; color:var(--primary); opacity:0; }
        .lv-select-opt.active .lv-select-opt-check { opacity:1; }
        .lv-ref-wrap { margin-top:4px; }
        .lv-ref-drop { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:12px 12px; border:1.5px dashed var(--border-strong); border-radius:8px; cursor:pointer; transition:.2s; color:var(--text-soft); background:var(--bg-soft); }
        .lv-ref-drop:hover, .lv-ref-drop.drag-over { border-color:var(--primary); color:var(--primary); background:rgba(0,240,255,0.05); }
        .lv-ref-stack { display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; }
        .lv-ref-thumb { position:relative; width:60px; height:60px; border-radius:6px; overflow:hidden; border:1px solid var(--border-strong); background:var(--bg-soft); flex-shrink:0; transition:.2s; }
        .lv-ref-thumb:hover { border-color:var(--primary); box-shadow:0 0 0 1px var(--primary), 0 0 12px rgba(0,240,255,0.2); }
        .lv-ref-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
        .lv-ref-thumb .lv-ref-num { position:absolute; top:2px; left:2px; min-width:18px; height:18px; padding:0 4px; border-radius:9px; background:rgba(0,240,255,0.9); color:#0a0e17; font-size:10px; font-weight:700; line-height:18px; text-align:center; box-shadow:0 1px 4px rgba(0,0,0,0.4); }
        .lv-ref-thumb .lv-ref-del { position:absolute; top:2px; right:2px; width:18px; height:18px; padding:0; border:none; border-radius:50%; background:rgba(0,0,0,0.7); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; opacity:0; transition:.15s; }
        .lv-ref-thumb:hover .lv-ref-del { opacity:1; }
        .lv-ref-thumb .lv-ref-del:hover { background:var(--warn); color:#0a0e17; }
        .lv-ref-thumb .lv-ref-del svg { width:12px; height:12px; stroke-width:2.5; }
        .lv-ref-bar { display:flex; gap:6px; margin-top:8px; }
        .lv-spinner { width:14px; height:14px; border:2px solid #fff; border-top-color:transparent; border-radius:50%; animation:spin 1s linear infinite; display:inline-block; }
        body.studio-theme-dark .lv-spinner { border-color:rgba(10,14,23,0.3); border-top-color:#0a0e17; }
        .lv-empty-hint { color:var(--text-faint); font-size:12px; padding:14px; }
        /* 暗色下的画廊样式微调 */
        body.studio-theme-dark .lv-card { box-shadow:0 0 0 1px rgba(0,240,255,0.04), 0 4px 12px rgba(0,0,0,0.3); }
        body.studio-theme-dark .lv-card:hover { border-color:rgba(0,240,255,0.25); }
        body.studio-theme-dark .lv-title [data-lucide] { color:var(--primary); }
        .lv-empty-hint { color:var(--text-faint); font-size:12px; padding:14px; }
        @keyframes spin { to { transform:rotate(360deg); } }
    </style>
</head>
<body>
<div class="lv-root">
    <div class="layout-container lv-header">
        <div class="lv-title">
            <i data-lucide="film"></i>
            <span>视频生成</span>
        </div>
        <select id="workflowSelect" class="lv-wf-select" title="切换工作流">
            <!-- 动态从 /api/workflows/builtin 加载, 入口脚本填充 options -->
        </select>
        <div class="lv-status" id="status">就绪</div>
        <div style="flex:1"></div>
        <input type="number" id="seedInput" value="-1" placeholder="种子" title="随机种子 (-1=随机)" style="width:90px;padding:4px 8px;border:1px solid var(--border-strong);border-radius:6px;background:var(--bg-card);color:var(--text-main);font-size:12px;text-align:center;">
        <button class="lv-btn lv-btn-ghost" id="randomSeed" title="随机种子" style="margin-left:6px;">
            <i data-lucide="dices"></i>
        </button>
    </div>

    <div class="layout-container lv-body">
        <aside class="lv-side">
            <div class="lv-card" data-wf-only="video/MiniMax_H3.json" style="display:none;">
                <div class="lv-card-title">
                    <i data-lucide="images"></i>参考图
                    <span style="flex:1"></span>
                    <span class="lv-status" id="refCount">0 / 9</span>
                </div>
                <div class="lv-ref-wrap" id="refEmpty">
                    <label class="lv-ref-drop" id="refDrop">
                        <input type="file" id="refInput" accept="image/*" multiple style="display:none">
                        <i data-lucide="upload-cloud" style="width:28px;height:28px;opacity:.6;"></i>
                        <div style="margin-top:4px;font-size:12px;">点击或拖入参考图</div>
                        <div style="margin-top:2px;font-size:11px;opacity:.55;">MiniMax H3 最多 9 张</div>
                    </label>
                </div>
                <div class="lv-ref-stack" id="refStack" style="display:none;"></div>
                <div class="lv-ref-bar" id="refBar" style="display:none;">
                    <button type="button" class="lv-btn lv-btn-ghost" id="refAddBtn" style="flex:1;padding:6px;font-size:12px;">
                        <i data-lucide="plus" style="width:14px;height:14px;"></i>
                        <span>添加</span>
                    </button>
                    <button type="button" class="lv-btn lv-btn-ghost" id="refClearBtn" style="flex:1;padding:6px;font-size:12px;color:var(--text-faint);">
                        <i data-lucide="trash-2" style="width:14px;height:14px;"></i>
                        <span>清空</span>
                    </button>
                </div>
                <div class="lv-note" style="margin-top:6px;">多张参考图按顺序拼接为 &lt;Picture 1&gt;…&lt;Picture 9&gt; 提示</div>
            </div>

            <div class="lv-card" data-wf-only="LTX23-图生视频.json">
                <div class="lv-card-title"><i data-lucide="image"></i>输入图像</div>
                <label class="lv-img-drop" id="imgDrop">
                    <input type="file" id="imgInput" accept="image/*" style="display:none">
                    <div class="placeholder" id="imgPlaceholder">
                        <i data-lucide="upload-cloud" style="width:32px;height:32px;"></i>
                        <div style="margin-top:6px;">点击或拖入图片</div>
                    </div>
                    <button type="button" class="lv-img-clear" id="imgClear" title="清除图片">
                        <i data-lucide="x"></i>
                    </button>
                </label>
                <div class="lv-img-info" id="imgInfo" style="display:none;">
                    <i data-lucide="file-image" style="width:12px;height:12px;flex-shrink:0;"></i>
                    <span class="name" id="imgName">—</span>
                    <span class="size" id="imgSize">—</span>
                </div>
                <div class="lv-note" id="imgNote" style="margin-top:6px;">支持 PNG/JPG/WEBP，作为视频首帧</div>
            </div>

            <div class="lv-card" style="padding-top:8px;">
                <div class="lv-card-title" style="font-size:11px;margin-bottom:4px;"><i data-lucide="type" style="width:14px;height:14px;"></i>提示词</div>
                <div class="lv-field" style="margin-bottom:0;">
                    <textarea class="lv-textarea" id="prompt" placeholder="正向提示词：描述视频内容…" style="margin-top:0;min-height:96px;"></textarea>
                </div>
                <details class="lv-collapse" data-wf-only="LTX23-图生视频.json" style="margin-top:6px;">
                    <summary style="font-size:11px;padding:4px 0;">反向提示词</summary>
                    <div class="lv-field" style="margin-bottom:0;margin-top:4px;">
                        <textarea class="lv-textarea" id="negative_prompt" style="min-height:48px;font-size:12px;" placeholder="不想出现的内容…"></textarea>
                    </div>
                </details>
            </div>

            <!-- LTX 参数卡片 -->
            <div class="lv-card" data-wf-only="LTX23-图生视频.json">
                <div class="lv-card-title"><i data-lucide="sliders-horizontal"></i>参数</div>

                <div class="lv-field">
                    <div class="lv-label"><span>总帧数</span><span id="total_frames_val">97</span></div>
                    <input class="lv-slider" type="range" id="total_frames" min="49" max="481" step="8" value="97">
                    <div class="lv-note" id="total_frames_note">≈4 秒 @ 24fps</div>
                </div>

                <div class="lv-field">

<script>
// ============= 状态 =============
// 工作流注册表：每个 workflow 列出需要填入的控件以及到 ComfyUI 节点的映射。
// 原理：所有控件以固定 id 出现于 DOM (如 #total_frames, #length, #aspect_ratio)，
// 运行时根据当前选中的 workflow 决定哪些 DOM 节点可见，并由 node_map 告诉你点提交时
// 值应该写到哪个 ComfyUI node.input。
const WORKFLOW_REGISTRY = {
    "LTX23-图生视频.json": {
        title: "LTX23 图生视频",
        // 哪些控件该出现(LTX 有负向提示词、总帧、帧率、尺寸、步数、种子)
        controls: ["negative_prompt", "total_frames", "fps", "size", "steps"],  // seed 移到 header 统一输入
        // 主节点映射表
        node_map: {
            input_image:     { node: "173",    input: "image" },
            prompt:          { node: "175:5",  input: "text" },
            negative_prompt: { node: "175:6",  input: "text" },
            total_frames:    { node: "175:10", input: "value" },
            fps:             { node: "175:12", input: "value" },
            size:            { node: "175:179", input: "size" },
            seed:            { node: "175:16", input: "noise_seed" },
            steps:           { node: "175:22", input: "steps" }
        },
        // 采样步数预估值, 用于 progress 显示
        stepsField: "steps",
        saveNodeId: "174",  // WS executed 消息匹配的视频输出节点
        defaultPromptHint: "描述视频内容…"
    },
    "video/MiniMax_H3.json": {
        title: "MiniMax H3 图生视频",
        controls: ["length", "aspect_ratio", "megapixels"],  // seed 移到 header 统一输入
        node_map: {
            input_image:  { node: "137", input: "image" },
            prompt:       { node: "138", input: "value" },
            length:       { node: "132", input: "value" },
            aspect_ratio: { node: "115", input: "aspect_ratio" },
            megapixels:   { node: "115", input: "megapixels" },
            seed_mm:      { node: "129", input: "noise_seed" }
        },
        stepsField: null,  // MiniMax 步数固定在 workflow 内 (BasicScheduler 20步), 不暴露
        saveNodeId: "92",
        defaultPromptHint: "Multi-shot description with sound (English preferred)…"
    }
};
let currentWorkflow = "LTX23-图生视频.json";  // 启动后由动态列表覆盖
let inputImageFile = null;
let inputImageObjectUrl = null;  // 避免内存泄漏, 重新选择时 revoke 旧的
let inputImageComfyName = null;  // 上传到 ComfyUI 后的文件名
// MiniMax 多参考图状态:每项 { id, file, url(本地预览), comfyName(上传后), slot(0..8) }
const MAX_REF_IMAGES = 9;
let refImgs = [];  // 工作流切换或清空时整体重置
let currentSession = [];  // {url, ts, prompt}
let isRunning = false;
let progressTimer = null;

// ============= 工具 =============
function getToken() {
    return (window.AUTH_TOKEN && window.AUTH_TOKEN.get && window.AUTH_TOKEN.get())
        || window.localStorage.getItem('auth_token')
        || '';
}
function status(msg, active) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'lv-status' + (active ? ' active' : '');
}
function showProgress(pct, msg) {
    document.getElementById('progress').style.display = 'block';
    document.getElementById('progressBar').style.width = Math.max(0, Math.min(100, pct)) + '%';
    if (msg) {
        const m = document.getElementById('overlayMsg');
        m.textContent = msg;
        m.style.display = 'block';
    }
}
function hideProgress() {
    document.getElementById('progress').style.display = 'none';
    document.getElementById('overlayMsg').style.display = 'none';
}
function randSeed() {
    return Math.floor(Math.random() * 2 ** 31);
}

// ============= 输入图 =============
const imgDrop = document.getElementById('imgDrop');
const imgInput = document.getElementById('imgInput');
const imgPlaceholder = document.getElementById('imgPlaceholder');
imgDrop.addEventListener('click', () => imgInput.click());
imgDrop.addEventListener('dragover', e => { e.preventDefault(); imgDrop.classList.add('drag-over'); });
imgDrop.addEventListener('dragleave', e => { e.preventDefault(); imgDrop.classList.remove('drag-over'); });
imgDrop.addEventListener('drop', e => {
    e.preventDefault();
    imgDrop.classList.remove('drag-over');
    if (e.dataTransfer.files && e.dataTransfer.files[0]) handleImage(e.dataTransfer.files[0]);
});
imgInput.addEventListener('change', e => {
    if (e.target.files && e.target.files[0]) handleImage(e.target.files[0]);
});
document.getElementById('imgClear').addEventListener('click', e => {
    e.preventDefault();
    e.stopPropagation();  // 阻止冒泡到 label 触发 file dialog
    clearImage();
});
function handleImage(file) {
    if (!file.type.startsWith('image/')) {
        status('请选择图片文件'); return;
    }
    inputImageFile = file;
    if (inputImageObjectUrl) {
        URL.revokeObjectURL(inputImageObjectUrl);
    }
    inputImageObjectUrl = URL.createObjectURL(file);
    imgDrop.classList.add('has-image');
    // 不清空 imgDrop 整个内部, 只修改占位区, 保留 <input> 和 label 包裹关系
    let preview = imgDrop.querySelector('.lv-img-preview');
    if (!preview) {
        preview = document.createElement('img');
        preview.className = 'lv-img-preview';
        // 插在 input 之前, 保留 input 在 DOM 里 (label 包裹 input 才能点击触发 file dialog)
        imgDrop.insertBefore(preview, imgInput);
    }
    preview.src = inputImageObjectUrl;
    // 文件信息条
    const info = document.getElementById('imgInfo');
    const nameEl = document.getElementById('imgName');
    const sizeEl = document.getElementById('imgSize');
    nameEl.textContent = file.name;
    sizeEl.textContent = '(' + (file.size/1024).toFixed(1) + ' KB)';
    info.style.display = 'flex';
    if (window.lucide) window.lucide.createIcons();
}
function clearImage() {
    inputImageFile = null;
    inputImageComfyName = null;
    if (inputImageObjectUrl) {
        URL.revokeObjectURL(inputImageObjectUrl);
        inputImageObjectUrl = null;
    }
    const preview = imgDrop.querySelector('.lv-img-preview');
    if (preview) preview.src = '';
    imgDrop.classList.remove('has-image');
    imgInput.value = '';  // 重置 file input, 否则选同一张图不触发 change
    document.getElementById('imgInfo').style.display = 'none';
    status('已清除输入图');
}

// ============= 参数联动显示 =============
// 只为当前 workflow 启用的 slider 绑 input 事件。重复调用是安全的 (nextElementSibling 防御)。
function bindSliderEvents() {
    const cfg = WORKFLOW_REGISTRY[currentWorkflow];
    if (!cfg) return;
    const sliderIds = cfg.controls.filter(c => document.getElementById(c)?.type === 'range');
    sliderIds.forEach(id => {
        const el = document.getElementById(id);
        const valEl = document.getElementById(id + '_val');
        if (!el || !valEl) return;
        if (el.dataset.bound) return;
        el.dataset.bound = '1';
        el.addEventListener('input', () => {
            valEl.textContent = el.value;
            updateDerived();
        });
    });
}
function updateDerived() {
    const cfg = WORKFLOW_REGISTRY[currentWorkflow];
    if (!cfg) return;
    const vramNote = document.getElementById('vramNote');
    if (currentWorkflow === 'LTX23-图生视频.json') {
        const frames = parseInt(document.getElementById('total_frames').value);
        const fps = parseInt(document.getElementById('fps').value);
        const size = parseInt(document.getElementById('size').value);
        const sec = (frames / fps).toFixed(1);
        const note2 = document.getElementById('total_frames_note');
        if (note2) note2.textContent = `≈ ${sec} 秒 @ ${fps}fps`;
        // 显存粗估: 481 帧 + 1280 像素 + int8 ≈ 28GB
        const pixels = size * size * (frames / 30);
        const estGB = (pixels / 1.5e8).toFixed(0);
        if (parseInt(estGB) >= 20) {
            vramNote.innerHTML = `<span class="lv-tip-warn">⚠ 预估显存 ≈ ${estGB}GB, 24GB 显卡可能 OOM</span>`;
        } else {
            vramNote.innerHTML = `<span class="lv-tip-ok">预估显存 ≈ ${estGB}GB</span>`;
        }
    } else {
        // MiniMax: 显存量级不同，不估计
        vramNote.innerHTML = '';
    }
}

// ============= workflow 切换 =============
// 根据选中工作流控制 data-wf-only 元素的显隐, 重置绑定, 更新提示。
function applyWorkflowVisibility(wfName) {
    const cfg = WORKFLOW_REGISTRY[wfName];
    if (!cfg) return;
    currentWorkflow = wfName;
    // 1. 切换 data-wf-only 元素
    document.querySelectorAll('[data-wf-only]').forEach(el => {
        el.style.display = (el.dataset.wfOnly === wfName) ? '' : 'none';
    });
    // 2. 提示 placeholder
    const promptEl = document.getElementById('prompt');
    if (promptEl) promptEl.placeholder = cfg.defaultPromptHint || '';
    // 3. 随机种子按钮绑定 (统一用 header 的 #seedInput)
    const randomBtn = document.getElementById('randomSeed');
    const seedInput = document.getElementById('seedInput');
    randomBtn.onclick = () => {
        if (seedInput) seedInput.value = randSeed();
    };
    // 4. 给新出现的 slider 绑事件
    bindSliderEvents();
    // 5. hint 保持隐藏 (不显示安装提示)
    const wfHint = document.getElementById('wfHint');
    if (wfHint) wfHint.style.display = 'none';
    // 6. 同步精度滑条的初始 note (取决于当前比例)
    const mpSlider = document.getElementById('megapixels');
    if (mpSlider && mpSlider._sync) mpSlider._sync(mpSlider.value);
    updateDerived();
}

// ============= 比例下拉选择 =============
// ComfyUI 期望的完整名字符串(如 "9:16 (Portrait Widescreen)")。value 是 hidden input 的存储值。
const ASPECT_OPTIONS = [
    { value: '1:1 (Square)',                short: '1:1',  sub: '正方形',  w: 1,  h: 1  },
    { value: '16:9 (Widescreen)',            short: '16:9', sub: '横屏',    w: 16, h: 9  },
    { value: '9:16 (Portrait Widescreen)',   short: '9:16', sub: '竖屏',    w: 9,  h: 16 },
    { value: '4:3 (Standard)',               short: '4:3',  sub: '传统横',  w: 4,  h: 3  },
    { value: '3:4 (Portrait Standard)',      short: '3:4',  sub: '传统竖',  w: 3,  h: 4  },
    { value: '2:3 (Portrait Photo)',         short: '2:3',  sub: '照片竖',  w: 2,  h: 3  },
    { value: '3:2 (Photo)',                  short: '3:2',  sub: '照片横',  w: 3,  h: 2  },
    { value: '21:9 (Ultrawide)',             short: '21:9', sub: '超宽',    w: 21, h: 9  }
];
// 精度档位 0.2~1.0MP, 滑条 step=0.1
const MEGAPIXELS_OPTIONS = [
    { value: 0.2, sub: '草稿' },
    { value: 0.3, sub: '预览' },
    { value: 0.4, sub: '低清' },
    { value: 0.5, sub: '标清' },
    { value: 0.6, sub: '推荐' },
    { value: 0.7, sub: '吃显存' },
    { value: 0.8, sub: '吃显存' },
    { value: 0.9, sub: '吃显存' },
    { value: 1.0, sub: '1MP' }
];
// 按 megapixels + 比例计算输出尺寸 (multiple=32, 边缘对齐)
function computeOutputSize(mp, aspectOpt) {
    const ratio = aspectOpt.w / aspectOpt.h;
    // pixels = mp * 1e6, h = sqrt(pixels / ratio), w = pixels / h
    const pixels = mp * 1e6;
    const h = Math.sqrt(pixels / ratio);
    const w = pixels / h;
    const m = 32;
    const aw = Math.round(w / m) * m;
    const ah = Math.round(h / m) * m;
    return `${aw}×${ah}`;
}
// 容器 34×22, 矩形象内部按 w/h 等比缩放居中
function aspectRectStyle(w, h, maxW = 30, maxH = 18) {
    const ratio = w / h;
    let bw, bh;
    if (ratio >= 1) { bw = maxW; bh = maxW / ratio; }
    else            { bh = maxH; bw = maxH * ratio; }
    return `width:${bw.toFixed(1)}px;height:${bh.toFixed(1)}px;`;
}
function renderAspectPreview(container, opt, extraClass) {
    const cls = extraClass || 'lv-select-preview-rect';
    container.innerHTML = '<span class="' + cls + '" style="' + aspectRectStyle(opt.w, opt.h) + '"></span>';
}
function bindAspectRatio() {
    const root = document.getElementById('aspectSelect');
    const trigger = document.getElementById('aspectTrigger');
    const panel = document.getElementById('aspectPanel');
    const hidden = document.getElementById('aspect_ratio');
    const preview = document.getElementById('aspectPreview');
    const nameEl = document.getElementById('aspectName');
    const subEl = document.getElementById('aspectSub');
    if (!root || !trigger || !panel || !hidden || root.dataset.bound) return;
    root.dataset.bound = '1';
    // 1. 填充选项
    panel.innerHTML = ASPECT_OPTIONS.map(opt => {
        return '<div class="lv-select-opt" data-value="' + opt.value + '">' +
            '<span class="lv-select-opt-preview"></span>' +
            '<span class="lv-select-opt-text">' + opt.short + '<span class="lv-select-opt-sub">' + opt.sub + '</span></span>' +
            '<i class="lv-select-opt-check" data-lucide="check"></i>' +
            '</div>';
    }).join('');
    // 2. 选项预览渲染 + 选中状态
    panel.querySelectorAll('.lv-select-opt').forEach((el, idx) => {
        renderAspectPreview(el.querySelector('.lv-select-opt-preview'), ASPECT_OPTIONS[idx], 'lv-select-opt-preview-rect');
    });
    // 3. 同步当前值 -> trigger
    function syncToTrigger(value) {
        const opt = ASPECT_OPTIONS.find(o => o.value === value) || ASPECT_OPTIONS[2];
        nameEl.textContent = opt.short;
        subEl.textContent = opt.sub;
        renderAspectPreview(preview, opt);
        hidden.value = opt.value;
        panel.querySelectorAll('.lv-select-opt').forEach((el, idx) => {
            el.classList.toggle('active', ASPECT_OPTIONS[idx].value === opt.value);
        });
        if (window.lucide) window.lucide.createIcons();
    }
    syncToTrigger(hidden.value);
    // 4. 触发:开/关
    trigger.addEventListener('click', e => {
        e.stopPropagation();
        root.classList.toggle('open');
    });
    document.addEventListener('click', e => {
        if (!root.contains(e.target)) root.classList.remove('open');
    });
    // 5. 选项点击
    panel.addEventListener('click', e => {
        const opt = e.target.closest('.lv-select-opt');
        if (!opt) return;
        syncToTrigger(opt.dataset.value);
        // 同步刷新精度滑条的尺寸提示
        const mpSlider = document.getElementById('megapixels');
        if (mpSlider && mpSlider._sync) mpSlider._sync(mpSlider.value);
        root.classList.remove('open');
    });
    // 6. 暴露供 applyWorkflowVisibility 重新同步
    root._sync = syncToTrigger;
}

// ============= 精度滑条 =============
// 滑条 + label 显示 + note 同步输出尺寸。比例变动时调用 _sync()。
function bindMegapixels() {
    const slider = document.getElementById('megapixels');
    const label = document.getElementById('megapixelsVal');
    const noteEl = document.getElementById('megapixelsNote');
    if (!slider || slider.dataset.bound) return;
    slider.dataset.bound = '1';
    function syncToTrigger(value) {
        const v = parseFloat(value);
        if (label) label.textContent = v.toFixed(1);
        const opt = MEGAPIXELS_OPTIONS.find(o => Math.abs(o.value - v) < 0.05) || { value: v, sub: v.toFixed(1) + 'MP' };
        const ar = ASPECT_OPTIONS.find(o => o.value === document.getElementById('aspect_ratio').value) || ASPECT_OPTIONS[2];
        if (noteEl) noteEl.textContent = ar.short + ' → ' + computeOutputSize(opt.value, ar);
    }
    slider.addEventListener('input', () => syncToTrigger(slider.value));
    // 暴露供 bindAspectRatio 比例变动时调用
    slider._sync = syncToTrigger;
}

// ============= MiniMax 多参考图 =============
// 添加文件 -> 创建本地预览 URL, 推入 refImgs 数组, 重渲染。
function addRefFiles(files) {
    const incoming = Array.from(files || []).filter(f => f.type && f.type.startsWith('image/'));
    const slotsLeft = MAX_REF_IMAGES - refImgs.length;
    if (slotsLeft <= 0) { status('参考图已达上限 ' + MAX_REF_IMAGES + ' 张'); return; }
    const accepted = incoming.slice(0, slotsLeft);
    if (incoming.length > slotsLeft) status('仅添加 ' + slotsLeft + ' 张,已达上限');
    accepted.forEach(f => {
        const id = 'ref_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
        const url = URL.createObjectURL(f);
        refImgs.push({ id, file: f, url, comfyName: null });
    });
    renderRefStack();
}
function removeRefById(id) {
    const idx = refImgs.findIndex(r => r.id === id);
    if (idx < 0) return;
    if (refImgs[idx].url) URL.revokeObjectURL(refImgs[idx].url);
    refImgs.splice(idx, 1);
    renderRefStack();
}
function clearRefImgs() {
    refImgs.forEach(r => { if (r.url) URL.revokeObjectURL(r.url); });
    refImgs = [];
    renderRefStack();
}
function renderRefStack() {
    const stack = document.getElementById('refStack');
    const empty = document.getElementById('refEmpty');
    const bar = document.getElementById('refBar');
    const counter = document.getElementById('refCount');
    if (!stack || !empty || !bar || !counter) return;
    counter.textContent = refImgs.length + ' / ' + MAX_REF_IMAGES;
    if (refImgs.length === 0) {
        stack.style.display = 'none';
        stack.innerHTML = '';
        empty.style.display = '';
        bar.style.display = 'none';
        return;
    }
    empty.style.display = 'none';
    stack.style.display = '';
    bar.style.display = '';
    stack.innerHTML = refImgs.map((r, i) => {
        return '<div class="lv-ref-thumb" data-id="' + r.id + '" title="' + r.file.name + '">' +
            '<img src="' + r.url + '" alt="ref' + (i + 1) + '">' +
            '<span class="lv-ref-num">' + (i + 1) + '</span>' +
            '<button type="button" class="lv-ref-del" data-id="' + r.id + '" title="删除">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">' +
                '<path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>' +
            '</button>' +
            '</div>';
    }).join('');
    // 事件委托:删除按钮
    stack.querySelectorAll('.lv-ref-del').forEach(btn => {
        btn.addEventListener('click', e => {
            e.preventDefault(); e.stopPropagation();
            removeRefById(btn.dataset.id);
        });
    });
    if (window.lucide) window.lucide.createIcons();
}
// 拖拽 + 点击 + 清空 事件绑定
function bindRefImgs() {
    const drop = document.getElementById('refDrop');
    const input = document.getElementById('refInput');
    const addBtn = document.getElementById('refAddBtn');
    const clearBtn = document.getElementById('refClearBtn');
    if (!drop || !input || drop.dataset.bound) return;
    drop.dataset.bound = '1';
    drop.addEventListener('click', () => input.click());
    input.addEventListener('change', e => {
        if (e.target.files && e.target.files.length) addRefFiles(e.target.files);
        e.target.value = '';  // 重置, 允许重复选同一文件
    });
    // 拖拽
    let dragCounter = 0;
    drop.addEventListener('dragenter', e => { e.preventDefault(); dragCounter++; drop.classList.add('drag-over'); });
    drop.addEventListener('dragover', e => { e.preventDefault(); });
    drop.addEventListener('dragleave', e => { e.preventDefault(); dragCounter--; if (dragCounter <= 0) { dragCounter = 0; drop.classList.remove('drag-over'); } });
    drop.addEventListener('drop', e => {
        e.preventDefault(); dragCounter = 0; drop.classList.remove('drag-over');
        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) addRefFiles(e.dataTransfer.files);
    });
    if (addBtn) addBtn.addEventListener('click', () => input.click());
    if (clearBtn) clearBtn.addEventListener('click', () => {
        if (refImgs.length === 0) return;
        if (confirm('清空所有参考图?')) clearRefImgs();
    });
}
// 提交前逐张上传到 ComfyUI, 返回按 slot 顺序排列的文件名数组 (上传失败的跳过)
async function uploadRefImgs() {
    for (let i = 0; i < refImgs.length; i++) {
        const r = refImgs[i];
        if (r.comfyName) continue;  // 已上传过
        const fd = new FormData();
        fd.append('image', r.file);
        fd.append('type', 'input');
        fd.append('overwrite', 'true');
        const token = getToken();
        const resp = await fetch('/api/comfyui/upload/image', {
            method: 'POST',
            headers: token ? { 'Authorization': 'Bearer ' + token } : {},
            body: fd
        });
        if (!resp.ok) throw new Error('参考图上传失败: HTTP ' + resp.status);
        const data = await resp.json();
        if (!data.name && !data.filename) throw new Error('参考图上传响应缺少 name');
        r.comfyName = data.name || data.filename;
    }
    return refImgs.map(r => r.comfyName).filter(Boolean);
}
// 为多张参考图在 workflow 中追加 LoadImage 节点。
// MiniMax 工作流原有一个 LoadImage 137 给 ref_image_0; 额外图片从 200 起递增, 输出链到 136.ref_images.ref_image_{i}
function injectExtraLoadImages(apiWorkflow, comfyNames, targetNodeId) {
    // 已有 LoadImage 137 给 slot 0 (params 覆写 image); 剩下 slot 1..N-1 注入新节点
    const added = [];  // { id, inputName, filename }
    let nextId = 200;
    for (let i = 1; i < comfyNames.length; i++) {
        while (apiWorkflow[String(nextId)]) nextId++;
        const lid = String(nextId);
        nextId++;
        apiWorkflow[lid] = {
            inputs: { image: comfyNames[i] },
            class_type: 'LoadImage',
            _meta: { title: '加载图像 ref' + (i + 1) }
        };
        const inputName = 'ref_images.ref_image_' + i;  // 与工作流原 slot 0 命名一致
        if (!apiWorkflow[targetNodeId].inputs) apiWorkflow[targetNodeId].inputs = {};
        apiWorkflow[targetNodeId].inputs[inputName] = [lid, 0];  // link to LoadImage output slot 0
        added.push({ id: lid, inputName, filename: comfyNames[i], slot: i });
    }
    return added;
}

// 从 /api/workflows/builtin 动态填充工作流下拉。
async function loadWorkflowList() {
    const sel = document.getElementById('workflowSelect');
    let workflows = [];
    try {
        const resp = await fetch('/api/workflows/builtin', { headers: getToken() ? { 'Authorization': 'Bearer ' + getToken() } : {} });
        if (resp.ok) {
            const data = await resp.json();
            workflows = (data.workflows || []).map(w => w.name);
        }
    } catch (e) {
        console.warn('[litevideo] 拉取工作流列表失败', e);
    }
    // 确保至少 LTX23 在列表里 (builtin 列表可能不返回未配置 config.json 的工作流)
    if (!workflows.includes('LTX23-图生视频.json')) workflows.unshift('LTX23-图生视频.json');
    // 只显示注册表里支持的工作流
    const supported = workflows.filter(n => WORKFLOW_REGISTRY[n]);
    sel.innerHTML = '';
    supported.forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = WORKFLOW_REGISTRY[name].title || name;
        sel.appendChild(opt);
    });
    if (supported.length && !supported.includes(currentWorkflow)) currentWorkflow = supported[0];
    sel.value = currentWorkflow;
    applyWorkflowVisibility(currentWorkflow);
    sel.addEventListener('change', () => {
        // 切 workflow 时保留输入图和提示词(用户要继续微调不同后端)
        applyWorkflowVisibility(sel.value);
        // 随机种子重置为 -1 (不同后端种子效果不可移植)
        const seedInput = document.getElementById('seedInput');
        if (seedInput) seedInput.value = -1;
    });
}

// ============= 上传图到 ComfyUI =============
async function uploadInputImage() {
    if (!inputImageFile) throw new Error('请先选择输入图像');
    const fd = new FormData();
    fd.append('image', inputImageFile);
    fd.append('type', 'input');
    fd.append('overwrite', 'true');
    const token = getToken();
    const resp = await fetch('/api/comfyui/upload/image', {
        method: 'POST',
        headers: token ? { 'Authorization': 'Bearer ' + token } : {},
        body: fd
    });
    if (!resp.ok) throw new Error('上传图像失败: HTTP ' + resp.status);
    const data = await resp.json();
    if (!data.name && !data.filename) throw new Error('上传响应缺少 name');
    return data.name || data.filename;
}

// ============= WebSocket 进度订阅 =============
// litevideo 需要实时进度, /api/generate 是同步等所有节点跑完才返回, 进度条要靠 WS 事件驱动
let progressWs = null;
let progressWsCloseTimer = null;
function openProgressWs(clientId, onProgress) {
    closeProgressWs();
    const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const url = `${proto}//${window.location.host}/api/comfyui/ws?client_id=${encodeURIComponent(clientId)}`;
    try {
        progressWs = new WebSocket(url);
    } catch (e) {
        console.warn('[litevideo] WS 创建失败', e);
        return;
    }
    progressWs.onopen = () => {
        console.log('[litevideo] WS 已连接', clientId);
    };
    progressWs.onmessage = (e) => {
        try {
            if (typeof e.data !== 'string') return;
            const msg = JSON.parse(e.data);
            if (msg.type === 'progress' && msg.data) {
                // value/max 是当前节点的采样进度
                const v = msg.data.value, mx = msg.data.max || 1;
                onProgress({ kind: 'progress', value: v, max: mx, node: msg.data.node });
            } else if (msg.type === 'executing') {
                onProgress({ kind: 'executing', node: msg.data.node });
            } else if (msg.type === 'execution_start') {
                onProgress({ kind: 'start' });
            } else if (msg.type === 'execution_error') {
                onProgress({ kind: 'error', message: msg.data?.exception_message || 'ComfyUI 节点错误' });
            } else if (msg.type === 'executed' && msg.data?.node) {
                // SaveVideo 完成后 -> 视频即将可读, 进度推到 99%
                // 从注册表取当前 workflow 的 SaveVideo 节点 id
                const _saveId = (WORKFLOW_REGISTRY[currentWorkflow] || {}).saveNodeId;
                if (msg.data.node === _saveId) {
                    onProgress({ kind: 'video_ready' });
                }
            }
        } catch (err) {
            console.warn('[litevideo] WS 消息解析失败', err);
        }
    };
    progressWs.onerror = () => {};
    progressWs.onclose = () => { progressWs = null; };
}
function closeProgressWs() {
    if (progressWsCloseTimer) { clearTimeout(progressWsCloseTimer); progressWsCloseTimer = null; }
    if (progressWs) {
        try { progressWs.close(); } catch (e) {}
        progressWs = null;
    }
}
// 依据当前帧数 + 步数粗估总采样步数, 用作进度条分母
function estimateTotalSteps() {
    const steps = parseInt(document.getElementById('steps').value) || 8;
    return Math.max(steps, 1);
}
let _progressPct = 0;
function applyProgress(evt) {
    if (evt.kind === 'start') {
        _progressPct = 5;
        showProgress(_progressPct, 'ComfyUI 已开始执行…');
    } else if (evt.kind === 'progress') {
        // 单节点内部 value/max 是该节点的采样进度, 步数阶段大约占 70%, 视频编码占 30%
        const stepsPct = (evt.value / Math.max(evt.max, 1)) * 70;
        _progressPct = Math.max(_progressPct, 5 + stepsPct);
        showProgress(_progressPct, `采样中 ${evt.value}/${evt.max}`);
    } else if (evt.kind === 'executing') {
        if (evt.node === null) {
            // 全部执行完毕, 但视频还在编码
            _progressPct = Math.max(_progressPct, 85);
            showProgress(_progressPct, '编码视频…');
        } else {
            const nodeNames = {
                '173': '加载图像', '175:179': '缩放', '175:10': '生成帧', '175:22': '调度', '174': '保存视频',
                '137': '加载参考图', '138': '提示词', '115': '选分辨率', '132': '时长',
                '136': '生成视频', '130': '合成视频', '92': '保存视频'
            };
            showProgress(_progressPct, `执行节点 ${evt.node} ${nodeNames[evt.node] || ''}`);
        }
    } else if (evt.kind === 'video_ready') {
        _progressPct = Math.max(_progressPct, 99);
        showProgress(_progressPct, '视频已生成, 准备加载…');
    } else if (evt.kind === 'error') {
        showProgress(0, '错误: ' + (evt.message || '未知'));
    }
}

// ============= 提交生成 =============
document.getElementById('runBtn').addEventListener('click', async () => {
    if (isRunning) return;
    const isMiniMax = currentWorkflow === 'video/MiniMax_H3.json';
    if (isMiniMax) {
        if (refImgs.length === 0) { status('请先选择参考图(至少 1 张)'); return; }
    } else {
        if (!inputImageFile) { status('请先选择输入图像'); return; }
    }
    const btn = document.getElementById('runBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="lv-spinner"></span><span>排队中…</span>';
    isRunning = true;
    _progressPct = 0;
    status('上传图像…', true);
    showProgress(1, isMiniMax ? '上传参考图…' : '上传输入图…');
    try {
        // 0. 预先准备稳定的 client_id, 让 WS 和提交使用同一个
        const clientId = 'litevideo_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
        openProgressWs(clientId, applyProgress);
        // 1. 上传图像:LTX 单图,MiniMax 多参考图
        let imgComfyName = null;       // LTX 单图名
        let refComfyNames = null;     // MiniMax 参考图名列表(按 slot 顺序)
        if (isMiniMax) {
            refComfyNames = await uploadRefImgs();
            imgComfyName = refComfyNames[0];  // slot 0 默认走 137 LoadImage
        } else {
            imgComfyName = await uploadInputImage();
            inputImageComfyName = imgComfyName;
        }
        status('提交工作流…', true);
        showProgress(3, '提交到 ComfyUI…');
        // 2. 组装参数 (按当前 workflow 的 node_map)
        const cfg = WORKFLOW_REGISTRY[currentWorkflow];
        if (!cfg) {
            throw new Error('未识别的工作流: ' + currentWorkflow);
        }
        // 随机种子：统一从 header #seedInput 读取 (LTX 用 node_map.seed, MiniMax 用 node_map.seed_mm)
        const seedInput = document.getElementById('seedInput');
        let finalSeed = null;
        if (seedInput) {
            const seedVal = parseInt(seedInput.value);
            finalSeed = isNaN(seedVal) || seedVal === -1 ? randSeed() : seedVal;
        }
        // 控件值采集：key 是 node_map 的 key, value 是 DOM 读取
        // input_image/prompt 对所有 workflow 都采集
        const rawValues = {
            input_image: imgComfyName,
            prompt: document.getElementById('prompt').value
        };
        // 根据 workflow 决定 seed 的 key (LTX 用 'seed', MiniMax 用 'seed_mm')
        const seedKey = cfg.node_map.seed ? 'seed' : (cfg.node_map.seed_mm ? 'seed_mm' : null);
        if (seedKey && finalSeed !== null) rawValues[seedKey] = finalSeed;
        // 其余 active 控件 (slider/select)
        cfg.controls.forEach(ctrl => {
            if (rawValues[ctrl] !== undefined) return;
            const el = document.getElementById(ctrl);
            if (!el) return;
            // slider 或 hidden numeric 字段 (如 megapixels): 转 float
            const numeric = ctrl === 'megapixels' || el.type === 'range';
            rawValues[ctrl] = numeric ? parseFloat(el.value) : el.value;
        });
        // 3. 提交 (走 /api/generate, params 走 { nodeId: { inputName: value } } 覆盖)
        const token = getToken();
        const params = {};
        for (const [fid, value] of Object.entries(rawValues)) {
            const m = cfg.node_map[fid];
            if (!m) continue;
            if (!params[m.node]) params[m.node] = {};
            params[m.node][m.input] = value;
        }
        const body = {
            prompt: rawValues.prompt || '',
            workflow_json: currentWorkflow,
            type: 'video',
            client_id: clientId,
            params: params
        };
        // MiniMax 多参考图:获取 workflow JSON, 追加 LoadImage 节点, 走 workflow_data 提交
        if (isMiniMax && refComfyNames && refComfyNames.length > 1) {
            const wfResp = await fetch('/api/workflows/' + encodeURIComponent(currentWorkflow), {
                headers: token ? { 'Authorization': 'Bearer ' + token } : {}
            });
            if (!wfResp.ok) throw new Error('加载工作流失败: HTTP ' + wfResp.status);
            const wfEnvelope = await wfResp.json();
            const apiWorkflow = JSON.parse(JSON.stringify(wfEnvelope.workflow || wfEnvelope));
            // node_map.input_image.node = '137' (已有 LoadImage) 给 slot 0
            // 额外 slot 1..N-1 注入 LoadImage 节点(从 200 起), 输出链到 136.ref_images.reference_image_{i}
            injectExtraLoadImages(apiWorkflow, refComfyNames, '136');
            body.workflow_data = apiWorkflow;
            delete body.workflow_json;  // 优先用 workflow_data
            showProgress(3, '提交到 ComfyUI(' + refComfyNames.length + ' 张参考图)…');
        }
        const resp = await fetch('/api/generate', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                ...(token ? { 'Authorization': 'Bearer ' + token } : {})
            },
            body: JSON.stringify(body)
        });
        if (!resp.ok) {
            const txt = await resp.text();
            throw new Error('HTTP ' + resp.status + ': ' + txt.substring(0, 300));
        }
        const data = await resp.json();
        console.log('[litevideo] run result', data);
        // 4. 取视频 URL
        const urls = (data.images || []).concat(data.video_urls || []);
        if (!urls.length) throw new Error('未返回视频文件');
        const videoUrl = urls[0];
        // 5. 显示
        const v = document.getElementById('resultVideo');
        v.src = videoUrl;
        v.style.display = 'block';
        document.getElementById('emptyStage').style.display = 'none';
        status('完成 ✓', false);
        // 6. push 到 session history
        currentSession.unshift({ url: videoUrl, ts: Date.now(), prompt: rawValues.prompt || '' });
        renderSession();
        // 7. 收尾进度条
        showProgress(100, '完成 ✓');
        setTimeout(hideProgress, 1500);
    } catch (e) {
        console.error(e);
        status('失败: ' + e.message);
        showProgress(0, '失败: ' + e.message);
        setTimeout(hideProgress, 4000);
    } finally {
        isRunning = false;
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="play"></i><span>生成视频</span>';
        if (window.lucide) window.lucide.createIcons();
        // 关闭 WS (但要等几秒让最后的 executed 事件过来)
        if (progressWsCloseTimer) clearTimeout(progressWsCloseTimer);
        progressWsCloseTimer = setTimeout(closeProgressWs, 3000);
    }
});

function renderSession() {
    const list = document.getElementById('historyList');
    document.getElementById('historyCount').textContent = currentSession.length + ' 个';
    if (!currentSession.length) {
        list.innerHTML = '<div class="lv-empty-hint">尚无生成记录</div>';
        return;
    }
    list.innerHTML = '';
    currentSession.forEach((it, i) => {
        const div = document.createElement('div');
        div.className = 'lv-history-item';
        div.title = it.prompt || ('#' + (i + 1));
        const v = document.createElement('video');
        v.src = it.url;
        v.muted = true;
        v.preload = 'metadata';
        div.appendChild(v);
        div.addEventListener('click', () => {
            const main = document.getElementById('resultVideo');
            main.src = it.url;
            main.style.display = 'block';
            document.getElementById('emptyStage').style.display = 'none';
        });
        list.appendChild(div);
    });
}

// 启动时补图标
if (window.lucide) window.lucide.createIcons();
status('就绪');
// 比例卡片事件(静态 DOM, 启动时一次性绑定)
bindAspectRatio();
bindMegapixels();
// 参考图事件
bindRefImgs();
// 异步加载工作流列表, 然后按当前 workflow 应用 UI
loadWorkflowList().catch(e => {
    console.warn('[litevideo] loadWorkflowList 失败, 使用默认 LTX23', e);
    applyWorkflowVisibility('LTX23-图生视频.json');
});
