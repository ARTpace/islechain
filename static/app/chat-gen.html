<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>对话生图</title>
<script src="/static/modules/auth-token.js"></script>
<script src="/static/js/theme.js?v=20261024001"></script>
<script src="/static/js/ui-refine.js?v=20261024001"></script>
<link rel="stylesheet" href="/static/css/studio-ui.css">
<style>
/* 统一双主题：浅色默认，深色随 .studio-theme-dark 自动切换（对齐 studio-ui.css token） */
:root {
  --bg:var(--ui-bg); --panel:var(--ui-panel); --soft:var(--ui-soft);
  --line:var(--ui-line); --line-strong:var(--ui-line-strong);
  --text:var(--ui-text); --muted:var(--ui-muted); --faint:var(--ui-faint);
  --mine:var(--ui-accent-soft);
  --accent:var(--ui-accent); --accent-glow:var(--ui-accent-glow); --accent-ink:var(--ui-accent-ink);
  --ease:cubic-bezier(.4,0,.2,1);
}
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; -webkit-font-smoothing:antialiased; }
*::-webkit-scrollbar { width:10px; height:10px; }
*::-webkit-scrollbar-thumb { background:var(--line-strong); border-radius:999px; border:3px solid transparent; background-clip:padding-box; }
*::-webkit-scrollbar-thumb:hover { background:var(--faint); }
*::-webkit-scrollbar-track { background:transparent; }

.page { height:100%; display:flex; flex-direction:column; }

/* 顶栏 */
.topbar { height:52px; flex:0 0 auto; display:flex; align-items:center; gap:12px; padding:0 16px;
  border-bottom:1px solid var(--line); background:linear-gradient(180deg, rgba(0, 240, 255, .04), transparent); }
.topbar .brand { display:flex; align-items:center; gap:9px; font-weight:800; font-size:14px; letter-spacing:.02em; }
.topbar .brand .dot { width:9px; height:9px; border-radius:50%; background:var(--accent);
  box-shadow:0 0 10px var(--accent); animation:uiBreathe 2.4s ease-in-out infinite; }
.topbar .spacer { flex:1; }
.topbar .tbtn { height:36px; padding:0 12px; border-radius:10px; border:1px solid var(--line);
  background:var(--panel); color:var(--muted); font-size:12px; font-weight:700; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px; transition:all .15s var(--ease); }
.topbar .tbtn:hover { color:var(--text); border-color:var(--accent); }
.topbar .tbtn.danger:hover { color:#cfcdc4; border-color:#f87171; }
.topbar .tbtn.stop { color:var(--accent-ink); background:linear-gradient(135deg,var(--accent-glow),var(--accent));
  border-color:transparent; display:none; }
.topbar .tbtn.stop.show { display:inline-flex; }

/* 对话流 */
.thread { flex:1; overflow:auto; padding:26px 8vw 18px; display:flex; flex-direction:column; gap:20px; }
.empty { margin:auto; text-align:center; color:var(--muted); max-width:340px; }
.empty .ico { width:64px; height:64px; margin:0 auto 14px; border-radius:18px; display:flex; align-items:center; justify-content:center;
  background:var(--panel); border:1px solid var(--line); color:var(--accent); }
.empty .t { font-size:15px; font-weight:800; color:var(--text); margin-bottom:6px; }
.empty .s { font-size:13px; line-height:1.6; }

.row { display:flex; }
.row.user { justify-content:flex-end; }
.row.asst { justify-content:flex-start; }
.row.ui-fade-in { animation:uiFadeIn .3s var(--ease) both; }
.bubble { max-width:min(640px, 78%); }
.user .bubble { background:var(--mine); border:1px solid var(--line); border-radius:18px 18px 6px 18px; padding:11px 13px; }
.user .text { font-size:14px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
.refs { display:flex; gap:8px; justify-content:flex-end; margin-bottom:8px; }
.refs img { width:84px; height:84px; object-fit:cover; border-radius:10px; border:1px solid var(--line); }

.asst .label { font-size:12px; color:var(--muted); margin:2px 2px 6px; display:flex; align-items:center; gap:6px; }
.asst img.result { max-width:min(440px, 70vw); border-radius:12px; display:block; background:var(--soft);
  border:1px solid var(--line); animation:uiFadeIn .4s var(--ease) both; }
.ops { display:flex; gap:8px; margin-top:10px; }
.ops button { height:32px; padding:0 12px; border-radius:999px; border:1px solid var(--line);
  background:var(--panel); color:var(--muted); font-size:12px; font-weight:700; cursor:pointer;
  transition:all .15s var(--ease); }
.ops button:hover { color:var(--text); border-color:var(--accent); }
.err { color:#cfcdc4; font-size:13px; display:flex; align-items:center; gap:6px; }

/* 生成中占位：流光 */
.pending { width:240px; height:300px; border-radius:12px; position:relative; overflow:hidden;
  background:linear-gradient(135deg,var(--soft),var(--panel)); border:1px solid var(--line); }
.pending::after { content:""; position:absolute; inset:0;
  background:linear-gradient(110deg,transparent 35%, rgba(0, 240, 255, .10) 50%, transparent 65%);
  transform:translateX(-100%); animation:uiShimmer 1.4s ease-in-out infinite; }
.pending .ptxt { position:absolute; left:0; right:0; bottom:14px; text-align:center; color:var(--accent);
  font-size:12.5px; font-weight:700; letter-spacing:.04em; z-index:2; }

/* 底部输入坞 */
.dock { padding:0 8vw 18px; flex:0 0 auto; }
.composer { background:var(--panel); border:1px solid var(--line); border-radius:22px; padding:10px 12px 8px;
  transition:border-color .18s var(--ease), box-shadow .18s var(--ease); }
.composer:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%, transparent); }
.refstrip { display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
.refchip { position:relative; width:54px; height:54px; border-radius:12px; overflow:hidden; border:1px solid var(--line); flex:0 0 auto; }
.refchip img { width:100%; height:100%; object-fit:cover; }
.refchip button { position:absolute; top:3px; right:3px; width:18px; height:18px; border-radius:50%;
  border:0; background:rgba(11, 11, 10, .8); color:#fbfaf9; font-size:12px; line-height:18px; cursor:pointer; display:none; }
.refchip:hover button { display:block; }
.composer textarea { width:100%; min-height:44px; max-height:150px; resize:none; border:0; outline:none;
  background:transparent; color:var(--text); font:14px/1.55 inherit; padding:4px 4px; }
.composer textarea::placeholder { color:var(--faint); }
.rowbar { display:flex; align-items:center; gap:8px; margin-top:4px; }
.rowbar .grow { flex:1; }
.chip { height:36px; min-width:44px; padding:0 12px; border-radius:999px; border:1px solid var(--line);
  background:var(--soft); color:var(--muted); font-size:12px; font-weight:700; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:4px;
  transition:all .15s var(--ease); }
.chip:hover { color:var(--text); border-color:var(--accent); }
.chip.active { background:linear-gradient(135deg,var(--accent-glow),var(--accent)); color:var(--accent-ink); border-color:transparent; }
.file { display:none; }
.send { width:44px; height:44px; border-radius:50%; border:0; flex:0 0 auto;
  background:linear-gradient(135deg,var(--accent-glow),var(--accent)); color:var(--accent-ink); cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:800;
  transition:all .15s var(--ease); }
.send:hover { transform:translateY(-1px); box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 30%, transparent); }
.send:active { transform:translateY(0) scale(.96); }
.send:disabled { opacity:.45; cursor:default; transform:none; box-shadow:none; }
</style>
<style id="ui-responsive">
/* 对话生图响应式底座补充（页面已用 var(--ui-*) token，此处补全统一行为） */
body { overflow-x: hidden; }
.page { min-width: 0; }
.thread, .dock, .composer { min-width: 0; }
.bubble { min-width: 0; }
@media (max-width: 640px) {
  .thread { padding-left: 4vw; padding-right: 4vw; }
  .dock { padding-left: 4vw; padding-right: 4vw; }
  .topbar { padding-left: 12px; padding-right: 12px; }
  .composer textarea { font-size: 16px; }
  .tbtn { height: 40px; }
}
img, .asst img.result { max-width: 100%; height: auto; }
</style>
</head>
<body>
<div class="page">
    <div class="topbar">
        <div class="brand"><span class="dot"></span><span>对话生图</span></div>
        <div class="spacer"></div>
        <button id="stopBtn" class="tbtn stop" type="button" title="停止生成">■ 停止</button>
        <button id="clearBtn" class="tbtn danger" type="button" title="清空对话">清空</button>
    </div>

    <div id="thread" class="thread">
        <div class="empty">
            <div class="ico">✶</div>
            <div class="t">用一句话开始创作</div>
            <div class="s">描述你想要的画面，可附参考图，回车发送。<br>生成结果会保存在本机对话中。</div>
        </div>
    </div>

    <div class="dock">
        <form id="composer" class="composer">
            <div id="refstrip" class="refstrip"></div>
            <textarea id="prompt" placeholder="描述你想要的画面，回车发送…" rows="1"></textarea>
            <div class="rowbar">
                <button type="button" id="addRef" class="chip" title="添加参考图">＋ 参考图</button>
                <input id="file" class="file" type="file" accept="image/*" multiple>
                <button type="button" class="chip ratio" data-ratio="1:1">1:1</button>
                <button type="button" class="chip ratio active" data-ratio="3:4">3:4</button>
                <button type="button" class="chip ratio" data-ratio="16:9">16:9</button>
                <button type="button" class="chip ratio" data-ratio="9:16">9:16</button>
                <span class="grow"></span>
                <button id="send" class="send" type="submit" title="发送">↑</button>
            </div>
        </form>
    </div>
</div>
<script>
const SIZES = { '1:1':[1024,1024], '3:4':[768,1024], '16:9':[1280,720], '9:16':[720,1280] };
const thread = document.getElementById('thread');
const promptEl = document.getElementById('prompt');
const sendBtn = document.getElementById('send');
const stopBtn = document.getElementById('stopBtn');
const clearBtn = document.getElementById('clearBtn');
let ratio = '3:4';
let refs = [];
let busy = false;
let workflow = null;
let controller = null;

function userName() {
    try {
        const u = JSON.parse(localStorage.getItem('xy_auth_user') || 'null');
        return (u && (u.username || u.name)) || 'guest';
    } catch (e) { return 'guest'; }
}
function storeKey() { return 'chat_gen_thread:' + userName(); }
function loadThread() {
    try { return JSON.parse(localStorage.getItem(storeKey()) || '[]'); } catch (e) { return []; }
}
function saveThread(items) {
    try { localStorage.setItem(storeKey(), JSON.stringify(items.slice(-40))); } catch (e) {}
}

function autoGrow() {
    promptEl.style.height = 'auto';
    promptEl.style.height = Math.min(promptEl.scrollHeight, 150) + 'px';
}

function render(items, animateLast) {
    thread.innerHTML = '';
    if (!items.length) {
        thread.innerHTML = '<div class="empty"><div class="ico">✶</div>' +
            '<div class="t">用一句话开始创作</div>' +
            '<div class="s">描述你想要的画面，可附参考图，回车发送。<br>生成结果会保存在本机对话中。</div></div>';
        return;
    }
    items.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = 'row ' + (item.role === 'user' ? 'user' : 'asst');
        if (animateLast && idx === items.length - 1) row.classList.add('ui-fade-in');
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        if (item.role === 'user') {
            if (item.refs && item.refs.length) {
                const strip = document.createElement('div');
                strip.className = 'refs';
                item.refs.forEach(src => {
                    const img = document.createElement('img');
                    img.src = src;
                    strip.appendChild(img);
                });
                bubble.appendChild(strip);
            }
            const text = document.createElement('div');
            text.className = 'text';
            text.textContent = item.text || '';
            bubble.appendChild(text);
        } else if (item.pending) {
            const p = document.createElement('div');
            p.className = 'pending';
            p.innerHTML = '<div class="ptxt">生成中 · ' + (item.ratio || '') + '</div>';
            bubble.appendChild(p);
        } else if (item.error) {
            bubble.innerHTML = '<div class="err">⚠ ' + item.error + '</div>';
        } else {
            (item.images || []).forEach(src => {
                const img = document.createElement('img');
                img.className = 'result';
                img.src = src;
                bubble.appendChild(img);
            });
            const label = document.createElement('div');
            label.className = 'label';
            label.innerHTML = '<span class="ui-status-dot"></span> 图片已生成';
            bubble.appendChild(label);
            const ops = document.createElement('div');
            ops.className = 'ops';
            const again = document.createElement('button');
            again.type = 'button';
            again.textContent = '用此提示再画';
            again.onclick = () => { promptEl.value = item.prompt || ''; autoGrow(); promptEl.focus(); };
            ops.appendChild(again);
            // 铁律 10：复制对勾 2.5s 后自熄
            const copyBtn = document.createElement('button');
            copyBtn.type = 'button';
            copyBtn.textContent = '复制提示词';
            copyBtn.onclick = () => {
                const p = item.prompt || '';
                if (!p) return;
                UIRefine.copy(p).then(() => UIRefine.flashDone(copyBtn, '✓')).catch(() => {});
            };
            ops.appendChild(copyBtn);
            bubble.appendChild(ops);
        }
        row.appendChild(bubble);
        thread.appendChild(row);
    });
    thread.scrollTop = thread.scrollHeight;
}

async function ensureWorkflow() {
    if (workflow) return workflow;
    const res = await fetch('/api/workflows/' + encodeURIComponent('text2image/z-image.json'));
    if (!res.ok) throw new Error('工作流加载失败');
    const data = await res.json();
    workflow = data.workflow || data;
    return workflow;
}

async function generate(text, signal) {
    const wf = JSON.parse(JSON.stringify(await ensureWorkflow()));
    const [w, h] = SIZES[ratio];
    const seed = Math.floor(Math.random() * 1e15);
    if (wf['23'] && wf['23'].inputs) wf['23'].inputs.text = text;
    if (wf['144'] && wf['144'].inputs) {
        wf['144'].inputs.width = w;
        wf['144'].inputs.height = h;
        wf['144'].inputs.batch_size = 1;
    }
    if (wf['22'] && wf['22'].inputs) wf['22'].inputs.seed = seed;
    const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            prompt: text, width: w, height: h, type: 'zimage', feature: 'zimage',
            client_id: 'chat-gen-' + userName(), workflow_data: wf
        }),
        signal
    });
    if (!res.ok) throw new Error((await res.text()).slice(0, 180) || '生成失败');
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    const images = (data.images || []).filter(Boolean);
    if (!images.length) throw new Error('没有返回图片');
    return images;
}

function setBusy(v) {
    busy = v;
    sendBtn.disabled = v;
    stopBtn.classList.toggle('show', v);
}

document.querySelectorAll('.ratio').forEach(btn => {
    btn.onclick = () => {
        ratio = btn.dataset.ratio;
        document.querySelectorAll('.ratio').forEach(b => b.classList.toggle('active', b === btn));
    };
});

function renderRefStrip() {
    const strip = document.getElementById('refstrip');
    strip.innerHTML = '';
    refs.forEach((url, i) => {
        const chip = document.createElement('div');
        chip.className = 'refchip';
        const img = document.createElement('img');
        img.src = url;
        const x = document.createElement('button');
        x.type = 'button';
        x.textContent = '×';
        x.title = '移除';
        x.onclick = () => {
            URL.revokeObjectURL(url);
            refs.splice(i, 1);
            renderRefStrip();
        };
        chip.appendChild(img);
        chip.appendChild(x);
        strip.appendChild(chip);
    });
}

document.getElementById('addRef').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = () => {
    const files = [...document.getElementById('file').files].slice(0, 4);
    files.forEach(file => refs.push(URL.createObjectURL(file)));
    renderRefStrip();
    document.getElementById('file').value = '';
};

promptEl.addEventListener('input', autoGrow);
promptEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        document.getElementById('composer').requestSubmit();
    }
});

stopBtn.onclick = () => {
    if (controller) controller.abort();
    setBusy(false);
};

clearBtn.onclick = () => {
    if (!confirm('确定清空当前对话？')) return;
    refs.forEach(URL.revokeObjectURL);
    refs = []; renderRefStrip();
    saveThread([]); render(loadThread());
};

document.getElementById('composer').onsubmit = async (e) => {
    e.preventDefault();
    const text = promptEl.value.trim();
    if (!text || busy) return;
    controller = new AbortController();
    setBusy(true);
    const items = loadThread();
    const snapRefs = refs.slice();
    items.push({ role: 'user', text, refs: snapRefs, ratio });
    items.push({ role: 'assistant', pending: true, ratio, prompt: text });
    saveThread(items);
    render(items);
    promptEl.value = '';
    autoGrow();
    refs = []; renderRefStrip();
    try {
        const images = await generate(text, controller.signal);
        const next = loadThread();
        next.pop();
        next.push({ role: 'assistant', images, prompt: text, ratio });
        saveThread(next);
        render(next, true);
    } catch (err) {
        if (err.name === 'AbortError') {
            const next = loadThread();
            next.pop();
            next.push({ role: 'assistant', error: '已停止生成', prompt: text });
            saveThread(next);
            render(next);
            return;
        }
        const next = loadThread();
        next.pop();
        next.push({ role: 'assistant', error: err.message || '生成失败', prompt: text });
        saveThread(next);
        render(next);
    } finally {
        controller = null;
        setBusy(false);
    }
};

render(loadThread());
</script>
</body>
</html>
