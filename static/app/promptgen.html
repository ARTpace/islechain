<body class="antialiased">
    <header class="pt-20 pb-12">
        <div class="layout-container">
            <div class="console-card rounded-3xl p-1.5">
                <div class="bg-gray-50/50 rounded-[22px] p-8">
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">图像反推 - Prompt Generation</span>
                        <div id="statusDot" class="flex items-center gap-2">
                            <span id="statusText" class="text-[9px] font-bold text-gray-500 uppercase">System Ready</span>
                            <div id="dotColor" class="w-1.5 h-1.5 bg-black rounded-full"></div>
                        </div>
                    </div>
                    <textarea id="prompt" rows="2" class="w-full bg-transparent text-2xl font-medium outline-none placeholder:text-gray-200 text-black resize-none leading-relaxed" placeholder="输入自定义提示词，用于指导反推方向..."></textarea>
                </div>
                <div class="flex flex-col md:flex-row items-center justify-between p-4 px-6 gap-6">
                    <div class="flex items-center gap-8 flex-wrap w-full md:w-auto">
                        <div class="flex flex-col">
                            <span class="text-[9px] font-bold text-gray-400 uppercase mb-1">上传图像</span>
                            <div class="upload-zone" id="uploadZone">
                                <div class="text-2xl mb-2">🖼️</div>
                                <div class="text-[11px] font-bold text-gray-400 uppercase">点击、拖拽或 Ctrl+V 上传</div>
                                <input type="file" id="fileInput" accept="image/*" style="display: none;">
                                <img class="preview-image" id="preview" alt="图像预览">
                            </div>
                        </div>
                        <div class="h-8 w-px bg-gray-100 hidden md:block"></div>
                        <div class="flex flex-col gap-2">
                            <div class="flex flex-col">
                        <span class="text-[9px] font-bold text-gray-400 uppercase mb-1">预设提示词风格</span>
                        <select id="presetSelect" class="preset-select bg-transparent outline-none border-b border-transparent focus:border-black text-xs font-bold py-1 pr-8 min-w-[200px]">
                            <option value="Prompt Style - Extreme Detailed">Prompt Style - Extreme Detailed</option>
                            <option value="Prompt Style - Simple">Prompt Style - Simple</option>
                            <option value="Prompt Style - Artistic">Prompt Style - Artistic</option>
                            <option value="Prompt Style - Technical">Prompt Style - Technical</option>
                        </select>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-[9px] font-bold text-gray-400 uppercase mb-1">随机种子</span>
                        <div class="flex items-center gap-2">
                            <input id="seedInput" type="number" min="0" max="999999999999999" class="w-32 bg-transparent outline-none border-b border-transparent focus:border-black text-xs font-bold">
                            <button onclick="randomizeSeed()" class="text-[10px] text-gray-400 hover:text-black">🎲</button>
                        </div>
                    </div>
                        </div>
                    </div>
                    <button id="mainGenBtn" onclick="handleRender()" class="w-full md:w-56 h-12 btn-render rounded-xl font-bold text-[11px] uppercase flex items-center justify-center gap-3" disabled>
                        <i data-lucide="zap" id="btnIcon" class="w-4 h-4 text-yellow-400"></i>
                        <span id="btnText">开始反推</span>
                    </button>
                    <div id="progressInline" class="progress-inline">
                        <div class="progress-bar-wrap">
                            <div class="progress-bar-track">
                                <div id="progressFill" class="progress-bar-fill"></div>
                            </div>
                            <span id="progressPercent" class="progress-bar-percent">0%</span>
                        </div>
                        <div id="progressStatus" class="progress-bar-status">准备中...</div>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <main class="pb-24">
        <div class="layout-container">
            <div class="flex items-center gap-6 mb-8">
                <h2 class="text-[11px] font-black uppercase tracking-[0.5em] text-gray-400">反推结果</h2>
                <div class="h-px flex-1 bg-black/5"></div>
            </div>
            <div id="outputArea" class="output-box mb-12 hidden">
                <div class="flex items-center gap-2 mb-4">
                    <i data-lucide="file-text" class="w-4 h-4 text-gray-400"></i>
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Generated Text</span>
                    <button onclick="copyOutput()" class="ml-auto text-[10px] text-gray-400 hover:text-black font-bold uppercase tracking-wider flex items-center gap-1">
                        <i data-lucide="copy" class="w-3 h-3"></i>复制
                    </button>
                </div>
                <pre id="outputText" class="text-sm leading-relaxed whitespace-pre-wrap font-mono text-gray-700 max-h-[600px] overflow-y-auto"></pre>
            </div>
            <div id="historyArea">
                <div class="flex items-center justify-between mb-4 gap-2">
                    <div class="flex items-center gap-6">
                        <h2 class="text-[11px] font-black uppercase tracking-[0.5em] text-gray-400">历史记录</h2>
                        <div class="h-px flex-1 bg-black/5"></div>
                    </div>
                <div id="masonry" class="masonry-grid"></div>
            </div>
        </div>
    </main>
    <script>
        lucide.createIcons();

        // 服务器地址解析、请求封装、进度条、任务提交统一由 comfy-tool-runtime.js 提供
        const tool = ComfyTool.create({
            keepAlive: true,
            // 节点中文名来自工作流 _meta.title，延迟取值以避开 WORKFLOW_CONFIG 的声明顺序
            nodeTitles: (id) => WORKFLOW_CONFIG.workflow?.[id]?._meta?.title || ''
        });
        const CLIENT_ID = tool.clientId;

        const WORKFLOW_CONFIG = {
            name: "图像反推",
            type: "promptgen",
            workflow: {
                "3": {
                    "inputs": {
                        "preset_prompt": "Prompt Style - Extreme Detailed",
                        "custom_prompt": "使用中文描述这张图片",
                        "system_prompt": "",
                        "inference_mode": "one by one",
                        "max_frames": 24,
                        "max_size": 256,
                        "seed": 874233121890205,
                        "force_offload": false,
                        "save_states": false,
                        "llama_model": ["13", 0],
                        "parameters": ["5", 0],
                        "images": ["6", 0]
                    },
                    "class_type": "llama_cpp_instruct_adv",
                    "_meta": { "title": "llama_cpp_指令（高级）" }
                },
                "5": {
                    "inputs": {
                        "max_tokens": 1024,
                        "top_k": 30,
                        "top_p": 0.9,
                        "min_p": 0.05,
                        "typical_p": 1,
                        "temperature": 0.8,
                        "repeat_penalty": 1,
                        "frequency_penalty": 0,
                        "present_penalty": 1,
                        "mirostat_mode": 0,
                        "mirostat_eta": 0.1,
                        "mirostat_tau": 5,
                        "state_uid": -1
                    },
                    "class_type": "llama_cpp_parameters",
                    "_meta": { "title": "llama_cpp_参数" }
                },
                "6": {
                    "inputs": {
                        "image": "uploaded_image.png"
                    },
                    "class_type": "LoadImage",
                    "_meta": { "title": "加载图像" }
                },
                "13": {
                    "inputs": {
                        "model": "Qwen3.5-9B-Uncensored-HauhauCS-Aggressive-Q8_0.gguf",
                        "mmproj": "mmproj-Qwen3.5-9B-Uncensored-HauhauCS-Aggressive-BF16.gguf",
                        "chat_handler": "Qwen3.5",
                        "n_ctx": 8192,
                        "vram_limit": -1,
                        "image_min_tokens": 0,
                        "image_max_tokens": 0,
                        "load_mtp": false
                    },
                    "class_type": "llama_cpp_model_loader",
                    "_meta": { "title": "Llama-Cpp 模型加载器" }
                },
                "15": {
                    "inputs": {
                        "text_undefined": "",
                        "text": ["3", 0]
                    },
                    "class_type": "ShowText|pysssss",
                    "_meta": { "title": "展示文本🐍" }
                }
            },
            nodeMappings: {
                "6": { param: "image", label: "输入图像", type: "upload" },
                "3": { params: ["preset_prompt", "custom_prompt", "seed"], label: "提示词配置", type: "config" },
                "15": { param: "text_undefined", label: "输出文本", type: "output" }
            },
            apiEndpoint: "/api/generate"
        };


        /** 保存到用户 output 文件夹 */
        // 图片归档复用 comfyui-utils.js 的 saveToUserOutput。

        async function loadConfig() { await tool.loadConfig(); }

        const apiFetch = (url, options) => tool.apiFetch(url, options);

        async function checkServerConnection() { await tool.checkConnection(); }

        // 统一缩略图模块配置（一处改全处同步）
        window.GALLERY_CONFIG = {
            type: 'promptgen',
            container: '#masonry',
            trigger: '#loadMoreTrigger',
            pageSize: 15,
            batchSelectBtn: '#batchSelectBtn',
            deleteSelectedBtn: '#deleteSelectedBtn',
            selectedCount: '#selectedCount',
            features: {
                delete: true,
                openFolder: true,
                download: true,
                copyToCanvas: true,
                regenerate: true,
                batchSelect: true,
                contextMenu: true,
                imageFallback: true,
                modelBadge: 'auto'
            }
        };
        GalleryDisplay.init({
            historyType: 'promptgen',
            masonrySelector: '#masonry',
            loadMoreSelector: '#loadMoreTrigger',
            favoritesEnabled: true,
        });
        let uploadedImageName = null;

        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const promptInput = document.getElementById('prompt');
        const presetSelect = document.getElementById('presetSelect');
        const seedInput = document.getElementById('seedInput');
        const mainGenBtn = document.getElementById('mainGenBtn');
        const btnText = document.getElementById('btnText');
        const statusText = document.getElementById('statusText');
        const dotColor = document.getElementById('dotColor');

        // 从 workflow["3"] 节点初始化表单默认值
        function initFormFromWorkflow() {
            const node3 = WORKFLOW_CONFIG.workflow["3"].inputs;

            // 初始化预设提示词
            if (node3.preset_prompt) {
                presetSelect.value = node3.preset_prompt;
            }

            // 初始化自定义提示词
            if (node3.custom_prompt) {
                promptInput.value = node3.custom_prompt;
            }

            // 初始化种子
            if (node3.seed !== undefined) {
                seedInput.value = node3.seed;
            }
        }

        // 同步表单更改到 workflow 节点参数
        function syncFormToWorkflow() {
            const node3 = WORKFLOW_CONFIG.workflow["3"].inputs;
            node3.preset_prompt = presetSelect.value;
            node3.custom_prompt = promptInput.value.trim();
            node3.seed = parseInt(seedInput.value) || 0;
        }

        uploadZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => { if (e.target.files[0]) handleFile(e.target.files[0]); };

        uploadZone.ondragover = (e) => { e.preventDefault(); uploadZone.classList.add('dragover'); };
        uploadZone.ondragleave = () => uploadZone.classList.remove('dragover');
        uploadZone.ondrop = (e) => { e.preventDefault(); uploadZone.classList.remove('dragover'); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); };

        document.addEventListener('paste', (e) => {
            const items = e.clipboardData?.items;
            if (!items) return;
            for (const item of items) {
                if (item.type.startsWith('image/')) {
                    const file = item.getAsFile();
                    if (file) handleFile(file);
                    break;
                }
            }
        });

        async function handleFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.classList.add('active');
                uploadZone.querySelector('.text-2xl').style.display = 'none';
                uploadZone.querySelector('.text-\\[11px\\]').style.display = 'none';
            };
            reader.readAsDataURL(file);

            const formData = new FormData();
            formData.append('files', file);
            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await res.json();
                uploadedImageName = data.files[0].comfy_name;
                mainGenBtn.disabled = false;
            } catch (err) { console.error("Upload error", err); }
        }

        function randomizeSeed() {
            seedInput.value = Math.floor(Math.random() * 999999999999999);
        }

        function setLoading(loading) {
            mainGenBtn.disabled = loading;
            btnText.textContent = loading ? "处理中..." : "开始反推";
            statusText.textContent = loading ? "Processing..." : "System Ready";
            dotColor.style.backgroundColor = loading ? '#06b6d4' : 'var(--text)';
        }

        let isGenerating = false;
        let currentPromptId = null;

        // 进度条绘制统一由共享运行时负责（多页同一套 DOM 契约）
        function startProgress(text) { tool.startProgress(text); }
        // 常驻 WS 会收到别的任务的消息，非生成期间必须忽略
        function updateRealProgress(msg) { if (!isGenerating) return; tool.updateProgress(msg); }
        function completeProgress() { tool.completeProgress(); }
        function hideProgress() { tool.hideProgress(); currentPromptId = null; }

        function showOutput(text) {
            const outputArea = document.getElementById('outputArea');
            const outputText = document.getElementById('outputText');
            outputText.textContent = text;
            outputArea.classList.remove('hidden');
            lucide.createIcons();
        }

        function addHistoryItem(data) {
            // 文字历史容器已随改版移除（历史统一由画廊模块展示），这里判空跳过，
            // 否则每次反推都会在渲染阶段抛 Cannot read properties of null
            const list = document.getElementById('historyList');
            if (!list) return;
            const existing = document.getElementById(`history-${data.timestamp}`);
            if (existing) return;

            const item = document.createElement('div');
            item.id = `history-${data.timestamp}`;
            item.className = 'console-card rounded-2xl p-6';
            const time = new Date(data.timestamp * 1000).toLocaleString('zh-CN');

            // Handle both old format (image_url) and new format (images array)
            const imageUrl = data.image_url || (data.images && data.images[0]) || '';
            const outputText = data.text || '无文本输出';
            const preset = data.preset || '';
            const customPrompt = data.custom_prompt || '';

            item.innerHTML = `
                <div class="flex items-start gap-4">
                    ${imageUrl ? `<img src="${imageUrl}" class="w-20 h-20 rounded-xl object-cover flex-shrink-0" onerror="this.style.display='none'">` : ''}
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-2 flex-wrap">
                            ${preset ? `<span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">${preset}</span>` : ''}
                            ${customPrompt ? `<span class="text-[10px] font-bold text-gray-500">${customPrompt}</span>` : ''}
                            <span class="text-[10px] font-bold text-gray-300">${time}</span>
                        </div>
                        <pre class="text-xs leading-relaxed whitespace-pre-wrap font-mono text-gray-700 max-h-40 overflow-y-auto">${outputText}</pre>
                        <div class="flex items-center gap-2 mt-3">
                            <button onclick="copyHistoryText(this)" class="text-[10px] text-gray-400 hover:text-black font-bold uppercase tracking-wider flex items-center gap-1">
                                <i data-lucide="copy" class="w-3 h-3"></i>复制
                            </button>
                            <button onclick="deleteHistoryItem(this, ${data.timestamp})" class="text-[10px] text-red-400 hover:text-red-600 font-bold uppercase tracking-wider flex items-center gap-1 ml-auto">
                                <i data-lucide="trash-2" class="w-3 h-3"></i>删除
                            </button>
                        </div>
                    </div>
                </div>
            `;
            list.prepend(item);
            lucide.createIcons();
        }

        function copyHistoryText(btn) {
            const pre = btn.closest('.flex-1').querySelector('pre');
            navigator.clipboard.writeText(pre.textContent);
            const original = btn.innerHTML;
            btn.innerHTML = '<i data-lucide="check" class="w-3 h-3"></i>已复制';
            lucide.createIcons();
            setTimeout(() => { btn.innerHTML = original; lucide.createIcons(); }, 1500);
        }

        function copyOutput() {
            const text = document.getElementById('outputText').textContent;
            navigator.clipboard.writeText(text);
            const btn = document.querySelector('[onclick="copyOutput()"]');
            const original = btn.innerHTML;
            btn.innerHTML = '<i data-lucide="check" class="w-3 h-3"></i>已复制';
            lucide.createIcons();
            setTimeout(() => { btn.innerHTML = original; lucide.createIcons(); }, 1500);
        }
        async function handleRender() {
            if (!uploadedImageName) return alert("请先上传图像");

            isGenerating = true;
            setLoading(true);
            startProgress();

            syncFormToWorkflow();

            const workflowData = JSON.parse(JSON.stringify(WORKFLOW_CONFIG.workflow));
            // 上传后的文件名必须写进工作流，否则 LoadImage 一直指向占位名 → 提交即校验失败
            workflowData["6"]["inputs"]["image"] = uploadedImageName;
            const customPrompt = WORKFLOW_CONFIG.workflow["3"]["inputs"]["custom_prompt"];
            const preset = WORKFLOW_CONFIG.workflow["3"]["inputs"]["preset_prompt"];
            const seed = WORKFLOW_CONFIG.workflow["3"]["inputs"]["seed"];

            let ok = false;
            try {
                // 提交与等结果交给共享运行时：完成判定用 history 轮询，
                // 不再依赖单次 WebSocket 事件（消息一旦丢失就会永久挂起）
                const result = await tool.submit(workflowData, { onProgress: updateRealProgress });
                currentPromptId = result.promptId;
                ok = await getResult(currentPromptId, customPrompt, preset);
            } catch (e) {
                alert(`错误: ${e.message}`);
                setStatus("错误", "#ef4444");
            } finally {
                isGenerating = false;
                // 失败时不再显示「生成完成」，直接收起进度条
                if (ok) { completeProgress(); setTimeout(() => hideProgress(), 800); }
                else { hideProgress(); }
                setLoading(false);
            }
        }

        async function getResult(promptId, customPrompt, preset) {
            try {
                // historyEntry 自带错误状态判断；返回 null 表示记录还没写进 history，隔 1s 重试
                let entry = null;
                for (let i = 0; i < 5; i++) {
                    entry = await tool.historyEntry(promptId);
                    if (entry) break;
                    await new Promise(r => setTimeout(r, 1000));
                }
                if (!entry) throw new Error('未找到生成结果');
                const outputs = entry.outputs || {};
                let outputText = null;
                let imageUrl = null;
                for (const nodeId in outputs) {
                    const nodeOutput = outputs[nodeId];
                    if (nodeOutput.text || nodeOutput.string) {
                        outputText = nodeOutput.text || nodeOutput.string || [];
                        if (Array.isArray(outputText)) outputText = outputText.join('\n');
                        break;
                    }
                    if (nodeOutput.images && nodeOutput.images.length > 0) {
                        const image = nodeOutput.images[0];
                        imageUrl = `/api/comfyui/view?filename=${encodeURIComponent(image.filename)}&subfolder=${encodeURIComponent(image.subfolder || '')}&type=${encodeURIComponent(image.type || 'output')}`;
                    }
                }
                if (outputText) {
                    if (imageUrl) imageUrl = await saveToUserOutput(imageUrl, '图像反推');
                    showOutput(outputText);
                    const timestamp = Date.now() / 1000;
                    const record = {
                        timestamp,
                        text: outputText,
                        preset: preset,
                        custom_prompt: customPrompt,
                        image_url: imageUrl || '',
                        type: 'promptgen'
                    };
                    addHistoryItem(record);
                    // 若附带图片，同步推送到 Gallery 公共模块顶部
                    if (imageUrl && window.GalleryList && typeof GalleryList.pushNewImage === 'function') {
                        GalleryList.pushNewImage(Object.assign({}, record, { images: [imageUrl] }));
                    }

                    await fetch('/api/history/save', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            prompt: customPrompt || preset,
                            images: imageUrl ? [imageUrl] : [],
                            text: outputText,
                            type: 'promptgen',
                            timestamp: Date.now(),
                            params: { preset, custom_prompt: customPrompt }
                        })
                    });

                    setStatus("完成", "#10b981");
                } else { throw new Error('未找到生成结果'); }
                return true;
            } catch (e) {
                alert('获取结果失败: ' + e.message);
                setStatus("错误", "#ef4444");
                return false;
            }
        }

        function setStatus(text, color) {
            statusText.textContent = text;
            dotColor.style.backgroundColor = color;
        }

        // 监听表单变化，实时同步到 workflow
        function setupFormSync() {
            presetSelect.addEventListener('change', syncFormToWorkflow);
            promptInput.addEventListener('input', syncFormToWorkflow);
            seedInput.addEventListener('change', syncFormToWorkflow);
        }

        window.onload = async () => {
            await loadConfig();
            checkServerConnection();
            setInterval(checkServerConnection, 5000);
            initFormFromWorkflow();
            setupFormSync();
            GalleryList.load(0); 
            window.HistoryBulkManager?.attach({masonry:'#masonry'});
            lucide.createIcons(); 
        };
    </script>
</body>
</html>
