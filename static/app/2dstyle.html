        .btn-render:disabled { background: #cccccc; cursor: not-allowed; }
        input::-webkit-inner-spin-button { display: none; }
        .form-select {
            background: var(--ui-soft);
            border: 1px solid var(--ui-line);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--ui-text);

            width: 100%;
            cursor: pointer;

        .theme-dark .form-select { background: #20201e; border-color: rgba(0, 240, 255, 0.15); color: #e3e1d9; }
        .form-select:focus { border-color: #06b6d4; box-shadow: 0 0 0 2px rgba(0, 240, 255, 0.15); }
        .btn-2d-glow {
            background: linear-gradient(135deg, #06b6d4, #06b6d4);
            color: #fbfaf9;
            border: none;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.3), 0 0 30px rgba(6, 182, 212, 0.15);
            transition: all 0.3s ease;
        }
        .btn-2d-glow:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.5), 0 0 40px rgba(6, 182, 212, 0.3);
        }
        .btn-2d-glow:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .progress-inline {

            border-radius: 14px;
            border: 1px solid rgba(6, 182, 212, 0.15);
        }
        .progress-inline.active { display: block; }
        .theme-dark .progress-inline {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.1), rgba(6, 182, 212, 0.06));
            border-color: rgba(6, 182, 212, 0.2);
        }

  .btn-remove-glow, .btn-glow { width: 100% !important; }

}

<body class="antialiased">
    <header class="pt-20 pb-12">
        <div class="layout-container">
            <div class="console-card rounded-3xl p-1.5">
                <div class="bg-gray-50/50 rounded-[22px] p-8">
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-[16px] font-bold text-gray-400 uppercase tracking-widest">2D风格细化</span>
                        <div id="statusDot" class="flex items-center gap-2">
                            <span id="statusText" class="text-[16px] font-bold text-gray-500 uppercase">System Ready</span>
                            <div id="dotColor" class="w-1.5 h-1.5 bg-black rounded-full"></div>
                        </div>
                    </div>
                    <textarea id="prompt" rows="2" class="w-full bg-transparent text-2xl font-medium outline-none placeholder:text-gray-200 text-black resize-none leading-relaxed" placeholder="无需输入提示词即可运行，有特定需求输入即可"></textarea>
                </div>
                <div class="flex flex-col md:flex-row items-center justify-between p-4 px-6 gap-6">
                    <div class="flex items-center gap-8 flex-wrap">
                        <div class="flex flex-col">
                            <span class="text-[16px] font-bold text-gray-400 uppercase mb-1">上传图像</span>
                            <div class="upload-zone" id="uploadZone">
                                <div class="text-3xl mb-2">📷</div>
                                <div class="text-[11px] font-bold text-gray-400 uppercase">点击、拖拽或 Ctrl+V 上传</div>
                                <input type="file" id="fileInput" accept="image/*" style="display: none;">
                                <img class="preview-image" id="preview" alt="图像预览">
                            </div>
                        </div>
                        <div class="h-8 w-px bg-gray-100"></div>
                        <div class="flex flex-col gap-2">
                            <div class="flex flex-col">
                                <span class="text-[16px] font-bold text-gray-400 uppercase mb-1">目标尺寸</span>
                                <input id="sizeInput" type="number" value="1536" min="512" max="4096" step="64" class="w-20 bg-transparent outline-none border-b border-transparent focus:border-black text-xs font-bold">
                            </div>
                            <div class="flex flex-col">
                                <span class="text-[16px] font-bold text-gray-400 uppercase mb-1">随机种子</span>
                                <div class="flex items-center gap-2">
                                    <input id="seedInput" type="number" value="313602191412550" min="0" max="999999999999999" class="w-24 bg-transparent outline-none border-b border-transparent focus:border-black text-xs font-bold">
                                    <button onclick="randomizeSeed()" class="text-[10px] text-gray-400 hover:text-black">🎲</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button id="mainGenBtn" onclick="handleRender()" class="w-full md:w-56 h-12 btn-2d-glow rounded-xl font-bold text-[13px] flex items-center justify-center" disabled>
                        <span id="btnText">2D风格细化</span>
                    </button>
                    <div id="progressInline" class="progress-inline">
                        <div class="progress-bar-wrap">
                            <div class="progress-bar-track">
                                <div id="progressFill" class="progress-bar-fill"></div>
                            </div>
                            <span id="progressPercent" class="progress-bar-percent">0%</span>
                        </div>
                        <div id="progressStatus" class="progress-bar-status">准备中...</div>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <main class="pb-24">
        <div class="layout-container">
            <div id="masonry" class="masonry-grid"></div>
            <div id="loadMoreTrigger" class="py-12 text-center text-gray-300 text-[10px] font-bold uppercase tracking-widest cursor-pointer hidden">Load More Archive</div>
        </div>
    </main>
    <script>
        lucide.createIcons();

        const _isLocalAccess = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost';
        let COMFYUI_SERVER = 'http://127.0.0.1:8188';
        let IS_LOCAL_SERVER = _isLocalAccess;

        const WORKFLOW_CONFIG = {
            name: "2D风格细化",
            type: "2dstyle",
            workflow: {
                "76": { "inputs": { "image": "uploaded_image.png" }, "class_type": "LoadImage", "_meta": { "title": "加载图像" } },
                "122": { "inputs": { "sampler_name": "euler" }, "class_type": "KSamplerSelect", "_meta": { "title": "K采样器选择" } },
                "123": { "inputs": { "noise": ["125", 0], "guider": ["137", 0], "sampler": ["122", 0], "sigmas": ["146", 0], "latent_image": ["148", 0] }, "class_type": "SamplerCustomAdvanced", "_meta": { "title": "自定义采样器(高级)" } },
                "124": { "inputs": { "samples": ["123", 0], "vae": ["127", 0] }, "class_type": "VAEDecode", "_meta": { "title": "VAE解码" } },
                "125": { "inputs": { "noise_seed": 313602191412550 }, "class_type": "RandomNoise", "_meta": { "title": "随机噪波" } },
                "126": { "inputs": { "unet_name": "Flux2-Klein-9B-True-v2-fp8mixed.safetensors", "weight_dtype": "default" }, "class_type": "UNETLoader", "_meta": { "title": "UNET加载器" } },
                "127": { "inputs": { "vae_name": "flux2-vae.safetensors" }, "class_type": "VAELoader", "_meta": { "title": "加载VAE" } },
                "133": { "inputs": { "clip_name": "qwen_3_8b_fp8mixed.safetensors", "type": "flux2", "device": "default" }, "class_type": "CLIPLoader", "_meta": { "title": "加载CLIP" } },
                "135": { "inputs": { "text": "把图像改成xy风格，最佳画质", "嵌入提示词": null, "clip": ["133", 0] }, "class_type": "CLIPTextEncode", "_meta": { "title": "CLIP Text Encode (Positive Prompt)" } },
                "136": { "inputs": { "text": "", "嵌入提示词": null, "clip": ["133", 0] }, "class_type": "CLIPTextEncode", "_meta": { "title": "CLIP Text Encode ( Negative Prompt)" } },
                "137": { "inputs": { "cfg": 1, "model": ["126", 0], "positive": ["141", 0], "negative": ["139", 0] }, "class_type": "CFGGuider", "_meta": { "title": "CFG引导" } },
                "139": { "inputs": { "conditioning": ["136", 0], "latent": ["140", 0] }, "class_type": "ReferenceLatent", "_meta": { "title": "参考Latent" } },
                "140": { "inputs": { "pixels": ["173", 0], "vae": ["127", 0] }, "class_type": "VAEEncode", "_meta": { "title": "VAE编码" } },
                "141": { "inputs": { "conditioning": ["135", 0], "latent": ["140", 0] }, "class_type": "ReferenceLatent", "_meta": { "title": "参考Latent" } },
                "146": { "inputs": { "steps": 6, "width": ["147", 0], "height": ["147", 1] }, "class_type": "Flux2Scheduler", "_meta": { "title": "Flux2代 调度器" } },
                "147": { "inputs": { "image": ["173", 0] }, "class_type": "easy imageSize", "_meta": { "title": "图像尺寸" } },
                "148": { "inputs": { "width": ["147", 0], "height": ["147", 1], "batch_size": 1 }, "class_type": "EmptyFlux2LatentImage", "_meta": { "title": "Flux2代 空Latent" } },
                "173": { "inputs": { "target_size": ["183", 0], "resolution_multiple": 32, "upscale_method": "lanczos", "resize_and_pad": true, "input_image": ["76", 0] }, "class_type": "DINKI_Resize_And_Pad", "_meta": { "title": "调整大小并填充" } },
                "174": { "inputs": { "remove_pad": true, "latent_scale": 0, "input_image": ["124", 0], "pad_info": ["173", 1] }, "class_type": "DINKI_Remove_Pad_From_Image", "_meta": { "title": "移除图像填充" } },
                "183": { "inputs": { "value": 1536 }, "class_type": "PrimitiveInt", "_meta": { "title": "整数" } },
                "185": { "inputs": { "filename_prefix": "comfyui", "images": ["174", 0] }, "class_type": "SaveImage", "_meta": { "title": "保存图像" } }
            },
            nodeMappings: {
                "76": { param: "image", label: "输入图像", type: "upload" },
                "183": { param: "value", label: "目标尺寸", type: "number" },
                "125": { param: "noise_seed", label: "随机种子", type: "number" }
            },
            apiEndpoint: "/api/generate"
        };


        /** 保存到用户 output 文件夹 */
        // 图片归档复用 comfyui-utils.js 的 saveToUserOutput。
        function generateUUID() {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) { try { return crypto.randomUUID(); } catch (e) { } }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        const CLIENT_ID = localStorage.getItem("client_id") || generateUUID();
        localStorage.setItem("client_id", CLIENT_ID);

        async function loadConfig() {
            const localConfig = localStorage.getItem('comfyui_config');
            if (localConfig) {
                try {
                    const config = JSON.parse(localConfig);
                    const activeServer = config.active_server || '本地服务器';
                    IS_LOCAL_SERVER = (activeServer === '本地服务器');
                    if (activeServer === '云端服务器' && config.cloud_address) {
                        COMFYUI_SERVER = (config.cloud_address.startsWith('http') ? config.cloud_address : `https://${config.cloud_address}`).replace(/\/+$/, '');
                    } else if (config.local_address) {
                        COMFYUI_SERVER = (config.local_address.startsWith('http') ? config.local_address : `http://${config.local_address}`).replace(/\/+$/, '');
                    }
                    return;
                } catch (e) {
                    console.error('解析本地配置失败:', e);
                }
            }
        }
        // 统一缩略图模块配置（一处改全处同步）
        window.GALLERY_CONFIG = {
            type: '2dstyle',
            container: '#masonry',
            trigger: '#loadMoreTrigger',
            pageSize: 15,
            batchSelectBtn: '#batchSelectBtn',
            deleteSelectedBtn: '#deleteSelectedBtn',
            selectedCount: '#selectedCount',
            features: {
                delete: true,
                openFolder: true,
                download: true,
                copyToCanvas: true,
                regenerate: true,
                batchSelect: true,
                contextMenu: true,
                imageFallback: true,
                modelBadge: 'auto'
            }
        };
        GalleryDisplay.init({
            historyType: '2dstyle',
            masonrySelector: '#masonry',
            loadMoreSelector: '#loadMoreTrigger',
            favoritesEnabled: true,
        });
        let uploadedImageName = null;
        let currentPromptId = null;
        let isGenerating = false;
        let comfyWs = null;

        const backendSocket = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}/ws/stats?client_id=${CLIENT_ID}`);
        backendSocket.onmessage = (e) => {
            try {
                const msg = JSON.parse(e.data);
                if (msg.type === 'new_image' && msg.data?.type === '2dstyle') {
                        GalleryList.pushNewImage(msg.data);
                    }
            } catch (err) { }
        };

        async function apiFetch(url, options = {}) {
            if (IS_LOCAL_SERVER) {
                const directUrl = COMFYUI_SERVER + url;
                const response = await fetch(directUrl, options);
                return response;
            }
            const headers = {
                'X-ComfyUI-Server-Url': COMFYUI_SERVER,
                ...(options.headers || {})
            };
            const response = await fetch(url, { ...options, headers });
            return response;
        }

        function buildWsUrl() {
            // 始终通过后端代理连接 ComfyUI WebSocket，避免直连端口问题
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            return `${protocol}//${window.location.host}/api/comfyui/ws?client_id=${CLIENT_ID}`;
        }

        function connectComfyUIWebSocket() {
            const wsUrl = buildWsUrl();
            try {
                comfyWs = new WebSocket(wsUrl);
                comfyWs.onopen = () => {
                    console.log('[ComfyUI WS] 已连接');
                };
                comfyWs.onmessage = (event) => {
                    try {
                        if (typeof event.data !== 'string') return;
                        const message = JSON.parse(event.data);
                        if (message.type === 'progress' && isGenerating) {
                            const data = message.data;
                            updateRealProgress({
                                type: 'comfyui_progress',
                                status: 'sampling',
                                value: data.value || 0,
                                max: data.max || 1,
                                node: data.node || ''
                            });
                        } else if (message.type === 'executing' && isGenerating) {
                            const data = message.data;
                            if (data.node === null) {
                                updateRealProgress({
                                    type: 'comfyui_progress',
                                    status: 'done',
                                    value: 1,
                                    max: 1,
                                    node: ''
                                });
                            } else {
                                updateRealProgress({
                                    type: 'comfyui_progress',
                                    status: 'executing',
                                    value: 0,
                                    max: 1,
                                    node: data.node || ''
                                });
                            }
                        } else if (message.type === 'execution_start' && isGenerating) {
                            updateRealProgress({
                                type: 'comfyui_progress',
                                status: 'started',
                                value: 0,
                                max: 1,
                                node: ''
                            });
                        } else if (message.type === 'execution_cached' && isGenerating) {
                            updateRealProgress({
                                type: 'comfyui_progress',
                                status: 'cached',
                                value: 0,
                                max: 1,
                                node: 'cached'
                            });
                        }
                    } catch (err) { }
                };
                comfyWs.onerror = (err) => {
                    console.log('[ComfyUI WS] 连接错误:', err);
                };
            } catch (err) {
                console.log('[ComfyUI WS] 创建失败:', err);
            }
        }

        connectComfyUIWebSocket();

        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const promptInput = document.getElementById('prompt');
        const sizeInput = document.getElementById('sizeInput');
        const seedInput = document.getElementById('seedInput');
        const mainGenBtn = document.getElementById('mainGenBtn');

        UploadZone.bind(uploadZone, fileInput, handleFileUpload);

        async function handleFileUpload(file) {
            if (!file.type.startsWith('image/')) return alert('请上传图片文件');
            const reader = new FileReader();
            reader.onload = (e) => { preview.src = e.target.result; preview.classList.add('active'); };
            reader.readAsDataURL(file);
            const formData = new FormData();
            formData.append('files', file);
            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.files?.length > 0) {
                    uploadedImageName = data.files[0].comfy_name;
                    updateGenButtonState();
                    setStatus('Image uploaded');
                }
            } catch (e) { alert('上传失败'); }
        }

        function updateGenButtonState() {
            mainGenBtn.disabled = !uploadedImageName;
        }
        function randomizeSeed() { seedInput.value = Math.floor(Math.random() * 1000000000000000); }
        function setStatus(text) {
            document.getElementById("statusText").innerText = text;
            document.getElementById("dotColor").className = "w-1.5 h-1.5 bg-black rounded-full";
        }

        async function checkServerConnection() {
            try {
                const statsUrl = IS_LOCAL_SERVER ? '/system_stats' : '/api/comfyui/system_stats';
                const response = await apiFetch(statsUrl);
                if (response.ok) {
                    document.getElementById("statusText").innerText = "System Ready";
                    document.getElementById("dotColor").className = "w-1.5 h-1.5 bg-green-500 rounded-full";
                } else {
                    throw new Error('Server not responding');
                }
            } catch (e) {
                document.getElementById("statusText").innerText = "System Offline";
                document.getElementById("dotColor").className = "w-1.5 h-1.5 bg-red-500 rounded-full";
            }
        }

        async function handleRender() {
            if (!uploadedImageName) return alert("请先上传图像");
            isGenerating = true;
            startProgress();
            setLoading(true);
            const placeholder = createPlaceholder("2D 风格细化");
            document.getElementById('masonry').prepend(placeholder);
            try {
                const workflowData = JSON.parse(JSON.stringify(WORKFLOW_CONFIG.workflow));
                const promptText = promptInput.value.trim() || "把图像改成xy风格，最佳画质";
                const seed = parseInt(seedInput.value) || 313602191412550;
                const size = parseInt(sizeInput.value) || 1536;

                workflowData["76"]["inputs"]["image"] = uploadedImageName;
                workflowData["135"]["inputs"]["text"] = promptText;
                workflowData["125"]["inputs"]["noise_seed"] = seed;
                workflowData["183"]["inputs"]["value"] = size;

                currentPromptId = generateUUID();

                const wsUrl = `ws://127.0.0.1:8188/ws?clientId=${CLIENT_ID}`;

                const ws = await new Promise((resolve, reject) => {
                    const socket = new WebSocket(wsUrl);
                    socket.onopen = () => {
                        console.log('[ComfyUI WS] 连接成功');
                        resolve(socket);
                    };
                    socket.onerror = (e) => {
                        console.error('[ComfyUI WS] 连接失败:', e);
                        reject(new Error('WebSocket 连接失败'));
                    };
                    setTimeout(() => reject(new Error('WebSocket 连接超时')), 5000);
                });

                await new Promise((resolve, reject) => {
                    ws.onmessage = (event) => {
                        try {
                            if (typeof event.data !== 'string') return;
                            const message = JSON.parse(event.data);
                            if (message.type === 'execution_start') {
                                updateRealProgress({
                                    type: 'comfyui_progress',
                                    status: 'started',
                                    value: 0,
                                    max: 1,
                                    node: ''
                                });
                            } else if (message.type === 'progress') {
                                const data = message.data;
                                if (data.prompt_id === currentPromptId) {
                                    updateRealProgress({
                                        type: 'comfyui_progress',
                                        status: 'sampling',
                                        value: data.value || 0,
                                        max: data.max || 1,
                                        node: data.node || ''
                                    });
                                }
                            } else if (message.type === 'executing') {
                                const data = message.data;
                                if (data.prompt_id === currentPromptId) {
                                    if (data.node === null) {
                                        updateRealProgress({
                                            type: 'comfyui_progress',
                                            status: 'done',
                                            value: 1,
                                            max: 1,
                                            node: ''
                                        });
                                        setTimeout(() => {
                                            ws.close();
                                            resolve(getResult(currentPromptId));
                                        }, 500);
                                    } else {
                                        updateRealProgress({
                                            type: 'comfyui_progress',
                                            status: 'executing',
                                            value: 0,
                                            max: 1,
                                            node: data.node || ''
                                        });
                                    }
                                }
                            } else if (message.type === 'execution_cached') {
                                updateRealProgress({
                                    type: 'comfyui_progress',
                                    status: 'cached',
                                    value: 0,
                                    max: 1,
                                    node: 'cached'
                                });
                            } else if (message.type === 'execution_error') {
                                const data = message.data;
                                ws.close();
                                throw new Error(data.exception_message || '执行错误');
                            }
                        } catch (e) {
                            reject(e);
                        }
                    };

                    fetch(`/api/comfyui/prompt`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            prompt: workflowData,
                            client_id: CLIENT_ID,
                            prompt_id: currentPromptId
                        })
                    }).then(async (response) => {
                        if (!response.ok) {
                            const errorText = await response.text();
                            reject(new Error(`HTTP ${response.status}: ${errorText}`));
                            return;
                        }
                        const result = await response.json();
                        console.log('工作流提交成功, prompt_id:', result.prompt_id);
                        currentPromptId = result.prompt_id;
                        document.getElementById('progressStatus').textContent = '任务已提交，等待执行...';
                    }).catch(reject);
                });
            } catch (e) {
                placeholder.remove();
                alert(e.message || "生成失败");
            } finally {
                isGenerating = false;
                completeProgress();
                setTimeout(() => hideProgress(), 800);
                setLoading(false);
            }
        }

        async function getResult(promptId) {
            const placeholder = document.querySelector('.masonry-item');
            try {
                const res = await fetch(`/api/comfyui/history/${promptId}`);
                if (!res.ok) throw new Error('获取历史记录失败');
                const history = await res.json();
                const promptData = history[promptId];
                if (!promptData) throw new Error('历史记录中未找到该任务');
                if (promptData.status && promptData.status.status_str === 'error') {
                    throw new Error('任务执行错误: ' + JSON.stringify(promptData.status.messages));
                }
                const outputs = promptData.outputs || {};
                let imageUrl = null;
                for (const nodeId in outputs) {
                    const nodeOutput = outputs[nodeId];
                    if (nodeOutput.images && nodeOutput.images.length > 0) {
                        const image = nodeOutput.images[0];
                        imageUrl = `/api/comfyui/view?filename=${encodeURIComponent(image.filename)}&subfolder=${encodeURIComponent(image.subfolder || '')}&type=${encodeURIComponent(image.type || 'output')}`;
                        break;
                    }
                }
                if (imageUrl) {
                    imageUrl = await saveToUserOutput(imageUrl, '2D风格');
                    const promptText = promptInput.value.trim() || "把图像改成xy风格，8k,最佳画质";
                    const timestamp = Date.now();
                    const record = { timestamp, prompt: promptText, images: [imageUrl], type: '2dstyle' };
                    GalleryList.pushNewImage(record);;
                                        await fetch('/api/history/save', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(record)
                    });
                    
                    if (placeholder) placeholder.remove();
                } else {
                    throw new Error('未找到生成结果');
                }
            } catch (e) {
                if (placeholder) placeholder.remove();
                alert('获取结果失败: ' + e.message);
            }
        }

        function setLoading(isLoading) {
            mainGenBtn.disabled = isLoading || !uploadedImageName;
            if (isLoading) {
                mainGenBtn.innerHTML = `<div class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div><span class="ml-2">处理中...</span>`;
            } else {
                mainGenBtn.innerHTML = `<span>2D风格细化</span>`;
            }
        }

        let progressTimer = null;

        function startProgress() {
            document.getElementById('progressInline').classList.add('active');
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('progressPercent').textContent = '0%';
            document.getElementById('progressStatus').textContent = '正在提交任务...';
        }

        function updateRealProgress(msg) {
            const el = document.getElementById('progressInline');
            if (!el.classList.contains('active')) el.classList.add('active');

            const fill = document.getElementById('progressFill');
            const percent = document.getElementById('progressPercent');
            const status = document.getElementById('progressStatus');

            if (msg.status === 'started') {
                fill.style.width = '2%';
                percent.textContent = '2%';
                status.textContent = 'ComfyUI 开始执行...';
            } else if (msg.status === 'executing') {
                fill.style.width = '5%';
                percent.textContent = '5%';
                status.textContent = `执行节点: ${msg.node || '...'}`;
            } else if (msg.status === 'cached') {
                status.textContent = '部分节点命中缓存';
            } else if (msg.status === 'sampling') {
                const value = msg.value || 0;
                const max = msg.max || 1;
                const basePct = Math.round((value / max) * 80);
                const finalPct = 10 + basePct;
                fill.style.width = `${finalPct}%`;
                percent.textContent = `${finalPct}%`;
                status.textContent = `采样中 ${value}/${max}`;
            } else if (msg.status === 'done') {
                fill.style.width = '95%';
                percent.textContent = '95%';
                status.textContent = '解码保存中...';
            }
        }

        function completeProgress() {
            document.getElementById('progressFill').style.width = '100%';
            document.getElementById('progressPercent').textContent = '100%';
            document.getElementById('progressStatus').textContent = '生成完成！';
        }

        function hideProgress() {
            document.getElementById('progressInline').classList.remove('active');
            currentPromptId = null;
        }

        function createPlaceholder(text) {
            const div = document.createElement('div');
            div.className = 'masonry-item bg-gray-50 flex flex-col items-center justify-center border-dashed border-2 border-gray-200';
            div.innerHTML = `<div class="w-6 h-6 border-2 border-gray-100 border-t-black rounded-full animate-spin mb-3"></div><span class="text-[8px] font-bold text-gray-400 uppercase tracking-tighter">${text}</span>`;
            return div;
        }
        async function loadModels() {
            updateGenButtonState();
        }

        window.onload = async () => {
            await loadConfig();
            checkServerConnection();
            setInterval(checkServerConnection, 5000);
            loadModels();
            GalleryList.load(0).then(() => {
                const trigger = document.getElementById('loadMoreTrigger');
                if (trigger) { trigger.onclick = () => GalleryList.load(1); }
                window.HistoryBulkManager?.attach({masonry:'#masonry'});
            });
            setInterval(async () => {
                try {
                    const res = await fetch("/api/queue_status?client_id=" + encodeURIComponent(CLIENT_ID));
                    const data = await res.json();
                    if (data.total > 0) {
                        document.getElementById("statusText").innerText = `Queueing ${data.position}/${data.total}`;
                        document.getElementById("dotColor").className = "w-1.5 h-1.5 bg-orange-500 rounded-full animate-pulse";
                    } else {
                        document.getElementById("statusText").innerText = "System Ready";
                        document.getElementById("dotColor").className = "w-1.5 h-1.5 bg-black rounded-full";
                    }
                } catch (e) { }
            }, 3000);
        };

    </script>
</body>
</html>
