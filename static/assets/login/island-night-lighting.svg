<svg xmlns="http://www.w3.org/2000/svg" width="2711" height="1546" viewBox="0 0 2711 1546" fill="none">
<!-- 与白天底图共用原始坐标；局部光源随 cover 裁切同步，不跟视口百分比漂移。 -->
<defs>
 <radialGradient id="moon"><stop stop-color="#badbff" stop-opacity=".22"/><stop offset="1" stop-color="#70aaff" stop-opacity="0"/></radialGradient>
 <radialGradient id="warm"><stop stop-color="#ffcf79" stop-opacity=".58"/><stop offset=".28" stop-color="#ffb84e" stop-opacity=".24"/><stop offset="1" stop-color="#ffae42" stop-opacity="0"/></radialGradient>
 <radialGradient id="water"><stop stop-color="#3aafff" stop-opacity=".28"/><stop offset=".65" stop-color="#258cff" stop-opacity=".13"/><stop offset="1" stop-color="#258cff" stop-opacity="0"/></radialGradient>
 <radialGradient id="gold"><stop stop-color="#ffe59c" stop-opacity=".85"/><stop offset=".18" stop-color="#ffcf66" stop-opacity=".38"/><stop offset="1" stop-color="#ffbd43" stop-opacity="0"/></radialGradient>
 <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
 <filter id="bloom" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2"/></filter>
</defs>
<!-- 冷色天光从右上进入，海面与瀑布保留蓝色反射。 -->
<ellipse cx="1960" cy="100" rx="1000" ry="670" fill="url(#moon)"/>
<ellipse cx="520" cy="1070" rx="550" ry="180" fill="url(#water)"/>
<ellipse cx="2330" cy="850" rx="430" ry="165" fill="url(#water)"/>
<ellipse cx="2425" cy="942" rx="175" ry="60" fill="url(#water)"/>
<path d="M2365 759 Q2404 779 2400 850 L2400 918 M2415 765 Q2450 790 2440 900" stroke="#7bdaff" stroke-opacity=".36" stroke-width="10" filter="url(#soft)"/>
<!-- 屋内灯光有高亮灯芯、门窗漫射和落在草地上的暖光。 -->
<ellipse cx="590" cy="858" rx="155" ry="130" fill="url(#warm)"/>
<ellipse cx="628" cy="903" rx="115" ry="43" fill="url(#warm)"/>
<path d="M531 824 L551 832 L551 855 L531 846Z" fill="#ffdb88"/>
<path d="M618 891 L618 846 Q629 830 640 838 L640 882Z" fill="#ffd185" fill-opacity=".78"/>
<path d="M531 824 L551 832 L551 855 L531 846Z M618 891 L618 846 Q629 830 640 838 L640 882Z" fill="#ffc266" filter="url(#soft)"/>
<ellipse cx="2345" cy="632" rx="145" ry="145" fill="url(#warm)"/>
<ellipse cx="2330" cy="673" rx="105" ry="38" fill="url(#warm)"/>
<path d="M2330 649 L2334 615 Q2344 594 2354 608 L2356 655Z" fill="#ffce7c" fill-opacity=".85"/>
<ellipse cx="2348" cy="563" rx="24" ry="30" fill="url(#gold)"/>
<!-- 星形小岛的暖光与稀疏星点，不给表单区域铺光斑。 -->
<ellipse cx="2212" cy="1154" rx="122" ry="110" fill="url(#gold)"/>
<ellipse cx="2212" cy="1235" rx="140" ry="38" fill="url(#warm)"/>
<g fill="#e3efff">
 <circle cx="360" cy="105" r="2"/><circle cx="865" cy="155" r="1.6"/>
 <circle cx="1120" cy="72" r="1.4"/><circle cx="1640" cy="105" r="2"/>
 <circle cx="1865" cy="218" r="1.6"/><circle cx="2290" cy="100" r="1.8"/>
 <circle cx="2500" cy="185" r="1.3"/><circle cx="455" cy="300" r="1.2"/>
 <circle cx="1015" cy="280" r="1.2"/><circle cx="1780" cy="335" r="1.3"/>
</g>
<g fill="#ffe5a1" filter="url(#bloom)"><circle cx="360" cy="105" r="3"/><circle cx="1640" cy="105" r="3"/><circle cx="2290" cy="100" r="2.5"/></g>
</svg>
