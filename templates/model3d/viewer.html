<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18222d;color:#d7e2ee;font:12px system-ui}canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.tools{position:absolute;bottom:10px;left:10px;right:10px;display:flex;gap:5px;align-items:center}button,select{border:1px solid #ffffff28;background:#1a2634dc;color:inherit;padding:6px 8px;border-radius:7px;font:inherit;cursor:pointer}select{max-width:150px}button:hover{background:#385069}#state{position:absolute;top:12px;left:12px;right:12px;pointer-events:none;color:#acbdce}#state.error{color:#ffb4aa}.tools .spacer{flex:1}
</style><canvas aria-label="3D 模型预览" tabindex="0"></canvas><div id="state" role="status">正在加载模型…</div>
<div class="tools"><button id="rotate" title="自动旋转" aria-pressed="true">↻</button><button id="reset" title="重置视角">⌂</button><select id="display" aria-label="显示方式"><option value="material">材质</option><option value="wire">线框</option><option value="solid">白模</option></select><span class="spacer"></span><select id="clip" aria-label="动画片段" hidden></select><button id="play" title="播放 / 暂停动画" aria-pressed="true" hidden>Ⅱ</button><button id="full" title="全屏预览">⛶</button></div>
<script>/*__ENGINE__*/</script><script>
(() => {
const state=document.getElementById('state');let renderer,model,mixer,active,raf,playing=true;
try {
 const T=window.THREE,canvas=document.querySelector('canvas');renderer=new T.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.setClearColor(0x18222d);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;
 const scene=new T.Scene(),camera=new T.PerspectiveCamera(40,1,.01,1000),controls=new GameOrbitControls(camera,canvas);controls.enableDamping=true;controls.autoRotate=true;controls.autoRotateSpeed=1.4;
 scene.add(new T.HemisphereLight(0xffffff,0x66788a,3));const key=new T.DirectionalLight(0xffffff,3);key.position.set(4,8,5);scene.add(key);
 const grid=new T.GridHelper(10,20,0x536576,0x2b3b4b);scene.add(grid);let distance=4,center=new T.Vector3(0,1,0);
 const reset=()=>{controls.target.copy(center);camera.position.copy(center).add(new T.Vector3(distance,.6*distance,distance));camera.near=distance/1000;camera.far=distance*100;camera.updateProjectionMatrix();controls.update();};reset();
 const clips=document.getElementById('clip'),play=document.getElementById('play');
 new GameGLTFLoader().load('data:model/gltf-binary;base64,__MODEL_BASE64__',gltf=>{
  model=gltf.scene;scene.add(model);const box=new T.Box3().setFromObject(model),size=box.getSize(new T.Vector3());center=box.getCenter(new T.Vector3());distance=Math.max(size.x,size.y,size.z,.01)*1.6;grid.position.y=box.min.y;grid.scale.setScalar(Math.max(size.x,size.z,.1)/5);reset();
  model.traverse(object=>{if(object.isMesh)object.userData.originalMaterial=object.material;});
  if(gltf.animations.length){mixer=new T.AnimationMixer(model);clips.hidden=false;play.hidden=false;gltf.animations.forEach((clip,index)=>{const option=document.createElement('option');option.value=index;option.textContent=clip.name||'动画 '+(index+1);clips.append(option);});
   const select=()=>{mixer.stopAllAction();active=mixer.clipAction(gltf.animations[Number(clips.value)]);active.play();active.paused=!playing;};clips.onchange=select;select();}
  state.textContent='拖动旋转 · 滚轮缩放 · 右键平移';
 },undefined,error=>{state.className='error';state.textContent='模型加载失败：'+(error.message||'GLB 内容或渲染格式不支持');});
 document.getElementById('rotate').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.currentTarget.setAttribute('aria-pressed',controls.autoRotate);};
 document.getElementById('reset').onclick=reset;
 addEventListener('message',event=>{
  if(event.source!==parent||event.data?.type!=='capture-model-reference')return;
  const requestId=event.data.requestId;
  if(!model){parent.postMessage({type:'model-reference',requestId,error:'模型尚未加载完成'},'*');return;}
  renderer.render(scene,camera);
  canvas.toBlob(blob=>parent.postMessage({type:'model-reference',requestId,blob},'*'),'image/png');
 });
 document.getElementById('display').onchange=e=>{if(!model)return;model.traverse(o=>{if(!o.isMesh)return;if(o.userData.previewMaterial){o.userData.previewMaterial.dispose();delete o.userData.previewMaterial;}if(e.target.value==='material')o.material=o.userData.originalMaterial;else{o.userData.previewMaterial=new T.MeshStandardMaterial({color:0xa9c2d8,wireframe:e.target.value==='wire',side:T.DoubleSide});o.material=o.userData.previewMaterial;}});};
 play.onclick=()=>{playing=!playing;if(active)active.paused=!playing;play.textContent=playing?'Ⅱ':'▶';play.setAttribute('aria-pressed',playing);};
 document.getElementById('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{state.textContent='当前环境不支持全屏，可使用画布放大查看';});};
 let previous=0;function draw(time){const dt=previous?Math.min((time-previous)/1000,.05):0;previous=time;const w=innerWidth,h=innerHeight;if(canvas.width!==Math.floor(w*renderer.getPixelRatio())||canvas.height!==Math.floor(h*renderer.getPixelRatio())){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}controls.update(dt);mixer?.update(dt);renderer.render(scene,camera);raf=requestAnimationFrame(draw);}
 document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);previous=0;}else raf=requestAnimationFrame(draw);});
 canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();cancelAnimationFrame(raf);state.className='error';state.textContent='3D 渲染上下文丢失，请重新加载预览';});
 addEventListener('pagehide',()=>{cancelAnimationFrame(raf);controls.dispose();renderer.dispose();});raf=requestAnimationFrame(draw);
}catch(error){state.className='error';state.textContent='无法启动 3D 预览：'+error.message;renderer?.dispose();}
})();
</script></html>
