<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--ui-panel:#202831;--ui-soft:#171f28;--ui-line:#27303d;--ui-line-strong:#3a4655;--ui-text:#d7e2ee;--ui-muted:#8e9eaf;--ui-accent:#a5c880;--ui-accent-soft:#141d12;--accent:var(--ui-accent)}

*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1117;color:var(--ui-text);font:12px system-ui}[hidden]{display:none!important}
.viewer-wrap{position:relative;display:flex;flex-direction:column;width:100%;height:100%;min-height:0;background:#090e15}
#viewer-canvas{display:block;flex:1;min-height:0;width:100%;touch-action:none;outline:none}
button,select{font:inherit;cursor:pointer;color:inherit;background:var(--ui-panel);border:1px solid var(--ui-line-strong);border-radius:6px;padding:5px}
button svg{width:20px;height:20px}.icon-button{padding:0}.viewer-help .icon-button{background:none;border:0}
#state{position:absolute;top:12px;left:12px;right:164px;pointer-events:none;color:var(--ui-muted);font-size:10px}#state.error{color:#ffb4aa}
.animation-tools{position:absolute;bottom:10px;right:12px;z-index:4;display:flex;gap:6px}
.viewer-tools{position:absolute;top:12px;right:12px;display:flex;gap:8px;z-index:4}
/* 画布上的功能键放大（2026-10-20 用户反馈 30px 偏小）：40px 键 + 20px 图标，
   深色画布上半透明底照旧，和周边留出呼吸。 */
.viewer-tools .icon-button{width:40px;height:40px;display:grid;place-items:center;background:var(--ui-panel);border:1px solid var(--ui-line-strong);border-radius:10px;color:var(--ui-muted)}
.viewer-tools .icon-button:hover{color:var(--ui-text);border-color:var(--ui-line-strong)}
.viewer-tools .icon-button.on{color:var(--accent);border-color:var(--ui-accent);background:var(--ui-accent-soft)}
.viewer-tools .icon-button[hidden]{display:none}
.viewer-tools .icon-button svg{width:20px;height:20px}
/* Sketchfab / ArtStation / ambientCG 用的是平台自己的 iframe 预览器（各有各的操作方式），
   内置预览器的按键 UI 只属于本地 three 预览：iframe 一亮出来，工具条与手势 caption 全收。
   用 :has() 跟画布显隐联动 —— 任何 iframe 路径（含以后新增的）都不用为这个改 JS。 */
.viewer-tools{display:none}
.viewer-wrap:has(#viewer-canvas:not([hidden])) .viewer-tools{display:flex}
/* 操作说明弹层：和八猴一样收进一个问号里，不常驻占画面。 */
.viewer-help{position:absolute;top:60px;right:12px;width:224px;background:var(--ui-panel);border:1px solid var(--ui-line-strong);border-radius:10px;padding:6px 14px 12px;z-index:5;box-shadow:0 10px 28px #000000a6}
.viewer-help[hidden]{display:none}
.viewer-help-head{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;color:var(--ui-text);padding:8px 0 6px}
/* 帮助面板的关闭键一并放大：22px 在 96vw 弹窗里几乎点不中。 */
.viewer-help-head .icon-button{width:30px;height:30px;display:grid;place-items:center;color:var(--ui-muted)}
.viewer-help-head .icon-button:hover{color:var(--ui-text)}
.viewer-help-head .icon-button svg{width:15px;height:15px}
.viewer-help ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.viewer-help li{display:flex;align-items:baseline;gap:8px;font-size:11px;color:var(--ui-muted)}
.viewer-help li b{flex:none;min-width:86px;color:var(--ui-text);font-weight:600}
.viewer-help-tip{margin:10px 0 0;font-size:10px;line-height:1.6;color:var(--ui-muted);border-top:1px solid var(--ui-line);padding-top:8px}
/* 材质预设条：连了 PBR 材质才出现。模型 / 球 / 方 / 平板 + 平铺滑条，
   和右上角工具条同一套视觉，浮在左上、不挡右上角那三个按键。 */
.viewer-material{position:absolute;left:12px;top:12px;z-index:4;display:flex;align-items:center;gap:8px;padding:4px 8px;border:1px solid var(--ui-line-strong);border-radius:10px;background:var(--ui-panel);backdrop-filter:blur(6px)}
.viewer-material[hidden]{display:none}
.vm-control{position:relative}.vm-button{display:flex;align-items:center;gap:7px;height:32px;padding:0 10px;color:var(--ui-text)}.vm-button svg,.vm-popover svg{width:18px;height:18px;flex:none}.vm-button[aria-expanded="true"]{color:var(--accent);border-color:var(--ui-accent)}
.vm-popover{position:absolute;top:calc(100% + 8px);left:0;display:flex;flex-direction:column;gap:4px;padding:6px;background:var(--ui-panel);border:1px solid #33454f;border-radius:9px;box-shadow:0 8px 24px #0009;min-width:110px}
.vm-popover button{display:flex;align-items:center;gap:8px;white-space:nowrap;padding:7px 10px;border-color:transparent;background:transparent}.vm-popover button.on{color:var(--accent);background:#a5c88018}.vm-popover button:disabled{opacity:.35;cursor:default}.vm-repeat-popover{min-width:0;width:44px;align-items:center;padding:12px 8px;left:50%;transform:translateX(-50%)}
#vm-repeat,#vm-height{writing-mode:vertical-lr;direction:rtl;appearance:auto;width:20px;height:150px;margin:0;accent-color:var(--accent);cursor:pointer}.vm-button output{min-width:28px;font-variant-numeric:tabular-nums}
.viewer-textures{position:absolute;right:8px;top:62px;bottom:8px;width:clamp(96px,19%,190px);display:flex;flex-direction:column;gap:6px;padding:6px;background:#101722ee;border:1px solid var(--ui-line-strong);border-radius:10px;z-index:3}.viewer-textures figure{margin:0;flex:1;min-height:0;display:flex;flex-direction:column;gap:3px}.viewer-textures img{width:100%;flex:1;min-height:0;object-fit:contain;background:#080d13;border-radius:5px}.viewer-textures figcaption{flex:none;color:#9fb0c2;font-size:10px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.viewer-wrap.textures-open .viewer-channels{right:clamp(104px,20%,202px)}.viewer-wrap.textures-open #viewer-canvas{width:calc(100% - clamp(104px,20%,202px))}
/* 通道预览覆盖层：标签条贴在各条左缘（竖排），统计照 mviewer 放左下角。
   pointer-events:none 是关键——覆盖层只是「标签」，点击切通道听的是 canvas 自己。 */
.viewer-channels{position:absolute;inset:0;z-index:2;pointer-events:none}
.viewer-channels[hidden]{display:none}
.viewer-channel-labels{position:absolute;inset:0;display:flex}
.viewer-channel-labels span{flex:1;display:flex;align-items:flex-end;justify-content:center;padding:0 8px 38px;font-size:10px;letter-spacing:2px;color:#d5dde8;text-shadow:0 1px 3px #000c;writing-mode:horizontal-tb}
.viewer-channel-labels span+span{border-left:1px solid #ffffff2e}
.viewer-stats{position:absolute;left:12px;bottom:10px;font-size:10px;letter-spacing:.5px;color:#aab8c8;background:#0d1117b8;border:1px solid var(--ui-line-strong);border-radius:6px;padding:3px 9px}
.viewer-stats[hidden]{display:none}
.viewer-settings{position:relative;display:flex;z-index:6}.viewer-display{order:1}.viewer-settings .vm-popover{left:auto;right:0;top:calc(100% + 10px);width:min(240px,calc(100vw - 24px));min-width:0;padding:10px;gap:8px;max-height:calc(100vh - 80px);overflow:auto}.environment-actions,.environment-files{display:flex;align-items:center;gap:6px}.viewer-settings .lighting-check,.environment-files button{display:grid;place-items:center;width:30px;height:28px;margin:0;padding:4px;border:1px solid var(--ui-line-strong);border-radius:6px;cursor:pointer;color:#8796a8}.lighting-check:has(input:checked){color:var(--accent);background:#a5c88020;border-color:var(--ui-accent)}.lighting-check input{position:absolute;opacity:0;width:1px;height:1px}.lighting-check:focus-within{outline:2px solid var(--accent)}.viewer-settings svg{width:16px;height:16px;flex:none}.viewer-settings #environment-preview{display:grid;place-items:center;padding:0;background:#ffffff06;border:1px solid #ffffff12;border-radius:6px;height:88px}.viewer-settings #environment-thumb{width:80px;height:80px}.environment-parameters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.environment-parameters label{display:grid;grid-template-columns:16px 1fr;align-items:center;gap:4px;min-width:0}.environment-parameters input{grid-row:2;grid-column:1 / -1;width:100%;margin:0;accent-color:var(--accent)}.environment-parameters output{text-align:right;font-size:11px;font-variant-numeric:tabular-nums}.viewer-settings p{font-size:10px;color:#8998a8;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.environment-files{position:absolute;right:10px;top:10px}.viewer-settings p:empty{display:none}
.viewer-channel-labels span{min-width:0;letter-spacing:0;font-size:11px;white-space:nowrap}
.viewer-display{display:flex;align-items:center;gap:0;padding:3px;border:1px solid var(--ui-line-strong);border-radius:10px;background:var(--ui-panel)}.viewer-tools .viewer-display .icon-button{width:30px;height:32px;border:0;border-radius:6px;background:transparent}.viewer-tools .viewer-display .icon-button.on{background:#a5c88030;color:var(--accent)}@media(max-width:620px){.viewer-material{top:62px}}
.viewer-uv{position:absolute;right:8px;top:62px;bottom:8px;width:clamp(180px,30%,360px);z-index:3;background:var(--ui-panel);border:1px solid var(--ui-line-strong);border-radius:9px;padding:8px;display:flex;flex-direction:column;gap:8px}.viewer-uv header{display:flex;gap:8px;align-items:center}.viewer-uv select{min-width:0;flex:1}.viewer-uv canvas{width:100%;flex:1;min-height:0;background:#0a1018}.viewer-uv p{font-size:10px;color:var(--ui-muted);margin:0}.viewer-wrap.uv-open #viewer-canvas{width:calc(100% - clamp(196px,32%,376px))}.viewer-wrap.uv-open .viewer-channels{right:clamp(196px,32%,376px)}.viewer-views{position:absolute;right:12px;top:62px;width:min(250px,calc(100% - 24px));padding:10px;background:var(--ui-panel);border:1px solid var(--ui-line-strong);border-radius:9px;z-index:6;box-shadow:0 8px 24px #0008}.viewer-views form{display:flex;gap:6px;margin-top:8px}.viewer-views input{width:0;flex:1;min-width:0;background:var(--ui-soft);color:var(--ui-text);border:1px solid var(--ui-line-strong);border-radius:5px;padding:6px;font:inherit}.viewer-views-list{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto}.viewer-views-list>div{display:flex;gap:4px}.viewer-views-list .view-recall{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.viewer-views p{margin:2px;color:var(--ui-muted);font-size:11px}
/* ── ANCHOR-DIFF 8：贴图放大查看（与 AssetVault viewer.css 同构，整段可原样互相拷贝）── */
.viewer-texture-zoom{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;background:#05080cde;backdrop-filter:blur(4px)}
.viewer-texture-zoom[hidden]{display:none}
.viewer-texture-zoom img{max-width:min(88%,960px);max-height:78%;object-fit:contain;background:#0d1420;border:1px solid #ffffff26;border-radius:8px;box-shadow:0 14px 44px #000a;transform:scale(var(--zoom-scale,1));transition:transform .12s ease;cursor:zoom-in;user-select:none}
.viewer-texture-zoom .texture-zoom-caption{flex:none;color:#9fb0c2;font-size:11px;text-align:center;padding:0 16px;pointer-events:none}
.viewer-texture-zoom .texture-zoom-close{position:absolute;top:10px;right:12px;width:30px;height:30px;padding:6px;border:1px solid #ffffff26;border-radius:8px;background:#0d1420cc;color:#e7eef7}
.viewer-texture-zoom .texture-zoom-close:hover{background:#ffffff1a}
.viewer-textures figure{cursor:zoom-in}
.viewer-textures figure:hover img{outline:1px solid #a5c88088}
/* ── ANCHOR-DIFF 9：加载过渡层（与 AssetVault viewer.css 同构，整段可原样互相拷贝）── */
.viewer-loading{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;pointer-events:none;background:#090e15a8;backdrop-filter:blur(2px);opacity:0;transition:opacity .22s ease}
.viewer-loading[hidden]{display:none}
.viewer-loading.on{opacity:1}
.viewer-loading-card{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 26px;border:1px solid #ffffff1f;border-radius:14px;background:#0d1420e6;box-shadow:0 12px 36px #0008}
.viewer-loading-ring{width:30px;height:30px;border:2px solid #ffffff1f;border-top-color:#a5c880;border-radius:50%;animation:viewer-spin .85s linear infinite}
@keyframes viewer-spin{to{transform:rotate(360deg)}}
.viewer-loading-text{color:#e7eef7;font-size:12px;letter-spacing:.02em}
.viewer-loading-bar{width:168px;height:2px;border-radius:2px;background:#ffffff14;overflow:hidden}
.viewer-loading-bar i{display:block;width:38%;height:100%;border-radius:2px;background:#a5c880;animation:viewer-slide 1.15s ease-in-out infinite}
@keyframes viewer-slide{0%{transform:translateX(-110%)}100%{transform:translateX(370%)}}
.viewer-loading-tip{color:#7d8da0;font-size:10px}
@media (prefers-reduced-motion:reduce){.viewer-loading-ring,.viewer-loading-bar i{animation-duration:2.4s}}
/* ── ANCHOR-DIFF 10：贴图缩略图铺满侧栏宽度（两个工具同构，整段可原样互相拷贝）──
 * 原来 figure / img 都是 flex:1，正方形贴图被压进「等高格子」再 contain 居中，
 * 左右各留一大片空白。改成宽度铺满、高度按原始比例，超出侧栏高度时滚动。 */
.viewer-textures{overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#ffffff26 transparent}
.viewer-textures figure{flex:none;margin:0}
.viewer-textures img{width:100%;height:auto;flex:none;display:block;object-fit:contain}
.viewer-textures figcaption{flex:none}

 if(event.source!==parent||event.data?.type!=='studio-preview-theme')return;
 const allowed=['--ui-bg','--ui-panel','--ui-soft','--ui-line','--ui-line-strong','--ui-text','--ui-muted','--ui-faint','--ui-accent','--ui-accent-soft','--ui-accent-ink','--ui-error'];

 document.documentElement.style.colorScheme=event.data.dark?'dark':'light';
});

const MATERIAL_SLOTS={basecolor:['map',true],normal:['normalMap',false],roughness:['roughnessMap',false],metallic:['metalnessMap',false],ao:['aoMap',false],height:['displacementMap',false]};

async function applyMaterialMaps(maps){

  const bases=Array.isArray(node.userData.baseMaterial)?node.userData.baseMaterial:[node.userData.baseMaterial];

function updateEnvironmentPreview(texture){

 select.replaceChildren(...names.map(name=>{const option=document.createElement('option');option.value=name;option.textContent=name==='uv'?'UV 0':'UV '+name.slice(2);return option;}));

function drawUVLayout(){
 const canvas=document.getElementById('viewer-uv-canvas');if(!canvas||document.getElementById('viewer-uv').hidden)return;
 const width=Math.max(1,canvas.clientWidth),height=Math.max(1,canvas.clientHeight),ratio=Math.min(devicePixelRatio,2);
 const nextW=Math.round(width*ratio),nextH=Math.round(height*ratio);
 if(canvas.width!==nextW||canvas.height!==nextH){canvas.width=nextW;canvas.height=nextH;}
 const ctx=canvas.getContext('2d');ctx.setTransform(ratio,0,0,ratio,0,0);ctx.fillStyle='#0a1018';ctx.fillRect(0,0,width,height);

 const pad=10,size=Math.max(1,Math.min(width,height)-pad*2),ox=(width-size)/2,oy=(height-size)/2;

   const i=t*3,a=idx?idx[i]:i,b=idx?idx[i+1]:i+1,c=idx?idx[i+2]:i+2;
   if(a*2+1>=uvData.length||b*2+1>=uvData.length||c*2+1>=uvData.length)continue;
   ctx.moveTo(x(uvData[a*2]),y(uvData[a*2+1]));ctx.lineTo(x(uvData[b*2]),y(uvData[b*2+1]));ctx.lineTo(x(uvData[c*2]),y(uvData[c*2+1]));ctx.closePath();shown++;
  }

}

let sidebarUrls=[];

 const labels={basecolor:'颜色',normal:'法线',roughness:'粗糙度',metallic:'金属度',ao:'AO',emissive:'自发光',height:'高度'};
 const entries=[];
 if(hasMaterial())for(const [channel,blob] of Object.entries(materialMaps)){const url=URL.createObjectURL(blob);sidebarUrls.push(url);entries.push({url,label:labels[channel]||channel});}
 else{
  const seen=new Set();model?.traverse(node=>{if(!node.isMesh)return;for(const material of Array.isArray(node.material)?node.material:[node.material])for(const [channel,[slot]] of Object.entries({...MATERIAL_SLOTS,emissive:['emissiveMap']})){

/* ── ANCHOR-DIFF 8：贴图放大查看（与 AssetVault gltf-preview.js 同名同结构，可整段互相拷贝）──
 * 点侧栏缩略图开覆盖层看原图；滚轮缩放、←/→ 切图、双击还原、Esc / 点遮罩 / × 关闭。
 * 事件全部委托，侧栏每次重建缩略图都不会重复绑定。 */
let textureZoomUrls=[],textureZoomIndex=0,textureZoomScale=1;
function closeTextureZoom(){
 const layer=document.getElementById('viewer-texture-zoom');
 if(layer)layer.hidden=true;
}
function setTextureZoomImage(){
 const layer=document.getElementById('viewer-texture-zoom'),image=document.getElementById('texture-zoom-image');
 const caption=document.getElementById('texture-zoom-caption'),entry=textureZoomUrls[textureZoomIndex];
 if(!layer||!image||!entry)return;
 image.src=entry.url;image.alt=entry.label;
 if(caption)caption.textContent=entry.label+' · '+(textureZoomIndex+1)+'/'+textureZoomUrls.length+' · 滚轮缩放 / ←→ 切换 / Esc 关闭';
 textureZoomScale=1;layer.style.setProperty('--zoom-scale','1');
}
function openTextureZoom(index){
 const layer=document.getElementById('viewer-texture-zoom');
 if(!layer||!textureZoomUrls.length)return;
 bindTextureZoom();
 textureZoomIndex=Math.max(0,Math.min(index,textureZoomUrls.length-1));
 layer.hidden=false;setTextureZoomImage();
 document.getElementById('texture-zoom-close')?.focus();
}
function bindTextureZoom(){
 const layer=document.getElementById('viewer-texture-zoom');
 if(!layer||layer.dataset.bound)return;
 layer.dataset.bound='1';
 const sidebar=document.getElementById('viewer-textures');
 const indexOf=target=>[...sidebar.querySelectorAll('figure')].indexOf(target);
 sidebar?.addEventListener('click',event=>{
  const figure=event.target.closest?.('figure');
  if(figure&&sidebar.contains(figure))openTextureZoom(indexOf(figure));
 });
 sidebar?.addEventListener('keydown',event=>{
  if(event.key!=='Enter'&&event.key!==' ')return;
  const figure=event.target.closest?.('figure');
  if(!figure||!sidebar.contains(figure))return;
  event.preventDefault();openTextureZoom(indexOf(figure));
 });
 document.getElementById('texture-zoom-close')?.addEventListener('click',closeTextureZoom);
 layer.addEventListener('click',event=>{if(event.target===layer)closeTextureZoom();});
 // 兜底：点放大层以外的任何地方（工具条、画布、关闭弹窗）都顺手收起，
 // 免得关掉贴图侧栏后还留着一张大图挡住模型。
 document.addEventListener('pointerdown',event=>{
  if(!layer.hidden&&!layer.contains(event.target))closeTextureZoom();
 });
 layer.addEventListener('wheel',event=>{
  event.preventDefault();
  textureZoomScale=Math.min(6,Math.max(1,textureZoomScale+(event.deltaY<0?0.25:-0.25)));
  layer.style.setProperty('--zoom-scale',String(textureZoomScale));
 },{passive:false});
 document.getElementById('texture-zoom-image')?.addEventListener('dblclick',()=>{
  textureZoomScale=1;layer.style.setProperty('--zoom-scale','1');
 });
 document.addEventListener('keydown',event=>{
  if(layer.hidden)return;
  if(event.key==='Escape'){closeTextureZoom();return;}
  if(event.key!=='ArrowRight'&&event.key!=='ArrowLeft')return;
  if(!textureZoomUrls.length)return;
  event.preventDefault();
  textureZoomIndex=(textureZoomIndex+(event.key==='ArrowRight'?1:-1)+textureZoomUrls.length)%textureZoomUrls.length;
  setTextureZoomImage();
 });
}

}
bindMaterialBar();bindSceneSettings();bindInspectionTools();updateEnvironmentSettings();
 let previous=0;function draw(time){const dt=previous?Math.min((time-previous)/1000,.05):0;previous=time;const {w,h}=canvasSize();if(w&&h){if(canvas.width!==Math.floor(w*renderer.getPixelRatio())||canvas.height!==Math.floor(h*renderer.getPixelRatio())){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}controls.update();mixer?.update(dt);renderFrame();}raf=requestAnimationFrame(draw);}
 document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);previous=0;}else raf=requestAnimationFrame(draw);});
 canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();cancelAnimationFrame(raf);state.className='error';state.textContent='3D 渲染上下文丢失，请重新加载预览';});
 addEventListener('pagehide',()=>{cancelAnimationFrame(raf);disposeChannelResources();controls.dispose();environmentRequest++;customEnvironment?.dispose();environmentPreviewTarget?.dispose();environment.dispose();renderer.dispose();});raf=requestAnimationFrame(draw);
 function bindViewerGestures(){
  if(!canvas||gesturesBound)return;
  gesturesBound=true;
  canvas.addEventListener('pointerdown',event=>{
   if(!event.shiftKey||event.button!==0||!controls||!lightRig)return;
   lightDrag={x:event.clientX,y:event.clientY,yaw:lightRig.rotation.y,pitch:lightRig.rotation.x};
   controls.enabled=false;
   lightRig.position.copy(controls.target);
   try{canvas.setPointerCapture(event.pointerId);}catch(_){}
   event.preventDefault();
  });
  canvas.addEventListener('pointermove',event=>{
   if(!lightDrag)return;
   lightRig.rotation.y=lightDrag.yaw+(event.clientX-lightDrag.x)*0.006;
   lightRig.rotation.x=Math.max(-0.5,Math.min(1.1,lightDrag.pitch+(event.clientY-lightDrag.y)*0.006));
   requestRender();
  });
  const endLightDrag=()=>{if(!lightDrag)return;lightDrag=null;if(controls)controls.enabled=true;};
  canvas.addEventListener('pointerup',endLightDrag);
  canvas.addEventListener('pointercancel',endLightDrag);
  canvas.addEventListener('dblclick',()=>resetCamera());
 }

 /** 预览器 UI：右上角「?」操作说明弹层 + 「通道」开关 + 点画布切通道 + 数字快捷键。
  *  点画布切通道必须挂在 canvas 自己身上（覆盖层 pointer-events:none），并且用
  *  pointerdown/up 的距离区分「点击」与「拖动旋转」—— 直接听 click 会在每次拖动
  *  收尾时误切通道。 */
 function bindViewerUI(){
  if(!canvas||uiBound)return;
  uiBound=true;
  const helpBtn=document.getElementById('viewer-help-btn');
  const helpPanel=document.getElementById('viewer-help');
  if(helpBtn&&helpPanel)helpBtn.addEventListener('click',()=>{helpPanel.hidden=!helpPanel.hidden;});
  const helpClose=helpPanel?.querySelector('[data-close]');
  if(helpClose&&helpPanel)helpClose.addEventListener('click',()=>{helpPanel.hidden=true;});
  const channelBtn=document.getElementById('viewer-channels-btn');
  if(channelBtn)channelBtn.addEventListener('click',()=>{
   if(!channelAvailable||!channelTarget)return;
   setChannelMode(channelMode==='off'?'all':'off');
  });
  // 画布点击：拆分态点某条 → 单独预览该通道；单独态再点 → 回拆分（同 mviewer）。
  canvas.addEventListener('pointerdown',event=>{pressInfo={x:event.clientX,y:event.clientY};});
  canvas.addEventListener('pointerup',event=>{
   if(!pressInfo||channelMode==='off'||!channelTarget){pressInfo=null;return;}
   const moved=Math.hypot(event.clientX-pressInfo.x,event.clientY-pressInfo.y);
   pressInfo=null;
   if(moved>5)return;
   const rect=canvas.getBoundingClientRect();
   const fx=rect.width?(event.clientX-rect.left)/rect.width:0;
   if(channelMode==='all'){
    const idx=Math.min(CHANNELS.length-1,Math.max(0,Math.floor(fx*CHANNELS.length)));
    setChannelMode(CHANNELS[idx]);
   }else setChannelMode('all');
  });
  // 数字快捷键与 mviewer 一致：1-5 单通道（再按一次回拆分），0 进拆分。
  window.addEventListener('keydown',event=>{
   if(!ready||canvas.hidden)return;
   if(event.target&&/^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName))return;
   if(event.key==='Escape'){if(helpPanel)helpPanel.hidden=true;return;}
   if(!channelAvailable||!channelTarget)return;
   if(event.key==='0'){setChannelMode('all');return;}
   const n=Number(event.key);
   if(n>=1&&n<=CHANNELS.length)setChannelMode(channelMode===CHANNELS[n-1]?'all':CHANNELS[n-1]);
  });
 }

 /** 各分支取景完成后记一次「到家机位」，双击重置就靠它 —— 包围盒是加载时算好的，
  *  这里只存快照，不做任何重算，避免 reset 时再量一次尺寸把 ground 圆也算进去。 */
 function rememberHome(){
  if(!camera||!controls)return;
  homeShot={position:camera.position.clone(),target:controls.target.clone(),
   near:camera.near,far:camera.far,minDistance:controls.minDistance,maxDistance:controls.maxDistance};
 }
 function resetCamera(){
  if(!homeShot||!camera||!controls)return;
  camera.position.copy(homeShot.position);
  controls.target.copy(homeShot.target);
  camera.near=homeShot.near;camera.far=homeShot.far;camera.updateProjectionMatrix();
  controls.minDistance=homeShot.minDistance;controls.maxDistance=homeShot.maxDistance;
  controls.update();
 }

 function setChannelMode(mode){
  channelMode=mode;displayMode='material';syncDisplayButtons();
  const btn=document.getElementById('viewer-channels-btn');
  if(btn)btn.classList.toggle('on',mode!=='off');
  const overlay=document.getElementById('viewer-channels');
  if(overlay)overlay.hidden=mode==='off'||!channelTarget;
  renderChannelLabels();
  renderFrame();
 }

 /** 通道是否可用：只有模型预览有通道可言；贴图/HDRI 是球和全景，进来先把按钮收起来。
  *  同时量一次包围球半径 —— 拆分视图每条通道是窄画幅，要靠它把相机推到能看全的距离。 */
 function setChannelAvailable(available,model){
  channelAvailable=!!available;
  channelTarget=model||null;
  if(channelTarget){
   const box=new THREE.Box3().setFromObject(channelTarget);
   const sphere=box.isEmpty()?null:box.getBoundingSphere(new THREE.Sphere());
   channelRadius=sphere&&sphere.radius>0?sphere.radius:1;
  }
  updateUVPreview();
  const btn=document.getElementById('viewer-channels-btn');
  if(btn)btn.hidden=!channelAvailable;
  if(!channelAvailable)setChannelMode('off');
 }

 /** 拆分/单独预览的标签条与统计（mviewer 左下角的 Triangles/Vertices）。 */
 function renderChannelLabels(){
  const wrap=document.getElementById('viewer-channel-labels');
  const stats=document.getElementById('viewer-stats');
  const live=channelMode!=='off'&&!!channelTarget;
  if(wrap){
   const strips=live?(channelMode==='all'?CHANNELS:[channelMode]):[];
   wrap.innerHTML=strips.map(name=>`<span>${CHANNEL_LABELS[name]}</span>`).join('');
   wrap.dataset.mode=channelMode;
  }
  if(stats){
   stats.hidden=!live;
   if(live){
    let tris=0,verts=0;
    channelTarget.traverse(node=>{
     if(!node.isMesh||!node.geometry)return;
     const g=node.geometry;
     verts+=g.attributes.position?.count||0;
     tris+=g.index?g.index.count/3:(g.attributes.position?.count||0)/3;
    });
    stats.textContent=`面数 ${Math.round(tris).toLocaleString('en-US')}　顶点 ${verts.toLocaleString('en-US')}`;
   }
  }
 }

 /** 每帧出口：正常渲染，或按通道 scissor 分条渲染。renderer.render 默认 autoClear，
  *  开着 scissor test 时clear 只清当前条区域 —— 这正是多视图官方示例的做法。
  *
  *  拆分态最关键的一点：每条通道只是整块画布的 1/5 宽，相机 aspect 若还是整块画布的，
  *  模型会被横向压扁 5 倍（实测椅子直接被拍扁）。所以每条通道：
  *   1. aspect 改成该条的 width/h；
  *   2. 距离按包围球重算（窄画幅横向 FOV 变小，不推远就会被左右裁掉）；
  *   3. 乘上用户的缩放系数（dUser/dFull），否则拆分态里滚轮缩放会失灵。
  *  渲染完把 aspect 和机位还原成「逻辑机位」—— controls 每帧都用这两个值算轨道。 */
 function renderFrame(){
  if(!renderer)return;
  if(channelMode==='off'||!channelTarget){
   if(channelTarget&&displayMode!=='material')applyChannel(displayMode);
   renderer.render(scene,camera);restoreMaterials();return;
  }
  const {w,h}=canvasSize();
  if(!w||!h){renderer.render(scene,camera);return;}
  const strips=channelMode==='all'?CHANNELS:[channelMode];
  const solo=channelMode!=='all';
  const baseAspect=camera.aspect;
  const logical=camera.position.clone();
  const dir=logical.clone().sub(controls.target);
  const halfFov=camera.fov*Math.PI/360;
  const fitFull=channelRadius/Math.sin(halfFov)/Math.min(1,baseAspect);
  const zoom=(dir.length()||1)/(fitFull||1);
  renderer.setScissorTest(true);
  for(let i=0;i<strips.length;i++){
   const x=solo?0:Math.round(w*i/strips.length);
   const width=solo?w:Math.round(w/strips.length);
   const aspect=width/h;
   camera.aspect=aspect;camera.updateProjectionMatrix();
   if(solo){
    camera.position.copy(logical);
   }else{
    const fit=channelRadius/Math.sin(halfFov)/Math.min(1,aspect);
    camera.position.copy(controls.target).addScaledVector(dir.normalize(),fit*zoom);
   }
   renderer.setViewport(x,0,width,h);
   renderer.setScissor(x,0,width,h);
   applyChannel(strips[i]);
   renderer.render(scene,camera);
  }
  renderer.setScissorTest(false);
  renderer.setViewport(0,0,w,h);
  camera.aspect=baseAspect;camera.updateProjectionMatrix();
  camera.position.copy(logical);
  restoreMaterials();
 }

 function applyChannel(name){
  if(!channelTarget)return;
  channelTarget.traverse(node=>{
   if(!node.isMesh)return;
   if(!originalMaterials.has(node))originalMaterials.set(node,node.material);
   node.material=channelMaterial(name,originalMaterials.get(node))||node.material;
  });
 }
 function restoreMaterials(){
  for(const [mesh,material] of originalMaterials)mesh.material=material;
  originalMaterials.clear();
 }

 /** 各通道的覆盖材质。albedo/gloss 与源材质一对一（要拿它的 map/color/roughnessMap），
  *  按源材质 uuid 缓存；normals/reflectivity/topology 与资产无关，全预览共用一份。 */
 // 每个源材质分别缓存，读取 glTF 标准通道：roughness=G、metalness=B。
 function channelMaterial(name,src){
  if(Array.isArray(src))return src.map(material=>channelMaterial(name,material));
  if(!channelMaterials)channelMaterials={};
  const key=name+':'+src.uuid;
  if(!channelMaterials[key]){
   const slot={normals:'normalMap',albedo:'map',reflectivity:'metalnessMap',gloss:'roughnessMap',topology:'displacementMap'}[name];
   const texture=src[slot];
   let material;
   if(name==='white'||name==='wire')material=new THREE.MeshStandardMaterial({color:0xe2e5e8,roughness:0.75,metalness:0,wireframe:name==='wire'});
   else if(name==='normals'&&!texture)material=new THREE.MeshNormalMaterial();
   else if(name==='topology'&&!texture)material=new THREE.MeshBasicMaterial({color:0x9fe870,wireframe:true});
   else{
    const value=name==='reflectivity'?(src.metalness??0):name==='gloss'?(src.roughness??1):1;
    material=new THREE.MeshStandardMaterial({map:texture||null,color:name==='albedo'&&src.color?src.color.clone():new THREE.Color(value,value,value),toneMapped:false});
    const component=name==='reflectivity'?'b':name==='gloss'?'g':name==='topology'?'r':'';
    material.onBeforeCompile=shader=>{
     if(texture&&component)shader.fragmentShader=shader.fragmentShader.replace('#include <map_fragment>','diffuseColor *= vec4(vec3(texture2D(map, vMapUv).'+component+'), 1.0);');
     shader.fragmentShader=shader.fragmentShader.replace('#include <opaque_fragment>','gl_FragColor = vec4(diffuseColor.rgb, diffuseColor.a);');
    };
    material.customProgramCacheKey=()=>name;

   }
   material.side=src.side;channelMaterials[key]=material;
  }
  const material=channelMaterials[key];
  material.displacementMap=src.displacementMap||null;
  material.displacementScale=src.displacementScale;
  material.displacementBias=src.displacementBias;
  return material;
 }

 /** 粗糙度贴图反色成 gloss 贴图。8 位贴图才能 canvas 反色；HDR/浮点贴图进 catch 后退化。 */
 function invertTexture(tex){
  if(!tex||!tex.image)return null;
  const cached=invertCache.get(tex);if(cached)return cached;
  try{
   const img=tex.image;
   const c=document.createElement('canvas');c.width=img.width;c.height=img.height;
   const ctx=c.getContext('2d');ctx.drawImage(img,0,0);
   const data=ctx.getImageData(0,0,c.width,c.height);
   for(let i=0;i<data.length;i+=4){const v=255-data[i];data[i]=v;data[i+1]=v;data[i+2]=v;}
   ctx.putImageData(data,0,0);
   const t=new THREE.CanvasTexture(c);
   t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.copy(tex.repeat);t.needsUpdate=true;
   invertCache.set(tex,t);
   return t;
  }catch(err){
   console.warn('[预览] 粗糙度贴图反色失败，gloss 通道退化为统一高光',err);
   return null;
  }
 }

 /** 关预览/换资产/失败时释放通道覆盖材质。注意 albedo/gloss 克隆与源贴图共享纹理，
  *  dispose 只放 three 侧的 program 状态，不会误伤源材质；CanvasTexture 是自己的，必须 dispose。 */
 function disposeChannelResources(){
  restoreMaterials();
  for(const material of albedoCache.values())material.dispose();
  for(const material of glossCache.values())material.dispose();
  albedoCache.clear();glossCache.clear();
  for(const tex of invertCache.values())tex.dispose();
  invertCache.clear();
  if(channelMaterials){for(const material of Object.values(channelMaterials))material.dispose();channelMaterials=null;}
 }


}catch(error){state.className='error';state.textContent='无法启动 3D 预览：'+error.message;renderer?.dispose();}
})();
